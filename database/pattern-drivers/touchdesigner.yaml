technical_notes:
  - Node-based visual programming environment
  - Powerful 3D capabilities for spatial mapping
  - Can be combined with PixelMap for LED-specific features
  - Excellent for interactive installations
  - GPIO through a microcontroller or other device controlled via TCP/UDP or USB serial
