name: DMX Core 100
status: active
creator:
  name: DMX Pro Sales
  page: https://dmxcore.com/
notes: 'Standalone wall-mounted show controller with a 4.3" or 7" touchscreen: records a console''s output as cues, builds its own scenes, effects and timelines, and plays them on a schedule or trigger. Up to 800 universes at 40 Hz (600 at 60 Hz) with the Full licence; the Basic licence sends 8.'
inputs:
  audio: Input # music triggers from a mic or line input
  other:
    - OSC
    - HTTP
    - TCP
    - UDP
    - MQTT
    - Q-SYS
    - Symetrix
    - contact closures
  other_notes: Triggers start cues and recordings. Contact closures need the optional ADIO board (four opto-isolated inputs); MQTT needs its integration; MIDI binds only on a control surface.
outputs:
  protocols:
    artnet: Both
    sacn: Both
    dmx: Both
    kinet: Output
  dmx_notes: Optional 2-port isolated DMX512 board; each port is an input or an output
  other:
    - TPM2.net
capabilities:
  live: true
  designer: true
kind:
  - player
  - sequencer
links:
  url: https://dmxcore.com/dmx-core-100
platforms:
  notes: Its own hardware, powered over PoE or 8-28 V DC (max 8 W), with eMMC and microSD storage
