name: Smartshow LMS
status: active
creator: Lee James Apps
notes: LED matrix server for live shows, made in partnership with Smartshow Lighting. Build looks on
  a virtual matrix from 70+ effects, video, text, images, shaders and audio-reactive layers (four
  channels of two layers, Jinx-style mix modes), then run the night from a big-button touch Show
  Mode or a tablet remote. Maps odd-shaped rigs, not just rectangles.
inputs:
  video: Both
  audio: Input
  other:
    - Video files
    - Images
    - Webcam
    - Screen capture
    - NDI
    - Art-Net
    - sACN
    - OSC
    - MIDI
    - MTC
    - DMX
  other_notes: MIDI with learn and MIDI clock; DMX in from an ENTTEC DMX USB Pro
outputs:
  protocols:
    artnet: Both
    sacn: Both
    dmx: Both
    ddp: Output
  dmx_notes: DMX out through ENTTEC DMX USB Pro, DMXKing UltraDMX or Open DMX dongles; DMX in from
    an ENTTEC DMX USB Pro (Mk1 or Mk2)
  serial: Output
  serial_notes: USB serial DMX dongles, and the Glediator protocol for Arduino-driven strips
  other:
    - TPM2.net
    - PixelPusher
    - NDI
    - HDMI
    - FSEQ export
    - Glediator export
  other_notes: PixelPusher new in 1.3.5 (tested only against an emulator); HDMI to LED sender cards; FSEQ and Glediator .out export for standalone players
aliases:
  - Smart Show LMS
  - Smartshow LED Matrix Server
capabilities:
  live: true
  designer: true
  programmatic: true
integrations: WLED, xLights and Falcon controllers; HDMI LED sender cards such as Colorlight
language: GLSL
links:
  url: https://smartshowlms.leejamesapps.co.uk/
other_links:
  - https://smartshowlms.leejamesapps.co.uk/help/
  - https://forum.lms.leejamesapps.co.uk/
platforms:
  os:
    - Windows
    - macOS
    - Linux
  hardware:
    - Raspberry Pi
  notes: Windows 10 (build 1809 or later) or 11, 64-bit; macOS 11 or later (Universal); Linux
    AppImage for x86_64 or ARM64 (glibc 2.28 or newer, including Raspberry Pi OS Bookworm). 4 GB
    RAM minimum, 8 GB recommended
pricing:
  price: Free
  license_type: freeware, paid work included; redistribution, OEM bundling and white-label by
    arrangement
