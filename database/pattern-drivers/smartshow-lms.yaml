technical_notes:
  - Each Patch Editor row has its own protocol, target IP and universe, so one rig can mix protocols
    (Art-Net to a node, HDMI to an LED wall, Glediator to an Arduino strip)
  - Runs fully offline and only goes online to check for updates
  - Windows builds are signed as Hi-Lite Entertainment Limited
  - Scripts in LMS Script (the Jinx!Script language) as well as GLSL and ISF shaders
