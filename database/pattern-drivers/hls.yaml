name: HLS
status: end-of-life
creator: Joe Hinkle
notes: Joe Hinkle's free Windows sequencer for Christmas light shows, released as a beta in February 2012 - RGB channels, PixelPlane pixel matrices, Nutcracker effects, a preview window, shows played by HLS Player and a video player. Converts Vixen and LOR sequences. The last release-notes entry is version 25A (8 Mar 2016) and the download page no longer exists.
outputs:
  protocols:
    sacn: Output
    dmx: Output
  dmx_notes: COM-port DMX through Enttec Open DMX and Enttec DMX USB Pro
  other:
    - Renard
    - Lynx
    - Pixelnet
capabilities:
  designer: true
