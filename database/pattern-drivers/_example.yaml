# Example 1: commercial pattern driver (most fields)
name: Example LED Studio
status: active
creator:
  name: Example Software
  url: https://example.com
notes: Mapping and live-performance software for pixel installations.
inputs:
  video: Both # capture and NDI in, NDI out
  audio: Input # sound-reactive
  adc: false
  other: # short names, one per item
    - MIDI
    - OSC
  other_notes: game controllers through plugins
outputs:
  protocols: # Input (receives), Output (sends), Both, or false (checked: not supported); leave out when unknown
    artnet: Both
    sacn: Output
    dmx: Output
    kinet: false
    ddp: Output
    opc: false
  dmx_notes: ENTTEC DMX USB Pro
  gpio: false
  serial: Output
  serial_notes: Adalight-style serial to an Arduino
  other:
    - NDI
capabilities:
  live: true
  designer: true
  visualizer: 3D # false, true (kind unknown), 1D, 2D or 3D
  visualizer_notes: shows fixture models
  programmatic: Output # user code drives outputs; Input, Both, or true when the direction is unknown
integrations: WLED, Falcon Player
language: JavaScript # one, or a list (common.json programming_language)
links:
  url: https://example.com/led-studio
platforms:
  os:
    - Windows
    - macOS
pricing:
  price: 299
  license_type: perpetual
  tiers:
    - tier: Free
      price: 0
      features: Up to 1,000 pixels
      limitations: Watermark on output
    - tier: Pro
      price: 299
      features: Unlimited pixels
  demo:
    available: true
    limitations: No network output
technical_notes:
  - GPU rendering needs OpenGL 3.3
---
