name: Light-O-Rama
status: active
creator: Light-O-Rama
notes: Light-O-Rama's ShowTime Sequencing Suite (S6) for holiday and animated light shows - Sequencer, Control Panel with Show Player, Hardware Utility and Cue List Player. Drives Light-O-Rama controllers (including Pixie smart-pixel controllers) over LOR/ELOR networks, and DMX universes over E1.31, Art-Net or a USB DMX adapter. License levels Basic, Advanced and Pro set the limits (1, 999 or 3000 DMX universes; 1, 16 or 16 LOR networks).
inputs:
  other:
    - SMPTE
  other_notes: SMPTE / Art-Net timecode (Show Player leader/follower, S6.3.10+)
outputs:
  protocols:
    artnet: Output
    sacn: Output
    dmx: Output
  dmx_notes: USB adapter (Open DMX or Enttec Pro) or E1.31, not both at the same time
  other:
    - LOR
  other_notes: LOR / ELOR networks for Light-O-Rama controllers
aliases:
  - LOR
  - ShowTime Sequencing Suite
  - Light-O-Rama Software Suite
