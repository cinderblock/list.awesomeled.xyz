name: QLC+
status: active
creator: Massimo Callegari
notes: Includes sound responsive features. Large fixture compatibility list.
inputs:
  video: Output
  audio: Both
  other:
    - OSC
    - MIDI
    - Web API
outputs:
  protocols:
    artnet: Both
    sacn: Both
    dmx: Both # Open DMX and Vince interfaces: output only
    kinet: Output # through the OLA plugin
    ddp: false
    opc: Output # through the OLA plugin
    spi: Output # SPI plugin, /dev/spidev0.0 (Linux)
  gpio: Both # GPIO plugin (Linux)
  serial: Output
  serial_notes: 'UART plugin: DMX framing on a serial port (Linux)'
  other:
    - USB
    - OSC
aliases:
  - Q Light Controller+
  - Q Light Controller Plus
capabilities:
  live: true
  designer: true
  visualizer: 3D
  visualizer_notes: QLC+ 5 and later
  programmatic: Both
