name: vvvv
status: active
creator: vvvv (Dießl & Gregor GbR)
notes: Visual live-programming environment for .NET (vvvv gamma), used for interactive installations and custom media servers; DMX, Art-Net and sACN are among its built-in I/O options. Free without restrictions for non-commercial use; commercial use needs a per-developer licence.
inputs:
  other:
    - MIDI
    - OSC
    - TUIO
    - MQTT
    - ZeroMQ
    - UDP
    - TCP
    - WebSocket
    - HTTP
    - Spout
    - NDI
    - Ableton Link
  other_notes: MIDI, OSC, TUIO, MQTT, ZeroMQ, UDP, TCP, Websocket, HTTP, Spout, NDI, Ableton Link, Arduino, Raspberry Pi
outputs:
  protocols:
    artnet: Output
    sacn: Output
    dmx: Output
aliases:
  - vvvv gamma
capabilities:
  live: true
  programmatic: true
links:
  url: https://vvvv.org/
platforms:
  os:
    - Windows
  notes: Windows x64 and Windows Arm builds; no native macOS version (runs in Parallels on Apple silicon)
