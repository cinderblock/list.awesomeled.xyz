name: Pixout ArtNet DMX Recorder
status: active
creator:
  name: PixOut
  url: http://pixout.lighting/
  page: https://pixout.lighting/products/recorder/
notes: 'Raspberry Pi based Art-Net recorder/player: records universes from a console or media server and replays them standalone, as Art-Net over the network; up to 64 universes by license key; iOS/Android app.'
inputs:
  other:
    - GPIO
  other_notes: GPIO triggers; set up and controlled over Wi-Fi from web panels and an iOS/Android app. Records Art-Net from any source; the maker names grandMA 2/3, MADRIX, MadMapper, ENTTEC LED Mapper, ChamSys MagicQ, Resolume Arena and ArKaos.
outputs:
  protocols:
    artnet: Both
    dmx: Output
  dmx_notes: Four DMX512 outputs on the indoor D-100 model
capabilities:
  live: true
  designer: false
kind: player
links:
  url: https://pixout.lighting/products/recorder/
platforms:
  hardware:
    - Raspberry Pi
  notes: Sold as boxes (S-100 outdoor IP67, I-100 indoor, D-100 with DMX outputs; 12 V DC, adapter included) or as a licence for your own Raspberry Pi 3B, 3B+, 4 or CM4; SD card storage
pricing:
  price: €344
  source:
    notes: MSRP in EUR, ex VAT and shipping. The indoor I-100 is €304 / €624 / €1,157 for 1 / 16 / 64 universes; the D-100 (4 DMX outputs) starts at €389.
