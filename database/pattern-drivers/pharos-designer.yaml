name: Pharos Designer
status: active
creator: Pharos Architectural Controls
notes: Pharos' free Windows/macOS software (Designer 2) for programming its Designer controllers - LPC, LPC X, VLC and VLC+ - which then run the show standalone without a PC. Timelines, scenes and Designer Trigger rules; Designer Mapping turns fixtures into a pixel canvas for effects and video, and the VLC drives large LED pixel arrays from media files or an HDMI input.
inputs:
  video: Input
  other:
    - DMX
  other_notes: Designer Trigger rules and scripting, DMX and eDMX input
outputs:
  protocols:
    artnet: Both
    sacn: Both
    dmx: Both
    kinet: Output
  other:
    - Pathport
    - DALI
    - DVI
    - DisplayPort
  other_notes: Pathport, DALI (via RIO D4), DVI/DisplayPort pixel-matrix output (LPC X)
aliases:
  - Pharos
capabilities:
  live: true
  designer: true
images:
  - file: pharos-designer.webp
    source: https://dl.pharoscontrols.com/software_help/designer2/content/help/quick%20start/user%20interface.htm
    credit: Pharos Architectural Controls
links:
  url: https://www.pharoscontrols.com/designer/
platforms:
  os:
    - Windows
    - macOS
  notes: Projects are uploaded over Ethernet to Pharos LPC / VLC controllers, which play them back
