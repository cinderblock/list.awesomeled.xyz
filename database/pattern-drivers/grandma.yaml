name: grandMA
status: active
creator: MA Lighting
notes: MA Lighting's lighting-console software line (grandMA 1997, grandMA2 2008, grandMA3 since 2018). The same software runs on MA consoles and as grandMA3 onPC for Windows and macOS; onPC unlocks DMX parameters only when MA hardware (command wing, xPort Nodes, DMX-key, fader wing) is connected. Bitmaps map images and videos onto a selection of fixtures for pixel effects.
outputs:
  protocols:
    artnet: Both
    sacn: Both
  dmx_notes: DMX512 ports are on MA hardware (consoles, xPort Nodes, DMX-key); the number of DMX outputs varies with each grandMA3 onPC product
aliases:
  - grandMA3
  - grandMA2
  - grandMA3 onPC
  - grandMA onPC
capabilities:
  live: true
  designer: true
links:
