technical_notes:
  - No limit on matrix size; serial at 1,000,000 baud carries frames of about 1,000 pixels at 24 fps,
    and Ethernet output supplies much bigger matrices
  - "Solderlab's Arduino sketches: WS2801 at 500,000 baud (up to 512 pixels; about 1,024 on a Mega at
    1,000,000 baud) and WS2811/WS2812 at 1,000,000 baud (up to 512 pixels, BRG color order)"
