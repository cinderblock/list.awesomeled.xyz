name: Glediator
status: end-of-life
creator:
  name: SolderLab
  url: http://www.solderlab.de/
notes: >-
  Free Java program ("Graphical LED Installation AnimaTOR") that generates animations for LED
  matrices and strips and streams them live: over serial in its own Glediator protocol or TPM2 (with
  SolderLab's Arduino sketches for WS2801 and WS2811/WS2812 pixels), or over Ethernet as Art-Net and
  TPM2.Net. Last release V2.0.3; solderlab.de now serves only a placeholder page.
inputs:
  other:
    - Animated GIF
    - UDP remote control
  other_notes: Glediator Remote Control commands over the network (UDP)
outputs:
  protocols:
    artnet: Output
  serial: Output
  serial_notes: Glediator protocol, TPM2 or MiniDMX over COM or virtual COM ports at up to 1,000,000 baud (about 1000 pixels at 24 FPS)
  other:
    - TPM2.net
    - Recorder files that play back in Glediator or upload to the Solderlab Universal Interface Board
aliases:
  - Graphical LED Installation AnimaTOR
capabilities:
  live: true
  designer: true
