name: L.E.D. Lab
status: active
creator: Christopher Schardt
notes: iPad and iPhone app that drives LED displays from lists of Scenes, played in order or
  shuffled. Pictures Scenes animate a montage of images, videos and live camera feeds (with
  photographically generated maps for odd-shaped displays); Strips Scenes send particles of color
  down each strip. Music tracks, audio reactivity and external control. It also runs the developer's
  own large LED sculptures.
inputs:
  video: Both
  audio: Both
  other:
    - Camera
    - Video files
    - Music library
    - Microphone
    - MIDI
    - DMX
    - Art-Net
    - OSC
  other_notes: Any animatable parameter can follow MIDI, DMX, Art-Net or OSC
outputs:
  protocols:
    artnet: Both
    sacn: Output
    dmx: Input
    ddp: Output
    opc: Output
  other:
    - PixelPusher
    - DDP
    - RGB-123
    - FadeCandy
    - OSC
    - External display
  other_notes: DDP for Minleon and TekLights; FadeCandy through FCServer; an external monitor or projector as a VJ app
aliases:
  - LED Lab
capabilities:
  live: true
  designer: true
integrations: PixelPusher, RGB-123, FadeCandy/FCServer
links:
  url: https://apps.apple.com/us/app/l-e-d-lab/id832042156
other_links:
  - http://www.ledlabs.co/
platforms:
  mobile:
    - iOS
  notes: iPhone, iPad and iPod touch on iOS 15.6 or later; an iPad is best for full editing. Also
    installs on Apple silicon Macs as an iPad app, not verified for macOS by the developer
