name: Poet Creator
status: active
creator: Skandal Technologies
notes: Real-time visual content and control system for architecture and fixed installations (introduced as the POET platform in 2018). Generative content engines driven by cameras, microphones, sensors and live data (crowds, sports scores, weather) feed LED pixels and lights over Art-Net/sACN, plus screens, projections and sound. Free download with watermarked outputs; project licences come on a USB dongle.
inputs:
  video: Input
  other:
    - TCP
    - UDP
    - OSC
    - Serial
    - Web API
    - NDI
    - Spout
  other_notes: Cameras, microphones and sensors; live data feeds; TCP/IP, UDP, OSC and RS232 commands; REST API; RTSP, NDI and Spout streams
outputs:
  protocols:
    artnet: Output
    sacn: Output
  other:
    - NDI
    - Spout
    - MQTT
    - OSC
    - TCP
    - UDP
    - Dante
  other_notes: Up to 4 x 4K video, 2 x NDI, Spout, MQTT, OSC, TCP/UDP commands, multi-channel sound (Dante); DALI and Casambi through converters
aliases:
  - POET
capabilities:
  live: true
  designer: true
  visualizer: 3D
