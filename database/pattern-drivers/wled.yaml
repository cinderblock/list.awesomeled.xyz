name: WLED
status: active
creator: Aircoookie, community
notes: 'Great standalone pixel controller software for ESP8266 and ESP32 based boards. See also: WLED-SR, sound reactive fork'
inputs:
  video: false
  audio: Input # AudioReactive, built in since 0.15
  other: UDP Sync
outputs:
  protocols:
    artnet: Both # sends since 0.14
    sacn: Input # receive only
    dmx: Both
    kinet: false
    ddp: Both # sends since 0.13
    opc: false
  dmx_notes: 'RS-485 transceiver on a GPIO pin: output needs a _dmx build, input the v16 "V4" builds'
  gpio: Both # buttons, switches and PIR in; relay out
  serial: Input
  other: ws281x protocol, APA102, etc.
capabilities:
  live: true
  designer: false
  visualizer: Limited 1D
images:
  - file: wled.webp
    source: https://kno.wled.ge/basics/web-ui/
    credit: WLED project
integrations: Home Assistant, WLED App.
language: C++
license: EUPL-1.2
links:
  url: https://github.com/wled/WLED
other_links:
  - https://kno.wled.ge/
platforms:
  hardware:
    - ESP32
    - ESP8266
pricing:
  price: FOSS
  demo:
    available: Open source
related:
  - type: host
    ref: microboards/esp-01
    notes: "Runs on the ESP-01 (doc: 'Not recommended for general WLED installs', 1 MB flash)"
    source:
      url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/esp32-poe
    notes: Olimex ESP32-POE; also a built-in 'ESP32-POE' Ethernet type in WLED's Wi-Fi settings
    source:
      url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/wt32-eth01
    notes: WT32-ETH01; also a built-in 'WT32-ETH01' Ethernet type in WLED's Wi-Fi settings
    source:
      url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/esp-32s
    notes: NodeMCU-32S dev board; matched to the database's 'ESP-32S' (creator NodeMCU) by name, check before applying
    source:
      url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
  - type: related
    ref: drive-libraries/wled
    notes: "Same project: drive-libraries/wled's links.repo points at the same WLED repository"
    source:
      url: https://github.com/wled/WLED
      retrieved: '2026-11-18'
sources:
  status:
    url: https://github.com/wled/WLED/releases
    retrieved: '2026-11-18'
    notes: 'release v16.0.1 published 2026-07-07; repository moved from Aircoookie/WLED to wled/WLED'
