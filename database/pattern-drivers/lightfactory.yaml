name: LightFactory
status: active
creator: Dream Solutions Ltd
notes: PC lighting-console software for theatre, concerts, clubs, film/TV and houses of worship - traditional dimmer control plus moving lights, cue lists, palettes, a scheduler and six effects engines including LED/matrix effects, up to 250 DMX universes. Free iOS and Android remote apps; LightFactory registrations also unlock Vari-Lite's NEO PC software.
inputs:
  audio: Input
  other:
    - MIDI
    - SMPTE
    - Telnet
    - Vision.Net
    - ChilliNet
    - iCAN
  other_notes: MIDI notes and control changes, SMPTE / MIDI / Winamp timecode, Telnet, Vision.Net, ChilliNet and iCAN, contact closures, MySQL web triggers
outputs:
  protocols:
    artnet: Output
    sacn: Output
    dmx: Both
    kinet: Output
  dmx_notes: USB DMX interfaces (DMXKing ultraDMX RDM Pro / Micro, Enttec Open DMX / DMX USB Pro / Pro Mk2, Peperoni and others); a DMX lighting desk can be attached as an input for submasters, and version 2.23 merges incoming DMX streams into the output
  other:
    - Pathport
    - ShowNet
capabilities:
  live: true
  designer: true
images:
  - file: lightfactory.webp
    source: https://www.lightfactory.net/LightFactory-221-Features.html
    credit: Dream Solutions Ltd (LightFactory)
links:
  url: https://www.lightfactory.net/
platforms:
  os:
    - Windows
  notes: Windows 7, 8, 10 and 11; also supported under Parallels Desktop on macOS
