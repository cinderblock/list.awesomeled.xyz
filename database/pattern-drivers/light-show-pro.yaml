name: Light Show Pro
status: discontinued
creator: David Johnson
notes: Commercial Windows sequencer and playback engine for Christmas light shows (LSP), built on .NET; a spring 2009 magazine article had it in technology preview, due for release in May 2009. Imports LOR II/S2, Aurora, Animated Lighting and Vixen sequences. Its site showed only a hosting placeholder by June 2024 and no longer answers; a 2021 community-wiki update says updates were suspended while a rewrite was possibly in the works.
