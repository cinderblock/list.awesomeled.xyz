name: Jinx!
status: discontinued
creator: Sven Karschewski
notes: Free LED matrix control software for Windows. Four effect channels with two generators each,
  22 effect generators, Jinx!Script for your own effects, scenes, chases, crossfades and a
  touch-friendly show mode. Last release V2.4 (2016-05-16); still downloadable, but there has been
  no release since.
inputs:
  video: Both
  audio: Input
  other:
    - Webcam
    - Screen capture
    - Animated GIF
    - AVI
    - DMX
    - Art-Net
    - sACN
    - MIDI
    - TPM2.net
    - TPM2
  other_notes: Webcam, screen capture, images and AVI files as effect sources; scenes, chases, crossfader, master brightness and strobe remote-controlled over DMX, Art-Net, sACN (E1.31), MIDI, tpm2.net and tpm2
outputs:
  protocols:
    artnet: Both
    sacn: Both
    dmx: Both
    kinet: false
    ddp: false
    opc: false
  dmx_notes: DMX out through Enttec Open DMX USB or Enttec DMX USB Pro compatible interfaces; DMX
    in (remote control) through DMX USB Pro compatible interfaces
  gpio: false
  serial: Both
  serial_notes: tpm2, Glediator protocol and MiniDMX out (several serial ports can drive one matrix); tpm2 in for remote control
  other:
    - TPM2.net
    - DVI window
    - File
    - Bitmap series
    - Glediator recorder files
  other_notes: Borderless DVI output window; any output redirected to a file for standalone controllers; Windows Bitmap series export; Glediator 2 / Solderlab UIB recorder files
capabilities:
  live: true
  designer: true
  programmatic: true
