technical_notes:
  - Always renders at 25 fps; serial outputs need a baud rate fast enough for the frame size
  - Art-Net 3 addressing (Net, Subnet, Universe) with ArtPoll node discovery
  - Binaries are code-signed and check the signature at every start. V2.2 and V2.3 stopped starting
    after their certificate expired on 2017-01-04, so use V2.4
  - Effects are scripted in Jinx!Script, its own BASIC-like language
