name: WATCHOUT
status: active
creator: Dataton
notes: Dataton's multi-display show software. A Producer computer edits the timeline; Display computers play the media to projectors, monitors and LED walls, frame-synchronised over the network. ArtNet fixture cues on the timeline send Art-Net DMX at 44 frames per second, and incoming Art-Net can drive show variables.
inputs:
  other:
    - Art-Net
    - HTTP
    - OSC
    - MIDI
    - LTC
    - PosiStageNet
    - MIDI Show Control
  other_notes: Art-Net, HTTP REST API, OSC, MIDI, LTC timecode, PosiStageNet, MIDI Show Control
outputs:
  protocols:
    artnet: Both
  other_notes: Video outputs on the Display computers (4-8 per computer, depending on the graphics card)
capabilities:
  live: true
  designer: true
kind:
  - sequencer
  - player
links:
  url: https://www.dataton.com/watchout
platforms:
  os:
    - Windows
