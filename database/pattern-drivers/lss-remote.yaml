name: LSS Remote
status: active
creator: LED Strip Studio
notes: LED Strip Studio's phone and tablet app for its Reactivo 2, SPI Matrix and LEC3 (LED Ethernet Controller 3) controllers - plays the animations stored on the controller's SD card, builds playlists, sets colours and device settings (strip type, colour order, autoplay), and groups controllers into zones that stay in sync, without a computer. A separate product from the LED Strip Studio desktop software.
