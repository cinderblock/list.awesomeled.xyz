technical_notes:
  - Renderer written in Rust; a hardware GPU is required (software-only adapters don't count)
  - Custom effects and animations are WGSL shaders whose @param annotations become sliders
  - Works fully offline; includes an MCP server so AI agents (Claude Code, Codex) can operate it
