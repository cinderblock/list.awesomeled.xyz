name: FreeStyler
status: active
creator: Raphael Wellekens
notes: Free DMX lighting-control software for DJs, venues and lighting designers - live control plus programmed scenes, sequences and cues, up to 512 fixtures on 2 universes, with a built-in chaser for LED fixtures. The package also contains Fixture Creator, FreeStandalone and an Art-Net to DMX client for a remote PC.
inputs:
  other:
    - MIDI
  other_notes: MIDI, touchscreen
outputs:
  protocols:
    artnet: Output
    dmx: Output
  dmx_notes: Over 15 USB, serial and parallel-port DMX interfaces (Enttec Open DMX / PRO / ODE, DMXking, DMX4ALL, Eurolite, ELC Sidekick, MADRIX Interface and others)
capabilities:
  live: true
  designer: true
links:
  url: https://www.freestylerdmx.be/
platforms:
  os:
    - Windows
