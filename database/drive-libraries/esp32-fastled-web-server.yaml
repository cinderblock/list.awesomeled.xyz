name: ESP32 FastLED Web Server
status: unknown
creator: Jason Coon (Evil Genius Labs)
notes: Work-in-progress ESP32 port of Jason Coon's FastLED + ESP8266 Web Server - controls addressable LEDs from a web browser over Wi-Fi, with DemoReel100 patterns, palettes, twinkle and fire effects, an HTTP REST API and settings kept in EEPROM.
features: Static web app served from SPIFFS; REST settings for power, brightness, pattern, autoplay, speed, palette, solid colour, twinkle and fire parameters
hardware: ESP32 boards (Adafruit HUZZAH32 Feather, WEMOS LOLIN D32 / D1 Mini32, Adafruit QT Py ESP32-S3)
language: C++
license: GPL-3.0
links:
  repo: https://github.com/jasoncoon/esp32-fastled-webserver
platforms:
  - ESP32
