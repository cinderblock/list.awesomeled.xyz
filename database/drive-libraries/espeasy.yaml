name: ESPEasy
status: active
creator: Let's Control It (letscontrolit)
notes: Open-source multi-sensor firmware for ESP8266 and ESP32 boards - plugins read sensors and drive outputs, configured from a web UI, and report to controllers such as Domoticz, Home Assistant/openHAB (MQTT), Homie MQTT and generic HTTP/UDP. NeoPixel plugins drive WS281x strips (GRB or GRBW) as plain strips, effects, clocks, matrices or 7-segment displays.
features: 'NeoPixel plugins: P038 NeoPixel (Basic), P041 NeoPixel (Word Clock), P042 NeoPixel (Candle), P070 NeoPixel Ring Clock, P128 NeoPixel (BusFX, uses NeoPixelBus), P131 NeoPixel Matrix (uses Adafruit_NeoMatrix), P165 NeoPixel (7-Segment)'
hardware: ESP8266 and ESP32 boards (incl. ESP32-S2, -S3, -C2, -C3, -C5, -C6, -C61, -P4 builds)
language: C++
license: GPL-3.0-or-later
