name: Tasmota
status: active
creator: Theo Arends
notes: Open-source firmware for ESP8266 and ESP32 smart-home devices - web-UI configuration, OTA updates, timers and rules, and entirely local control over MQTT, HTTP, serial or KNX. Began in January 2016 as Sonoff-MQTT-OTA. Lights include WS2812-type addressable strips (NeoPixelBus; RMT or I2S on ESP32) and SM16716 / MY92x1 bulb drivers; ESP32 builds can take DMX over Art-Net to drive a WS2812 strip or matrix (experimental).
features: Addressable strips via the WS2812 GPIO component (USE_WS2812, NeoPixelBus); other chip types (SK6812, LC8812, APA106, P9813) need a custom build with USE_WS2812_HARDWARE; Art-Net receive (USE_LIGHT_ARTNET, in the Tasmota32 binaries)
hardware: ESP8266, ESP32, ESP32-S and ESP32-C3 based devices
language: C++ # Arduino-framework C/C++
license: GPL-3.0
links:
  repo: https://github.com/arendst/Tasmota
other_links:
  - https://tasmota.github.io/docs/
  - https://tasmota.github.io/docs/ArtNet/
platforms:
  - ESP8266
  - ESP32
protocols:
  - Art-Net
  - MQTT
  - KNX
