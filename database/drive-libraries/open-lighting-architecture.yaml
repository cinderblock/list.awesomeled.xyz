name: Open Lighting Architecture
status: active
creator: Simon Newton (Open Lighting Project)
notes: Framework that distributes DMX512 lighting-control data between network protocols and USB DMX devices - the olad daemon with protocol/device plugins, plus client libraries in C++, Python and (experimental) Java. Runs on ARM boards such as the Raspberry Pi, making a cheap Ethernet-to-DMX gateway, and converts between protocols. Its SPI plugin drives pixel strings directly, with per-port pixel type and DMX start address settable over RDM.
aliases:
  - OLA
features: Protocol conversion (e.g. Art-Net to sACN), DMX-over-IP to DMX512 gateway with a USB DMX interface, SPI pixel output, Fadecandy USB output for WS2811/WS2812 pixels
hardware: Linux and macOS hosts incl. Raspberry Pi; USB DMX interfaces (Enttec DMX USB Pro / Pro Mk2 / Open DMX USB, DMXking ultraDMX, Robe Universal Interface, Scanlime Fadecandy and others)
language: C++
license: LGPL-2.1-or-later AND GPL-2.0-or-later
links:
  repo: https://github.com/OpenLightingProject/ola
other_links:
  - https://www.openlighting.org/ola/
  - https://www.openlighting.org/ola/tutorials/ola-on-raspberry-pi/
platforms:
  - Linux
  - macOS
  - FreeBSD
  - Raspberry Pi
protocols:
  - Art-Net
  - sACN
  - ESP Net
  - KiNET
  - Open Pixel Control
  - OSC
  - Pathport
  - SandNet
  - ShowNet
  - Renard
  - DMX512
