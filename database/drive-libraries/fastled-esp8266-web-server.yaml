name: FastLED + ESP8266 Web Server
status: unknown
creator: Jason Coon (Evil Genius Labs)
notes: Arduino/PlatformIO firmware that controls an addressable LED strip from a web browser (a single-page app served from the board's flash) or an infrared remote - on/off, brightness, pattern, colour - with REST web services and connected or stand-alone access-point modes. Built on FastLED, with build configurations for plain strips and for specific LED products (Fibonacci32 to Fibonacci1024, Kraken64, Chamaeleon64, 1628 Rings, ESP8266 Thing).
aliases:
  - esp8266-fastled-webserver
features: Web app (jQuery + Bootstrap) over LittleFS, WebSockets, WiFiManager setup, NTP clock, IR remote control
hardware: Wemos D1 Mini (ESP8266) or D1 Mini32 (ESP32)
language: C++
license: GPL-3.0
links:
  repo: https://github.com/jasoncoon/esp8266-fastled-webserver
platforms:
  - ESP8266
  - ESP32
related:
