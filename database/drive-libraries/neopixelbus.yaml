name: NeoPixelBus
status: active
creator: Michael C. Miller (Makuna)
notes: >-
  Arduino library for one-wire (NeoPixel-style) and two-wire (DotStar-style) pixels, with
  asynchronous hardware output on ESP8266, ESP32, RP2040 and nRF52, RGB/RGBW/RGBWW colour features,
  an animator, gamma correction and matrix layouts. WLED drives its LEDs through it.
aliases:
  - NeoPixelBus by Makuna
features: RGB, RGBW and RGBWW pixels; async hardware output on ESP8266, ESP32, RP2040 and nRF52; animator, gamma and matrix/topology helpers
hardware: AVR, ESP8266, ESP32, RP2040, Nano 33 BLE and many Arm Arduinos
language: C++
license: LGPL-3.0
links:
  repo: https://github.com/Makuna/NeoPixelBus
platforms:
  - Arduino
  - ESP8266
  - ESP32
  - RP2040
  - nRF52
protocols:
  - DMX512
