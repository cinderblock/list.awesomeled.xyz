name: MicroPython
status: active
creator: Damien George
notes: Lean and efficient Python 3 implementation for microcontrollers and constrained systems. Its neopixel module drives WS2812 / NeoPixel strips, RGB or RGBW, with 800 kHz or 400 kHz timing; it is included by default on the ESP8266, ESP32 and RP2 ports and installable with mip on STM32 and others.
features: neopixel module (NeoPixel class; bpp 3 or 4, timing 800 kHz / 400 kHz or a custom bitstream timing tuple)
hardware: ESP32 family, ESP8266, RP2040/RP2350, SAMD21/SAMD51, STM32, nRF51/nRF52, i.MX RT and more
language: Python # interpreter written in C
license: MIT
links:
  repo: https://github.com/micropython/micropython
other_links:
  - https://micropython.org/
  - https://docs.micropython.org/en/latest/library/neopixel.html
platforms:
  - ESP32
  - ESP8266
  - RP2040
  - RP2350
  - SAMD21
  - SAMD51
  - STM32
  - nRF52
  - i.MX RT
  - Linux
  - macOS
  - Windows
