name: MoonLight
status: active
creator: MoonModules
notes: MoonModules' open-source system for large LED installations and DMX fixtures - effects, modifiers and layouts with the same web interface and light pipeline on every device; several devices work together as one installation over Art-Net, DDP and E1.31. ESP32 boards are flashed from a web installer; host builds run on desktops and Android. The current codebase (MoonModules/MoonLight, 2026) follows the earlier ewowi/MoonLight, StarLight and the WLED-MoonModules fork.
features: RMT LED and Parallel LED drivers for addressable strips, plus drivers for HUB75 panels, HDMI, NDI, Hue and PWM lights
hardware: ESP32, Teensy, desktop and Android hosts
language: C++
license: GPL-3.0
links:
  repo: https://github.com/MoonModules/MoonLight
