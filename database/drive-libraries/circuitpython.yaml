name: CircuitPython
status: active
creator: Adafruit
notes: Adafruit's beginner-friendly Python for microcontrollers, based on MicroPython - boards show up as a USB drive and code.py reloads automatically on save. The built-in neopixel_write module sends the 800 kHz NeoPixel protocol; the Adafruit NeoPixel and DotStar libraries add strip classes with RGB/RGBW support.
features: neopixel_write core module; Adafruit_CircuitPython_NeoPixel and Adafruit_CircuitPython_DotStar libraries (from the Adafruit library bundle)
hardware: 700+ boards (SAMD21/SAMD51, ESP32 family, RP2040, nRF52, STM32, i.MX RT10xx and more)
language: Python # interpreter written in C
license: MIT
links:
  repo: https://github.com/adafruit/circuitpython
other_links:
  - https://circuitpython.org/
  - https://github.com/adafruit/Adafruit_CircuitPython_NeoPixel
  - https://github.com/adafruit/Adafruit_CircuitPython_DotStar
platforms:
  - SAMD21
  - SAMD51
  - ESP32
  - RP2040
  - nRF52
  - STM32
  - i.MX RT
