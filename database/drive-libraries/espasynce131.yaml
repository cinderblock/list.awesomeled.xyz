name: ESPAsyncE131
status: active
creator: Shelby Merrick
notes: >-
  Asynchronous E1.31 (sACN) receiver library for Arduino on ESP8266 and ESP32: unicast or multicast,
  validated packets queued in a ring buffer. Derived from the same author's E131 library; ESPixelStick
  receives sACN through it.
aliases:
  - ESP Async E1.31
hardware: ESP8266 / ESP32
language: C++
links:
  repo: https://github.com/forkineye/ESPAsyncE131
platforms:
  - Arduino
  - ESP8266
  - ESP32
protocols:
  - sACN
