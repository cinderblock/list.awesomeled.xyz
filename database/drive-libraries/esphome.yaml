name: ESPHome
status: active
creator: Otto Winter (founder), Open Home Foundation (current)
notes: Firmware built from YAML configuration files for ESP32, ESP8266, RP2040, LibreTiny (BK72xx, RTL87xx, LN882x) and nRF52 chips, controlled locally from Home Assistant (native API) or MQTT. Started by Otto Winter in 2018; Nabu Casa took it over in 2021 and it is now an Open Home Foundation project.
features: 'Addressable LED light platforms: esp32_rmt_led_strip, i2s_clockless_led_strip, rp2040_pio_led_strip, beken_spi_led_strip, spi_led_strip, neopixelbus (ESP32 support deprecated in 2026.6) and fastled (not with ESP-IDF). Light effects can take E1.31 (sACN), Adalight serial and WLED UDP realtime data'
hardware: ESP32, ESP8266, RP2040, BK72xx, RTL87xx, LN882x, nRF52
language:
  - C++
  - Python
license: GPL-3.0 AND MIT
links:
  repo: https://github.com/esphome/esphome
other_links:
  - https://esphome.io/
  - https://esphome.io/components/light/
platforms:
  - ESP32
  - ESP8266
  - RP2040
  - BK72xx
  - RTL87xx
  - LN882x
  - nRF52
protocols:
  - sACN
  - Adalight
  - WLED UDP realtime
  - MQTT
