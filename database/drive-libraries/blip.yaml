name: BLIP
status: active
creator: Benjamin Kuperberg
aliases:
  - Beautiful Light In Props
features: OSCQuery Enabled, ArtNet multi-ledstrip controller and multi purpose firmware (GPIO, motors, etc.) with a unified control system. ESPNow compatible
hardware: ESP32
language: C++
license: GPL-3.0
links:
  repo: https://github.com/Golden-Geek/BLIP/
platforms:
  - ESP32
protocols:
  - Art-Net
  - DMX512
  - OSC
  - ESP-NOW
related:
  - type: uses
    ref: drive-libraries/artnetwifi
    notes: Art-Net input through rstephan's ArtnetWifi
    source:
      url: https://github.com/Golden-Geek/BLIP/blob/main/configs/components.ini
      retrieved: '2026-11-18'
  - type: uses
    ref: drive-libraries/fastled
    notes: LED strip component outputs through FastLED (or NeoPixelBus, per board config)
    source:
      url: https://github.com/Golden-Geek/BLIP/blob/main/configs/components.ini
      retrieved: '2026-11-18'
  - type: uses
    ref: drive-libraries/neopixelbus
    notes: LED strip component builds on a NeoPixelBus fork (tommag/NeoPixelBus)
    source:
      url: https://github.com/Golden-Geek/BLIP/blob/main/configs/components.ini
      retrieved: '2026-11-18'
sources:
  status:
