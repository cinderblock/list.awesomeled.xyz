name: PixLite 4 Mk2
status: active
creator:
  name: Advatek
  url: https://www.advateklights.com
  page: https://www.advateklights.com/pixlite-4-mk2-control-board
manufacturers:
  - Advatek
notes: new firmware has a pixel counting test pattern, great for mapping
inputs:
  physical:
    Ethernet: true
    Wi-Fi: true
    USB: true
  standalone: false # listed FPP support implies Falcon Player remote mode, but flat data marked standalone false
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 510 # 4080 total across 8 outputs
  clocked: selectable # output pins configurable as single or clock
  driver:
    buffered: true
  auxiliary:
    DMX512: 1
power:
  voltage:
    max: 24
  current:
    max: 30
price: 339.95
software:
  works_with:
    - xLights
sources:
  software.works_with:
    url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/advatek.xcontroller
    retrieved: '2026-11-18'
    notes: xLights controller definition (config upload supported)
technical_notes:
  - Pixel counting test pattern in firmware is useful for mapping large installations
