technical_notes:
  - GigaDevice GD32F107RCT6 Cortex-M3 microcontroller
  - Supports WS2812, SK6812, TM1804, UCS1904, GS8208, APA102, APA107, P9813, SK9822 and analog RGB(W) via 14-bit PWM
  - Also runs from 802.3bt Type 3 (50 W), 802.3at (25 W) and 802.3af (12.5 W) PoE; a fan is advised above 25 W
  - Open-source firmware, upgradable over the network
