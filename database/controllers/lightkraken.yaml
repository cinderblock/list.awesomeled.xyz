    Ethernet: true
    PoE: PoE++
  protocols:
    - Art-Net
    - sACN
  standalone: false
outputs:
  count: 2
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  current:
    max: 10 # at 5.4 V (54 W); 5.8 A at 12 V, 3 A at 23.5 V (70 W)
  clocked: selectable # async (e.g. WS2812) and clocked (e.g. APA102) types supported
  pixels:
    max_per_output: 1020 # 5 universes
  protocols:
    - WS2812
    - SK6812
    - TM1804
    - UCS1904
    - GS8208
    - SK6812 RGBW
    - APA102
    - APA107
    - P9813
    - SK9822
    - HDS107S
    - LPD8806
    - TM1829
    - WS2816
    - WS2801
    - HD108
power:
  voltage:
    min: 5.4 # selectable 5.4V / 12V / 24V
    max: 24
  current:
    max: 5
core:
  IC: GD32F107RCT6
  family: GD32
features:
  - PoE++ (802.3bt Type 4) powered, up to 70W over Cat5
  - Selectable output voltage (5.4V / 12V / 24V)
  - Built-in web configurator
