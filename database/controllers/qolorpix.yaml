name: Qolorpix
status: active
creator:
  name: City Theatrical
  url: https://www.citytheatrical.com
  page: https://www.citytheatrical.com/products/electronics/qolorflex-led-tape-and-accessories/qolorpix-tape-controller-eight-output
notes: DMX-controlled LED tape replay unit (model 5850, "QolorPIX Tape Controller, Eight Output") with a built-in 600 W, 5 V supply for 5 V WS2812B QolorPIX tape.
inputs:
  physical:
    DMX512: XLR-5 in + thru
    Wireless DMX: Multiverse
    buttons: true
  protocols:
    - DMX512
  standalone: true # 24 base effects + 4 recordable presets, runs without external controller
outputs:
  connector:
    ref: xlr-4
    notes: female, one per output
  count: 8
  driver:
    buffered: true
  pixels:
    max_per_output: 240
  current:
    max: 6 # 5 VDC output, 6 A max per port
  clocked: false # WS2812B tape
  protocols:
    - WS2812B
power:
  voltage:
    min: 85 # 85-264 VAC mains input via PowerCON
    max: 264
case:
  dimensions: 34.6cm L x 20.3cm W x 8.9cm H
  mounting: 19" rack, 2U
  waterproof: IP20
data:
  storage:
    - type: microSD # firmware updates via micro-SD card
datasheet:
  url: https://www.citytheatrical.com/docs/default-source/cut-sheets/5850-qolorpix-tape-controller.pdf # cut sheet (spec sheet)
features:
  - Integrated power supply (no external PSU)
  - Multiverse wireless DMX receiver
  - Full RDM support (wired DMX and Multiverse)
  - 24 base effects with recordable presets
  - Test function and flicker finder
