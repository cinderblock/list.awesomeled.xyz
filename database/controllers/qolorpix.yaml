technical_notes:
  - 600 W total output at 5 VDC (6 A max per port); 85-264 VAC input via PowerCON (manual - 115/230 VAC, 3.5/1.8 A)
  - Max 10 m cable run to LED tape
  - powerCON TRUE1 power in/thru; power can daisy-chain to at most 3 units
  - Indoor use only (NEMA 1 / IP20 steel enclosure)
