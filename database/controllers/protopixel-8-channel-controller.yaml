name: ProtoPixel 8 channel controller
status: discontinued
creator:
  name: ProtoPixel
  url: https://www.protopixel.io
  page: https://www.protopixel.io/pricing
notes: Driven over Ethernet (direct or through a switch) by ProtoPixel Create on a Mac, or by a ProtoPixel Node or Player. Up to 4800 RGB LEDs across two 4-output satellites (600 per output).
inputs:
  physical:
    Ethernet: true
    buttons: 1
  standalone: false
  requires_host: Mac (MacBook or iMac) running ProtoPixel Create, or a ProtoPixel Node / ProtoPixel Player
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 600
  clocked: false
  driver:
    buffered: true
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - NEOPIXEL
    - sk6812
    - WS2813
    - CS8812
    - WS2815
datasheet:
  url: https://web.archive.org/web/20200929142224id_/https://protopixel.fra1.digitaloceanspaces.com/production-website/documents/products/spec-sheets/LED_controller_spec_sheet.pdf?mtime=20200509143456&focal=none # spec sheet; the live bucket now returns 403
dead_links:
  - url: https://www.protopixel.io/pricing
    archive: https://web.archive.org/web/20210218144636/https://www.protopixel.io/pricing
    checked: '2026-11-18'
    notes: Now redirects to the generic product overview, which no longer lists this controller
features:
  - Two 4-output satellites connected to the controller via Ethernet
images:
  - file: protopixel-8-channel-controller.webp
    source: https://web.archive.org/web/20200929142224/https://protopixel.fra1.digitaloceanspaces.com/production-website/documents/products/spec-sheets/LED_controller_spec_sheet.pdf?mtime=20200509143456&focal=none
    credit: ProtoPixel
price: 573
software:
  works_with:
    - ProtoPixel Create
sources:
  status:
    url: https://www.protopixel.io/tools/product-overview
    retrieved: '2026-11-18'
    notes: 'not in the current lineup (Brain and Gate controllers only), no 8-channel controller'
  software.works_with:
    - url: http://web.archive.org/web/20200808024716/https://www.protopixel.io/pricing
      retrieved: '2026-11-18'
      notes: ProtoPixel Create docs name this hardware
    - url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
      retrieved: '2026-11-18'
      notes: "'Controller LED Status' table."
  outputs.protocols:
    url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
    retrieved: '2026-11-18'
    notes: "'Controller description' chipset table; WS2813, CS8812 and WS2815 need firmware v3+, the rest v1. 'NEOPIXEL' (Adafruit brand) kept as written."
  inputs.requires_host:
    url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
    retrieved: '2026-11-18'
    notes: "Ecosystem diagram: Router/Switch -> 'MacBook or iMac' over 'Ethernet cable or Wi-Fi'"
  inputs.physical:
    url: https://protopixel.net/doc/controller/pages/first_steps.html
    retrieved: '2026-11-18'
    notes: "'Plug the 10/100 ethernet connector to the controller's ethernet port'"
technical_notes:
  - Up to 4800 RGB LEDs total across 8 outputs (600 per output)
  - Supports WS2811, WS2812, WS2813, WS2815, SK6812 and similar pixel ICs
  - Subscription model (2020-21 prices) - ProtoPixel Create design software €149/month; management plans from €79/month
