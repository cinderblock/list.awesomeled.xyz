name: ProtoPixel 8 channel controller
status: active
creator:
  name: ProtoPixel
  url: https://www.protopixel.io
  page: https://www.protopixel.io/pricing
notes: Driven by the ProtoPixel software running on a connected host over USB. Up to 4800 RGB LEDs across two 4-output satellites (600 per output).
inputs:
  physical:
    USB: true
  standalone: false
  requires_host: Mac (MacBook or iMac) running ProtoPixel Create, or a ProtoPixel Node / ProtoPixel Player
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 600
  clocked: false
  driver:
    buffered: true
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - NEOPIXEL
    - sk6812
    - WS2813
    - CS8812
    - WS2815
features:
  - Two 4-output satellites connected to the controller via Ethernet
price: 573
software:
  works_with:
    - ProtoPixel Create
sources:
  software.works_with:
    - url: http://web.archive.org/web/20200808024716/https://www.protopixel.io/pricing
      retrieved: '2026-11-18'
      notes: ProtoPixel Create docs name this hardware
    - url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
      retrieved: '2026-11-18'
      notes: "'Controller LED Status' table."
  outputs.protocols:
    url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
    retrieved: '2026-11-18'
    notes: "'Controller description' chipset table; WS2813, CS8812 and WS2815 need firmware v3+, the rest v1. 'NEOPIXEL' (Adafruit brand) kept as written."
  inputs.requires_host:
    url: https://protopixel.net/doc/controller/pages/protopixel_hw_ecosystem.html
    retrieved: '2026-11-18'
    notes: "Ecosystem diagram: Router/Switch -> 'MacBook or iMac' over 'Ethernet cable or Wi-Fi'"
technical_notes:
  - Up to 4800 RGB LEDs total across 8 outputs (600 per output)
  - Supports WS2811, WS2812, WS2813, WS2815, SK6812 and similar pixel ICs
  - Subscription model - design software from $149/month, deployment from $79/month
