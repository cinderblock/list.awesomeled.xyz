technical_notes:
  - Up to 8 universes of DMX over Ethernet, at most 4 per output (2048 channels per output)
  - 5 W maximum power consumption; operating temperature -10 to 60 °C
  - Datasheet and user manual dated February 2019, firmware v1.2 (Feb 2019)
  - Also accepts ENTTEC's own ESP (ENTTEC Show Protocol), which the site's protocol list doesn't name
