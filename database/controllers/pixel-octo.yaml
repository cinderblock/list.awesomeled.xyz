name: Pixel Octo
status: discontinued
creator:
  name: ENTTEC
  url: https://www.enttec.com
  page: https://www.enttec.com/product/din/led-pixel-control-din-rail/din-rail-led-pixel-controller/
notes: ENTTEC 71520, the original 8-universe DIN-rail Ethernet-to-pixel controller with two 4-universe outputs. Superseded by the OCTO MK2 (71521).
inputs:
  physical:
    Ethernet: 2 # 2x RJ45, daisy-chain up to 50 units
    buttons: 1 # identify/test button
  protocols:
    - Art-Net
    - sACN
    - KiNET
  standalone: true # Fx generator plays a stored preset from power-up
outputs:
  count: 2
  connector:
    ref: mtsb-combicon
    pins: 4
    notes: pluggable Phoenix terminal block
  driver:
    buffered: true # sheet value, not verified
  pixels:
    max_per_output: 680 # RGB (4 universes); 512 RGBW
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - WS2813
    - WS2815
    - SK6812
    - TM1804
    - TM1812
    - TM1814
    - APA102
    - APA104
    - 9PDOT
  clocked: selectable # 3-wire and 4-wire (clock) LED protocols
power:
  connector: 2-pin pluggable Phoenix terminal
  voltage:
    min: 4
    max: 60
case:
  dimensions: 103x69x58mm
  material: Aluminium
  mounting: 35 mm DIN rail (4 modules)
  waterproof: IP20
datasheet:
  url: https://dol2kh495zr52.cloudfront.net/pdf/datasheets/Pixel+Octo_DS+(Feb+2019).pdf
dead_links:
  - url: https://www.enttec.com/product/din/led-pixel-control-din-rail/din-rail-led-pixel-controller/
    archive: https://web.archive.org/web/20190723230438/https://www.enttec.com/product/din/led-pixel-control-din-rail/din-rail-led-pixel-controller/
    checked: '2026-11-18'
features:
  - Wide 4-60 V DC input; can be back-fed from the pixel strip's supply
  - Identify button checks the wiring without a network input
  - Temperature and network-traffic monitoring in the web interface
  - Fx generator with a 100-slot preset library (14 factory effects)
other_links:
  - https://support.enttec.com/legacy-product/legacy-products/pixel-octo-71520-legacy-product
  - https://dol2kh495zr52.cloudfront.net/pdf/manuals/Pixel_Octo_UM+(Feb+2019).pdf
