name: LED Player M
status: discontinued
creator: Diamex
notes: Standalone TPM2 player (microSD) for up to 2048 LEDs on up to 8 single-wire channels, or one data + clock channel; Mini-USB virtual COM takes live data from JINX/GLEDIATOR. No network input. Diamex's successor is the 4-channel LED-Player-ME.
inputs:
  physical:
    USB: mini-USB
    buttons: 2
    triggers: 4
  protocols:
    - TPM2
    - Glediator
  standalone: true
outputs:
  count: 8 # single-wire LEDs on CH1-CH8; one clocked channel (DATA on CH4, CLOCK on CH8)
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 1024 # single-wire; one data + clock channel drives up to 2048
    max_total: 2048
  clocked: selectable
  protocols:
    - WS2811
    - WS2812
    - UCS1903
    - PL9823
    - APA106
    - WS2821
    - WS2801
    - APA102
    - LPD8803
    - LPD8806
power:
  voltage:
    min: 5 # USB or the +5V terminal; never more than 5 V
    max: 5
data:
  storage:
    - type: microSD
      max_size: 32 # SD/SDHC; SDXC cards are not readable
datasheet:
  url: https://www.diamex-shop.de/mediafiles/LG/LED-Player-M_Anleitung.pdf # user manual (German); has a Technische Daten section
  sources:
    - url: https://media.elv.com/file/121060_led_player_um.pdf
      host: distributor
      notes: ELV copy of the 2015 V1.0 manual
    - url: https://www.led-genial.de/mediafiles//Sonstiges/ENG_LED_Player_M.pdf
      host: manufacturer
      notes: English manual
    - url: https://www.led-genial.de/mediafiles/Sonstiges/LED-Player-M_Anleitung.pdf
      host: manufacturer
      notes: German manual (led-genial copy)
