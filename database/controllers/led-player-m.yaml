name: LED Player M
status: discontinued
creator: Diamex
notes: Standalone TPM2 player (microSD) for up to 2048 LEDs; USB virtual COM takes live data from JINX/GLEDIATOR. No network input.
inputs:
  physical:
    USB: true # Mini-USB - virtual COM (live JINX/GLEDIATOR), config, bootloader
    microSD: true # TPM2 file playback
  standalone: true
outputs:
  count: 8 # single-wire LEDs on CH1-CH8; one clocked channel (DATA on CH4, CLOCK on CH8)
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 2048 # per the LED-Player-M manual (was recorded as 512)
  clocked: selectable
  protocols:
    - WS2811
    - WS2812
    - UCS1903
    - PL9823
    - APA106
    - WS2821
    - WS2801
    - APA102
    - LPD8803
    - LPD8806
power:
  voltage:
    max: 5
