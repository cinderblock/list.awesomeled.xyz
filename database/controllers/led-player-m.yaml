technical_notes:
  - 'LED types: WS2811/WS2812 (UCS1903, PL9823 compatible), APA106, WS2821, WS2801, APA102, LPD8803/LPD8806'
  - ARM Cortex-M4 microcontroller at 96 MHz; 5 V data output level
  - A DIN-rail version (LED-Player-MH) adds built-in RS-485 line drivers for long runs to receivers
