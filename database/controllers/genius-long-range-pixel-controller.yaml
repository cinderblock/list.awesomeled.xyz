name: Genius Long Range Pixel Controller
status: active
release_year: 2022
creator:
  name: Experience Lights
  page: https://store.experiencelights.com/long-range-genius-pixel-controller/
inputs:
  physical:
    Ethernet: true
    Wi-Fi: true # setup hotspot; client mode from firmware 2.0
    Bluetooth: true # firmware 2.0
    buttons: 2
  protocols:
    - DDP
    - sACN
    - Art-Net
  standalone: true
outputs:
  connector:
    ref: rj45
  count: 40
  driver:
    buffered: true
  pixels:
    max_total: 20000
    # via DDP (~10,000 via E1.31/Art-Net); no per-port cap
  clocked: false # async pixels only
  auxiliary:
    DMX512: 2
  protocols:
    - WS281X
power:
  voltage:
    min: 100 # AC mains into the on-board MEAN WELL 5 V supply (2023 edition); the 2022 edition took 5 V DC, 3 A
    max: 240
data:
  storage:
    - type: microSD
