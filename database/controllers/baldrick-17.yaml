name: Baldrick17
status: active
release_year: 2025
creator:
  name: ILIGHTTHAT
  page: https://www.baldrickboard.com/en/boards/baldrick17
inputs:
  physical:
    Ethernet: 2 # daisy-chainable; network input for DDP/Art-Net/sACN
    buttons: true # test buttons (count not published)
    triggers: 3 # Turniput contact-closure inputs with button-lamp control
  protocols:
    - Art-Net
    - sACN # E1.31
    - DDP
  standalone: true # no Pi or FPP licence required; FPP API control built in
outputs:
  count: 17
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  pixels:
    max_per_output: 750 # up to 750 RGB pixels per port at 40fps
  clocked: false # async / single-wire pixels
  fuse: '7.5A' # 17 fused connectors with included 7.5 amp fuses
  protocols:
    - WS2811
    - UCS1903
    - SM16703P
    - UCS2904
power:
  voltage:
    min: 5
    max: 48
  current:
    max: 63.75
features:
  - Per-output fused connectors
  - Push from xLights integration
  - FPP API control to start/stop sequences and full lamp control
images:
  - file: baldrick-17.webp
    source: https://www.baldrickboard.com/en/boards/baldrick17
    credit: ILIGHTTHAT
price: 189
price_source:
  notes: Official US store, linked from the creator's buy page
  retrieved: '2026-11-18'
  url: https://www.baldrickstore.com/pixel-controllers/baldrick17/
  vendor: Baldrick Store
related:
  - type: variant
    ref: controllers/baldrick-8
    notes: 17-port version of the Baldrick8 (same firmware, setup and pixel wiring, plus Turniputs)
    source:
      url: https://www.baldrickboard.com/en/boards/baldrick17/manual
      retrieved: '2026-11-18'
software:
  works_with:
    - xLights
    - FPP
sources:
  status:
