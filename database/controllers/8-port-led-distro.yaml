name: 8 Port LED Distro
status: active
creator:
  name: Bong69
  page: https://www.tindie.com/products/bong69/8-port-led-distro
vendors:
  - name: Wasatch Lights
inputs:
  physical:
    Ethernet: true # WT32-ETH01 module
    Wi-Fi:
      - 2.4GHz
    USB: USB-C # programming
    GPIO: 4
  protocols:
    - sACN
    - DDP
    - Art-Net
  standalone: true # WLED firmware can play effects without a host
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  clocked: false # single-wire / async pixels
  fuse: 5 A replaceable 1808 fuses (V4); resettable fuses (V3)
  auxiliary:
    GPIO: 7 # GPIO17, 32, 33, 34, 35, 36, 39 broken out for buttons/mics/sensors
  pixels:
    max_total: 4800 # sheet value, not stated by the maker (see technical_notes)
  protocols:
    - WS2811
    - WS2812
    - WS2815
    - SK6812 RGBW
    - SM16825
power:
  voltage:
    min: 12 # V4 (current production); V3 (no longer made) was 5-24V
    max: 48
core:
  family: ESP32
features:
  - Runs WLED (pre-installed) or ESPixelStick firmware
  - Pluggable Phoenix connectors for outputs
images:
  - file: '8-port-led-distro.webp'
    source: https://www.tindie.com/products/bong69/8-port-led-distro/
    credit: Bong69
price: 65
price_source:
  notes: 'V4.1 board (ESP32, internal antenna, 12-48V): $40 base + $25 option; V3.1 5-24V options $55 (internal antenna) / $57 (external)'
  retrieved: '2026-11-18'
  url: https://www.tindie.com/products/bong69/8-port-led-distro
  vendor: Bong69 (Tindie)
related:
  - type: uses
    ref: microboards/wt32-eth01
    notes: "Built on the WT32-ETH01 design: V1 carried the module, V2+ integrate its parts (WLED Ethernet type 'WT32-ETH01')"
    source:
      url: https://github.com/bobko69/8PortLEDDistro/blob/main/BOARD_VERSIONS.md
      retrieved: '2026-11-18'
software:
  firmware:
    - WLED
    - ESPixelStick
  works_with:
    - xLights
