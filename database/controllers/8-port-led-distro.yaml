name: 8 Port LED Distro
status: active
creator:
  name: Bong69
  page: https://www.tindie.com/products/bong69/8-port-led-distro
vendors:
  - name: Wasatch Lights
inputs:
  physical:
    Ethernet: true # RJ45 onboard
  protocols:
    - sACN # E1.31
    - DDP
  standalone: true # WLED firmware can play effects without a host
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  clocked: false # single-wire / async pixels
  auxiliary:
    GPIO: 7 # GPIO17, 32, 33, 34, 35, 36, 39 broken out for buttons/mics/sensors
  pixels:
    max_total: 4800
  protocols:
    - WS2811
    - WS2812
    - WS2815
    - SK6812 RGBW
    - SM16825
power:
  voltage:
    min: 12 # V4 (current production); V3 (discontinued) was 5-24V
    max: 48
core:
  family: ESP32
features:
  - Runs WLED (pre-installed) or ESPixelStick firmware
  - Pluggable Phoenix connectors for outputs
images:
  - file: '8-port-led-distro.webp'
    source: https://www.tindie.com/products/bong69/8-port-led-distro/
    credit: Bong69
price: 65
price_source:
  notes: 'V4.1 board (ESP32, internal antenna, 12-48V): $40 base + $25 option; V3.1 5-24V options $55 (internal antenna) / $57 (external)'
  retrieved: '2026-11-18'
  url: https://www.tindie.com/products/bong69/8-port-led-distro
  vendor: Bong69 (Tindie)
related:
  - type: uses
    ref: microboards/wt32-eth01
    notes: "Built on the WT32-ETH01 design: V1 carried the module, V2+ integrate its parts (WLED Ethernet type 'WT32-ETH01')"
    source:
      url: https://github.com/bobko69/8PortLEDDistro/blob/main/BOARD_VERSIONS.md
      retrieved: '2026-11-18'
software:
  firmware:
    - WLED
    - ESPixelStick
  works_with:
    - xLights
sources:
  status:
    url: https://www.tindie.com/products/bong69/8-port-led-distro
    retrieved: '2026-11-18'
    notes: 'listed $65, v4.1 option 312 in stock'
  software.firmware:
    - url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
      notes: "WLED docs: compatible controllers — section 'Controllers with WLED pre-installed'"
    - url: https://github.com/bobko69/8PortLEDDistro/blob/main/README.md
      retrieved: '2026-11-18'
      notes: "Readme 'What is it?' and Specifications (Version 4): 'Firmware | WLED (ships installed and set up), or ESPixelStick'"
  software.works_with:
    - url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/wled.xcontroller
      retrieved: '2026-11-18'
      notes: xLights controller definition (config upload supported) — under the WLED vendor as Controller 'Bong69'
    - url: https://github.com/bobko69/8PortLEDDistro/blob/main/README.md
      retrieved: '2026-11-18'
      notes: Readme 'What is it?'; FAQ has 'How do I add the 8 Port LED Distro to xLights?'
  outputs.protocols:
    url: https://github.com/bobko69/8PortLEDDistro/blob/main/README.md
    retrieved: '2026-11-18'
    notes: "Readme 'What else do I need?' (maker's official repository). Examples only ('such as'): the board takes any single-wire type WLED supports; clocked types (APA102, WS2801) explicitly won't work. FAQ pixel-count table lists the same five."
  wled_compatible:
    url: https://github.com/bobko69/8PortLEDDistro/blob/main/README.md
    retrieved: '2026-11-18'
    notes: Readme intro
