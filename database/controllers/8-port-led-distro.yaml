technical_notes:
  - Open hardware; design files and WLED/ESP32 firmware at https://github.com/bobko69/8PortLEDDistro
  - 'Versions: V4 (current) accepts 12-48V and drops 5V pixels; V3 (no longer made, remaining stock sold) accepted 5-24V'
  - Over Ethernet the maker quotes up to 40 FPS with 400 LEDs per output; all 8 outputs run at the same pixel voltage
  - USB-C is for programming only
wled_compatible: true
