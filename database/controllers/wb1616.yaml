name: WB1616
status: discontinued
release_year: 2022
creator:
  name: Wally's Lights
  page: https://wallyslights.com/products/wallys-lights-wb1616-controller
notes: BeagleBone Black cape running FPP, designed with Scott Hanson and sold as a kit with a BeagleBone Black and an FPP microSD card. 16 local fused ports plus 16 remote (long-range) ports on 4 RJ45 jacks for Universal Differential Receivers, and 2 DMX ports; up to 1400 pixels per port at 20 fps.
inputs:
  physical:
    Ethernet: true # via host BeagleBone
    USB: true # via host BeagleBone
    buttons: 6
    GPIO: true
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # plays from SD card
  requires_host: BeagleBone Black
outputs:
  count: 32 # 16 local + 16 remote via 4 RJ45 jacks
  connector:
    ref: mtsb-combicon
  differential: true # 16 remote ports drive up to 4 Universal Differential Receivers
  clocked: false # async pixel types
  auxiliary:
    DMX512: 2
  pixels:
    max_per_output: 1400 # 800 at 40 fps
  protocols:
    - WS2811
power:
  voltage:
    max: 24
data:
  storage:
    - type: SD
dead_links:
  - url: https://wallyslights.com/products/wallys-lights-wb1616-controller
    archive: https://web.archive.org/web/20250805175734/https://wallyslights.com/products/wallys-lights-wb1616-controller
    checked: '2026-11-18'
features:
  - OLED display, 4 navigation buttons and a test button
  - Voltage sensors and reverse polarity protection
  - Header pins for a real-time clock; holes for GPIO inputs/outputs
images:
  - file: wb1616.webp
