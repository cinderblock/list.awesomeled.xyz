name: EspArtStick
status: discontinued
release_year: 2020
creator:
  name: Microcyb
  url: https://www.microcyb.com
  page: https://www.microcyb.com/index.html#!/WLED-5v-12V-SD-Card-WiFi-EspArtStick-pixel-controller/p/170368862/category=0
vendors:
  - name: EspartStick
    page: https://espartstick.ecwid.com/WLED-5v-12V-SD-Card-WiFi-EspArtStick-pixel-controller-p170368862
notes: Wemos D1 Mini (ESP8266) shield sold assembled, with WLED pre-installed from 2021. One single-wire output; a microSD slot plays xLights FSEQ files standalone (up to 512 pixels, with the custom EspArtStick SD firmware rather than WLED). The 2022 revision added an IR receiver and a fixed screw terminal. Also sold as a Pro Edition (D1 Mini Pro, external antenna) and a USB-powered Costume Edition.
inputs:
  physical:
    Wi-Fi:
      - 2.4GHz
    USB: micro-USB
    IR: true # 2022 revision
  protocols:
    - sACN # E1.31 over Wi-Fi
  standalone: true # FSEQ playback from microSD (custom firmware)
outputs:
  count: 1
  connector: Screw terminal # plug-in terminal block on 2020-21 boards
  clocked: false # single-wire only
  driver:
    buffered: true # data level shifter
  protocols:
    - WS2811
    - WS2812
power:
  voltage:
    min: 5
    max: 12 # board marked up to 24 V
core:
  family: ESP8266
data:
  storage:
    - type: microSD
      max_size: 32
