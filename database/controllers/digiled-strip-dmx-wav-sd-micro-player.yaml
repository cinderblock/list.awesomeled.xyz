technical_notes:
  - Pixel, DMX512, or WAV sound scene playback from SD card
  - Programmed using Artrender (https://www.boutique-electroconcept.com/informations/telechargements.html)
  - WAV mode drives an 8 ohm speaker (or a resistor divider to a line input); 8-bit 8 kHz to 44.1 kHz WAV files
  - A config file on the SD card sets the input mode and whether programs loop
