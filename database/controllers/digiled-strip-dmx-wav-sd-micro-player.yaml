name: Digiled Strip/DMX/WAV SD Micro Player
status: active
creator:
  name: Electroconcept
  page: https://www.boutique-electroconcept.com/micro-sd-player-digiled-strip-ou-dmx-512.html
notes: 35 x 18 mm micro-SD player board, sold in one of three firmware modes chosen when ordering - WS2812 pixel programs (up to 8 universes, made with ArtRender), one DMX512 universe (Recorder V2 recordings) or WAV audio. 6 dry-contact inputs start programs. Programmed using Artrender.
inputs:
  physical:
    Trigger inputs: 6 # dry-contact (non-isolated) inputs select programs 1-6, plus an optional default program
    triggers: 6 # dry-contact solder pads
  standalone: true
outputs:
  count: 1
  connector: Solder pads
  clocked: false # WS2812 single-wire pixels
  auxiliary:
    DMX512: 1 # DMX firmware version only (mode chosen at purchase)
  pixels:
    max_per_output: 1360 # 4080 WS2812 channels (8 universes)
  protocols:
    - WS2812
    - WS2811
power:
  voltage:
    min: 5
    max: 5 # DC +5 V, 20-70 mA
data:
  storage:
