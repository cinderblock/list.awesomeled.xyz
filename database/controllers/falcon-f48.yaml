name: Falcon F48
status: discontinued
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
  page: https://pixelcontroller.com/store/discontinued-products/52-f16v2-beta-board.html
notes: The original (F16V3-generation) Falcon F48 - 48 differential outputs and no local ports, driving up to 12 Falcon differential receiver boards (4 outputs each). Up to 16,384 pixels from 96 universes of E1.31 or Art-Net. Later models are the F48V4 and F48V5.
inputs:
  physical:
    Ethernet: 2
    Wi-Fi:
      # limited configuration only
      - 2.4GHz
    buttons: 6
  protocols:
    - sACN
    - Art-Net
    - DDP
    - ZCPP
  standalone: true # Falcon Player (FPP) remote mode plays FSEQ from SD card
outputs:
  count: 48
  connector:
    notes: to Falcon differential receiver boards (up to 12, 4 outputs each)
    ref: rj45
  differential: true
  driver:
    buffered: true
  pixels:
    max_per_output: 1024 # per-port maxima of the three 16-port groups must add up to 1024 (e.g. 512/256/256)
    max_total: 16384
  clocked: false
  auxiliary:
    DMX512: 4 # 3 on RJ-45 + 1 on a 3-pin connector
  protocols:
    - WS2811
    - WS2812
    - TM1804
    - TM1803
    - TM1809
    - TM1812
    - SM16715
    - INK1003
    - LX1203
    - UCS1903
    - TLS3001
    - TLS3002
    - CY3005
    - GE Color Effects
    - UCS2903
power:
  voltage:
    min: 5
    max: 5
data:
  storage:
    - type: microSD
features:
  - OLED status display
  - 2-port Ethernet switch for daisy-chaining
  - Reverse-polarity protected 5V input
