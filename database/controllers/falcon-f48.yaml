name: Falcon F48
status: discontinued
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
  page: https://pixelcontroller.com/store/discontinued-products/52-f16v2-beta-board.html
notes: 48 differential pixel outputs via remote receiver boards (4 outputs each).
inputs:
  physical:
    Ethernet: Dual # 2-port switch for daisy-chaining
  protocols:
    - Art-Net
    - sACN # E1.31
  standalone: true # Falcon Player (FPP) remote mode plays FSEQ from SD card
outputs:
  count: 48
  connector:
    notes: to differential SmartReceiver boards
    ref: rj45
  differential: true
  driver:
    buffered: true
  pixels:
    max_per_output: 1022 # 1022 @ 20fps, 680 @ 40fps
  clocked: false
  auxiliary:
    DMX512: 4 # 3 on RJ-45 + 1 on a 3-pin connector
  protocols:
    - WS2811
    - WS2812
    - TM1804
    - TM1803
    - TM1809
    - TM1812
    - SM16715
    - INK1003
    - LX1203
    - UCS1903
    - TLS3001
    - TLS3002
    - CY3005
    - GE Color Effects
    - UCS2903
power:
  voltage:
    min: 5
    max: 5
data:
  storage:
    - type: uSD
features:
  - OLED status display
  - 2-port Ethernet switch for daisy-chaining
  - Reverse-polarity protected 5V input
