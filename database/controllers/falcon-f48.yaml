technical_notes:
  - 'Pixel ports form three groups of 16 whose per-port maxima must add up to 1024 (e.g. 512 / 256 / 256): 16,384 pixels in total'
  - Any of the 49,152 received channels can be a port's start address
  - 'String types: WS2811/WS2812, TM1803/TM1804/TM1809/TM1812, SM16715, INK1003, LX1203'
  - Runs from a 5 V, 3 A supply; a power output port feeds switches
