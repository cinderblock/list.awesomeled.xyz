name: www.orangepi-dmx.org
status: active
creator:
  name: Arjan van Vught (Open Source)
  url: http://www.orangepi-dmx.org
  page: http://www.orangepi-dmx.org
notes: Unique central configuration with human readable UDP messages. No FPS limit except what is given for the pixel protocol.
inputs:
  physical:
    Ethernet: true
  standalone: true
  requires_host: Orange Pi Zero
outputs:
  count: 8
  pixels:
    max_per_output: 680 # 5440 total / 8 outputs
  driver:
    buffered: true
  clocked: selectable # supports both clocked and clockless pixels
  protocols:
    - WS2801
    - WS2811
    - WS2812
    - WS2812B
    - WS2813
    - WS2815
    - SK6812
    - SK6812W
    - UCS1903
    - UCS2903
    - CS8812
    - APA102
    - SK9822
    - P9813
images:
  - file: www-orangepi-dmx-org.webp
    source: https://www.orangepi-dmx.org/orange-pi/ws28xxapa102ucsx903tlc59711p9813-configuration/prototype-boards/multi-port-pixel-prototype-boards/schematic-and-board_1
    credit: Arjan van Vught
price: 50
software:
  firmware:
    - Orange Pi DMX
  works_with:
    - Jinx!
    - Lightjams
    - MadMapper
    - Chamsys MagicQ
    - MADRIX
    - Q Light Controller+
    - Resolume
sources:
  outputs.protocols:
    url: https://github.com/vanvught/rpidmx512/blob/master/lib-pixel/include/pixeltype.h
    retrieved: '2026-11-18'
    notes: Maker's firmware repository (vanvught/rpidmx512), lib-pixel pixel type enum, used by the multi-port (8x) output driver too (pixeloutputmulti.cpp handles APA102/SK9822/P9813).
  software.firmware:
    url: https://github.com/vanvught/rpidmx512/blob/master/README.md
    retrieved: '2026-11-18'
    notes: The board runs the author's own open-source (MIT) bare-metal firmware, i.e.
  software.works_with:
    url: http://www.orangepi-dmx.org/1-art-net-4-node-dmx-rdm-controller-pixel-controller/successfully-tested
    retrieved: '2026-11-18'
    notes: "'Successfully tested' list for the Art-Net 4 Node (DMX / RDM Controller / Pixel Controller) firmware."
  inputs.requires_host:
    url: https://github.com/vanvught/rpidmx512/blob/master/README.md
    retrieved: '2026-11-18'
    notes: 'firmware list: the 8x 4-universe pixel controller builds are for the Orange Pi Zero'
  status:
    url: https://github.com/vanvught/rpidmx512
    retrieved: '2026-11-18'
    notes: open-source firmware repository last pushed 2026-07-26; site still documents the 8-output pixel board
wled_compatible: false
