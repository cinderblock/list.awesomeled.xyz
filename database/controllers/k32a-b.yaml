name: K32A-B
status: discontinued
creator:
  name: KulpLights, LLC
  url: https://kulplights.com
  page: https://kulplights.com/product/k32a-b/
notes: BeagleBone Black cape running FPP (Ethernet via the BBB), retired. 32 local string ports with 5 A mini-blade fuses plus 4 send-only RJ45 differential ports for 16 more strings via receivers - 48 strings in all. Four power terminals, one per bank of 8 ports. Two RS485 outputs for DMX/PixelNet/Renard/LOR. OLED display, RTC, onboard sound DAC; FM transmitter optional. Successors are the K32, K32-Pro and K32-Max.
inputs:
  physical:
    Ethernet: true # via host BeagleBone
    buttons: 6
    GPIO: 9
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # runs FPP (Falcon Player)
  requires_host: BeagleBone Black
outputs:
  count: 48 # 32 fused local + 16 via the 4 RJ45 differential ports
  connector: Phoenix Screw/RJ45
  driver:
    buffered: true
  differential: true # 4 RJ45 differential receiver ports
  clocked: false # async pixel types
  current:
    max: 5 # 5 A mini-blade fuse per port
  auxiliary:
    DMX512: 2 # two RS485 outputs (DMX/PixelNet/Renard/LOR)
  pixels:
    max_per_output: 1500 # at 20 fps; 800 at 40 fps
  protocols:
    - WS2811
    - WS2812
power:
  voltage:
    min: 5
    max: 18
  current:
    max: 160 # sheet value (32 x 5 A fuses); each of the four supply terminals is rated 30 A
data:
  storage:
    - type: microSD # via BeagleBone Black
features:
  - OLED display
  - Real-time clock (RTC)
  - Onboard sound DAC
  - Optional FM transmitter
images:
  - file: k32a-b.webp
    source: https://kulplights.com/product/k32a-b/
    credit: KulpLights, LLC
price: 150
price_source:
  notes: last list price, board only (no BeagleBone, no SD card; $250 with a premounted BeagleBone Black); the product page is reachable again but delisted from the shop and every variant is out of stock
  part: K32A-B-None-None
  retrieved: '2026-11-18'
  url: https://kulplights.com/product/k32a-b/
  vendor: Kulp Lights LLC
