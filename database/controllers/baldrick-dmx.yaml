name: Baldrick DMX
status: active
creator:
  name: ILIGHTTHAT
  url: https://www.ilightthat.com
  page: https://www.baldrickboard.com/en/boards/baldrickdmx
notes: Single DMX output available on 3 ports (RJ45, 3-pin Neutrik XLR, 5-pin Neutrik XLR).
inputs:
  physical:
    Ethernet: true # network input only; it does not take pixel data
  protocols:
    - Art-Net
    - sACN # E1.31
    - DDP
outputs:
  auxiliary:
    DMX512: 1
power:
  voltage:
    min: 5
    max: 24 # up to 48V on version 1.1
features:
  - Button / Turnip activated presets
  - Push from xLights integration
image: baldrick-dmx.webp
other_links:
  - https://www.baldrickboard.com/en/boards/baldrickdmx
price: 75
software:
  works_with:
    - xLights
