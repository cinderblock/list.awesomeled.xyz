features:
  - Built-in PDM microphone for WLED AudioReactive effects
  - Relay (GPIO18) cuts power to the strips when the lights are switched off
  - 20 A pluggable mini blade fuse (spare 5 A fuse included)
  - Reverse-polarity and ESD protection
  - Toggle switch selects the data-line resistor for signal calibration
