notes: GLEDOPTO GL-C-616WL, a 2-output ESP32 WLED controller with Wi-Fi and Ethernet, a built-in microphone and a relay that cuts strip power when the lights are off. The Wi-Fi-only GL-C-615WL (Elite 2D-MU) is the same controller without Ethernet.
inputs:
  physical:
    Wi-Fi:
      - 2.4GHz
    Ethernet: true # LAN8720 PHY; WLED Ethernet type "Gledopto Series With Ethernet"
    USB: USB-C # 5 V / 3 A power input and UART firmware flashing
    Microphone: true # PDM; WLED AudioReactive, Generic I2S PDM (SD GPIO32, WS GPIO15)
    buttons: 1 # function button on GPIO17
  standalone: true # runs WLED
outputs:
  count: 2 # data on GPIO16 and GPIO2
  connector: Wago lever-operated spring terminals (0.34-4 mm², 22-12 AWG)
  current:
    max: 10 # per channel; 15 A total
  driver:
    buffered: true # TI level shifter to 5 V data
  clocked: false # maker lists single-wire chips only
  auxiliary:
    GPIO: 1 # IO13 DIY port for push buttons, switches or sensors
power:
  connector: V+/V- screw terminal (15 A max), 5.5 x 2.1 mm DC socket or USB-C
  voltage:
    min: 5
    max: 24
  current:
    max: 15
case:
  color: Black
  dimensions: 129x50x23mm
  material: Flame-retardant PC
  waterproof: IP20
core:
  family: ESP32
