name: Madrix Nebula
status: active
creator:
  name: Madrix
  url: https://www.madrix.com
  page: https://www.madrix.com/products/nebula
notes: Two-port SPI pixel-tape driver fed over Ethernet (Art-Net/sACN) or USB from MADRIX 5; 2,040 RGB pixels with firmware 6.0+. No standalone playback.
inputs:
  physical:
    Ethernet: 2 # built-in switch
    USB: USB-B # MADRIX 5 data; also power
  protocols:
    - Art-Net
    - sACN
  standalone: false
