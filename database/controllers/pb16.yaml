  status:
    url: https://github.com/computergeek1507/PB_16
    retrieved: '2026-11-18'
    notes: open hardware design files; repository last pushed 2026-10-05
  notes:
    url: https://github.com/computergeek1507/PB_16
    retrieved: '2026-11-18'
    notes: 'Readme: PB 16v1 "Original Pocketbeagle Version", PB 16v2 SMD PocketBeagle version; BBB 16v2 is the BeagleBone version'
