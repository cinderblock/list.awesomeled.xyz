name: PB16
status: unknown
creator:
  name: computergeek1507
  url: https://github.com/computergeek1507/PB_16
  page: http://doityourselfchristmas.com/forums/showthread.php?53296-FPP-PB16-Pixel-Controller
notes: Open source DIY FPP pixel controller cape for the BeagleBone Black.
inputs:
  physical:
    Ethernet: true # provided by BeagleBone Black host
  standalone: true # runs Falcon Player (FPP) on the BeagleBone
  requires_host: PocketBeagle
outputs:
  count: 32 # 16 onboard plus 16 via expansion header
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  clocked: false # async WS2811-style pixels
  auxiliary:
    DMX512: 2
  pixels:
    max_total: 22400
  protocols:
    - WS2811
power:
  voltage:
    max: 24
  current:
    max: 40
