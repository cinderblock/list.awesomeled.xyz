technical_notes:
  - 'Two supply inputs: J17 feeds pixel outputs 1-8 and the DMX VOUT, J18 feeds outputs 9-16 and the controller; a jumper sets the regulator for 5 V or 12/24 V pixels'
  - 'Fuses: 5 A per pixel output, 2 A for the PocketBeagle supply, 5 A for the powered DMX output; the docs give no total current rating'
  - 'DMX: PB 16v1 has two RJ45 serial outputs (DMX/Renard and DMX/LOR); PB 16v2 has one remote differential RJ45 port and one DMX/LOR RJ45'
  - OLED display header, real-time-clock header and a 2-pin GPIO header for a button or relay
