name: PB16
status: active # open-source design, repository still maintained
creator:
  name: computergeek1507
  url: https://github.com/computergeek1507/PB_16
  page: http://doityourselfchristmas.com/forums/showthread.php?53296-FPP-PB16-Pixel-Controller
notes: Open source (CERN-OHL-S) DIY FPP pixel controller by Scott Hanson, built around a PocketBeagle (the BeagleBone Black version is the BBB 16). 16 fused WS2811 ports plus an expansion header for 16 more, 2 DMX serial outputs, and a USB port for Ethernet, Wi-Fi or audio adapters.
inputs:
  physical:
    USB: USB-A host # network only through a USB Ethernet or Wi-Fi adapter
    buttons: 2
    GPIO: 1
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # runs Falcon Player (FPP) on the PocketBeagle
  requires_host: PocketBeagle
outputs:
  count: 32 # 16 onboard plus 16 via expansion header
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  clocked: false # async WS2811-style pixels
  current:
    max: 5 # 5 A mini-blade fuse per output
  fuse: 5 A mini blade per output (F1-F16)
  auxiliary:
    DMX512: 2
  pixels:
    max_per_output: 1400 # at 20 fps (the README says 1300); 700 at 40 fps
  protocols:
    - WS2811
power:
  voltage:
    min: 5
    max: 24
data:
  storage:
    - type: microSD
dead_links:
  - url: http://doityourselfchristmas.com/forums/showthread.php?53296-FPP-PB16-Pixel-Controller
    archive: https://web.archive.org/web/20230604010133/http://doityourselfchristmas.com/forums/showthread.php?53296-FPP-PB16-Pixel-Controller
    checked: '2026-11-18'
    notes: The DIYC forums are gone; every forum URL now returns 404
images:
  - file: pb16.webp
    source: https://github.com/computergeek1507/PB_16
    credit: Scott Hanson
    license: CERN-OHL-S-2.0
price: 130
related:
  - type: host
    ref: microboards/pocketbeagle
    notes: PocketBeagle cape (PB16 = PocketBeagle 16-port)
    source:
      url: https://github.com/computergeek1507/PB_16/blob/master/PB_16v1/README.md
      retrieved: '2026-11-18'
software:
  firmware:
    - FPP
  works_with:
    - xLights
