name: ThunderPack Wearable
status: limited # Tindie listing live, but the seller is "taking a break" (not purchasable, 2026-11-18)
release_year: 2020
creator:
  name: Jeremy Gillick Labs
  page: https://www.tindie.com/stores/jeremy/
vendors:
  - name: Tindie
    page: https://www.tindie.com/products/jeremy/thunderpack-standard-18650/
notes: Battery-powered STM32 microcontroller board, not a network pixel controller - 4 high-current PWM outputs (1.4-2.3A per channel) for analog RGB(W) LEDs, and 12 GPIOs that can drive addressable LEDs from Arduino or CircuitPython.
inputs:
  physical:
    USB: true # USB bootloader for programming
    GPIO: 12 # USART, I2C, SPI, USB ...
    buttons: 2 # tactile on/off switch + programmable user button
  standalone: true # battery-powered, runs Arduino/CircuitPython firmware
outputs:
  count: 4 # high-power PWM MOSFET channels (non-addressable); addressable LEDs run from the GPIO pins
  connector: Solder
  current:
    max: 2.3 # per high-power PWM channel (1.4 A on the compact version)
  clocked: selectable # addressable LEDs on GPIO via NeoPixel (single-wire) or DotStar (data + clock) libraries
power:
  current:
    max: 10
core:
  IC: STM32F411
  family: STM32
  clock: 100000000
data:
  storage:
    - type: flash # GD25Q16 SPI flash (16 Mbit), holds CircuitPython files
features:
  - Integrated 18650 lithium battery and 800 mA charger
  - 4 high-power PWM MOSFET outputs (1.4-2.3A each), each with a PCB LED
  - Status LEDs
  - Runs Arduino or CircuitPython
