name: QuinLED Dig2go
status: active
release_year: 2022
creator:
  name: Quindor / Intermittent Technology
  page: https://dig2go.info/
notes: ESP32, open to any software, often run with WLED
inputs:
  physical:
    Wi-Fi: 2.4GHz
  protocols:
    - DMX
  standalone: true
outputs:
  count: 1
  connector: Pigtail (included)
  clocked: false
  driver:
    buffered: true
  pixels:
    max_per_output: 1024
power:
  voltage:
    max: 5
  current:
    max: 3
core:
  family: ESP32
price: 24.99
software:
  firmware:
    - WLED
  works_with:
    - xLights
sources:
  software.firmware:
    url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
    retrieved: '2026-11-18'
    notes: "WLED docs: compatible controllers — section 'Controllers with WLED pre-installed'"
  software.works_with:
    url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/wled.xcontroller
    retrieved: '2026-11-18'
    notes: xLights controller definition (config upload supported)
wled_compatible: true
