name: PixLite 16 Plug and Play Mk2
status: end-of-life
creator:
  name: Advatek
  url: https://www.advateklighting.com
  page: https://www.advateklighting.com/products/shop/pixlite-16-plug-and-play-mk2
notes: 5V or 12V available. Multiple power plug versions available. PixLite 16 Mk2 controller in a rainproof, conformal-coated enclosure with a built-in 300-320 W supply (88-260 V AC in); pixels plug straight into 16 fused 4-pin outputs.
inputs:
