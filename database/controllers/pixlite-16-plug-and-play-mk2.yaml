    Ethernet: true
    buttons: 2
  protocols:
    - Art-Net
    - sACN
  standalone: false
outputs:
  count: 32 # 16 physical 4-pin outputs; 32 in expanded mode
  connector: 4 pin Advatek Male
  clocked: selectable # supports Single (async) or Clock pixel types
  driver:
    buffered: true
  fuse: 16 fused outputs
  pixels:
    max_per_output: 1020 # RGB in standard (16-output) mode; 768 RGBW
    max_total: 16320 # 96 universes
