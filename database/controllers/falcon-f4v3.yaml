name: Falcon F4V3
status: discontinued
release_year: 2018
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
  page: https://pixelcontroller.com/store/content/11-f4v3-pixel-controller
notes: 4-output E1.31/Art-Net pixel controller that replaced the F4V2 in 2018; a differential expansion board and two 4-string receivers add 8 remote outputs.
inputs:
  physical:
    Ethernet: 2
    Wi-Fi: true # configuration only
    buttons: 6
  protocols:
    - sACN
    - Art-Net
    - DDP
    - ZCPP
  standalone: true # FPP remote mode plays FSEQ sequences from microSD
outputs:
  count: 4 # built-in; 12 with expansion boards or receivers
  connector:
    ref: mtsb-combicon
  fuse: Mini-ATO blade, 5 A per output
  current:
    max: 5
  clocked: selectable # WS2801, APA102, LPD6803 etc. alongside WS2811-type
  pixels:
    max_per_output: 1024 # 12288 pixels per board
  driver:
    buffered: true # sheet value, not verified
  auxiliary:
    DMX512: 1 # RS-485 on RJ45 (DMX, Pixelnet or Renard)
  protocols:
    - WS2801
    - WS2803
    - WS2811
    - WS2812
    - TM1804
    - TM1803
    - TM1809
    - TM1812
    - SM16715
    - INK1003
    - UCS1903
    - TLS3001
    - TLS3002
    - CY3005
    - LPD6803
    - D705
    - LPD1101
    - UCS6909
    - UCS6912
    - SM16716
    - GE Color Effects
    - APA102
    - LPD8806
    - UCS2903
power:
  voltage:
    min: 5
    max: 13
data:
  storage:
    - type: microSD
