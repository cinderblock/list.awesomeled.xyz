name: Falcon F4V3
status: active
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
inputs:
  physical:
    Ethernet: true
    Wi-Fi: true
  standalone: true # Falcon Player (FPP) remote mode plays from SD
outputs:
  count: 48
  connector:
    ref: mtsb-combicon
  clocked: selectable # supports Single and Clock pixel types
  pixels:
    max_per_output: 340 # 16320 total across 48 outputs
  driver:
    buffered: true
  auxiliary:
    DMX512: 1
power:
  voltage:
    max: 36
  current:
    max: 60
data:
  storage:
    - type: SD
price: 200
related:
  - type: related
    ref: controllers/falcon-f16v4
    notes: Falcon family sibling; 4 local outputs
software:
  works_with:
    - xLights
sources:
  software.works_with:
    url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/falcon.xcontroller
    retrieved: '2026-11-18'
    notes: xLights controller definition (config upload supported)
