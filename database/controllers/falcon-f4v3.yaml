name: Falcon F4V3
status: discontinued
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
  page: https://pixelcontroller.com/store/content/11-f4v3-pixel-controller
inputs:
  physical:
    Ethernet: 2
    Wi-Fi: true # configuration only
    buttons: 6
  protocols:
    - sACN
    - Art-Net
    - DDP
    - ZCPP
  standalone: true # Falcon Player (FPP) remote mode plays from SD
outputs:
  count: 4 # built-in; 12 with expansion boards or receivers
  connector:
    ref: mtsb-combicon
  clocked: selectable # supports Single and Clock pixel types
  pixels:
    max_per_output: 1024 # 12288 pixels per board
  driver:
    buffered: true
  auxiliary:
    DMX512: 1
  protocols:
    - WS2801
    - WS2803
    - WS2811
    - WS2812
    - TM1804
    - TM1803
    - TM1809
    - TM1812
    - SM16715
    - INK1003
    - UCS1903
    - TLS3001
    - TLS3002
    - CY3005
    - LPD6803
    - D705
    - LPD1101
    - UCS6909
    - UCS6912
    - SM16716
    - GE Color Effects
    - APA102
    - LPD8806
    - UCS2903
power:
  voltage:
    max: 13
  current:
    max: 60
data:
  storage:
    - type: microSD
price: 125
price_source:
  notes: last list price (assembled board), from the vendor's archived product page; "This product is no longer in stock" at capture
  retrieved: '2021-10-27'
