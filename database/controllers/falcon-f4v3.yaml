technical_notes:
  - 73 universes of E1.31/Art-Net (37,376 channels) per the 2023 spec sheet; the store page said 64 universes
  - With the expansion board, 12 outputs x 1024 pixels, up to 12,288 pixels per board
  - The store page said the board runs from 5-24 V pixel power; the 2023 spec sheet gives 5-13 V for pixel power and 5-24 V for the separate controller power input
  - pixelcontroller.com's F4V3 support page links the F16V3 manual as its user manual; no F4V3-specific manual is published
