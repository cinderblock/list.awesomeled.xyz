name: ProtoPixel 1 channel Wi-Fi
status: discontinued
creator:
  name: ProtoPixel
  url: https://www.protopixel.io
  page: https://www.protopixel.io/pricing
inputs:
  physical:
    Wi-Fi:
      - 2.4GHz
      # IEEE 802.11 b/g/n
  protocols:
    - Art-Net
    - sACN # up to 4 universes
  standalone: true # plays autonomous content from microSD
outputs:
  count: 1
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  pixels:
    max_per_output: 680 # maker docs; a 2020 pricing page said 600
  clocked: false # WS2811/WS2812b/WS2813/WS2815/SK6812 families
  protocols:
    - WS2811
    - WS2812b
    - WS2812d
    - Sk6812
    - WS2813
    - WS2815
power:
  voltage:
    min: 5
    max: 12 # powered directly from the LED fixture (5V or 12V)
data:
  fps: 30 # 30fps in streaming
  storage:
    - type: microSD
dead_links:
  - url: https://www.protopixel.io/pricing
    archive: https://web.archive.org/web/20210218144636/https://www.protopixel.io/pricing
    checked: '2026-11-18'
    notes: Now redirects to the generic product overview, which no longer lists this controller
images:
  - file: protopixel-1-channel-wifi.webp
    source: https://web.archive.org/web/20200929124958/https://protopixel.fra1.digitaloceanspaces.com/production-website/documents/products/spec-sheets/1ch_wifi_spec_sheet_v101.pdf?mtime=20200811193443&focal=none
    credit: ProtoPixel
price: 221
related:
  - type: variant
    ref: controllers/protopixel-1-channel-ethernet
    notes: Wi-Fi version of the 1-channel Ethernet controller (no Ethernet jack, internal antenna)
    source:
      url: https://protopixel.net/doc/1ch_wifi/pages/00-description.html
      retrieved: '2026-11-18'
software:
  works_with:
    - ProtoPixel Create
sources:
  status:
    url: https://www.protopixel.io/tools/product-overview
    retrieved: '2026-11-18'
    notes: 'not in the current lineup (Brain and Gate controllers only); the old /mini-controller page returns 404'
  software.works_with:
    - url: http://web.archive.org/web/20200808024716/https://www.protopixel.io/pricing
      retrieved: '2026-11-18'
      notes: ProtoPixel Create docs name this hardware
    - url: https://protopixel.net/doc/1ch_wifi/pages/10-technical_features.html
      retrieved: '2026-11-18'
      notes: Also streams from any Art-Net source (pages/70-compatibility.html).
  outputs.protocols:
    url: https://protopixel.net/doc/1ch_wifi/pages/10-technical_features.html
    retrieved: '2026-11-18'
    notes: Maker docs, 'Technical Features'.
  outputs.pixels.max_per_output:
    url: https://protopixel.net/doc/1ch_wifi/pages/10-technical_features.html
    retrieved: '2026-11-18'
    notes: "'Maximum capacity: Record and stream up to 680 RGB LEDs'"
