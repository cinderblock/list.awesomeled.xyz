name: ProtoPixel 1 channel Wi-Fi
status: discontinued
creator:
  name: ProtoPixel
  url: https://www.protopixel.io
  page: https://www.protopixel.io/pricing
inputs:
  physical:
    Wi-Fi:
      - 2.4GHz
  protocols:
    - Art-Net
  standalone: true # plays autonomous content from microSD
outputs:
  count: 1
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  pixels:
    max_per_output: 680 # maker docs; a 2020 pricing page said 600
  clocked: false # WS2811/WS2812b/WS2813/WS2815/SK6812 families
  protocols:
    - WS2811
    - WS2812b
    - WS2812d
    - Sk6812
    - WS2813
    - WS2815
power:
  voltage:
    min: 5
    max: 12 # powered directly from the LED fixture (5V or 12V)
data:
  fps: 30 # 30fps in streaming
  storage:
    - type: microSD
datasheet:
  url: https://web.archive.org/web/20200929124958id_/https://protopixel.fra1.digitaloceanspaces.com/production-website/documents/products/spec-sheets/1ch_wifi_spec_sheet_v101.pdf?mtime=20200811193443&focal=none # spec sheet; the live bucket now returns 403
  mirror:
    url: https://assets.awesomeled.xyz/datasheets/controllers/protopixel-1-channel-wifi-1444c3c5.pdf
    sha256: 1444c3c5041456cd8ae2503a3f193949a146269662089d75c2abd00d5abeb648
    retrieved: '2026-11-28'
    source: https://web.archive.org/web/20200929124958id_/https://protopixel.fra1.digitaloceanspaces.com/production-website/documents/products/spec-sheets/1ch_wifi_spec_sheet_v101.pdf?mtime=20200811193443&focal=none
