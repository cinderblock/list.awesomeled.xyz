name: WB48
status: active
creator:
  name: Wally's Lights
  url: https://wallyslights.com
  page: https://wallyslights.com/products/wallys-lights-wb48-controller
notes: BeagleBone Black (Rev C) based FPP controller; designed with Scott Hanson. 12 differential RJ45 ports drive up to 48 remote ports via Universal Differential Receivers (5 V or 12 V pixels at the receiver).
inputs:
  physical:
    Ethernet: true # via host BeagleBone
    USB: true # via host BeagleBone
    buttons: 1
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # FPP 5.5 preloaded on the included 16 GB microSD
  requires_host: BeagleBone Black
outputs:
  count: 12
  connector:
    ref: rj45
  differential: true # up to 48 remote ports via Universal Differential Receivers
  pixels:
    max_per_output: 1400 # at 20 fps; 800 per port at 40 fps
  protocols:
    - WS2811
power:
  voltage:
    min: 5
    max: 5 # 5 V 3 A supply
data:
  storage:
    - type: microSD # 16 GB card included
features:
  - OLED display
  - Test button
  - Reverse polarity protection
  - Voltage sensors
