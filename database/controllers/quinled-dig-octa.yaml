name: QuinLED-Dig-Octa
status: active
release_year: 2022
creator:
  name: Quindor / Intermittent Technology
  page: https://quinled.info/quinled-dig-octa/
notes: ESP32, open to any software, often run with WLED. A modular, pre-assembled system - the Brainboard-32-8L (ESP32, Ethernet, microSD, 8 level-shifted LED channels) stacks on a Power-5, Power-5HV, Power-7 or Power-7HC powerboard that fuses and distributes LED power (30-100 A, 5-48 V depending on the board).
inputs:
  physical:
    Ethernet: true # LAN8720A, 10/100
    Wi-Fi:
      - 2.4GHz
    Button inputs: 2 # debounced button/switch terminals
    USB: USB-C
    buttons: 2
    triggers: 2
    Microphone: true
    GPIO: 4
  protocols:
    - sACN
    - Art-Net
    - DDP
    - TPM2.net
  standalone: true
outputs:
  count: 8
  connector: 5mm or 7.62mm screw terminal
  driver:
    buffered: true # level-shifted to 5.12 V
  clocked: selectable
  pixels:
    max_total: 3000 # QuinLED's suggested maximum with ESPixelStick v4; ~2000 with WLED
power:
  voltage:
    min: 5
    max: 48 # 48 V only with the Power-5HV powerboard
  current:
    max: 100 # Power-7HC powerboard; Power-5 / Power-7 50 A, Power-5HV 30 A
core:
  IC: ESP32-WROOM-32UE # Brainboard-32-8L v2
  family: ESP32
data:
  storage:
    - type: microSD
    - type: flash
features:
  - Pre-assembled (not a DIY kit)
  - Dedicated relay output to switch LED power supplies
  - Stackable powerboards with mixed voltages
images:
  - file: quinled-dig-octa.webp
    source: https://shop.allnetchina.cn/products/quinled-dig-octa-brainboard-32-8l-v4
    credit: ALLNET China
price: 70.48
price_source:
  notes: 'Cheapest working pair, as the QuinLED shop states ("A working Brainboard-plus-Powerboard pair starts from $70.48"): Brainboard-32-8L v4 $37.49 (QLD-DOBBV4) + Power-5 $32.99 (QLD-DOP5) at ALLNET China. Other powerboards: Power-7 $34.99, Power-5HV (48 V) $39.99, Power-7HC (100 A) $44.99'
  retrieved: '2026-11-18'
  url: https://quinled.shop/product/dig-octa-system/
  vendor: ALLNET China (via quinled.shop)
