notes: DMX driver for Elation FLEX PIXEL WP and P40WP pixel tape (72 pixels per 10 ft tape; P40WP uses the APA102 protocol). Uses 432 DMX channels and drives up to two tapes (144 pixels) from one data + clock output. SKU FLE768.
inputs:
  physical:
    DMX512: 3-pin terminals, in + thru
  protocols:
    - DMX512
  standalone: false
outputs:
  count: 1
  connector: 6-pin terminal (GND, NC, Data, CLK, NC, +5V)
  driver:
    buffered: true
  clocked: always
  pixels:
    max_per_output: 144 # two 72-pixel tapes
  protocols:
    - APA102
power:
  voltage:
    min: 5
    max: 5
  current:
    max: 5
case:
  dimensions: 90x40x20mm
  waterproof: IP20
