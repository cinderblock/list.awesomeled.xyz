name: Baldrick8
status: active
release_year: 2025
creator:
  name: ILIGHTTHAT
  url: https://www.ilightthat.com
  page: https://www.baldrickboard.com/en/boards/baldrick8
notes: V1.1 supports 48V
inputs:
  physical:
    Ethernet: true # 1 port on v1.0/v1.1; 2 with a built-in switch on v2
    buttons: 3 # network reset, set IP, factory reset
    triggers: 3 # contact-closure inputs: buttons, beam breaks, motion sensors
  protocols:
    - DDP
    - Art-Net
    - sACN # E1.31
  standalone: false
outputs:
  connector:
    ref: mtsb-combicon
  count: 8
  fuse: 7.5A # resettable, per output
  driver:
    buffered: true
  differential: false # single-ended outputs
  pixels:
    max_per_output: 750 # ~2250 channels per port at 40fps
  clocked: false # async pixels
power:
  voltage:
    min: 5
    max: 48 # 24 V on v1.0
  current:
    max: 60
images:
  - baldrick-8.webp
price: 75
price_source:
  notes: Current v2 board (dual Ethernet with switch); the v1.x listing ($70) is out of stock, and Wired Watts lists its v1 edition as discontinued
  retrieved: '2026-11-18'
  url: https://www.baldrickstore.com/pixel-controllers/baldrick8v2-pixel-controller/
  vendor: Baldrick Store
software:
  works_with:
    - xLights
sources:
  status:
    url: https://www.baldrickboard.com/en/boards/baldrick8
    retrieved: '2026-11-18'
    notes: 'creator page offers Baldrick8 v2 at $75 via Baldrick Store, in stock'
