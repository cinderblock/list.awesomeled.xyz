name: Baldrick8
status: active
release_year: 2025
creator:
  name: ILIGHTTHAT
  url: https://www.ilightthat.com
  page: https://www.baldrickboard.com/en/boards/baldrick8
notes: V1.1 supports 48V
inputs:
  physical:
    Ethernet: true # 1 port on v1.0/v1.1; 2 with a built-in switch on v2
    buttons: 3 # network reset, set IP, factory reset
    triggers: 3 # contact-closure inputs: buttons, beam breaks, motion sensors
  protocols:
    - DDP
    - Art-Net
    - sACN # E1.31
  standalone: true
outputs:
  connector:
    ref: mtsb-combicon
  count: 8
  fuse: 7.5A # resettable, per output
  driver:
    buffered: true
  differential: false # single-ended outputs
  pixels:
    max_per_output: 750 # ~2250 channels per port at 40fps
  clocked: false # async pixels
  protocols:
    - WS2811
    - UCS1903
    - SM16703P
    - UCS2904
power:
  voltage:
    min: 5
    max: 48 # 5-24 V on 1.0 boards
  current:
    max: 60
images:
  - file: baldrick-8.webp
    source: https://web.archive.org/web/20260520043643/https://www.baldrickboard.com/en/boards/baldrick8
    credit: ILIGHTTHAT
price: 75
price_source:
  notes: Current v2 board (dual Ethernet with switch); the v1.x listing ($70) is out of stock, and Wired Watts lists its v1 edition as discontinued
  retrieved: '2026-11-18'
  url: https://www.baldrickstore.com/pixel-controllers/baldrick8v2-pixel-controller/
  vendor: Baldrick Store
software:
  works_with:
    - xLights
    - FPP
    - ChamSys
    - MA Lighting
sources:
  status:
    url: https://www.baldrickboard.com/en/boards/baldrick8
    retrieved: '2026-11-18'
    notes: 'creator page offers Baldrick8 v2 at $75 via Baldrick Store, in stock'
  software.works_with:
    - url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/ilightthat.xcontroller
      retrieved: '2026-11-18'
      notes: xLights controller definition (config upload supported)
    - url: https://www.baldrickboard.com/en/boards/baldrick8/manual
      retrieved: '2026-11-18'
      notes: 'Introduction > Flexible Input Support and 3 Input Ports. Customer-showcased tools (MadMapper, ELM, LOR, sacnView, Resolume Arena) are excluded: the maker says not to ask for support with them.'
  outputs.protocols:
    url: https://www.baldrickboard.com/en/boards/baldrick8/manual
