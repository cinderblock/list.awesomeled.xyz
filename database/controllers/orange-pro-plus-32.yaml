name: Orange Pro Plus 32
status: discontinued
creator:
  name: Winterlights India
  url: https://www.winterlights.in
  page: https://www.winterlights.in/product-page/orange-pro-plus-32-48000-pixel-controller
vendors:
  - name: Flipkart (Motify Innovations)
    page: https://www.flipkart.com/winterlights-orange-pro-plus-32-artnet-controller/p/itmd1ca9064ee284
notes: >-
  16 direct pixel ports plus 16 long-distance ports on 4 RJ45 jacks (the 32 in the name), up to 1500 pixels each - 48,000 in total. Data-only outputs with no V+ pass-through; the controller itself runs from a 5 V adapter. Plays FPP sequences from microSD.
inputs:
  physical:
    Ethernet: true
    buttons: 5
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # plays FPP sequences from microSD
outputs:
  count: 32 # 16 direct + 16 long-distance (4 RJ45 jacks to long-distance receiver boards)
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  differential: true # long-distance ports need receiver boards
  clocked: false # 3-wire (data, GND, V+) WS2811/WS2812/WS2813 pixels only
  pixels:
    max_per_output: 1500
  protocols:
    - WS2811
    - WS2812
    - WS2813
    - '1903'
power:
  voltage:
    min: 5 # controller runs from the included 5 V 2 A adapter
    max: 5
data:
  storage:
    - type: microSD
