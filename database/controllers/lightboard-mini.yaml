name: LightBoard Mini
status: discontinued
creator:
  name: RocketLife
  url: https://www.bekonix.com/ # formerly rocketlife.com
  page: https://www.rocketlife.com/technology/ # original product page (gone; see dead_links)
notes: Now Bekonix; see Pattern Drivers.
inputs:
  physical:
    Bluetooth: BLE
    NFC: true
    GPIO: 4
  standalone: true
outputs:
  count: 1
  connector: Headers
  driver:
    buffered: true
  pixels:
    max_per_output: 1000
  clocked: selectable # supports single and clocked pixel protocols
  protocols:
    - APA
    - APA 8192
    - SK
    - WS
power:
  voltage:
    max: 5
