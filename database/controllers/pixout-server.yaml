name: Pixout ArtNet DMX Recorder
status: active
creator:
  name: PixOut
  url: http://pixout.lighting/
  page: https://pixout.lighting/products/recorder/
notes: 'Raspberry Pi based Art-Net recorder/player: records universes from a console or media server and replays them standalone, as Art-Net over the network; up to 64 universes by license key; iOS/Android app.'
inputs:
  physical:
    Ethernet: true
    Wi-Fi: true # setup and remote control (web panels, iOS/Android app)
    GPIO: true # triggers
  protocols:
    - Art-Net
  standalone: true # plays recorded cues from SD without external input
  requires_host: Raspberry Pi # runs on Raspberry Pi 3B/3B+/4 or CM4
outputs:
  auxiliary:
    DMX512: 4 # D-100 model only
power:
  voltage:
    max: 12
data:
  storage:
    - type: SD
features:
  - ArtNet DMX cue recording and playback
  - Web control panels and iOS/Android remote app
price:
  - name: S-100 Outdoor (IP67), 1 universe
    price:
      amount: 344
      currency: EUR
  - name: S-100 Outdoor (IP67), 16 universes
    price:
      amount: 664
      currency: EUR
  - name: S-100 Outdoor (IP67), 64 universes
    price:
      amount: 1197
      currency: EUR
  - name: Software-only licence for your own Raspberry Pi (from)
    price:
      amount: 104
      currency: EUR
price_source:
  notes: MSRP in EUR, ex VAT and shipping. The indoor I-100 is €304 / €624 / €1,157 for 1 / 16 / 64 universes; the D-100 (4 DMX outputs) starts at €389.
  retrieved: '2026-11-18'
  url: https://pixout.lighting/products/recorder/
  vendor: Pixout
software:
  works_with:
