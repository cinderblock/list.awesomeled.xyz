vendors:
  - name: EspartStick
    page: https://espartstick.ecwid.com/M8-PI-Raspberry-Pi-8-Port-Pixel-controller-p471859299
notes: Raspberry Pi HAT (Pi 3B/4, Zero/Zero 2) running FPP 6+ with a separately sold FPP license key. OLED display and joystick; powers the Pi from the 12 V pixel supply. Listed as "M8 Port Pixel" in the original spreadsheet.
inputs:
  physical:
    Ethernet: true
  standalone: true # FPP plays sequences from the Raspberry Pi
  requires_host: Raspberry Pi # 3B+ or above
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  driver:
    buffered: true
  clocked: false # single-wire only (FPP DPIPixels driver)
  pixels:
    max_per_output: 1600 # at 20 fps
power:
  voltage:
    max: 12
  current:
    max: 30
