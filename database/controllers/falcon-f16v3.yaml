technical_notes:
  - 96 universes of E1.31/Art-Net (49,152 channels)
  - With expansion boards each port's 1024-pixel budget is shared between main-board and expansion outputs
  - Differential expansion boards drive remote 4-string receivers up to about 75 m away
  - 13-24 V pixels need resistor R92 removed, which disables the fuse LEDs; above 24 V may damage the board
