name: Falcon F16V3
status: discontinued
release_year: 2017
creator:
  name: PixelController, LLC
  url: https://pixelcontroller.com
  page: https://pixelcontroller.com/store/discontinued-products/48-f16v3.html # formerly https://pixelcontroller.com/store/products/48-f16v3.html, which redirects here
notes: 16-output E1.31/Art-Net pixel controller; one or two expansion boards raise it to 32 or 48 outputs that share the same pixel budget. Succeeded by the F16V4.
inputs:
  physical:
    Ethernet: 2 # 2-port switch for daisy-chaining
    Wi-Fi:
      - 2.4GHz
      # ESP-07 module; partial configuration only, no E1.31/Art-Net/DDP input
  protocols:
    - Art-Net
    - sACN # E1.31
    - DDP # firmware 2.58+
    - ZCPP
  standalone: true # FPP remote mode plays FSEQ sequences from microSD
outputs:
  count: 16 # 32 or 48 with one or two expansion boards
  connector:
    ref: mtsb-combicon
    pins: 4
    notes: 3.5 mm pitch pluggable screw terminal
  fuse: Mini-ATO blade, 5 A per output
  current:
    max: 5
  driver:
    buffered: true # sheet value, not verified
  pixels:
    max_per_output: 1024
    max_total: 16320 # 96 universes; the 2017 manual says 16,384
  clocked: selectable # WS2801, APA102, LPD6803 etc. alongside WS2811-type
  auxiliary:
    DMX512: 4 # RS-485 (DMX/Renard/Pixelnet/LOR): three RJ45 jacks plus a 3-pin header
power:
  connector: Screw terminals for two pixel-power banks (V1 = outputs 1-8, V2 = outputs 9-16), up to 10 AWG
  voltage:
    min: 5
    max: 13 # 13-24 V pixels need the R92 board modification
  current:
    max: 60 # two banks x 30 A
data:
  storage:
    - type: microSD
features:
  - 128x64 OLED display with five navigation buttons
  - Per-output fuse-good LEDs
  - Two pixel-power banks that can run different voltages
  - Pixel-voltage monitoring and three temperature sensors
  - Pluggable resistor banks
other_links:
