name: LED Player L
status: active
creator: Diamex
vendors:
  - name: Diamex
    url: https://www.diamex-shop.de
    page: https://www.diamex-shop.de/LED-Player-L-fuer-Strips-und-Panels-bis-4096-LEDs
notes: Standalone TPM2 player (microSD or USB stick) for up to 4096 LEDs across 8 outputs; USB virtual COM takes live data from JINX. OLED display + 4 buttons; ARM Cortex-M7. No network input.
inputs:
  physical:
    USB: true # Mini-USB - virtual COM (live JINX), config, BIOS updates
  standalone: true
outputs:
  count: 8
  connector:
    ref: mtsb-combicon
  clocked: selectable # supports both clocked and clockless pixel types
  pixels:
    max_per_output: 512 # 4096 total across 8 outputs
  protocols:
    - WS2811
    - WS2812
    - UCS1903
    - PL9823
    - APA102
power:
  voltage:
    max: 5
data:
  storage:
    - type: microSD
    - type: USB
