name: K2-Pi0
status: active
creator:
  name: KulpLights, LLC
  page: https://kulplights.com/product/k2-pi0/
notes: Raspberry Pi Zero cape running FPP (Pi Zero W/2W recommended; Wi-Fi via the Pi - the Zero has no Ethernet port). 2 eFuse-protected ports, up to 800 pixels each (with power injection) at 40FPS, 6A per port, 5-24V input powers both cape and Pi. Small GPIO/i2c header; no OLED, buttons, or RTC.
inputs:
  physical:
    Wi-Fi:
      # via host Pi Zero 2 W
      - 2.4GHz
    GPIO: 5
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # runs FPP (Falcon Player)
  requires_host: Raspberry Pi Zero 2 W, Raspberry Pi Zero W
outputs:
  count: 2
  connector:
    ref: mtsb-combicon
  pixels:
    max_per_output: 800
  current:
    max: 6
  auxiliary:
    I2C: true # small GPIO/i2c header
  protocols:
    - WS2811
    - WS2812
power:
  voltage:
    min: 5
    max: 24
data:
  storage:
    - type: microSD
features:
  - Per-output eFuse protection
images:
  - file: k2-pi0.webp
    source: https://kulplights.com/product/k2-pi0/
    credit: KulpLights, LLC
price: 28
price_source:
  notes: board only (no Raspberry Pi, no SD card); $28-$77 with a premounted Pi Zero W/2 W and/or FPP SD card
  part: K2-Pi0-N-N
  retrieved: '2026-11-18'
  url: https://kulplights.com/product/k2-pi0/
  vendor: Kulp Lights LLC
related:
  - type: host
    ref: microboards/raspberry-pi-zero-w
    notes: Pi Zero hat; designed for the Pi Zero 2 W, also works on the original Pi Zero W
    source:
      url: https://kulplights.com/manuals/hardware/raspberry-pi/
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/raspberry-pi-3-model-b
    notes: Also works on a Pi 3 B+ (held only by the GPIO header; holes don't line up)
    source:
      url: https://kulplights.com/manuals/boards/k2-pi0/
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/raspberry-pi-4-model-b
    notes: Also works on a Pi 4 (held only by the GPIO header)
    source:
      url: https://kulplights.com/manuals/boards/k2-pi0/
      retrieved: '2026-11-18'
  - type: host
    ref: microboards/raspberry-pi-5
    notes: Also works on the bigger Pis
    source:
      url: https://kulplights.com/manuals/boards/k2-pi0/
      retrieved: '2026-11-18'
      notes: "'It also works on the bigger Pis (3 B+, 4, 5)'"
