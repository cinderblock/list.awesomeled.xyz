name: K2-Pi0
status: active
creator:
  name: KulpLights, LLC
  page: https://kulplights.com/product/k2-pi0/
notes: Raspberry Pi Zero hat running FPP, made for the Pi Zero 2 W (a Zero W works; on a 3 B+/4/5 it is held only by the GPIO header). Network is the Pi's Wi-Fi - no Ethernet, DMX, display, buttons or RTC. 2 eFused ports with current monitoring, up to 1600 pixels per string (about 800 at 40 fps). One 5-24 V terminal powers the Pi and both ports.
inputs:
  physical:
    Wi-Fi:
      # via host Pi Zero 2 W
      - 2.4GHz
    GPIO: 5
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # runs FPP (Falcon Player)
  requires_host: Raspberry Pi Zero 2 W, Raspberry Pi Zero W
outputs:
  count: 2
  connector:
    ref: mtsb-combicon
    pins: 3
    notes: 3.5 mm pitch pluggable, plugs included
  pixels:
    max_per_output: 1600 # about 800 at 40 fps
  current:
    max: 6 # per-port eFuse trips at about 6 A and latches off
  auxiliary:
    I2C: true # 2x5 header: 3.3 V, GND, I2C bus and five Pi GPIO pins
  protocols:
    - WS2811
    - WS2812
power:
  voltage:
    min: 5
    max: 24
data:
  storage:
    - type: microSD
features:
  - Per-port latching eFuses (about 6 A) with current monitoring and FPP port-status alerts
  - Port power is switched off when no output is needed
images:
  - file: k2-pi0.webp
    source: https://kulplights.com/product/k2-pi0/
    credit: KulpLights, LLC
price: 28
price_source:
  notes: board only (no Raspberry Pi, no SD card); $28-$77 with a premounted Pi Zero W/2 W and/or FPP SD card
  part: K2-Pi0-N-N
  retrieved: '2026-11-18'
  url: https://kulplights.com/product/k2-pi0/
  vendor: Kulp Lights LLC
