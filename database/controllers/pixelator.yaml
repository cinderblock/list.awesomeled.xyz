features:
  - Proprietary PLINK protocol over Cat5e/Cat6 up to 300m to PLINK injectors
  - DMX Generator with snapshot capture (static looks without a live input) and switchable profiles
  - Clock module and ArtSync keep all 24 outputs in sync
