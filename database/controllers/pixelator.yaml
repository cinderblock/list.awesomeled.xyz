technical_notes:
  - Controls up to 8192 RGB pixels (24,576 channels) across 24 PLINK ports
  - 85-264 V AC, 20 W, passive cooling, indoor use only; 40 fps per port
  - The user manual describes no show recording or playback storage
  - 'Revisions: Rev A no longer supported; Rev B added RS232 profile triggering; Rev C changed the operating system and dropped RS232'
