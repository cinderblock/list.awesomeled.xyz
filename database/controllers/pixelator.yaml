name: Pixelator
status: discontinued
creator:
  name: ENTTEC
  url: https://www.enttec.com
  page: https://www.enttec.co.uk/product/controls-gb/addressable-led-pixel-control-gb/24-port-ethernet-pixel-controller/
notes: 1U rack Ethernet-to-PLINK converter (SKU 70060) - 24 RJ45 ports each carry 2 universes over Cat5e/Cat6 (up to 300 m) to PLINK INJECTORs, which drive the pixels. Succeeded by the Pixelator Mini.
inputs:
  physical:
    Ethernet: true # gigabit
    buttons: 4
    Serial: RS-232 (profile select; not on RevC)
  protocols:
    - Art-Net
    - sACN # E1.31
    - ESP
    - KiNET # input only
  standalone: false
outputs:
  count: 24 # RJ45 ports carrying proprietary PLINK protocol to PLINK injectors
  connector:
    ref: rj45
  driver:
    buffered: true
  clocked: false # async pixel support
  pixels:
    max_per_output: 340 # 2 universes per PLINK port; 256 RGBW
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - WS2813
    - WS2815
    - WS2818
    - SK6812
    - TM1804
    - TM1812
    - APA-104
    - 9PDOT
    - UCS1903
    - UCS2903
    - UCS2904
    - UCS8903
    - UCS8904
    - SPXL
