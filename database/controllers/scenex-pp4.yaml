name: SceneX PP4
status: discontinued
creator:
  name: German Light Products
  url: https://www.germanlightproducts.com
  page: https://www.germanlightproducts.com/product/pp4-pixel-led-tape-drivers/
notes: Internal PSU. All-in-one Scenex Lighting pixel tape driver - 4 outputs on 4-pin XLR carry data and 5 V power from a built-in 5 V / 40 A supply (100-240 VAC input). Any output can take any share of the 2,040-pixel capacity.
inputs:
  physical:
    Ethernet: true
    buttons: 1
  protocols:
    - sACN
    - Art-Net
  standalone: false
outputs:
  count: 4
  connector:
    ref: xlr-4
  clocked: selectable # supports both clocked and async pixels
  driver:
    buffered: true
  fuse: data and power fused per output
  pixels:
    max_total: 2040 # unicast E1.31 or Art-Net (12 universes); 1,190 with multicast E1.31
  protocols:
    - LPD6803
    - LPD880x
    - WS2801
    - TM180x
    - TLS3001
    - CYT3005
    - DMS9813
    - WS2811
    - '1903'
    - '9813'
    - GE Color Effects
    - '16716'
power:
  voltage:
    min: 100 # 50/60 Hz
    max: 240
  current:
    max: 40 # from the built-in 5 V supply
  ac: true
  output_voltage: 5
datasheet:
  url: https://www.germanlightproducts.com/wp-content/uploads/2016/01/PP4-Controller-Operating-Manual_08_2015.pdf # user manual; has a Specifications section
  mirror:
