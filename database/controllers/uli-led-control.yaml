notes: Sold as the "4096 Kanal LED Strip Controller" - an Art-Net / sACN pixel controller kit (SMD parts pre-assembled, only sockets and plugs to solder) for up to 1360 RGB LEDs on 8 outputs, one universe each.
inputs:
