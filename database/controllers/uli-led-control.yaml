  count: 8
  pixels:
    max_per_output: 170 # one universe per output; 1360 RGB LEDs / 8 universes in total
  clocked: selectable # supports both clocked and non-clocked pixel types
  protocols:
    - WS2811
    - WS2812
    - WS2812b
    - APA104
    - APA102
    - LPD6803
    - WS2801
    - SK6812 RGBW
    - LPD8803
    - LPD8806
    - UCS1909
