technical_notes:
  - 16 universes (8192 channels), up to 2730 RGB pixels across 8 outputs
  - Outputs synchronize up to 300m away when paired with ENTTEC PLink or PSAT
  - Outputs carry ENTTEC's proprietary Pixel Link (PLink) signal, not pixel data; each port needs a PLink Injector or PSAT, within 3 m of the tape or dots
