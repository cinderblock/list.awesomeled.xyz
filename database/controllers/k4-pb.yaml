technical_notes:
  - 4 eFused ports, each driving 800+ pixels at 40FPS
  - 3-pin UART header for one DMX universe or PixelNet/Renard/LOR
  - The current board adjusts itself for 5 V or 12 V; early (2020) boards used 5V/12V jumpers and plain fuses
