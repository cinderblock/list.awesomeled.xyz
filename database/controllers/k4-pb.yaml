name: K4-PB
status: active
creator:
  name: KulpLights, LLC
  url: https://kulplights.com
  page: https://kulplights.com/product/k4-pb/
notes: PocketBeagle/PocketBeagle2 cape running FPP (networking via USB adapter on the host - Ethernet preferred, Wi-Fi works; FPP image on the host microSD). 4 eFused ports with current monitoring, pixel counting, and fuse alerts; each port drives 800+ pixels at 40FPS with power injection. One 5 V or 12 V terminal powers the board and all four ports (18 V absolute maximum).
inputs:
  physical:
    USB: USB-A host # network only through a USB Ethernet or Wi-Fi adapter
    buttons: 2
    GPIO: 6
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # FPP on the PocketBeagle host
  requires_host: PocketBeagle, PocketBeagle 2
outputs:
  count: 4
  pixels:
    max_per_output: 1600 # sheet value (6400 / 4); Kulp quotes 800+ at 40 fps
  clocked: false
  connector:
    ref: mtsb-combicon
    pins: 3
    notes: 3.5 mm pitch pluggable, plugs included
  driver:
    buffered: true
  current:
    max: 5.2 # per-port eFuse trips at about 5.2 A and latches off
  auxiliary:
    DMX512: 1 # 3-pin UART header: one DMX universe or PixelNet/Renard/LOR
  protocols:
    - WS2811
    - WS2812
power:
  voltage:
    min: 5
    max: 12 # 18 V absolute maximum; 24 V supplies damage the board
  current:
    max: 20
data:
  storage:
    - type: microSD # FPP image on the host microSD
features:
  - Per-port latching eFuses with current monitoring and fuse alerts (eFuse power distribution)
  - Pixel counting test pattern
  - Power injection per port
  - 128x64 OLED with two buttons and a temperature sensor (rev v3.0.1); no RTC
