name: Genius Pro 32 Port
status: active
release_year: 2023
creator:
  name: Experience Lights
  url: https://experiencelights.com
  page: https://store.experiencelights.com/genius-pro-32-port-controller/
notes: On-board PSU mounting, per-port current monitoring and fault finding; the 2024 edition has per-port eFuses, which the 2025 edition replaces with Power Banks (on/off power for groups of outputs)
inputs:
  physical:
    Ethernet: true # single port; show data must arrive over wired Ethernet
    Wi-Fi: true # built-in access point for configuration only
    USB: micro-USB # firmware programming/updates
    Bluetooth: true
    buttons: 2
  protocols:
    - DDP
    - sACN
    - Art-Net
  standalone: true
outputs:
  count: 32
  connector: Clever Lock 3-pin (color coded)
  clocked: false # async pixel types
  driver:
    buffered: true
  pixels:
    max_total: 20000
    # via DDP; no per-port cap
  current:
    max: 4
  protocols:
    - WS281X
power:
  voltage:
    max: 24
data:
  storage:
    - type: microSD
features:
  - eFuse-protected outputs with per-port power on/off (2024 edition only)
  - Power Banks switching groups of outputs on and off (2025 edition and newer)
  - Per-port current monitoring
  - On-board power supply mounting
  - On-board fault finding
  - microSD playback standalone or as an FPP remote, synced to an FPP master
