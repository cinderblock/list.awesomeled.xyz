technical_notes:
  - AMD Spartan-6 XC6LX9 FPGA; Microchip PIC18F26J50 microcontroller stores the configuration and handles updates
  - '3-wire LEDs: WS2811, WS2812, WS2812B, WS2815, SK6812, GS8208B; 4-wire LEDs: APA102, HD107S, SK9822'
  - Master or slave mode set by on-board DIP switches
  - The product page's "16 outputs, 512 smart pixels per output" (8,192 LEDs) disagrees with the datasheet and user guide (32 outputs, 16,384 LEDs)
