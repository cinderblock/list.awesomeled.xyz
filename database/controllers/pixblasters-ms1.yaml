name: PixBlasters MS1
status: active
creator:
  name: Pixblasters
  page: https://pixblasters.com/products/ms1-controller/
notes: Connects to a PC or Mac (or other device) over HDMI and acts like a monitor. Outputs a selected section of the screen to a matrix of LED strips or to prefab LED panels at up to 60 FPS. Up to 48 controllers can be chained over ordinary Ethernet (UTP) cables as master and slaves; Pixblasters quotes more than 200,000 synchronized LEDs for a chain. Strip power must be supplied by external power sources; 5V and 12V both work.
inputs:
  physical:
    HDMI: true # DVI-compatible video input, up to 720p at 60 Hz
    USB: USB-C # configuration and updates
  standalone: false
outputs:
  count: 32
  connector: Push-in terminal blocks (8-pin)
  clocked: selectable
  pixels:
    max_per_output: 512 # 3-wire mode; 4-wire mode uses 16 data + 16 clock outputs at 1024 LEDs per data output
  driver:
    buffered: false
  auxiliary:
    Daisy-chain: 1 # high-speed video output (HSO) over UTP cable to the next MS1
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - WS2815
    - SK6812
    - GS8208B
    - APA102
    - HD107S
    - SK9822
power:
  voltage:
    max: 5
  current:
    max: 0.6 # controller only; LEDs need separate supplies
