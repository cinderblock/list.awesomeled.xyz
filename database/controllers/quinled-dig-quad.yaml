name: QuinLED-Dig-Quad
status: active
release_year: 2020
creator:
  name: Quindor / Intermittent Technology
  page: https://quinled.info/quinled-dig-quad/
notes: ESP8266/ESP32 based, open to any software, often run with WLED
inputs:
  physical:
    Wi-Fi: 2.4GHz # via plug-in QuinLED-ESP32 module; wired Ethernet ESP32 variant optional
  standalone: true # commonly runs WLED firmware
outputs:
  count: 4
  connector: 5mm screw terminal
  clocked: selectable # supports single-wire and clocked (e.g. SK9822/APA102) strips
  driver:
    buffered: true # level-shifted output per channel
  pixels:
    max_total: 4096
  protocols:
    - ws2812b
    - ws2811
    - sk6812
    - TM1814
    - APA102
power:
  voltage:
    max: 24
  current:
    max: 30
core:
  family: ESP32
features:
  - Per-output level shifters
  - Onboard fuses with power distribution terminals
  - Reverse polarity protection
  - Available as DIY kit or pre-assembled
price: 37.5
related:
  - type: related
    ref: controllers/quinled-dig-uno
    notes: "QuinLED Dig family sibling: 4 outputs plus 7 fused power-injection terminals vs the Uno's 2 outputs"
    source:
      url: https://quinled.info/quinled-dig-quad/
      retrieved: '2026-11-18'
software:
  firmware:
    - WLED
    - ESPixelstick
    - ESPhome
    - Moonlight
  works_with:
    - xLights
sources:
  software.firmware:
    - url: https://github.com/wled/WLED-Docs/blob/main/docs/basics/compatible-controllers.md
      retrieved: '2026-11-18'
      notes: "WLED docs: compatible controllers — section 'Controllers with WLED pre-installed'"
    - url: https://quinled.info/quinled-dig-quad-pre-assembled-v4-specifications/
      retrieved: '2026-11-18'
      notes: "'EXPixelstick' is the page's typo; the index page https://quinled.info/quinled-dig-quad/ says 'The board is supported in the current versions of WLED and…"
  software.works_with:
    url: https://github.com/xLightsSequencer/xLights/blob/master/resources/controllers/wled.xcontroller
    retrieved: '2026-11-18'
    notes: xLights controller definition (config upload supported)
  outputs.protocols:
    url: https://quinled.info/quinled-dig-quad/
    retrieved: '2026-11-18'
    notes: Intro paragraph (spelling as on the page).
  wled_compatible:
