name: K16000S
status: active
creator:
  name: AUTUNEER
  page: https://www.autuneertech.com/products/k16000s-madrix-artnet-addressable-led-controller/
manufacturers:
  - AUTUNEER
  - CANRIA
  - CLAUTOP
vendors:
  - name: Amazon
    page: https://www.amazon.com/dp/B09PKDLHQG
notes: Not a Kulp product despite the K-name; generic Madrix/Art-Net pixel controller sold under AUTUNEER, CANRIA, and CLAUTOP brands. Online control via Art-Net/Madrix over Ethernet (NET IN/NET OUT ports cascade units); offline standalone playback from SD card (16 ports x 1024 pixels).
inputs:
  physical:
    Ethernet: Dual # NET IN + NET OUT; NET OUT cascades the next controller
    # No DMX512 input: an earlier pass listed a "DMX512 console input", but the K-16000S
    # instruction sheet shows none; CANRIA's "K16 ARTNET+DMX Console" is a different model.
  protocols:
    - Art-Net
  standalone: true # offline SD-card playback
outputs:
  count: 16
  connector: Screw Terminal
  pixels:
    max_per_output: 1024
  clocked: selectable
  protocols:
    - UCS1912
    - TM1803
    - TM1804
    - TM1809
    - TM1812
    - UCS2903
    - UCS2909
    - UCS2912
    - '8205'
    - '8206'
    - '16703'
    - WS2811
    - TM1914
    - '9883'
    - WS2812B
    - UCS1903
data:
  storage:
    - type: SD
