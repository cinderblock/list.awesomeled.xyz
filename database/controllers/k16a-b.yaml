name: K16A-B
status: discontinued
creator:
  name: KulpLights, LLC
  page: https://kulplights.com/product/k16a-b/
vendors:
  - name: Wired Watts
    page: https://www.wiredwatts.com/products/klk16a-bv3
notes: BeagleBone Black cape running FPP (2020-2025, retired). 16 local ports plus 4 RJ45 differential ports (not Ethernet, 16 strings via receivers) and an expansion port (16 more) - 48 strings in all. Onboard sound, FM transmitter optional. Three generations differ in port protection and supply - v1 5 A mini-blade fuses and 5/12 V; v2 eFuses and 5-18 V; v3 eFuses, four power banks and 5-24 V. Successors are the K16, K16-Pro and K16-Max.
inputs:
  physical:
    Ethernet: true # via host BeagleBone
    buttons: 6
    GPIO: 9
  protocols:
    - sACN
    - Art-Net
    - DDP
  standalone: true # Falcon Player (FPP)
  requires_host: BeagleBone Black
outputs:
  count: 48 # 16 local + 16 differential (4 RJ45) + 16 via the expansion port
  connector: Phoenix Screw/RJ45
  driver:
    buffered: true
  differential: true # 4 RJ45 differential ports for Smart Receivers
  clocked: false # async pixels only
  current:
    max: 6 # v3 eFuse trips at about 6 A (v2 about 5.2 A, v1 5 A mini-blade fuse)
  auxiliary:
    DMX512: 2 # two RS485 outputs (DMX/PixelNet/Renard/LOR)
  pixels:
    max_per_output: 1500 # at 20 fps; 800 at 40 fps
  protocols:
    - WS2811
    - WS2812
    - WS2812B
    - WS2813
    - WS2815
    - WS2818
    - SK6812
    - SK6813
    - SM16703
    - GS8206
    - GS8208
    - TM1809
    - TM1812
    - UCS1904
    - UCS2903
    - APA104
    - APA106
    - APA109
    - SK6812RGBW
    - SK6818
    - SM16704
    - UCS2904
    - WS2814
    - TM1814
    - TM1814A
    - UCS8903
    - UCS8904
    - UCS1903
    - TM1803
    - GW6205
    - TM1804
    - SK6822
    - PL9823
    - UCS1912
    - GE8822
power:
  voltage:
    min: 5
    max: 24
  current:
    max: 60
data:
  storage:
    - type: microSD # via the BeagleBone Black
features:
  - 'eFuse power distribution (v2/v3): latching per-port eFuses with switching and current readings; v1 used 5 A mini-blade fuses'
  - Port LEDs show power / fuse state
  - Onboard sound output
  - Optional FM transmitter
  - OLED display with menu buttons, real-time clock, temperature and voltage sensors
