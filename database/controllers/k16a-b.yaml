technical_notes:
  - Two RS485 outputs support DMX / PixelNet / Renard / LOR
  - 'Generations: v1 (v1.0.0-v1.2, 2020-2022) two power terminals, mini-blade fuses, 40-pin F16v3-style expansion, DMX on 3-pin terminals; v2 (v2.0-v2.1, 2023-2024) eFuses, 24-pin F16v4-style expansion, DMX on RJ45, two-way differential ports; v3 (v3.0-v3.0.1, 2024-2025) four power banks of 4 ports, 6 A eFuses, 5-24 V'
