name: PocketBeagle 2
status: active
release_year: 2025
creator:
  name: Beagleboard.org
  page: https://www.beagleboard.org/boards/pocketbeagle-2
notes: >-
  Successor to the PocketBeagle in the same 55 × 35 mm size, with USB-C, pre-soldered headers, an
  MSPM0 MCU for ADC/EEPROM and a LiPo charger. Rev A1 (in production) uses the quad-core AM6254; Rev
  A0 used the AM6232 and is out of production. The P1/P2 cape headers are kept compatible with the
  original PocketBeagle "as much as possible".
power:
  voltage:
    min: 5V
    max: 5V
  gpio_voltage: 3.3V
compute:
  soc: AM6254
  cpu: 4× ARM Cortex-A53
  isa: ARMv8-A
  clock_speed: 1.4GHz
  ram: 512MB
  linux: true
connectivity:
  usb: USB-C
  serial: true
