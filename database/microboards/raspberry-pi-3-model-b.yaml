name: Raspberry Pi 3 Model B
status: active
release_year: 2016
creator:
  name: Raspberry Pi Foundation
  page: https://www.raspberrypi.com/products/raspberry-pi-3-model-b/
notes: >-
  The original Pi 3 (not the 3B+): the first Raspberry Pi with a 64-bit CPU and built-in Wi-Fi and
  Bluetooth, on very nearly the Pi 2 Model B's form factor. Revision 1.1 used the BCM2837 and has
  reached end of life; the current revision uses the BCM2837B0 at 1.2 GHz.
power:
  voltage:
    min: 5V
    max: 5V
  gpio_voltage: 3.3V
aliases:
  - Raspberry Pi 3B
compute:
  soc: BCM2837B0
  cpu: 4× ARM Cortex-A53
  isa: ARMv8-A
  clock_speed: 1.2GHz
  ram: 1GB
  linux: true
connectivity:
  wifi:
    - 2.4GHz
  ethernet: 100BASE-TX
  bluetooth: '4.1'
  usb: 2.0 x4
  serial: true
io:
  max_outputs: 1
  storage: microSD
  bms: false
  imu: false
other_links:
  - https://pip.raspberrypi.com/documents/RP-008340-DS
price: 35
price_source:
  notes: Same as the launch price (Raspberry Pi blog, 29 Feb 2016)
  part: '3055'
  retrieved: '2026-11-18'
  url: https://www.adafruit.com/product/3055
  vendor: Adafruit
