name: BeagleBone Green
status: active
release_year: 2015
creator:
  name: Seeed Studio / Beagleboard.org
  page: https://www.beagleboard.org/boards/seeedstudio-beaglebone-green
manufacturers:
  - Seeed Studio
notes: >-
  Seeed Studio's version of the BeagleBone Black, made with BeagleBoard.org: the HDMI port and the
  5 V barrel jack are removed, power comes in over micro-USB (or 5 V on the P9 header), and two Grove
  connectors (I2C, UART) are added. Not the same board as the BeagleBone Green Wireless.
power:
  voltage:
    min: 5V
    max: 5V
  gpio_voltage: 3.3V
aliases:
  - SeeedStudio BeagleBone Green
  - BBG
compute:
  soc: am3358
  cpu: Cortex-A8, 2x PRUSS
  isa: ARMv7-A
  clock_speed: 1GHz
  flash: 4GB # eMMC
  ram: 512MB
  linux: true
connectivity:
  ethernet: 100BASE-TX
  usb: Micro-USB client, USB 2.0 host
  serial: true
datasheet:
  url: https://files.seeedstudio.com/wiki/BeagleBone_Green/resources/BBG_SRM_V1a_20151009.pdf
  mirror:
