    ref: microboards/beaglebone-black
    notes: Based on the BeagleBone Black design and meant to stay compatible with it; HDMI and barrel jack removed, Grove connectors added
    source:
      url: https://files.seeedstudio.com/wiki/BeagleBone_Green/resources/BBG_SRM_V1a_20151009.pdf
      retrieved: '2026-11-18'
      notes: "SRM: 'BeagleBone Green (BBG) is based on the classical open-source hardware design of BeagleBone Black (BBB) and added two Grove connectors'; 'The board is intended to be compatible with the BeagleBone Black as much as possible.' Seeed wiki: 'Fully Compatible with BeagleBone® Black'"
