    retrieved: '2026-11-28'
    source: https://files.seeedstudio.com/wiki/BeagleBone_Green/resources/BBG_SRM_V1a_20151009.pdf
images:
  - file: beaglebone-green.webp
    source: https://www.seeedstudio.com/Seeed-Studio-BeagleBone-Green.html
    credit: Seeed Studio
io:
  storage: microSD
  imu: false
other_links:
  - https://wiki.seeedstudio.com/BeagleBone_Green/
related:
