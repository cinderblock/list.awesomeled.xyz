# Example 1: Wi-Fi microcontroller board (all fields)
name: Example ESP32 Board
status: active
release_year: 2024
creator:
  name: Example Boards
  url: https://example.com
  page: https://example.com/esp32-board
notes: ESP32-S3 board with an Ethernet PHY; runs WLED.
power:
  voltage:
    min: 5V
    max: 12V
  gpio_voltage: 3.3V
compute:
  soc: ESP32-S3 # spelled as the maker does
  cpu: 2x Xtensa LX7
  isa: Xtensa # Xtensa, RISC-V, AVR, ARMv6-M, ARMv6Z, ARMv7-M, ARMv7-A, ARMv8-A
  clock_speed: 240MHz
  flash: 16MB # memory grammar: B, kB, MB, GB, TB
  ram: 512kB
  ram_notes: plus 8MB PSRAM
  linux: false
connectivity:
  wifi: # bands on the board; false when none; add-on = dongle, shield or module
    - 2.4GHz
  ethernet: 100BASE-TX # false, 100BASE-TX, 1000BASE-T or add-on
  bluetooth: 5.0 LE
  usb: USB-C (native USB)
  serial: true
  poe: add-on # true, false or add-on
io:
  max_outputs: 8 # usable pixel data outputs
  storage: microSD # false, microSD, SD or add-on
  bms: false # false, 1S (LiPo charger) or diode
  imu: false # false, true or add-on
---
# Example 2: Linux single-board computer with RAM variants
name: Example SBC
compute:
  soc: Example A53
  isa: ARMv8-A
  clock_speed: 1.5GHz
  flash: 8GB
  flash_notes: eMMC
  ram: # a list when variants differ
    - 1GB
    - 2GB
    - 4GB
  linux: true
connectivity:
  wifi:
    - 2.4GHz
    - 5GHz
  ethernet: 1000BASE-T
  bluetooth: '5.0'
  usb: OTG x1, 2.0 x2
io:
  storage: microSD

