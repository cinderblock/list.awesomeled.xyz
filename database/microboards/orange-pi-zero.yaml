    notes: "'Allwinner H2+ quad core Cortex A7 processor @ 1.2 GHz with Mali-400MP2 GPU @ 600 MHz'. The maker's page writes 'AllWinner H2 SoC' and lists 'H2/H3' in its spec table"
  compute.isa:
