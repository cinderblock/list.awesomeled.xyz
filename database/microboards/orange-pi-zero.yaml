name: Orange Pi Zero
release_year: 2016
creator:
  name: Shenzhen Xunlong Software
  page: http://www.orangepi.org/html/hardWare/computerAndMicrocontrollers/details/Orange-Pi-Zero.html
notes: >-
  48 × 46 mm Allwinner quad-core board with 100 Mbit Ethernet, Wi-Fi, a 26-pin header and a 13-pin
  header (USB, IR, audio), powered over micro-USB. The 2019 Orange Pi Zero LTS (v1.5) is the same
  board with lower power draw and temperature.
power:
  voltage:
    min: 5V
    max: 5V
compute:
  soc: Allwinner H2+
  cpu: 4× ARM Cortex-A7
  isa: ARMv7-A
  clock_speed: 1.2GHz
  flash: 2MB # SPI NOR
  ram:
    - 256MB
    - 512MB
  linux: true
connectivity:
  wifi:
    - 2.4GHz
  ethernet: 100BASE-TX
  usb: OTG x1, 2.0 x1
  poe: true # passive PoE, off by default (enabled with solder jumpers)
io:
  storage: microSD
related:
  - type: variant
    ref: microboards/orange-pi-lts
    notes: The Zero LTS (v1.5, 2019) keeps the same specifications with lower power draw and temperature
    source:
      url: https://www.cnx-software.com/2019/07/20/orange-pi-zero-lts-allwinner-h2-sbc-gets-more-efficient-and-cooler/
      retrieved: '2026-11-18'
      notes: "'improvements in the design in order to reduce power consumption, and lower the board's temperature'; spec list headed 'Orange Pi Zero LTS v1.5 specifications'. Both orangepi.org product pages give the same 48 × 46 mm size and spec table"
sources:
  release_year:
