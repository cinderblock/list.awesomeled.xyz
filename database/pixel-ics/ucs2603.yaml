name: UCS2603
creator: Lianxinke Microelectronics
notes: RGB driver with a backup data line, 4-bit current setting per color and 8kHz PWM
color:
  channel_bits: 8
  pwm_frequency: 8kHz
data:
  clocked: false
  channels: 3
  bitrate: 800kHz
  backup_line: true
electrical:
  output_voltage: 28V
  output_voltage_notes: Top of the 5-28V output pixel voltage Advatek and ENTTEC list (no maker datasheet found)
  supply_voltage: 5V
  current_programmable: true
other_links:
