technical_notes:
  - Datasheet V1.3 (2019-09-06) raised the R/G/B port withstand voltage to 20 V and added 24 V applications.
  - Datasheet V1.5 (Oct 2022) dropped the CPC-8 package (a ~2.6 x 2.6 mm WorldSemi 8-lead part) and added FSOP-8; the English V1.5 still says 'SOP8, CPC8 and FSOP8 package types available'.
  - "Datasheet V2.0 (2023-09-23) revised the die: '优化内部芯片' (optimized internal chip)."
