# Example 1: single-wire 3-channel driver IC (most fields)
name: EX2811
status: active
release_year: 2012
creator: Example Semi # the maker as written on its own datasheet
notes: 3-channel constant-current driver for strings and modules.
aliases: # other part numbers for the same IC
  - EX2811S
color:
  channel_bits: 8 # PWM bits per channel; a list when selectable ([8, 12, 16])
  pwm_frequency: 2kHz
  pwm_frequency_notes: 400Hz on the first revision
data:
  type: WS2811 # protocol family (stream 4 links ICs that speak it)
  clocked: false
  channels: 3
  bitrate: 800kHz
  pixel_size_bits: 24 # pixel_rate_max is derived from bitrate / pixel_size_bits
  backup_line: false
datasheet:
  url: https://example.com/ex2811.pdf
electrical:
  output_voltage: 12V # highest LED-side voltage (Vds max)
  supply_voltage: 5V
  supply_voltage_notes: higher supplies through a series resistor
  gpio:
    min: 3.5V # lowest logic high on the data input
    max: 5V
  max_current: 18.5mA # per channel
  quiescent_current: 1mA
physical:
  packages: # common.json ic_package
    - SOP-8
    - DIP-8
price:
  - qty: 1
    price: 0.05
price_source:
  vendor: Example Distributor
  url: https://example.com/ex2811
  retrieved: '2026-01-01'
---
# Example 2: clocked driver with extra brightness control (fewer fields)
name: EX9822
creator: Example Semi
color:
  channel_bits: 8
  brightness_control: # extra bits on top of PWM
    bits: 5
    method: current # current (scales the LED current) or pwm (a slower overlaid PWM)
    scope: global # global (one value per pixel) or per_channel
data:
  clocked: true
  channels: 3
  bitrate: 30MHz
  pixel_size_bits: 32
physical:
  packages:
    - QFN-16

