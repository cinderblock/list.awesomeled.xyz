technical_notes:
  - 144-bit shift register (18 channels x 8 bits); free-running PWM after the data is written, with staggered delays between output channels
  - 'Current accuracy: +/-1% between channels, +/-2% between chips'
  - Over-temperature protection shuts the outputs off at 150°C and re-enables them at 125°C
  - No datasheet copy found online; WorldSemi's 2012 product page linked a 'WS2803 Specification book' archive that the Wayback Machine did not capture
