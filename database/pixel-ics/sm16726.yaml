technical_notes:
  - R, G and B LED current can be adjusted online for white balance; constant-current error under ±5% (Sunmoon product page)
  - Reverse-polarity protection against swapped power and ground; HBM ESD above 8 kV (Sunmoon product page)
  - Powers up white (selection guide)
  - "Sunmoon's product page links no datasheet; the frame layout is taken from Falcon's grouping with the SM16716"
