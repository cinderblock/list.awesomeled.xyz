name: NS108
status: active
release_year: 2018
creator: Newstar LED Co.
manufacturers:
  - Newstar LED Co.
notes: Newstar's 16-bit clocked RGB driver IC, the chip inside the HD108 LED. Adds a 5-bit current gain per color; Newstar's upgrade of the NS107S.
color:
  channel_bits: 16
  brightness_control:
    bits: 5
    method: current
    scope: per_channel
  pwm_frequency: 27kHz
data:
  type: SK9826
  clocked: true
  channels: 3
  bitrate: 40MHz
  pixel_size_bits: 64
  backup_line: false
  max_per_string: 1024
datasheet:
  url: https://web.archive.org/web/20230131080044id_/http://newstar-ledstrip.com/product/20220705164520116.pdf
  sources:
    - url: https://web.archive.org/web/20230131080044id_/http://newstar-ledstrip.com/product/20220705164520116.pdf
      host: manufacturer
      notes: Newstar's NS108 spec (SPC/NS108 Rev. 04), Wayback capture
    - url: https://voron.ua/files/pdf/led/NS108_5050.pdf
      host: distributor
      notes: Newstar NS108-5050-16bit spec (Rev. 04), distributor copy (Voron, UA)
electrical:
  supply_voltage: 5.1V
  supply_voltage_notes: 'NS108 spec Rev. 04: VDD 5.1 V typical, 5.5 V max'
  gpio:
    min: 3V
  max_current: 18mA
  max_current_notes: Default with REXT floating; an external REXT resistor sets up to 60 mA
  current_programmable: true
other_links:
  - http://newstar-ledstrip.com/productshow847.html
  - https://www.advateklighting.com/pixel-protocols/hd108
physical:
  packages:
    - '5050'
    - '2020'
related:
  - type: predecessor
    ref: pixel-ics/ns107s
    notes: 'Newstar: "NS108/HD108 LED is the upgrade type of NS107S".'
    source:
      url: http://newstar-ledstrip.com/productshow847.html
      retrieved: '2026-11-18'
sources:
  creator:
    url: https://web.archive.org/web/20230131080044/http://newstar-ledstrip.com/product/20220705164520116.pdf
    retrieved: '2026-11-18'
    notes: 'Newstar NS108 spec: "NEWSTAR LED as the original IC developer of NS107S NS108 series digital led". Its Pixel LED Chip catalog lists each LED as "NS108 HD108": NS108 is the IC, HD108 the LED.'
  status:
    url: http://newstar-ledstrip.com/products.asp?sid=195&tid=274
    retrieved: '2026-11-20'
    notes: Newstar's Pixel LED Chip catalog lists NS108 HD108 in 5050 and 2020.
  release_year:
    url: https://web.archive.org/web/20230131080044/http://newstar-ledstrip.com/product/20220705164520116.pdf
    retrieved: '2026-11-18'
    notes: The sheet's NS108 row says 2018; the NS108 spec's sample reel label is dated 2018-09-12.
  color.brightness_control:
    url: http://newstar-ledstrip.com/productshow847.html
    retrieved: '2026-11-20'
    notes: '"64Bit (65536 level) color settings; each set of data are 1bit start code +15 Bit (32) brightness adjustment (red, green, blue three ports each 5bits, corresponding to S4 ~ S0) ; 48bits gray data (red, green, blue 16bits)"'
  data.bitrate:
    url: https://web.archive.org/web/20250213151642/http://newstar-ledstrip.com/productshow847.html
    retrieved: '2026-11-18'
    notes: '"The maximum serial data input frequency 40MHZ, refresh rate of up to 27KHz, cascade up to 1024 points"'
  electrical.max_current:
    url: http://newstar-ledstrip.com/productshow847.html
    retrieved: '2026-11-20'
    notes: '"when REXT is floating, the three-channel constant current driver default output of 18mA ... Can also be REXT external resistor to adjust the required current"'
