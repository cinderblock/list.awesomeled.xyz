technical_notes:
  - 'Per-channel current control: 6 bits per color (Advatek)'
  - Built-in gray-level smoothing on top of the 16-bit gamma curve (Advatek)
  - No datasheet found; every value here is from the Advatek and ENTTEC protocol pages
