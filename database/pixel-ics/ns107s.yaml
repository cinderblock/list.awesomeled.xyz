name: NS107S
status: active
release_year: 2017
creator: Newstar LED Co.
manufacturers:
  - Newstar LED Co.
notes: Newstar's clocked RGB driver IC, the chip inside the HD107S LED. APA102 frame with ~27 kHz PWM; Newstar's upgrade of the APA107.
color:
  channel_bits: 8
  aggregate_bits: 24
  brightness_bits: 5
  brightness_method: global
  pwm_frequency: 27.0kHz
  pwm_frequency_notes: Newstar's NS107S page says ">27kHz"
data:
  type: APA102
  clocked: true
  channels: 3
  bitrate: 30MHz
  bitrate_notes: Newstar's NS107S page and spec give ">30Mhz"; Rose Lighting's HD107S spec gives 40 MHz
  pixel_size_bits: 32
  backup_line: false
