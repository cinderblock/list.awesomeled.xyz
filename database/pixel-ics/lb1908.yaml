sources:
  data.type:
    url: https://media.ledyi.com/lb1908-datasheet_1309db21e23b3ebdc074abd8b810492aa543b85520f7cd25739da821d0d92aca.pdf
    retrieved: '2026-11-18'
    notes: "'Using return to 0 code, serial data transmission rate 800KHz'; T0H 250-350 ns, T1H 700-900 ns, bit period 1.1-1.3 us, reset 200 us or more; 24 bits R G B per chip, higher bits first. Falcon's pixel-type table (https://pixelcontroller.com/store/PixelTypes.html) lists LB1908 among its WS2811 alternatives."
  data.channels:
    url: https://media.ledyi.com/lb1908-datasheet_1309db21e23b3ebdc074abd8b810492aa543b85520f7cd25739da821d0d92aca.pdf
    retrieved: '2026-11-18'
    notes: "'There are 3 open-drain constant current output terminals' (OUTR, OUTG, OUTB)"
  data.backup_line:
    url: https://media.ledyi.com/lb1908-datasheet_1309db21e23b3ebdc074abd8b810492aa543b85520f7cd25739da821d0d92aca.pdf
    retrieved: '2026-11-18'
    notes: "'the chip provides dual data inputs as redundant control to ensure signal transmission in the case of single chip damage'; pins DIN (5) and FDIN (7)"
  color.pwm_frequency:
