    notes: "'OUT output port withstand voltage 24V'; Maximum Ratings Vout 26 V"
technical_notes:
  - "FDIN carries the same stream as the previous chip's DIN and drops the first 24 bits, so wire the controller to the first chip's DIN and ground that chip's FDIN; leave FDIN floating if break-point resume isn't wanted"
  - 'Gaps over 80 us between bytes may reset the chip mid-frame'
  - 'Put 68-100 ohm protective resistors on the signal pins and a 0.1 uF (104) decoupling capacitor at each chip'
  - "The datasheet names no maker; its ESD paragraph reads 'Titan Micro Electronics suggests taking all appropriate preventive measures'"
