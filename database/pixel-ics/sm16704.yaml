electrical:
  output_voltage: 26V
  output_voltage_notes: OUT R/G/B/W port withstand voltage; the older SM16704 datasheet lists 30V as the absolute maximum
  supply_voltage: 5V
  supply_voltage_notes: Built-in clamp (4.8-5.5V, 5.2V typical) lets it run from a 5-24V supply through a series resistor (1K at 12V, 3K at 24V)
  gpio:
    min: 3.5V
    max: 5.4V
    notes: VIH 0.7×VDD (3.5V at VDD 5V); logic input up to VDD+0.4V
  max_current: 17mA
  max_current_notes: Default constant current per channel; Sunmoon's SM16704PB product page says 16mA
  quiescent_current: 1.2mA
