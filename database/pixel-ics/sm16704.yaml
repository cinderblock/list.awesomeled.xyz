  data.type:
    url: https://www.ledyilighting.com/wp-content/uploads/2025/02/SM16704PB-datasheet.pdf
    retrieved: '2026-11-18'
    notes: "SM16704PB datasheet IBIBZIV1.3, Data Communication Protocol: single-polarity RZ code, T0H 200-400ns (300 typ), T1H 800-1000ns (900 typ), code period at least 1.2us, reset (Trst) at least 200us; 'Trst+ First chip 32bits data + ... + The N chip 32bits data +Trst', high bit first. Same RZ protocol as the SM16703 with a fourth (W) byte; note the longer 200us reset."
  data.channels:
    url: https://www.chinaasic.com/websiteManage/product/20230523101647341.pdf
    retrieved: '2026-11-18'
    notes: "'The SM16704PB is a single-line transmission 4-channel output LED driver'"
