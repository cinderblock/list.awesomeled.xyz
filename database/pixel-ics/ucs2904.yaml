name: UCS2904
creator: Lianxinke Microelectronics
notes: >-
  RGBW (4-channel) version of the UCS2903. Constant-current outputs preset to 17mA; current
  datasheets are for the UCS2904B.
color:
  channel_bits: 8
  pwm_frequency: 1.8kHz
data:
  clocked: false
  channels: 4
  bitrate: 800kHz
  pixel_size_bits: 32
  backup_line: false
  type: 4chUCS1903
datasheet:
  url: https://www.superlightingled.com/PDF/UCS2904-Datasheet.pdf # Covers UCS2904B; Superlighting LED copy, maker (szucs.cn) hosts no PDFs
  mirror:
    url: https://assets.awesomeled.xyz/datasheets/pixel-ics/ucs2904-67d004e1.pdf
