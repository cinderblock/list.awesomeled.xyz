      host: community
      notes: LEDYi copy of an older UCS2904B specification (24V rated, 28V absolute maximum output)
    - url: https://www.gree-leds.com/web/userfiles/download/UCS2904BGreeledEnglish.pdf
      host: distributor
      notes: Greeled copy of the UCS2904B datasheet
electrical:
  output_voltage: 26V
  output_voltage_notes: Rated port withstand voltage; 30V absolute maximum. An older UCS2904B spec gives 24V rated, 28V absolute maximum.
  supply_voltage: 5V
  supply_voltage_notes: Built-in 5V regulator on VDD, so 12V and 24V strips feed it through a series resistor. Recommended VDD 2.6-6V, 6.5V absolute maximum.
  gpio:
    min: 3.5V
    max: 5.5V
    notes: VIH 0.7×VDD (3.5V at VDD 5V); logic input up to VDD+0.5V
  max_current: 17mA
  max_current_notes: Preset constant current (no current-setting pin); ±1.5% between channels, ±3% between chips
