  url: https://web.archive.org/web/20241102023333/http://newstar-ledstrip.com/productshow855.html
  discrepancies:
    - Newstar's NS8808 page names the GE8808B in one sentence of its description ("the GE8808B use the e-RZ ... as the signal transmission mode"), apparently text carried over from that chip's datasheet.
electrical:
  supply_voltage: 12V
  supply_voltage_notes: Input range 9-15 V; the regulator (7805-type) is built-in
  output_voltage: 12V
  output_voltage_notes: Voltage endurance of the LED outputs
  max_current: 17.5mA
  max_current_notes: Default constant-current output; the minimum is 11 mA
