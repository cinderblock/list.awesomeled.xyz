technical_notes:
  - 'Data depth is selectable: 8-bit (gamma 2.2 expanded to 16-bit), 12, 14 or 16 bits per channel; bits per chip on the wire follow the depth and field mode'
  - 'Field mode sets how many values each chip takes: 1 (one value for all four outputs), 2 (RG and BW pairs), 3 (RGB, W off) or 4 (RGBW)'
  - At 800 kHz and 30 frames/s one line carries 1111 three-value chips at 8-bit or 555 at 16-bit, twice that at 1.6 MHz
  - 'FastLED (src/fl/chipsets/encoders/ucs7604.h) documents the 15-byte preamble: 6 x 0xFF sync, header 0x00 0x03, mode byte, 4-bit current per R/G/B/W, 2 reserved bytes'
