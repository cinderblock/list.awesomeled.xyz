    retrieved: '2026-11-18'
    notes: "'RoHS Compliant Package SSOP24 QFN24' (datasheet: GP SSOP24L-150-0.64, GFN QFN24L-4*4-0.5). Advatek says SOP24."
technical_notes:
  - POL pin selects output polarity, so the chip can drive external regulators or MOSFETs as a PWM controller; with POL low it accepts only 10-bit data.
  - Phase-inverted clock output (CKO) to stop pulse-width distortion accumulating along the chain.
