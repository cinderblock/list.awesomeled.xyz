name: MBI6023
status: active
release_year: 2011
creator:
  name: Macroblock
  page: https://www.mblock.com.tw/en/Driver_ICs/LED_Driver_ICs/detail/48
notes: 3x4-channel (four RGB pixels) version of the MBI6020, 16-bit S-PWM
color:
  channel_bits:
    - 10
    - 16
  pwm_frequency: 11.718kHz
  pwm_frequency_notes: Visual refresh rate in 16-bit S-PWM mode with the default ~12MHz gray scale clock (12MHz / 65536 x 64); the 10-bit mode uses conventional PWM
data:
  type: MBI6023
  clocked: true
  channels: 12
  bitrate: 10MHz
  bitrate_notes: CKI 0.2-10MHz
  pixel_size_bits: 48
  backup_line: false
