    retrieved: '2026-11-18'
    notes: "'two selectable gray scale modes ... 16-bit gray scale mode and 10-bit gray scale mode'"
  color.pwm_frequency:
    url: https://www.neumueller.com/datenblatt/macroblock/MBI6023%20Datasheet%20VB.01-EN.pdf
    retrieved: '2026-11-18'
    notes: "'12MHz/65536x64=11,718Hz'; Advatek lists 11,718Hz"
  electrical.output_voltage:
    url: https://www.mblock.com.tw/en/Driver_ICs/LED_Driver_ICs/detail/48
    retrieved: '2026-11-18'
    notes: "Specification table: 'Sustaining Output Voltage 17V', 'Supply Voltage 3~5.5V', 'Constant Output Current Range per Channel 3~45mA'"
  physical.packages:
