  url: https://www.neumueller.com/datenblatt/macroblock/MBI6023%20Datasheet%20VB.01-EN.pdf # Macroblock MBI6023 datasheet VB.01 (November 2016); Neumüller (authorized distributor) copy
  sources:
    - url: https://www.neumueller.com/datenblatt/macroblock/MBI6023%20Datenblatt%20-%20Datasheet.pdf
      host: distributor
      notes: Preliminary datasheet V1.00 (October 2011), Neumüller copy
electrical:
  output_voltage: 17V
  supply_voltage: 3-5.5V
  max_current: 45mA
  max_current_notes: Constant current 3-45mA; three external resistors (R-EXTA/B/C) each set one output group
  current_programmable: true
  current_range: 3-45mA
other_links:
