name: D705
creator: DMS Microelectronics
notes: Clocked RGB driver with 5-bit (32-level) outputs using the LPD6803 frame; D705G adds gamma correction
aliases:
  - D705A
  - D705G
color:
  channel_bits: 5
data:
  type: LPD6803
  clocked: true
  channels: 3
  bitrate: 15MHz
  bitrate_notes: 'Recommended data clock 0-15 MHz; absolute maximum 20 MHz'
  pixel_size_bits: 16
  backup_line: false
datasheet:
  url: https://web.archive.org/web/20120312160731id_/http://www.leds.ru/pdf/D705_en.pdf # DMS Microelectronics D705, English RAV D705-A2 (2009-08-26); Wayback copy, the original leds.ru file now 404s and no maker-hosted PDF was found
  mirror:
    url: https://assets.awesomeled.xyz/datasheets/pixel-ics/d705-d678cc60.pdf
    sha256: d678cc60c1e9003d8b6a1f159fde69190b389d84aa84e4d3b80ad2bcb1f59776
    retrieved: '2026-11-28'
    source: https://web.archive.org/web/20120312160731id_/http://www.leds.ru/pdf/D705_en.pdf
electrical:
  output_voltage: 12V
  output_voltage_notes: 'LED drive port voltage; LED supply 3-12 V (enough for 3 LEDs in series)'
  supply_voltage: 4.5-7.5V
  supply_voltage_notes: Built-in LDO with a 4.5 V regulator output (Vout pin)
  gpio:
    notes: 'VIH 0.7 x VDD, VIL 0.3 x VDD'
  max_current: 45mA
  max_current_notes: 'Per channel; 18-20 mA from the built-in resistor when FB floats, higher with an external FB resistor (absolute maximum 60 mA)'
  current_programmable: true
  current_range: 18-45mA
other_links:
  - https://fw.hardijzer.nl/?p=158
physical:
  packages:
    - SOP-14
    - DIP-14
    - QFN-16
    - DFN-10
    - MSOP-10
related:
  - type: compatible
    ref: pixel-ics/lpd6803
    notes: Same clock + data frame as the LPD6803; SanDevices and Falcon drive it with their LPD6803 pixel type
    source:
      url: http://sandevices.com/wp-content/uploads/2017/11/E682_Operating_Manual.pdf
      retrieved: '2026-11-18'
      notes: "E682 Operating Manual, 'Full Pixel Type List': 'LPD6803 — D705, LPD1101, UCS6909, UCS6912'. Falcon's pixel-type table (https://pixelcontroller.com/store/PixelTypes.html) lists D705 among its LPD6803 alternatives."
sources:
  creator:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "Header on every page: 'DMS MICROELECTRONICS LTD.', footer 'DMS Microelectronic Limited' (the P9813's maker)"
  aliases:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "'D705 is available in D705A and D705G. Generally speaking, D705A is used for ads; D705G with the function of Gamma Correction ... the grade-color of D705G will be up to 256 when the serial input clock frequency is not less than 1MHZ'. Order codes D705AD14, D705AS14, D705AMS10, D705AQF16, D705ADF10."
  data.type:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "'Communication protocol and timing': 32 bits of 0 as the start frame, then per chip one start bit '1' and three 5-bit RGB gray values, MSB first on the rising edge of Cin; a further clock pulse per chip makes the new data take effect. That is the LPD6803 frame."
  data.bitrate:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "'Maximum serial input data clock frequency is 20MHZ'; recommended working parameters FCLK 0-15 MHz"
  electrical.max_current:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "'3 drive channels, each channel with current 18-45mA'; I = 0.7 V / [R x 37.5 / (37.5 + R)] with R on the FB pin (39 ohm gives about 36 mA)"
  physical.packages:
    url: https://web.archive.org/web/20120312160731/http://www.leds.ru/pdf/D705_en.pdf
    retrieved: '2026-11-18'
    notes: "'available in SOP14、DIP14、QFN3.3X3.3-16L、DFN3.3X3.3-10L、MSOP10 package and DIE of COB package'"
technical_notes:
  - Built-in 1.2 MHz ring oscillator keeps the outputs modulating (free-run) without a running clock, so a static image holds
  - 'MODE pin: high (default) for constant-current outputs, low to drive external transistors in constant-voltage mode'
  - Clock and data are regenerated by push-pull drivers for the next chip; the datasheet recommends twisted pair and 39 ohm series resistors on DOUT and COUT
  - The DFN-10 and MSOP-10 versions have a fixed built-in 18-20 mA current
  - 'Data and clock inputs have built-in pull-ups (SOP14/DIP14 pins 1-2)'
