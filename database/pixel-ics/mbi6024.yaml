technical_notes:
  - 'Dot correction: 8-bit (16-bit mode) or 6-bit (10-bit mode) gain per output, sent as its own packet before the gray-scale data and multiplied in on chip; Advatek presents it as 8-bit current control per color'
  - Phase-inverted clock output (CKO) to stop pulse-width distortion accumulating along the chain
  - Gray scale clock 3, 6, 12 (default) or 24MHz from the internal oscillator; auto-synchronization (default) or manual synchronization of PWM cycles
  - Selectable output polarity, to drive external high-power drivers or MOSFETs
  - If CKI stays low for more than 95 CKI cycles the chip ignores the current data and keeps showing the previous image
