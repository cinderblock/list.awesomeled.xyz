related:
  - type: variant
    ref: pixel-ics/mbi6023
    notes: Same 3x4-channel driver and gray-scale packet as the MBI6023, adding dot correction, configuration registers and manual synchronization
    source:
      url: https://www.neumueller.com/datenblatt/macroblock/MBI6024%20Datenblatt%20-%20Datasheet.pdf
      retrieved: '2026-11-18'
      notes: "Both datasheets (MBI6023 VB.01 at https://www.neumueller.com/datenblatt/macroblock/MBI6023%20Datasheet%20VB.01-EN.pdf): prefix of CKI and SDI low for more than 172 CKI cycles, 48-bit header with command 6'b111111 (16-bit) or 30-bit header with 6'b101011 (10-bit), 12 words per IC, last IC first. Only the MBI6024 has the dot-correction (6'b110011, 6'b100111) and configuration (6'b100011, 6'b110111) commands. Its own product description still says 'MBI6023 preserves selectable polarity reversion'."
