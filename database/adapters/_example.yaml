# Example 1: Shield that turns a dev board into a pixel controller (all fields)
name: Example 4x Pixel Shield
status: active
creator:
  name: Example Labs
  url: https://example.com
  page: https://example.com/4x-shield
vendors:
  - name: Tindie
    page: https://example.com/tindie/4x-shield
notes: Level-shifted pixel outputs for a Wemos D1 Mini; runs WLED.
inputs:
  physical:
    Wi-Fi: # from the dev board
      - 2.4GHz
  protocols:
    - Art-Net
    - sACN
outputs: # same shape as a controller's outputs (common.json pixel_outputs)
  count: 4
  connector: Screw terminals # or { ref: <connectors/ slug> }
  clocked: selectable # false (single-wire only), selectable, or always (clocked only)
  driver:
    buffered: true
power: # common.json power_input
  voltage:
    min: 5
    max: 24
  current:
    max: 15
diy_or_ots: OTS # DIY, OTS or both
links:
  product: https://example.com/4x-shield
parent: Wemos D1 Mini # the board it plugs into
price: 18
software:
  firmware:
    - WLED
  works_with:
    - xLights
---
# Example 2: Raspberry Pi HAT that outputs DMX512, not pixels
name: Example Pi DMX HAT
notes: Isolated DMX512 output for a Raspberry Pi running OLA or FPP.
outputs:
  auxiliary:
    DMX512: 1 # one universe
  connector: XLR-5
diy_or_ots: OTS
parent: Raspberry Pi
price: 30

