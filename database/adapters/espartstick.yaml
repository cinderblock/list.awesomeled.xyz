name: ESP Art Stick
status: discontinued
creator: Microcyb
notes: "Microcyb's 2019 Wemos D1 Mini (ESP8266) shield, sold assembled with the D1 Mini, before the SD-card EspArtStick: one pixel output, in 5 V kits ($16.99; terminal block with a clock pin, or a barrel-jack version that is data only) and a 12 V kit ($25, later 5-12 V). Runs ESPixelStick or custom Arduino code, up to about 1024 pixels. Gone from the store by 2022."
