name: Raspberry Pi Pixel HAT (Dual Output)
status: discontinued
creator:
  name: Microcyb
  url: http://microcyb.com/
notes: Two-output pixel HAT for a Raspberry Pi running FPP (RPIWS281X driver, single-wire pixels), with a data level amplifier on each output; it powers the Pi from the 5 V or 12 V pixel supply. "Over 512" pixels per output, 1024 in total at 40 fps. Listed as "Pi Hat" in the original spreadsheet, whose row was shifted (its "3200" and "Phoenix Screw" don't fit this product); the connector type isn't published.
outputs:
  count: 2
  clocked: false
  driver:
    buffered: true # data level amplifier per output
  pixels:
    max_per_output: 512 # "over 512" each, 1024 total at 40 fps
power:
  voltage:
    min: 5
    max: 12
