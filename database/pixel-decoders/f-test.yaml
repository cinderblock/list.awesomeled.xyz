notes: 'Handheld pixel, DMX and SmartReceiver tester and data analyzer (released 2023). Output modes generate WS281x test patterns for up to 1400 pixels, Falcon, FPP and HinksPix smart-receiver test data, and DMX, LOR or Renard serial. Input modes decode, analyze and pass through incoming pixel, smart-receiver and DMX data, cleaning up the signal like an F-Amp. Powered from 5-13 V on the pixel port (not 24 V) or USB; microSD slot for firmware and logging.'
inputs:
  protocols:
    - WS2811
outputs:
  count: 3 # pixel data (xConnect), Smart Remote, DMX (RJ45)
  types:
    - pixel-data
    - dmx512
  connector:
    ref: rj45
    notes: DMX; pixel data and Smart Remote on xConnect
diy_or_ots: OTS
