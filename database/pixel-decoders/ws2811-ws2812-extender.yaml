name: WS2811 / WS2812 Extender
status: discontinued
creator:
  name: EagleDecorations
  url: https://www.tindie.com/stores/ericgu/
notes: >-
  Acts as one WS2812 pixel with a high-current output per colour, for driving non-addressable
  5V or 12V loads (old-school LED ornaments) from a WS2812 controller. 5V or 12V selected by a
  solder jumper; 4A per channel with all channels driven, 8A with one. Chains like WS2812 LEDs.
  34 × 28mm.
inputs:
  protocols:
    - WS2811
    - WS2812
outputs:
  count: 3
  types:
    - pwm
  connector: Solder pads or 3.96mm headers
diy_or_ots: OTS
