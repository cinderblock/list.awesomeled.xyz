# Example 1: Pixel data in, PWM out (all fields)
name: Example Pixel-to-PWM Board
status: active
creator:
  name: Decoder Corp
  url: https://example.com
  page: https://example.com/pixel-to-pwm
manufacturers:
  - Decoder Corp
vendors:
  - name: LED Supplier
    page: https://example.com/shop/pixel-to-pwm
notes: Turns one WS2811 address into four high-current MOSFET channels for plain (non-addressable) strip.
inputs:
  protocols: # pixel protocols accepted on the data input, as the vendor names them
    - WS2811
outputs:
  count: 4
  types: # pixel-data, dmx512, pwm, relay, servo, power
    - pwm
  connector: Screw terminal # or a ref into connectors/, see Example 2
diy_or_ots: OTS # DIY, OTS or both
links:
  product: https://example.com/pixel-to-pwm
price: 9.5
---
# Example 2: Pixel data in, DMX512 out
name: Example Pixel-to-DMX Bridge
creator: Bridge Works
notes: Maps the first 170 RGB pixels of a string onto one DMX universe (512 channels).
outputs:
  count: 1 # a DMX512 output counts once per universe
  types:
    - dmx512
  connector:
    ref: xlr-3 # slug of an entry in connectors/ (checked by bun run validate)
    notes: pass-through pixel output on a 3-pin pigtail
diy_or_ots: OTS
price: 49
---
# Example 3: Inline data conditioning, DIY
name: Example Data Isolator
creator: Open Hardware Project
notes: Galvanically isolates the data line between a controller and a separately powered string.
outputs:
  count: 1
  types:
    - pixel-data
  connector: Solder pads
diy_or_ots: DIY
links:
  product: https://example.com/isolator

