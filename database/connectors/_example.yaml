# Example 1: Sealed circular power/data connector (all fields)
name: Example Circular 4-Pin
status: active
creator:
  name: Example Connectors
  url: https://example.com
  page: https://example.com/circular-4
manufacturers:
  - Example Connectors
  - Generic clones
notes: Screw-locking circular connector common on outdoor pixel strings.
aliases:
  - EC4
common_applications:
  - Outdoor pixel strings (power + data in one plug)
links:
  product: https://example.com/circular-4
  digikey: https://example.com/digikey/circular-4
mechanical:
  outline: Circular # Rectangular, Circular, Triangular (a list when variants differ)
