  solder: true
  screw_terminal: false
  crimp: false
  idc: false
  smallest_gauge: 22 # AWG numbers: the thinnest wire it takes
  largest_gauge: 16 # the thickest
wiring:
  pinout: '+ D G'
  colors: Black
