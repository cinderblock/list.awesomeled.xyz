name: xConnect
creator:
  name: HolidayCoro
  url: https://www.holidaycoro.com/
notes: >-
  Screw-together, 3-conductor waterproof plug for pixel strings and extensions: HolidayCoro's
  EasyPlug3 standard, which other vendors call xConnect. The design isn't patented, so other vendors
  copy it, and HolidayCoro warns their cables may not mate with its own. HolidayCoro's extensions use
  18 AWG wire.
aliases:
  - EasyPlug3
common_applications:
  - Pixel strings, pigtails and extension cables (power, ground and data)
