name: XLR 4
creator: Neutrik / Generic
notes: >-
  4-pole member of the XLR family. On LED gear it carries power and data together: City Theatrical's
  QolorPIX tape controller has a 4-pin XLR female on each output, and its QolorFLEX tape uses the same
  plug.
aliases:
  - 4-pin XLR
common_applications:
  - LED tape power and data (City Theatrical QolorPIX / QolorFLEX)
datasheet:
  url: https://www.neutrik.com/en/product/nc4mxx.pdf
