mechanical:
  outline: Circular
  contact_type: Pins
  min_pins: 4
  max_pins: 4
  gendered: true
  locking: Latching
  wire_to_wire: true
ratings:
  max_current: 10A
  max_voltage: 50V
  ip_rating: IP40
