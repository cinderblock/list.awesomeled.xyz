name: PCB Screw Terminal Block
creator: Generic
notes: >-
  Fixed (one-piece, non-pluggable) screw-clamp terminal block soldered to the board, usually at 5.0 mm
  or 5.08 mm (0.2 in) pitch: the power and pixel-output terminals on many DIY controllers and shields.
  Ratings vary by maker; the datasheet linked here is Degson's DG301-5.0. Two-part pluggable blocks
  are a separate entry (MSTB COMBICON).
aliases:
  - Screw terminal
  - DG301
  - MKDS 1,5
