name: SN74HCT245
status: active
creator: Texas Instruments
notes: >-
  Octal bus transceiver (A-to-B or B-to-A per the DIR pin) with TTL-voltage-compatible inputs on a
  4.5-5.5 V supply: a high input needs only 2 V, so 3.3 V logic drives its 5 V outputs. The
  74HC245 has the same pinout but CMOS input thresholds (3.15 V minimum at a 4.5 V supply). Used as
  the 5 V buffer on PJRC's OctoWS2811 Adaptor and on Evil Genius Labs' LED shields.
aliases:
  - 74HCT245
  - SN74HCT245N
  - SN74HCT245DW
  - SN74HCT245DWR
  - SN74HCT245PWR
  - SN74HCT245DBR
  - SN74HCT245NSR
  - SN74HCT245DGSR
