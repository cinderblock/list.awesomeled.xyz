# Example 1: buffer IC (most fields)
name: Example 74XX125
status: active
creator: Example Semiconductor
notes: Quad buffer with 5V-tolerant inputs, a common 3.3V-to-5V pixel data shifter.
aliases: # other part numbers for the same device (package suffixes, other makers)
  - EX74XX125D
  - EX74XX125PW
datasheet:
  url: https://example.com/ex74xx125.pdf
electrical:
  supply_voltage: 4.5-5.5V # range the part runs from
  output_current: 8mA # drive per output
  input_high_voltage: 2V # VIH min powered for 5 V output: below 3.3V means a 3.3V controller can drive it
io:
  channels: 4
  direction: fixed # fixed (one way), dir-pin (set by a DIR input) or auto (auto-sensing)
  buffered: true
links:
  product: https://example.com/ex74xx125
physical:
  packages: # common.json ic_package
    - SOIC-14
    - TSSOP-14
price:
  - qty: 1
    price: 0.5
  - qty: 1000
    price: 0.2
price_source:
  vendor: Example Semiconductor
  url: https://example.com/ex74xx125
  retrieved: '2026-01-01'
