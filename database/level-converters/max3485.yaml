name: MAX3485
status: active
creator: Analog Devices
notes: >-
  3.3 V half-duplex RS-485/RS-422 transceiver (one driver, one receiver) at up to 10 Mbps, in the
  industry-standard 75176 pinout; interoperable with 5 V logic, and up to 32 transceivers can share
  a bus. First released in 1994 (datasheet revision 0, 12/94); now an Analog Devices part.
