name: TXB0104
status: active
creator: Texas Instruments
notes: >-
  4-bit bidirectional translator that senses direction automatically: A port 1.2-3.6 V, B port
  1.65-5.5 V, up to 100 Mbps. Only for push-pull signals; TI rates it for loads up to 70 pF and says
  its output drivers have low DC drive strength. TI lists the TXB0604 as a newer version.
