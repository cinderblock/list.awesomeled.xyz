name: SN74HCT125
status: active
creator: Texas Instruments
notes: >-
  Four independent buffers with TTL-voltage-compatible inputs and 3-state outputs on a 4.5-5.5 V
  supply, so 3.3 V logic drives 5 V outputs. Evil Genius Labs uses it as the level shifter on its
  4-output Wemos D1 Mini shield.
aliases:
  - 74HCT125
  - SN74HCT125N
  - SN74HCT125NE4
  - SN74HCT125D
  - SN74HCT125DR
datasheet:
  url: https://www.ti.com/lit/ds/symlink/sn74hct125.pdf
electrical:
  max_voltage: 5.5V
  output_current: 6mA
  input_high_voltage: 2V
  input_high_voltage_notes: 'VCC = 4.5 V to 5.5 V'
images:
