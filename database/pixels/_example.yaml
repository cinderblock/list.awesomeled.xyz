# Example 1: single-wire 5050 pixel (most fields)
name: EX2812B
status: active
release_year: 2014
creator: Example Semi # the maker as written on its own datasheet
manufacturers:
  - Example Semi
notes: 5050 RGB LED with a built-in single-wire driver.
aliases: # other names for the same LED
  - EX2812
color:
  order: GRB
  channel_bits: 8 # PWM bits per channel
  pwm_frequency: 2kHz
data:
  type: WS2812 # protocol family (stream 4 links pixels that speak it)
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24 # pixel_rate_max is derived from bitrate / pixel_size_bits
  backup_line: false
datasheet:
  url: https://example.com/ex2812b.pdf
electrical:
  led_voltage: 5V
  supply_voltage: 5V # the built-in driver's VCC / VDD
  gpio:
    min: 3.5V # lowest logic high on the data input
    max: 5V
  channel_current: 18.5mA # per color channel at full brightness
  quiescent_current: 0.7mA
physical:
  packages: # common.json led_package: footprint code or through-hole size
    - '5050'
price:
  - qty: 100
    price: 0.08
price_source:
  vendor: Example Distributor
  url: https://example.com/ex2812b
  retrieved: '2026-01-01'
---
# Example 2: clocked pixel with extra brightness control (fewer fields)
name: EX102
creator: Example Semi
color:
  order: BGR
  channel_bits: 8
  brightness_control: # extra bits on top of PWM
    bits: 5
    method: pwm # pwm (a slower overlaid PWM) or current (scales the LED current)
    scope: global # global (one value per pixel) or per_channel
    notes: a 440 Hz PWM overlaid on the LEDs
data:
  clocked: true
  bitrate: 30MHz
  pixel_size_bits: 32
electrical:
  led_voltage: 5V
  supply_voltage: 5V
physical:
  packages:
    - '5050'
    - '2020'

