name: APA107
status: active
release_year: 2017
creator: Newstar LED Co.
notes: Economic type of APA102, cheaper with lower PWM; produced by Newstar
color:
  order: BGR
  brightness_bits: 8+5
  pwm_frequency: 9.0kHz
  brightness_method_notes: Extra 5-bit brightness control, likely by LED current like SK9822
  pwm_frequency_notes: Unverified. The datasheet gives only its oscillator, 800-1200 kHz, which at 8-bit PWM means about 3.1-4.7 kHz, as on the SK9822 (measured at 4.7 kHz); no source found for 9 kHz
data:
  type: APA102
  clocked: true
  bitrate: 30MHz
  pixel_size_bits: 32
  backup_line: false
datasheet:
  url: http://www.newstar-ledstrip.com/product/20180820112602493.pdf # linked from the product page, productshow816.html
electrical:
  led_voltage: 5V
  vcc_voltage: 5V
  gpio:
    min: 3.5V
    max: 5.3V
  channel_current: 22.0mA
  quiescent_current: 1.0mA
  wattage: 110mW
  channel_current_notes: Datasheet claims 22-26mA; every other spec matches SK9822, so 19-22mA is most likely
