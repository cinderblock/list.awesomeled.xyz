name: TX1818
status: active
creator: TCWIN
manufacturers:
  - TCWIN
notes: TCWIN 12V RGB LEDs with a built-in single-wire driver; the six-pin 5050 version adds a backup data input
color:
  order: RGB
  brightness_bits: 8
  pwm_frequency: 8.0kHz
data:
  type: WS2811/12
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24
  backup_line: true
datasheet:
  url: https://datasheet.lcsc.com/datasheet/pdf/b153efab9bc27ebcdabd89857c3357d8.pdf # TCWIN TX1818BJJ-F01 (5050) specification A2 (2023-03-27), Chinese; LCSC's direct file, TCWIN's own site hosts no datasheets
  sources:
    - url: https://www.lcsc.com/datasheet/C784552.pdf
      host: distributor
      notes: LCSC viewer page for the same TX1818BJJ-F01 file (serves HTML to non-browsers)
    - url: https://datasheet.lcsc.com/datasheet/pdf/ccf6c4ce438971261bcd22da2dbd0270.pdf
      host: distributor
      notes: TX1818HLJ-F01 (3535) specification A2, same driver figures, no FDIN pin (LCSC C784557, viewer https://www.lcsc.com/datasheet/C784557.pdf)
electrical:
  vcc_voltage: 12V
  vcc_voltage_notes: 'Supply 10.8-13.2 V (absolute maximum 14 V)'
  gpio:
    min: 4V
    min_notes: 'VIH at least 4 V, VIL at most 1 V at VDD 12 V'
  channel_current: 9mA
  channel_current_notes: 'Fixed, 8.82-9.18 mA'
  quiescent_current: 2mA
  wattage: 0.12W
other_links:
  - https://www.advateklighting.com/pixel-protocols/tx1818
  - https://www.enttec.com/pixel-protocols/TX1818
physical:
  packages:
    - '5050'
    - '3535'
  pin_count: 6
sources:
  status:
    url: https://www.lcsc.com/product-detail/C784552.html
    retrieved: '2026-11-18'
    notes: 'TX1818BJJ-F01 in stock at LCSC (20 pcs); TX1818HLJ-F01 (https://www.lcsc.com/product-detail/C784557.html) 75 pcs'
  creator:
    url: https://www.lcsc.com/datasheet/C784552.pdf
    retrieved: '2026-11-18'
    notes: "Cover: 深圳市天成照明有限公司 (Shenzhen Tiancheng Lighting), TCWIN, www.tcwinled.com. Naming rule: 'TX' = 内置IC 系列 (built-in IC series), '1818' = IC 分类 (IC type), then package size and drive current. Advatek: 'designed by TCWIN Lighting in China'."
  data.type:
    url: https://www.lcsc.com/datasheet/C784552.pdf
    retrieved: '2026-11-18'
    notes: "Unipolar return-to-zero code, '数据传输频率可达800Kbps'; T0H 0.3 us, T1H 0.9 us, T0L 0.9 us, T1L 0.3 us (+/-0.05 us), reset 80 us or more; 24 bits per pixel, MSB first. Same framing and timing as the WS2812."
  data.backup_line:
    url: https://www.lcsc.com/datasheet/C784552.pdf
    retrieved: '2026-11-18'
    notes: "TX1818BJJ-F01 pin 3 FDIN '备用数据输入' (backup data input). The 3535 TX1818HLJ-F01 has no backup input. Advatek and ENTTEC list a redundant data line."
  color.order:
    url: https://www.lcsc.com/datasheet/C784552.pdf
    retrieved: '2026-11-18'
    notes: "24bit 数据结构: R7-R0, G7-G0, B7-B0, '高位先发，按照RGB 的顺序发送数据'"
  color.pwm_frequency:
    url: https://www.lcsc.com/datasheet/C784552.pdf
    retrieved: '2026-11-18'
    notes: IC electrical parameters, PWM 频率 FPWM 8 KHZ typical; Advatek and ENTTEC list 8000 Hz
  physical.packages:
    url: https://www.lcsc.com/product-detail/C784552.html
    retrieved: '2026-11-18'
    notes: 'LCSC packages: TX1818BJJ-F01 SMD5050-6P, TX1818CWCJ-F01 SMD5050-4P (C27636975), TX1818HLJ-F01, TX1818HXJ-F01 (C784558) and TX1818GLJ-F01 (C7495085) SMD3535-6P'
technical_notes:
  - "The TX1818HLJ-F01 datasheet adds power-on and power-down reset: '上电不亮灯' (LEDs stay off at power-up)"
  - 'TCWIN recommends a 33 ohm resistor in series with the supply pin, a 330 ohm resistor on the data input and a 0.1 uF decoupling capacitor per LED'
  - 'LED chips (5050, 9 mA): red 620-625 nm, green 520-525 nm, blue 465-470 nm'
variants:
  - name: TX1818BJJ-F01
    differences: '5050 (5.0 x 5.4 x 1.6 mm), 6 pins: GND, DIN, FDIN (backup data input), VDD, NC, DO'
  - name: TX1818CWCJ-F01
    differences: 5050, 4 pins (LCSC SMD5050-4P)
  - name: TX1818HLJ-F01
    differences: '3535 (3.5 x 3.5 x 1.36 mm), 6 pins: GND, NC, DIN, VDD, NC, DO (no backup input)'
  - name: TX1818HXJ-F01
    differences: 3535, 6 pins (LCSC SMD3535-6P)
  - name: TX1818GLJ-F01
    differences: 3535, 6 pins (LCSC SMD3535-6P)
