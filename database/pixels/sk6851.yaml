name: SK6851
creator: Opsco Optoelectronics
notes: 5050 RGB LED with a built-in single-wire driver and a ~4V clamp, made to run several in series from 24V (6 per string) or rectified 120V (30 per string)
aliases:
  - SK6851N
  - SK6851N-RG
color:
  order: GRB
  brightness_bits: 8
  pwm_frequency: 4kHz
data:
  type: WS2811/12
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24
  backup_line: false
datasheet:
  url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf # OPSCO SK6851N-RG-002 specification Rev B/0 (2024-03-18, Chinese/English), via LCSC C5440839
electrical:
  vcc_voltage: 4.2V
  vcc_voltage_notes: Chip clamping voltage 3.8-4.2V; the LEDs sit in series strings fed through a current-limiting resistor (30mA per string), 6 on 24V or 30 on rectified 120V AC
  channel_current: 8.5mA
other_links:
  - https://www.advateklighting.com/pixel-protocols/sk6851
physical:
  packages:
    - '5050'
  pin_count: 4
sources:
  creator:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: "Dongguan OPSCO Optoelectronics specification; Advatek: 'This pixel protocol was designed by OPSCO in China'"
  aliases:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: "Product naming: 'SK 6851N RG-002', where '6851N: Refers to the 68 series IC; 8.5mA current version' and 'RG-002: internal code'. LCSC lists it as SK6851N-RG (C5440839); Advatek and the controller lists write SK6851."
  data.type:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: "'Single-line zero code transmission protocol, can be infinite cascade', 800Kbps; T0H 0.2-0.4 us, T1H 0.65-1.0 us, bit period at least 1.2 us, reset low over 200 us; 24-bit data G7...B0, high bit first"
  color.pwm_frequency:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: IC electrical parameters, PWM frequency 4.0KHz (typical); Advatek lists 4000Hz
  electrical.vcc_voltage:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: "IC limit parameter 'Chip clamping voltage VDD +3.8~+4.2V'; chip input voltage 4.2V typical at IDD 1mA; application notes: 'Applicable working voltage for product circuit: 24V、120V, 24V series connected light source 6PCS, 120V series connected light source 30PCS'"
  electrical.channel_current:
    url: https://datasheet.lcsc.com/datasheet/pdf/80b71069049ae9c8aaafeb0811733cd2.pdf
    retrieved: '2026-11-18'
    notes: B/G/R output drive current 8.5mA (typical) at VDD 4.2V, VOUT 2V
technical_notes:
  - 'Pins: DOUT, DIN, VDD, GND'
  - In series strings each DIN is coupled through a 10nF capacitor, with an SS14 Schottky diode isolating DIN from VDD and 220 ohm on the first chip's DIN
