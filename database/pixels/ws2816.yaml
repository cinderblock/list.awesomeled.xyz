technical_notes:
  - 48-bit pixel data for 16-bit per channel color depth
  - 'WS2816A only: independent 5-bit current gain for each R, G, B channel'
  - Backup data line for fault tolerance
  - WS2816B (20mA) and WS2816C (10mA) current variants available
variants:
  - name: WS2816A
    suffix: A
    differences: 5-bit current gain on each RGB channel (keeps the 4-bit gamma correction)
  - name: WS2816B
    suffix: B
    differences: 20mA channel current
  - name: WS2816C
    suffix: C
    differences: 10mA channel current
