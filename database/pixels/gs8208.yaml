name: GS8208
status: active
release_year: 2018
creator: Genesis Systech
notes: Built-in 8->12bit gamma correction! Similar to WS2815; early version booted with onboard patterns - now eliminated
color:
  order: RGB
  channel_bits: 8
  channel_bits_notes: 12-bit gamma correction per colour (36 bits interpolated)
  pwm_frequency: 8kHz
  pwm_frequency_notes: 8kHz according to datasheet - uses MPWM to effectively multiply 2kHz PWM to 8kHz
data:
  type: WS2811/12
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24
  backup_line: true
