name: GS8208
status: active
release_year: 2018
creator: Genesis Systec
notes: Built-in 8->12bit gamma correction! Similar to WS2815; early version booted with onboard patterns - now eliminated
color:
  order: RGB
  channel_bits: 8
  channel_bits_notes: 12-bit gamma correction per colour (36 bits interpolated)
  pwm_frequency: 8kHz
  pwm_frequency_notes: 8kHz according to datasheet - uses MPWM to effectively multiply 2kHz PWM to 8kHz
data:
  type: WS2811/12
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24
  backup_line: true
datasheet:
  url: http://www.normandled.com/upload/201805/GS8208%20LED%20Datasheet.pdf
  discrepancies:
    - Datasheet claims 15mA but measured value is ~10mA
electrical:
  led_voltage: 12V
  led_voltage_notes: Datasheet 10.8-13.2V
  supply_voltage: 12V
  gpio:
    min: 3.5V
    max: 5V
  channel_current: 10mA
  channel_current_notes: Measured current across 3 LEDs at 12V. Datasheet claims 15mA
  quiescent_current: 2.5mA
  wattage: 120mW
