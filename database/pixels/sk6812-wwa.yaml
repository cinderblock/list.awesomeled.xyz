      host: distributor
      notes: rev 03 (2019-01-21)
    - url: https://www.lcsc.com/datasheet/C7423112.pdf
      host: distributor
      notes: SKC6812WWA rev A/0 (2021-09-09), Chinese
electrical:
  led_voltage: 5V
  led_voltage_notes: Datasheet claims "26V Vds, Max" but LEDs are built-in and share power with 5V VDD
  supply_voltage: 5.2V
  supply_voltage_notes: Datasheet typical; VDD range 3.5-5.5V (rev 01), 3.7-5.5V (rev 03)
  gpio:
    min: 3.4V
    min_notes: VIH 3.4V in rev 01; rev 03 gives 0.7×VDD
    max: 5V
  channel_current: 12mA
  channel_current_notes: The rev 03 part-number key reads "68 series IC, 12mA current version"
  quiescent_current: 1mA
  wattage: 200mW
physical:
  packages:
    - '5050'
  pin_count: 4
