name: SK6812WWA
status: active
release_year: 2015
creator: Opsco/Newstar
vendors:
  - name: Newstar LED
    page: http://newstar-ledstrip.com/productshow751.html
notes: >-
  SK6812 with three white dies in place of RGB, for tunable-white (variable CCT) strips: cool
  white (6000-7000K), warm white (2700-3000K) and amber (1800-2000K). Same single-wire protocol
  and 24-bit frames as the RGB SK6812.
aliases:
  - SK6812 WWA
  - LC8812WWA
  - HD8812WWA
color:
  channel_bits: 8
  pwm_frequency: 1.2kHz
  pwm_frequency_notes: 1.2kHz in datasheet rev 01 (2015) and rev 03 (2019); 4kHz in the SKC6812WWA (2021) revision
data:
  type: WS2811/12
  clocked: false
  bitrate: 800kHz
  pixel_size_bits: 24
  backup_line: false
datasheet:
  url: https://cdn-shop.adafruit.com/product-files/6509/P6509+SK6812WWA+LED+datasheet.pdf
  sources:
