  source: https://www.ti.com/product/SN74HCT244
  quote: Eight-channel 4.5-V to 5.5-V buffers with TTL-compatible CMOS inputs and tri-state outputs
  retrieved: '2026-11-18'
  notes: >-
    "PDIP largest" is a stray package note, not an interface; TI ships all six 20-pin packages (PDIP, SOIC, SSOP, SOP,
    TSSOP, VSSOP), already listed in `aliases`. If a value is wanted, the field's examples
    (level-converters/_example.yaml: "74AHCT125", "Bi-directional MOSFET", "RS-485 differential") suggest something like
    "3-state buffer". Structural: sn74ahct125n ("Through-Hole DIP") and sn74lv1t34dbvrg4 ("SOT 23") also keep a package
    in io.interface, because the level-converter schema has no package field (pixel ICs use common.json ic_package).

