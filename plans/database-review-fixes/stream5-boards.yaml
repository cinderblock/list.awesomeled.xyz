- entry: controllers/led-player-m
  field: outputs.pixels.max_per_output
  current: 2048
  value: 256
  status: apply
  owner: stream2
  source: https://www.diamex-shop.de/mediafiles/LG/LED-Player-M_Anleitung.pdf
  quote: 'Maximale Kapazität: 256 LEDs pro Kanal, gesamt 2048 LEDs'
  retrieved: '2026-11-18'
  notes: >-
    2048 is the device total: a77491b set it while the entry still had 1 output, and the later move to 8 outputs left
    it, implying 8 x 2048. Diamex's current manual (12/21 edition, the entry's datasheet.url) also says "Die maximale
    Anzahl der angeschlossenen LEDs pro Kanal sollte 256 nicht überschreiten" (connection section; its V1.5 firmware
    history repeats the 256 limit for WS2812-type LEDs). Clocked (dual-wire) LEDs use one channel only (DATA on CH4,
    CLOCK on CH8) for up to 2048. The older V1.0 manual (ELV copy in datasheet.sources) said 1024 per channel, and
    controllers-b.md read 512 on the archived shop page (not re-read). Suggested comment: "# single-wire, per channel;
    one clocked channel takes up to 2048".

