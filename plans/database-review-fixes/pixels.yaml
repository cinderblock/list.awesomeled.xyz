- entry: pixels/lc2823-2020
  field: name
  current: LC2823-2020
  value: LC8823-2020
  status: apply
  owner: stream2
  source: https://www.szledcolor.com/Public/editor/attached/file/20191030/LC8823%202020.pdf
  quote: 'LC8823-2020'
  retrieved: '2026-11-18'
  notes: >-
    The entry's own datasheet.url is this "LC8823-2020" spec from Shenzhen LED Color (it was
    restored from the Google Sheet's hyperlink in d26e73c). Every value in the entry matches it:
    "Outline (L* W*H): 2.0*2.0*0.75mm", "6 Pins type led", "LED voltage Vled 3-7.5 V", "The max led
    output Current IOMAX 18 mA", "The maximum frequency of 27KHZ". The datasheet never says "LC2823".
    A web search for "LC2823" finds only LC8823 documents, and the report found none on the maker's
    site, LCSC/JLC or AliExpress. So the name is a typo. The report's guess, LC8822, is wrong:
    Led-Color's "6Pin LC8822 2020 LED" page
    (https://www.addressable-led.com/Products/LC8822-2020-LED.html) claims only "256 gray level" and
    no 27 kHz, while 27 kHz with 8+5 bits is the LC8823 spec. Structural follow-up
    for stream 2: either rename the file/slug to lc8823-2020, or merge it into pixels/lc8823 as that
    part's 2020 package. Same maker and IC; the 5050 sheet says 17 mA / 85 mW against 18 mA / 90 mW
    here. Nothing in the repo references the lc2823-2020 slug.

