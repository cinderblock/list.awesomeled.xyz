- entry: pixel-ics/ws2814
  field: physical.packages
  current:
    - SOP-12
  value:
    - SOP-12
    - SOP-8
    - SOP-10
    - FSOP-8
  status: apply
  owner: stream2
  source: https://www.world-semi.com/downloads/datasheets/en/ws2814b-1.3.pdf
  quote: 'SOP10 package'
  retrieved: '2026-11-18'
  notes: >-
    These are the packages of the whole family. The entry's price, status and technical notes
    already cover the variants, and the schema asks for every package the IC is offered in.
    SOP-12 is the original dual-input WS2814 (the entry's datasheet, V1.4 2022); WorldSemi no longer
    lists it, and LCSC C965562 is gone. WorldSemi's catalog now lists the WS2814A, WS2814B and
    WS2814F ("4-Channel RGBW"). WS2814A V2.1 has "SOP8 Packaging"; its history shows V1.4
    (2023-03-28) "Add FSOP8 Package", and in V1.5 (2023-04-22) the FSOP8 spec was split off (that's
    the WS2814F). WS2814B V1.3 has "SOP10 package"; it was new on 2023-07-18 and adds a BIN backup
    input. For the WS2814F, LCSC C5446694 (our price) and WorldSemi's own image name
    (ws2814f-fsop8.webp) say FSOP-8, but the V2.1 datasheet (2026-07-14) labels its drawing
    "SOT23-8 package" (2.85 x 3.25 mm, 8 leads). FSOP-8 is kept here, following LCSC; use SOT-23-8
    instead if the datasheet's name should win. WS2814C (SOP-8, in technical_notes) is not on
    WorldSemi's site. Sources: .../en/ws2814a-2.1.pdf and .../en/ws2814f-2.1.pdf. These are
    image-only PDFs, read by OCR, and the SOT23-8 label was checked by eye.

