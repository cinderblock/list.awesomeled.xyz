- entry: pixels/ws2816
  field: related
  value:
    - type: related
      name: WS2916B
      url: https://www.world-semi.com/downloads/datasheets/en/ws2916b-v1.pdf
      notes: WorldSemi's "new generation" 16-bit 5050 LED, listed in place of the WS2816
    - type: related
      name: WS2916A
      url: https://www.world-semi.com/downloads/datasheets/en/ws2916a-2.1.pdf
  status: other-owner
  owner: stream4
  source: https://www.world-semi.com/downloads/datasheets/en/ws2916b-v1.pdf
  quote: 'WS2916B is the new generation of digital LED from WORLDSEMI'
  retrieved: '2026-11-18'
  notes: >-
    Confirmed: WorldSemi's RGBIC catalog (https://www.world-semi.com/products-rgbic-led.html) lists
    only the WS2812, WS2813, WS2815 and WS2916 series ("High-grayscale RGB and RGBW digital LED
    family"). WS2816 appears nowhere, and the site's datasheet index (datasheet-availability.js) has
    no ws2816 key. The WS2916A/B product images are /assets/products/ws2816-family/ws2816a-...webp
    and ws2816b-...webp, and app.js has "const isWs2816ThreePackageFamily = item.model ===
    'WS2916A';". The WS2916A/B
    datasheets are V1.0, marked "New" on 2026-08-22, and never mention WS2816. They do match it:
    5050, 16-bit, 10 kHz refresh, dual-signal by-pass, 48-bit frames. A has "32 levels of current
    gain", B has "an internal 4-bit gamma check". So the WS2916 is a successor and possibly a rename,
    but WorldSemi doesn't say so. Use type replacement only if stream 6 marks WS2816 discontinued.
    These datasheets are image-only; they were read by OCR (copies in fixes/dl/pixels/).

