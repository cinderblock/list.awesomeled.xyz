# Pattern-driver kinds (database review, 2026-11-22): what each entry is for,
# from its maker's pages. `doubt` marks a judgment call or a weak source;
# the entries carry kind + sources.kind. dmx-core was kept as player + sequencer
# (docs.dmxcore.com: "build scenes, effects, and sequences"; Timelines).

allpixmatrix:
  kind: [live]
  url: https://github.com/NLED/allpixmatrix
  retrieved: '2026-11-22'
  notes: '"A Processing based video creation and mixing application for low resolution LED screens and matrices"; output streamed to serial/Art-Net'

arkaos:
  kind: [live]
  url: https://web.archive.org/web/20250906170847/https://arkaos.com/
  retrieved: '2026-11-22'
