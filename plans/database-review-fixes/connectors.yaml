# Fix list: connectors, plus 1 commercial system and 4 diffusive materials.
# Brief: scratchpad/fixes/BRIEF.md. Verified 2026-11-18 with WebFetch / WebSearch only; repo untouched.
#
# Order:
#   1. plans/data-freshness/findings/connectors.md, "(d) Wrong facts for other workstreams".
#   2. ISSUES.md, "## Connector and diffuser spec corrections (stream 2 or 6)": every bullet,
#      in order; bullets already covered by section 1 are a comment pointing up.
# Records whose notes start "Unreported:" were in neither report: they are wrong (or missing)
# values stated by the same maker source while verifying a reported item.
# `value` is always what the field should hold now. For already-fixed / reject / unverifiable
# records it equals `current` (no change), and the notes say what the report proposed.
#
# Grammar used (database/_schema/connector.json + common.json, after commit 795a04f):
#   - ratings.max_current: one value ('3A'), no ranges. A family gets its maximum, and the
#     variants go in ratings.max_current_notes (a separate record when that field changes).
#   - ratings.max_voltage: one value ('300V') or a 'min-max' range ('80-150V'); no AC/DC suffix
#     and no max_voltage_notes field. app/lib/designer/catalog.ts nominalVoltage() uses a
#     range's max, so a range of variant ratings still works there.
#   - mechanical.pitch: length grammar ('2mm', or a range '4.14-6.35mm').
#   - termination gauges: integer AWG; smallest_gauge = thinnest (larger number). null = remove key.
#   - mechanical.rows: a single integer >= 1 (no ranges, no lists).
# Two entries carry YAML comments on max_current (mt30-60, xt60-90) that state the old
# ratings; the records below say to drop them.
# PDFs fetched for this list: scratchpad/fixes/dl/connectors/ and dl/diffusers/ (text
# extracted with pdftotext; image-only catalogs rendered to PNG and read).

# ---------------------------------------------------------------------------
