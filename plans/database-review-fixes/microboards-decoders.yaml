# ---------------------------------------------------------------- microboards: creators

- entry: microboards/esp-32s
  field: creator.name
  current: NodeMCU
  value: Ai-Thinker
  status: apply
  owner: stream2
  source: https://web.archive.org/web/20210729143054/https://docs.ai-thinker.com/en/esp32-s_development_board
  quote: The Nodemcu-32s module is developed by Ai-Thinker Technology.
  retrieved: '2026-11-18'
  notes: >-
    The entry describes the NodeMCU-32S dev board (usb 'Power + UART', dev-board street prices), which is
    built on Ai-Thinker's ESP-32S module. Ai-Thinker makes both, so the creator is Ai-Thinker either way.
    A second archived Ai-Thinker page (2021-12-09,
    https://web.archive.org/web/20211209010040/https://docs.ai-thinker.com/en/esp32/boards/nodemcu_32s) reads
    "NodeMCU-32S is a core development board designed by Essence based on the ESP32-32S module". "Essence"
    is a machine translation of 安信可 (Ai-Thinker). The ESP32S datasheet page (archived 2024-06-21) is
    published by "Shenzhen Anxinke Technology Co., Ltd.", which is Ai-Thinker's legal name. "NodeMCU" is
    only the board's name prefix.
    Knock-on change for stream4: the pattern-drivers/wled.yaml related note (ref microboards/esp-32s) says
    "(creator NodeMCU)". An alias 'NodeMCU-32S' on this entry would match the name WLED uses.

- entry: microboards/esp-32s
  field: creator.page
  current: https://www.espressif.com/en/products/socs/esp32
  value: https://docs.ai-thinker.com/en/esp32-s_development_board
  status: other-owner
  owner: stream6
  source: https://web.archive.org/web/20210729143054/https://docs.ai-thinker.com/en/esp32-s_development_board
  quote: Nodemcu-32s Development Board
  retrieved: '2026-11-18'
  notes: >-
    Once the creator is Ai-Thinker, Espressif's SoC page no longer fits as creator.page (it could move to
    other_links). Ai-Thinker's live docs have dropped the classic ESP32: /en/esp32 renders an empty page,
    and the URL above now returns the docs home page (a soft 404). Either use the original URL plus a
    dead_links item with the archive above, or set a creator name with no page.

