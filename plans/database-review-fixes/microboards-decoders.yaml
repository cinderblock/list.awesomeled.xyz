# ---------------------------------------------------------------- microboards: attiny85

- entry: microboards/attiny85
  field: notes
  value: Bare 8-pin AVR microcontroller (8-pin PDIP or SOIC, 20-pad QFN/MLF), not a development board.
  status: apply
  owner: stream2
  source: https://ww1.microchip.com/downloads/en/devicedoc/atmel-2586-avr-8-bit-microcontroller-attiny25-attiny45-attiny85_datasheet.pdf
  quote: 8-pin PDIP, 8-pin SOIC, 20-pad QFN/MLF, and 8-pin TSSOP (only ATtiny45/V)
  retrieved: '2026-11-18'
  notes: >-
    The report is right that this is a bare chip, and the right fix is structural. No field can say "not a
    board". database/microboards/description.md defines the category as "Microcontroller development
    boards", and there is no category for bare MCUs. The entry does fit the schema (title "DIY MicroBoard")
    and its fields are correct. This notes line is the minimum change. Moving or dropping the entry is a
    scope decision for stream2. (TSSOP is ATtiny45 only, hence its absence from the value.)

- entry: microboards/attiny85
  field: creator.name
  current: Atmel
  status: reject
  owner: stream2
  source: https://ww1.microchip.com/downloads/en/devicedoc/atmel-2586-avr-8-bit-microcontroller-attiny25-attiny45-attiny85_datasheet.pdf
  quote: © 2013 Atmel Corporation. All rights reserved.
  retrieved: '2026-11-18'
  notes: >-
    CLAUDE.md defines `creator` as the original designer/developer, and Atmel designed the part (datasheet
    title "Atmel 8-bit AVR Microcontroller with 2/4/8K Bytes In-System Programmable Flash"). Keep Atmel and
    record today's maker in `manufacturers` (next record). Harmonize with level-converters/tc4427, which has
    creator Microchip, if the two should follow the same rule.

- entry: microboards/attiny85
