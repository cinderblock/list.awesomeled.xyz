# ---------------------------------------------------------------- pixel-decoders: led-strip-driver-module

- entry: pixel-decoders/led-strip-driver-module
  field: notes
  current: WS2811 to high-current MOSFET outputs.
  value: P9813 (clocked CIN/DIN input) to three high-current MOSFET outputs for a 12V RGB strip; cascadable.
  status: apply
  owner: stream2
  source: https://www.diymore.cc/products/full-color-rgb-led-strip-driver-module-shield-for-arduino-stm32-avr-v1-0
  quote: Based on a P9813; Can be cascaded all lights of the drive module
  retrieved: '2026-11-18'
  notes: >-
    Report confirmed. The AliExpress item itself is captcha-blocked. A 2025-01-31 capture
    (https://web.archive.org/web/20250131114801/https://www.aliexpress.com/item/32786272573.html?gatewayAdapt=4itemAdapt)
    gives og:title "For Arduino R3 For MCU System LED Strip Driver Module v1.0 For Arduino STM32 AVR 12V DC 5V
    MCU Full Color RGB Board One", plus the listing photos. The photos show the chip marked "P9813", an input
    header labelled "GND VCC DIN CIN", and the silkscreen "LED Strip Driver" / "www.diymore.cc". The diymore store
    sells the same board with the same photos, and its text (read from the store's product JSON) also has
    "External power supply is 12VDC". Bot'n Roll sells it too
    (https://www.botnroll.com/en/controllers/4256-rgb-led-strip-driver-module-shield-for-arduino-stm32.html):
    "RGB LED Ribbon Controller P9813 is a small board capable of controlling 5 meter RGB LED ribbon using
    only two digital pins." outputs (3 × pwm, screw terminal) are correct.

