- entry: drive-libraries/branchcontroller2
  field: features
  current: Teensy 3.2 branch controller for up to 8 separate LED strips, based on instructions received over TCP-IP.
  status: reject
  owner: stream2
  source: https://github.com/jspolsky/branchController2
  quote: 'We use TCP and not UDP for Open Pixel Control.'
  retrieved: '2026-11-18'
  notes: >-
    The report went by the GitHub About blurb ("...based on instructions
    received over UDP."), but the README is explicit: "Ethernet control.
    Connects to an ethernet network to receive pixel data over TCP/IP.", it
    listens "for TCP connections on port 7890", and "The w5500 ethernet chip
    used in this design has a tiny buffer and will lose UDP packets if they
    are sent too fast." The YAML (and its sources.protocols, TCP port 7890)
    is right; the About text is stale.

