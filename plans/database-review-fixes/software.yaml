- entry: drive-libraries/artnet-to-tmp2-convertor
  field: name
  current: ArtNet to TMP2 Convertor
  value: Artnet to TPM2 Converter + Editor
  status: apply
  owner: stream2
  source: https://live-leds.de/features/
  quote: 'supporting Art-Net, sACN (E1.31), tpm2.net, tpm2, Glediator protocol and MiniDMX'
  retrieved: '2026-11-18'
  notes: >-
    The format is TPM2 (tpm2), not TMP2. The maker's page
    (http://www.tlhome.de/ATCE.htm) can't be fetched with WebFetch (the
    forced HTTPS upgrade fails with a TLS error), so the product's own
    spelling comes from this entry's sources.aliases (retrieved 2026-11-18,
    "page heading": "Artnet to TPM2 Converter + Editor") and the report
    ("ATCE Artnet to TPM2 Converter + Editor"). Using the maker's name makes
    that alias a duplicate (stream4: drop it, keep "ATCE"). Minimal
    alternative: "ArtNet to TPM2 Converter". Also odd but unchecked:
    creator "ATCE" is the product's own acronym, not a maker.

