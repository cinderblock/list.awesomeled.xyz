# Fix list: software slice (database/pattern-drivers, database/drive-libraries)
#
# Covers the "(d) Wrong facts for other workstreams" list in
# plans/data-freshness/findings/software.md (in that order), then the inline
# wrong/outdated remarks in software-notes.md that (d) doesn't already cover,
# then one extra finding made while verifying (flagged in its notes).
#
# Checked against the repo at d20cf8f (ws/database-review). Many items were
# already fixed by b3e5fea ("corrections found while verifying links"),
# d609eda and 66342a4.
#
# Conventions in this file:
# - `value` is omitted when nothing should change (already-fixed, reject,
#   unverifiable, or a structural issue the schema can't express).
# - Array elements are addressed as `pricing.tiers[0]...`; the notes name the tier.
# - web.archive.org and http-only hosts (tlhome.de) can't be fetched with
#   WebFetch (it forces HTTPS); where that mattered the notes say so.

