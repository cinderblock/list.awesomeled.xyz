- entry: pixels/ws2816
  field: color.brightness_control
  current: { bits: 5, scope: per_channel }
  value:
    {
      bits: 5,
      method: current,
      scope: per_channel,
      notes: 'WS2816A only: 5-bit current gain on each RGB channel. WS2816B and WS2816C have none (16-bit grayscale with 4-bit gamma correction).',
    }
  status: apply
  owner: stream2
  source: https://datasheet.lcsc.com/datasheet/pdf/6bd8afedb2468ec953fc8ec232561b98.pdf
  quote: 'RGB通道各具有5bit电流增益功能'
  retrieved: '2026-11-18'
  notes: >-
    The report is half right. WorldSemi's WS2816A-2121-V1-B datasheet (via LCSC C42417609) says "RGB
    channels each have a 5-bit current-gain function", on top of "每个通道高达16bit灰度数据，以及内部4bit
    gamma校验". The WS2816B datasheets (the entry's datasheet.url and its 2020 source) have no such
    control: "each channel with 16bit gray scale,4bit gamma correction inside ,can achieve 20bit display
    effect". So the 5 bits belong to the A variant only, and they scale current (method: current).
    Field path is the new grammar (5584f26); before it, this was brightness_bits / brightness_method /
    brightness_method_notes. The entry's notes ("per-channel brightness control") are true for A only.

- entry: pixels/ws2816
  field: technical_notes.1
  current: Independent 5-bit brightness control for each R, G, B channel
  value: 'WS2816A only: independent 5-bit current gain for each R, G, B channel'
  status: apply
  owner: stream2
  source: https://datasheet.lcsc.com/datasheet/pdf/6bd8afedb2468ec953fc8ec232561b98.pdf
  quote: 'RGB通道各具有5bit电流增益功能'
  retrieved: '2026-11-18'
  notes: See color.brightness_control above.

- entry: pixels/ws2816
  field: variants.0.differences
  current: 4-bit per-colour current control instead of gamma correction
  value: 5-bit current gain on each RGB channel (keeps the 4-bit gamma correction)
  status: apply
  owner: stream2
  source: https://datasheet.lcsc.com/datasheet/pdf/6bd8afedb2468ec953fc8ec232561b98.pdf
  quote: '每个通道高达16bit灰度数据，以及内部4bit gamma校验'
  retrieved: '2026-11-18'
  notes: Extra. The WS2816A datasheet has both the 4-bit gamma and the 5-bit current gain ("RGB通道各具有5bit电流增益功能"); the "4-bit ... instead of gamma" wording came from Advatek, not WorldSemi.

