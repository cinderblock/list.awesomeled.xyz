- entry: pixel-ics/sm16511
  field: data.channels
  current: 4
  value: 3
  status: apply
  owner: stream2
  source: https://www.chinaasic.com/chipDetails/detail_141.html
  quote: 'SM16511BK是并联应用单线三通道LED驱动控制芯片，兼容并拓展DMX512(1990)数据协议'
  retrieved: '2026-11-18'
  notes: >-
    Sunmoon's own page ("single-wire three-channel LED driver for parallel use, compatible with and
    extending DMX512(1990)"); SM16511BK is the only SM16511 part the maker lists. The 4 channels came
    from third parties: Advatek lists it under "RGBW", ENTTEC marks RGB and RGBW and "SOP10/16". Advatek
    uses the same "can come in a SOP8/SOP10/SOP14 package, depending on which functions" boilerplate on
    other chips (e.g. QED3001), so its package claims look templated. If an older 4-channel SM16511
    existed, no maker document survives.

