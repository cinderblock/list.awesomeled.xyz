- entry: controllers/an6usp10
  field: outputs.pixels.max_per_output
  current: 170
  value: 340
  status: apply
  owner: stream2
  source: https://www.electrondigit.com/products/art-net-controllers/product/download/file_id-30
  quote: There are two universes available per port.
  retrieved: '2026-11-18'
  notes: >-
    Maker's manual "AN6USPI0 BLUE firmware (6/12 4.0.00)": 2 universes (1020 channels) per port
    with Art-Net and sACN unicast, 1 universe (512 channels) with sACN multicast. The maker's
    page (already this entry's source) is titled "AN6USPI0 BLUE, Art-Net/sACN to 12U 6 port" and
    says "6120 channels per controller (2040 RGB or 1530 RGBW LEDs)". 1020 / 3 = 340 RGB per
    port, 6 x 340 = 2040. Suggested comment: `# 1020 channels (2 universes) per port; 170 with
    sACN multicast; 2040 total`. The 6 x 170 figure matches the older 6-universe listing
    (2021 eBay capture). Optional technical note: "12 universes (2 per port), 6,120 channels".

- entry: controllers/brightly
  field: status
  current: discontinued
  value: discontinued
  status: other-owner
  owner: stream6
  source: https://www.kicktraq.com/projects/glowbrightly/brightly-interactive-light-toolkit-for-creatives/
  quote: Funding Successful
  retrieved: '2026-11-18'
  notes: >-
    The report's "never launched" is only half right. The Kickstarter
    (https://www.kickstarter.com/projects/glowbrightly/brightly-interactive-light-toolkit-for-creatives,
    linked from Make's 2021-04-01 crowdfunding roundup) was funded: Kicktraq shows
    "Funded: $45,322 of $30,000", 90 backers, Mar 30 -> Apr 30 (2021). Whether rewards shipped
    is unverified (Kickstarter answers 403 to scripts). glowbrightly.io never got past a
    sign-up page ("Join for exclusive updates ... get early access" in the 2025-02-10 capture)
    and the domain is gone. The status enum has no "never shipped"; I'd keep `discontinued`
    and let stream2 add to notes: "Crowdfunded on Kickstarter in April 2021 (90 backers); never
    sold at retail; whether rewards shipped is unknown."

