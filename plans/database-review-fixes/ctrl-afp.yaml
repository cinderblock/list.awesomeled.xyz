- entry: controllers/digiled-strip-dmx-wav-sd-micro-player
  field: outputs.pixels.max_per_output
  current: 850
  value: 1360
  status: apply
  owner: stream2
  source: https://www.boutique-electroconcept.com/micro-sd-player-digiled-strip-ou-dmx-512.html
  quote: 512 en DMX , 4080 en WS2812
  retrieved: '2026-11-18'
  notes: >-
    The quote is the "Canaux DMX" row of the page's spec table; the "Univers" row reads
    "1 en DMX , 8 en WS2812". 4080 WS2812 channels / 3 = 1360 RGB pixels (8 universes x 170)
    on the single output. Suggested comment: `# 4080 WS2812 channels (8 universes x 170 RGB)`.
    850 matches the DMX-to-LED-Strip board's pattern-repeat figure and was probably copied
    from it. The manual (Productattachments m/i/micro_player_sd.pdf) gives no pixel count.

