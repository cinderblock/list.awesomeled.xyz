# Fix list: "(d) Wrong facts for other workstreams" in
#   plans/data-freshness/findings/ctrl-a.md, ctrl-f.md, ctrl-p.md
# YAML read 2026-11-18 at ws/database-review d20cf8f. Records follow the report order.
#
# Conventions used here:
# - `technical_notes[n]` is a 0-based index into the array as it stands now.
# - `value: null` means remove the field (or array item).
# - Suggested YAML comments for a value are given in `notes` (a value can't carry one).
# - Already-fixed records cite the source the entry itself now records; where I
#   re-read the maker's page myself the record also has a `quote`.
# - Records marked "EXTRA" are not in the (d) lists: wrong facts found while
#   verifying the listed ones, on the same entries.
# - Wayback pages were read with curl (WebFetch can't reach web.archive.org);
#   downloads are in fixes\dl\ctrl-afp\.

