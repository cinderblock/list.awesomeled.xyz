# 2. microboards/nodemcu-v2

- entry: microboards/nodemcu-v2
  field: io.max_outputs
  current: 2
  value: 3
  status: apply
  owner: stream2
  source: https://github.com/wled/WLED-Docs/blob/main/docs/features/multi-strip.md
  quote: 'There is a maximum of 3 strips supported.'
  retrieved: '2026-11-20'
  notes: >-
    The schema defines io.max_outputs as "Usable data outputs for pixels". The entries mix two readings
    (GPIO counts on arduino-mega-2560-rev3 54, beaglebone-black 48, attiny85 6; firmware-driven outputs
    on the ESP and Teensy boards), and the ESP boards all count WLED's outputs: classic ESP32 8, ESP32-S3
    4, and the other ESP8266 boards wemos-d1-mini and wemos-d1-mini-pro already have 3 from this same
    page. WLED's ESP8266 section: GPIO1 (TX) and GPIO2 (D4) "allow for hardware driving"; "GPIO3 (RX) is
    the third pin that allows hardware driving on ESP8266. However, it uses 5 times as much memory per LED
    as GPIO 1 and 2, so use it only for low LED counts (recommended <50)". The NodeMCU DEVKIT V1.0 pin map
    (github.com/nodemcu/nodemcu-devkit-v1.0, Documents/NODEMCU_DEVKIT_V1.0_PINMAP.png, read from the
    image) breaks all three out: D4 = GPIO2 (TXD1), D9 = GPIO3 (RXD0), D10 = GPIO1 (TXD0). WLED's
    compatible-controllers page lists "NodeMCU" as an ESP8266 board. The old comment ("UART1/DMA +
    bit-bang", commit dfc99134, "ESP8266 1-2") has no source. Use wemos-d1-mini's comment
    ("# WLED on ESP8266: GPIO1 + GPIO2 hardware-driven, GPIO3 for low LED counts") and add
    sources.io.max_outputs.

# 3. Makers: pixel-ics/p9883 (Power MOS) and pixel-ics/p9813 (DMS)

- entry: pixel-ics/p9883
  field: creator
  current: Power MOS Microelectronics
  value: Power MOS Microelectronics
  status: reject
  owner: stream2
  source: https://www.advateklighting.com/pixel-protocols/p9813
  quote: 'This pixel protocol was designed by Power MOS Microelectronics (formerly DMS Microelectronics) in China.'
  retrieved: '2026-11-20'
  notes: >-
    One company, by Advatek's account: the sentence above is on its P9813 page and, word for word, on its
    P9883 page (also P943 and P9412), each with "Note: Advatek Lighting is in no way affiliated with Power
    MOS Microelectronics or DMS Microelectronics." That is the only source naming both. The maker itself
    has no findable site under either name, and every maker document found uses the old name: the P9813
    datasheet's header on every page is "DMS MICROELECTRONICS LTD.," (Electrokit copy, also Seeed), and
    the D705 datasheet says the same. No P9883 datasheet is online, and ENTTEC's P9883 page says "The
    manufacturer is not firmly established." So no rename in either direction: d705 and p9813 keep the
    name their datasheets print; p9883, p943 and p9412 keep the name Advatek gives. To put all five under
    one "More from" row, add a maker alias in app/lib/relations.ts MAKER_ALIASES (e.g.
    dmsmicroelectronics -> powermosmicroelectronics) with a MAKER_LABELS label such as "Power MOS
    Microelectronics (formerly DMS)", citing this Advatek page. That's a code change, not a YAML one.

