# 5. controllers/digidot-c4-extended-8

- entry: controllers/digidot-c4-extended-8
  field: outputs.pixels.max_per_output
  current: 1024
  value: 1365
  status: apply
  owner: stream2
  source: https://www.digidot.eu/shop/digidot-c4-extended-127/document/270
  quote: 'The output capacity goes up to 8 universes, which is 4096 channels (depending on the C4 license).'
  retrieved: '2026-11-20'
  notes: >-
    DiGidot states capacity in channels, never pixels. The C4 Extended (8) licence (SKU 20204; the 2020
    spec sheet lists "extended 4 20204" with output channels "512 / 1048 / 2048 / 4096") is 4096
    channels = 1365 RGB 8-bit pixels (4096 / 3; 1360 if mapped at 170 per universe). No per-port cap
    lies below that: the Performance Guide v3.0.1-2 (https://www.digidot.eu/web/content/111291) says
    "The only limits the controllers has are; The total amount of channels you can control (this is
    determined by the device license) and the physical port limit of 8 universes", its tables run to 8
    universes on one port, and the C4 manual v2.3.0 (document/271) says "Physical port limit: 4096
    channels." So one port can carry the whole licence. DiGidot's practical advice is lower: "Average
    recommendation is max. 3 SPI universes per port" for 4 data-only outputs (512 RGB pixels) and "max. 6
    SPI universes per port" for 2 data + clock pairs. Suggested comment: "# 8-universe licence (4096
    channels) / 3; DiGidot recommends <= 3 universes (512 px) per data-only port". The old comment ("4096
    total channels across 4 ports") divided the channels evenly and called them pixels. The creator,
    DiGidot, is right (spec sheet footer "DiGidot Technologies B.V. 2020"); Dmx4All isn't involved.

- entry: controllers/digidot-c4-extended-8
  field: outputs.pixels.max_total
  value: 1365
  status: apply
  owner: stream2
  source: https://www.digidot.eu/shop/digidot-c4-extended-127/document/270
  quote: 'Up to 8 universes (4.096 channels)'
  retrieved: '2026-11-20'
  notes: >-
    Needed because count x max_per_output (4 x 1365) exceeds the licence. 4096 channels / 3 = 1365 RGB
    (1024 RGBW, 682 RGB at 16 bits). The manual: "The DiGidot C4 is always limited to the total amount of
    output channels corresponding to the license."

- entry: controllers/digidot-c4-extended-8
  field: power.voltage.min
  value: 5
  status: apply
  owner: stream2
  source: https://www.digidot.eu/shop/digidot-c4-extended-127/document/270
  quote: 'Wide voltage range (5-24 Vdc)'
  retrieved: '2026-11-20'
  notes: >-
    Extra: the entry has max 24 but no min. The C4 manual v2.3.0 (document/271) also gives "Input
    Voltage: 5-24 Vdc".

