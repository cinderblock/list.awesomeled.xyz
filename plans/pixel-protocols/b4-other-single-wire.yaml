        select: 'The chip measures the baud rate from a sync frame sent after power-up and after each reset frame.'
        T0H: null
        T0L: null
        T1H: null
        T1L: null
        period:
          {
            ns: null,
            min_ns: 500,
            max_ns: 10000,
            printed: '较宽的数据传送速率范围：100KHz～2MHz (V2.0 p2); 数据时钟频率 FDCLK 0.1～2 MHz (V2.0 p3)',
          }
        reset: null
        coding: 'Manchester: a high-to-low transition is "1", low-to-high is "0" (V2.0 p6 a). ESPixelStick: RmtOneBit = {half bit high, half bit low}, RmtZeroBit = {half low, half high}.'
        doc: tls3001-v2.0-cn
        page: 6
        quote: '数据通讯协议 送给SDI 脚的输入信号必须遵循下列定义： a. 有效输入数据必须为曼彻斯特编码，信号从高到低跳变表示"1"，从低到高跳变表示"0" … f. 数据先发送MSB(最高位) g. SDI 输入脚在空闲状态时，必须保持低电平 h. 同一帧数据发送过程中，必须连续发送，中间不能有中断，发送频率也不能改变。'
        translation: 'Data protocol. The input to SDI must follow: a. valid data must be Manchester-coded; a high-to-low transition means "1", low-to-high means "0" … f. MSB first. g. SDI must be held low when idle. h. Within one frame data must be sent continuously, without interruption, and the frequency must not change.'
        other_quotes:
          - {
              page: 16,
              quote: '输入数据的时钟频率须在100KHz～2MHz之间，为了信号能够传输更多的节点，建议数据的发送频率在1M以内 | SDI信号输入引脚的电压最大不能超过3.5V | SDO输出信号高电平为3.3V',
              translation: 'Input data clock must be 100 kHz–2 MHz; to reach more nodes, send below 1 MHz | SDI input must not exceed 3.5 V | SDO high level is 3.3 V',
            }
          - {
              doc: tls3001-v2.2-en,
              page: 2,
              quote: 'Manchester communication interface | 8 bit color depth PWM control | 100KHz~1MHz clock frequency',
            }
          - {
              doc: espixelstick-7f0d0e9,
              quote: '#define TLS3001_PIXEL_DATA_RATE 1000000.0 // bits /sec | const rmt_item32_t RmtOneBit = {TLS3001_PIXEL_RMT_TICKS_BIT / 2, 1, TLS3001_PIXEL_RMT_TICKS_BIT / 2, 0}; const rmt_item32_t RmtZeroBit = {TLS3001_PIXEL_RMT_TICKS_BIT / 2, 0, TLS3001_PIXEL_RMT_TICKS_BIT / 2, 1};',
            }
    clock: null
    frame:
      bits_per_channel: 12
      channels: 3
      wire_order: 'Data frame header, then chip 1 (the first to receive) … chip n; per chip 0 + OUT1[11:0] + 0 + OUT2[11:0] + 0 + OUT3[11:0]'
      pixel_bits: 39
      extra: 'Every frame starts with 15 ones and a 4-bit code. Sync 15''b1…1 + 4''b0001 + 11''b0, then wait > (chips ÷ baud in MHz) × 30 µs. Reset 15''b1…1 + 4''b0100, then wait 1 ms and resend sync. Data 15''b1…1 + 4''b0010 + 39 bits per chip. A reset + sync is to be repeated "after several frames" (p6 c; p8 suggests about every 3 s) to clear accumulated error.'
      start: 'data header 15 × 1 + 0010'
      end: null
      latch: 'Not stated in V2.0. Implementations differ: TimGremalm appends another 19-bit start-of-data header after the pixel data "For applying the data"; ESPixelStick sends nothing after the data and starts the next frame with a header.'
      doc: tls3001-v2.0-cn
      page: 6
      quote: 'b. 在芯片上电后必须先发一次同步帧，以便芯片检测通讯的波特率。同步帧的格式为：15’b111111111111111+4’b0001+11’b00000000000，在发送同步帧后必须延时一段时间再发送数据帧，这样做是为了每个芯片都能准确检测到通讯的波特率，延时时间（us）大于：连接芯片数÷通讯波率(MHz)×30 c. 在发送若干帧数据后，重新发送一次复位帧，等待1ms 之后，再发送一次同步帧，以便芯片消除积累误差，复位帧格式为：15’b111111111111111+4’b0100 d. 数据帧格式为：15’b111111111111111+4’b0010（数据头）+ 第一个芯片39bit 数据 + 第二个芯片39bit 数据 + …… + 第n 个芯片39bit 数据 e. 第一个芯片为最先接收数据的芯片，芯片的数据格式为：1’ b0(标识位) + 12’ bxxxxxxxxxxxx（输出端口1 数据） + 1’ b0(标识位) + 12’ bxxxxxxxxxxxx（输出端口2 数据） + 1’ b0(标识位) + 12’ bxxxxxxxxxxxx（输出端口3 数据），x 为1 或则0'
      translation: 'b. After power-up a sync frame must be sent first so the chip can detect the baud rate: 15 ones + 0001 + 11 zeros. After it, wait before sending data frames so every chip detects the rate: delay (µs) > number of chips ÷ baud rate (MHz) × 30. c. After a number of data frames, send a reset frame, wait 1 ms, then send a sync frame again to clear accumulated error; reset frame = 15 ones + 0100. d. Data frame = 15 ones + 0010 (header) + 39 bits for chip 1 + 39 bits for chip 2 + … + chip n. e. Chip 1 is the chip that receives data first; per chip: 0 (flag) + 12 bits port 1 + 0 (flag) + 12 bits port 2 + 0 (flag) + 12 bits port 3.'
      other_quotes:
        - {
            page: 7,
            quote: '基本时序 [figure: SDI 15个1 → 0:1:0:0, 1ms, 15个1 → 0:0:0:1, 11个0 "同步帧+复位帧"; SDI 15个1 → 0:0:1:0, 第一点39bit数据, 第二点39bit数据, 第三点39bit数据 … 第N点39bit数据 "数据帧"]',
          }
        - {
            doc: timgremalm-de66447,
            quote: '7. Start of data (19 bits, 15 x 0b1, 2 x 0b0, 1 x 0b1 & 1 x 0b0). For applying the data. 8. 0.125ms delay between end of last data and start or reset',
          }
    forwarding:
      text: 'Not described beyond "the first chip is the chip that receives data first" and its own 39-bit slot; the V2.2 English sheet only says SDO goes "to the receiver-end SDI of next driver IC".'
      doc: tls3001-v2.0-cn
      page: 6
      quote: 'e. 第一个芯片为最先接收数据的芯片'
      translation: 'e. The first chip is the chip that receives data first.'
    backup_line:
      pins: 'SOP14 only: SDI1 (3), SDO2 (4), SDI2 (9), SDO1 (10)'
      behaviour: 'Two complete data paths running in opposite directions (path 1: SDI1 at node 1 → node N → SDO1; path 2: SDI2 at node N → node 1 → SDO2). When both carry valid data the chip uses channel 1; while idle it checks the paths and switches to the other path when it detects a break. Channel 2 must carry the pixel data in reverse order.'
      doc: tls3001-v2.0-cn
      page: 7
      quote: '双通道通讯功能 TLS3001 具备双数据通路通讯功能。当两个通道同时接收到有效数据信息时，芯片会默认选择通道1 数据为有效数据；TLS3001 会在数据通路空闲时，定时检测数据通路状况，一旦检测到数据通路有断路情况，将自动将数据通路切换到另一条数据通路，这样大大提高了系统的可靠性。 [figure: 数据通路1 SDI1 → 节点1 … 节点N → SDO1; 数据通路2 SDI2 → 节点N … 节点1 → SDO2; 通道1数据格式 数据头 数据A 数据B 数据C … 数据Z; 通道2数据格式 数据头 数据Z 数据Y 数据X … 数据A]'
      translation: 'Dual-channel communication: TLS3001 has two data paths. When both channels receive valid data, the chip uses channel 1; while the path is idle it periodically checks it, and when it detects a break it switches automatically to the other path. [Figure: path 1 from SDI1 through node 1 … node N to SDO1; path 2 from SDI2 through node N … node 1 to SDO2; channel 1 sends header, A, B, C … Z; channel 2 sends header, Z, Y, X … A.]'
      other_quotes:
        - {
            page: 16,
            quote: '双通道模式下当双通道信号都为有效时，芯片会自动默认通道1 信号为显示信息。第二通道发送的数据顺序应该按像素信息与第一通道的首尾倒置 | SOP14 封装单通道使用模式下，不使用的通道输入端应该接上拉或悬空',
            translation: "In dual-channel mode, when both signals are valid the chip uses channel 1. Channel 2's pixel order must be the reverse of channel 1's. | With SOP14 in single-channel mode, pull up or float the unused input.",
          }
    compatibility_claims: []
    disagreements:
      - 'Grey scale: V2.0 p2 "12位PWM灰阶控制" and 12-bit fields in the frame vs V2.2 English p2 "8 bit color depth PWM control" (and its description "Pulse Width Modulation (PWM) control with 8-bit color depth").'
      - 'Rate: V2.0 p2 / p3 "100KHz～2MHz" vs V2.2 p2 "100KHz~1MHz clock frequency"; V2.2''s own application notice p14 says "100Khz~2MHz".'
      - 'Sync-frame zeros: datasheet "11’b00000000000" (mikbeng SYNCH_CMD 0x3FFF8800, 30 bits: 15 ones, 0001, 11 zeros) vs ESPixelStick fsm_RMT_state_SendSync "NumberOfZeroBitsToSend = 15".'
      - 'Speed in implementations: ESPixelStick 1 Mbit/s fixed, resets every 40 frames by default (TLS3001_DEFAULT_FRAMES_BETWEEN_RESETS 40), minimum frame 25 ms; TimGremalm README "The speed of the protocol can be between 100kHz and 1MHz" and an example at 166.7 kHz.'
      - 'Controller makers: Advatek "Color Resolution 12 Bits", "Data Transfer Rate 500 - 1000kbps", "Redundant Data Line [check] (SOP14)"; ENTTEC''s prose calls it "self-clocking" and "pulse-width encoding" (it is Manchester).'
    open:
      - 'No maker-hosted copy of either sheet; both are community copies.'
      - 'How data is latched (end of frame) is not in the datasheet.'

  # ------------------------------------------------------------------ Adafruit Pixie
  - part: Adafruit Pixie
    entry: pixels/adafruit-pixie
    maker: Adafruit Industries (designed by Ytai Ben-Tsvi)
    sourcing: "Maker guide (Adafruit learn guide PDF), Adafruit's Arduino library, and the Pixie firmware source in the designer's repository. Advatek / ENTTEC quoted as controller makers."
    documents:
      - id: pixie-guide
        url: https://cdn-learn.adafruit.com/downloads/pdf/pixie-3-watt-smart-chainable-led-pixels.pdf
        title: Pixie - the 3W Chainable LED Pixel (Adafruit learn guide)
        revision: null
        date: null
        language: en
        notes: '27 pages; page numbers below are the printed "Page N of 27".'
      - id: adafruit-pixie-lib
        url: https://github.com/adafruit/Adafruit_Pixie/blob/dd358f643cb62fd8b1eeee2afd43e6ce6d71f81d/Adafruit_Pixie.cpp
        title: 'Adafruit_Pixie.cpp / Adafruit_Pixie.h at dd358f6 (2023-10-17)'
        revision: dd358f643cb62fd8b1eeee2afd43e6ce6d71f81d
        date: '2023-10-17'
        language: en
      - id: pixie-firmware
        url: https://github.com/ytai/pixie/blob/be774335eced9cdcadfacd4f5b3e55482fe568e4/software/main.c
        title: 'ytai/pixie software/main.c and software/read.asm at be77433 (2016-04-04)'
        revision: be774335eced9cdcadfacd4f5b3e55482fe568e4
        date: '2016-04-04'
        language: en
      - id: adv-pixie
        url: https://www.advateklighting.com/pixel-protocols/adafruit-pixie
        title: 'LED Pixel Protocol Adafruit Pixie (Advatek)'
        revision: null
        date: null
        language: en
      - id: enttec-pixie
        url: https://www.enttec.com/pixel-protocols/Adafruit-Pixie
        title: 'Adafruit Pixie Pixel Protocol (ENTTEC)'
        revision: null
        date: null
        language: en
    line_coding: uart
    idle: high
    bit_order: lsb-first
    rates:
      - name: 115200 baud 8N1
        select: null
        T0H: null
        T0L: null
        T1H: null
        T1L: null
        period: { ns: null, printed: '115,200 baud 8N1 (one bit ≈ 8.68 µs, derived)' }
        reset:
          {
            min_ns: 1000000,
            typ_ns: null,
            max_ns: null,
            level: high,
            printed: '<at least 1ms of silence> (guide p10); firmware LATCH_TIME 30 counts × 32 µs = 960 µs',
          }
        doc: pixie-guide
        page: 5
        quote: "You'll also need thick wires to power each Pixie and a microcontroller that can send 115,200 baud 8N1 data to the Pixie"
        other_quotes:
          - {
              page: 4,
              quote: "You send it the color you want to appear at standard 115200 baud (1 byte per color). You can send a longer string of pixel data and it will 'forward' along the messages so you can chain them like a shift register.",
            }
          - {
              page: 7,
              quote: 'You also have an in and out pin. Each are 5V logic in and out, and receive/transmit data at 115200 baud.',
            }
          - {
              doc: pixie-firmware,
              quote: 'read.asm: ; Was this a falling edge (start bit)? Otherwise, ignore it. … ; Our first sample takes place 1.5 serial bits from the edge, or 13[us] … ; Repeat 8 times: sample, then wait until a period of 1 serial bit time | main.c: // All outputs but Dout are low. LATA = DOUT_PIN_MASK; // Weak pull-up on Din. WPUA = DIN_PIN_MASK; … r |= ((*p++ >> 5) & 1) << i;',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: "R G B bytes, first Pixie's three bytes first"
      pixel_bits: 24
      extra: 'Each byte is a UART character: start bit, 8 data bits LSB first, stop bit (30 bit-times per pixel).'
      start: null
      end: null
      latch: 'line idle (no edges) for ≥1 ms (firmware: 30 × 32 µs = 960 µs) — each Pixie then applies its three bytes'
      doc: pixie-guide
      page: 10
      quote: 'The resulting serial protocol is very simple: the controllers sends a byte-string containing a color value for each LED in the chain as follows: <R1>, <G1>, <B1>, <R2>, <G2>, <B2>, <R3>, <G3>, <B3>, ..., <Rn>, <Gn>, <Bn>, <at least 1ms of silence> Each of <Xi> is a byte representing the brightness of a single color of a single Pixie, where 0 is off, 255 is fully on … <R1>, <G1>, <B1> will determine the color of the Pixie that is the first in the chain, counting from the controller end.'
      other_quotes:
        - {
            doc: adafruit-pixie-lib,
            quote: 'while (!canShow()) ; // Wait for 1ms elapsed since prior call | stream->write(pixels, n3); | endTime = micros(); // Save EOD time for latch on next call | inline bool canShow() { return (micros() - endTime) > 1000L; } | p[0] = r; p[1] = g; p[2] = b;',
          }
        - {
            doc: pixie-firmware,
            quote: '// How long of a silence on the line is considered a latch event. // Units are 32[us] per count. #define LATCH_TIME 30',
          }
    forwarding:
      text: 'Consumes the first 3 bytes, then echoes every further edge from Din to Dout (firmware "echo mode": the input bit is shifted to the output pin on each edge interrupt), under 1 µs latency, until 1 ms of silence; then latches.'
      doc: pixie-guide
      page: 10
      quote: 'Each Pixie listens on it Din pin for serial data. It will consume the first 3 bytes it sees and store them. It will then echo any subsequent bytes to its Dout pin (with less than a microsecond latency). It will keep doing so until it detects a 1ms-long silence on Din. Then, it will immediately apply (latch) the color values it got and go back to listening for a new color.'
      other_quotes:
        - {
            doc: pixie-firmware,
            quote: "decfsz _bit_count, f ; Decrement bit count. If zero, we're in echo mode. … ; echo mode handling. lsrf PORTA, f ; Shift the input bit to the output position.",
          }
    backup_line: null
    timeout:
      text: 'No refresh for about 2 s → watchdog reset → LED off. Adafruit asks for data at least every second.'
      doc: pixie-guide
      page: 12
      quote: "It will reset the PIC if it doesn't hear from our firmware that everything is fine for about 2 seconds. In turn, our firmware will only pet the watchdog every time it gets a valid color and successfully latches it. So unless we hear from our controller at least every 2 seconds (and in practice, better leave a little margin), the Pixie resets, causing the LED to turn off until told otherwise."
      other_quotes:
        - {
            page: 4,
            quote: "You do have to send it data every 1 second at a minimum (as a protection against the bright and hot LEDs staying 'stuck on', they will eventually timeout if no updates are received)",
          }
    compatibility_claims:
      - {
          claim: "Originally, we have designed the Pixie to support the same serial protocol as the WS28x family (aka NeoPixel). It worked. However, this compatibility, which was originally considered a feature has been eventually deemed a drawback … Our solution: stick to the good ol' 115k.2 asynchronous serial.",
          doc: pixie-guide,
          page: 9,
        }
    disagreements:
      - 'Latch silence: guide "1ms-long silence" / library "> 1000L" µs vs firmware LATCH_TIME 30 × 32 µs = 960 µs.'
      - 'PWM: guide p9 "The PWM peripheral runs at about 500Hz" vs firmware comment "32MHz / 2^16 = 488Hz".'
      - 'Controller makers: Advatek "uses a variant of the standard DMX512 protocol as a single serial line", "Color Types RGB/RGBW", "Output Pixel Voltage 5 - 24V", "Data Transfer Rate 115.2kbps supported"; ENTTEC "single-wire, self-clocking … latches 8-bit colour", "RGBW Yes", "5 - 24V". Adafruit''s guide describes plain 115200-baud async serial with no break or start code, RGB only, and a 5 V module.'
    open: []
