      quote: 'When the input data achieves 36levels, it will be retransmitted to the next level circuit via SDO pin. The retransmitted data are all decoded and regenerated'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'Max data rate: p1 "the MAX is 16MHz" vs p3 "DATA tempo 0.1～1.6 MHz" and p3 "1.6M data can achieve 1778pixels'' control".'
      - 'Bit order within a channel: p3 "4bits+8bits format, the high level is in front and the low level behind" vs the p4 figure, which sends bits 3..0 before 11..4 (low nibble first).'
      - 'OUT2 / OUT3 colour: p2 "OUT2, OUT3 … advice to connect with blue and green color light" (order ambiguous); the data figure labels the rows R1, G1, B1.'
      - 'Implementation: FastLED (379b60be) defines LPD1886Controller1250Khz and LPD1886Controller1250Khz_8bit identically (same timing, no extra bits), i.e. 24 bits per pixel for both — it does not send the 36-bit 4096-level frame.'
