  # ------------------------------------------------------------------ TX1818
  - part: TX1818
    entry: pixels/tx1818
    maker: TCWIN (深圳市天成照明有限公司, Shenzhen Tiancheng Lighting)
    sourcing: 'Maker datasheets (TCWIN, via LCSC). Advatek / ENTTEC pages quoted only as controller-maker claims.'
    documents:
      - id: tx1818bjj-a2
        url: https://datasheet.lcsc.com/datasheet/pdf/b153efab9bc27ebcdabd89857c3357d8.pdf
        title: TX1818BJJ-F01 5050 内置IC 幻彩 智能外控LED 光源 — 产品规格书 SPECIFICATIONS
        revision: A2
        date: '2023-03-27'
        language: zh
        notes: '5050, 6 pins with FDIN. Cover: "日期：20230327 版本号：A2".'
      - id: tx1818hlj-a2
        url: https://datasheet.lcsc.com/datasheet/pdf/ccf6c4ce438971261bcd22da2dbd0270.pdf
        title: TX1818HLJ-F01 (3535) 产品规格书
        revision: A2
        date: '2023-03-27'
        language: zh
        notes: '3535 version, no FDIN. Same timing values; reset row printed differently (see disagreements).'
      - id: adv-tx1818
        url: https://www.advateklighting.com/pixel-protocols/tx1818
        title: 'LED Pixel Protocol TX1818 (Advatek)'
        revision: null
        date: null
        language: en
      - id: enttec-tx1818
        url: https://www.enttec.com/pixel-protocols/TX1818
        title: 'TX1818 Pixel Protocol (ENTTEC)'
        revision: null
        date: null
        language: en
    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kHz
        select: null
        T0H: { ns: 300, tol_ns: 50, min_ns: null, max_ns: null, printed: '0.3µs ±0.05us' }
        T0L: { ns: 900, tol_ns: 50, min_ns: null, max_ns: null, printed: '0.9µs ±0.05us' }
        T1H: { ns: 900, tol_ns: 50, min_ns: null, max_ns: null, printed: '0.9µs ±0.05us' }
        T1L: { ns: 300, tol_ns: 50, min_ns: null, max_ns: null, printed: '0.3µs ±0.05us' }
        period: null
        reset:
          {
            min_ns: 80000,
            typ_ns: null,
            max_ns: null,
            level: low,
            printed: 'Trst Reset码，低电平时间 ≥80µs',
          }
        derived: 'Both codes total 1200 ns ±100 ns (0.3 + 0.9 µs); not printed as a period.'
        doc: tx1818bjj-a2
        page: 7
        quote: '11.数据传输时间 | 名称 描述 典型值 容许误差 | T0H 0码，高电平时间 0.3µs ±0.05us | T1H 1码，高电平时间 0.9µs ±0.05us | T0L 0码，低电平时间 0.9µs ±0.05us | T1L 1码，低电平时间 0.3µs ±0.05us | Trst Reset码，低电平时间 ≥80µs --'
        translation: '11. Data transfer time | name, description, typical, tolerance | T0H 0-code high time 0.3 µs ±0.05 µs | T1H 1-code high time 0.9 µs ±0.05 µs | T0L 0-code low time 0.9 µs ±0.05 µs | T1L 1-code low time 0.3 µs ±0.05 µs | Trst reset-code low time ≥80 µs'
        other_quotes:
          - {
              page: 3,
              quote: '数据传输频率可达800Kbps。',
              translation: 'Data transfer rate up to 800 Kbps.',
            }
          - {
              page: 6,
              quote: '开关特性 | 数据传输速度 FDIN -- 800 -- KHZ | 传输延迟时间 TPLZ -- -- 200 ns DIN→DO',
              translation: 'Switching characteristics: data transfer speed (symbol printed as "FDIN") 800 kHz typ; propagation delay TPLZ 200 ns max, DIN→DO',
            }
          - {
              page: 6,
              quote: '信号输入翻转阀值 VIH 4 -- -- V VDD=12V | VIL -- -- 1 V',
              translation: 'Input threshold VIH ≥4 V, VIL ≤1 V at VDD 12 V',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low ≥80 µs ("复位码 ≥80us", p8)'
      doc: tx1818bjj-a2
      page: 8
      quote: '14. 24bit 数据结构 R7 R6 R5 R4 R3 R2 R1 R0 G7 … G0 B7 … B0 | 注：高位先发，按照RGB 的顺序发送数据'
      translation: '24-bit data structure R7…R0 G7…G0 B7…B0. Note: high bit first, data sent in R, G, B order.'
    forwarding:
      text: "The first 24 bits after reset go to the first pixel's latch; the rest is re-shaped and forwarded from DO, 24 bits fewer per pixel. Propagation delay 200 ns max."
      doc: tx1818bjj-a2
      page: 3
      quote: '数据协议采用单极性归零码的通讯方式，像素点在上电复位以后，DIN 端接受从控制器传输过来的数据，首先送过来的24bit 数据被第一个像素点提取后，送到像素点内部的数据锁存器，剩余的数据经过内部整形处理电路整形放大后通过DO 端口开始转发输出给下一个级联的像素点，每经过一个像素点的传输，信号减少24bit。'
      translation: 'The protocol uses unipolar return-to-zero code. After power-on reset the DIN pin receives data from the controller; the first 24 bits are taken by the first pixel into its latch; the remaining data is re-shaped and amplified and forwarded from DO to the next pixel; each pixel reduces the signal by 24 bits.'
    backup_line:
      pins: 'DIN (pin 2), FDIN (pin 3) on TX1818BJJ-F01 (5050); the 3535 TX1818HLJ-F01 has no FDIN'
      behaviour: 'FDIN is named only "backup data input". No text says how the chip chooses an input or whether FDIN drops 24 bits. The application circuit (p8) draws the controller''s DAT (through 330R) to chip 1 DIN and the same line on to chip 2 FDIN; chip 1 DO to chip 2 DIN; chip 1 FDIN unconnected; and so on down the chain (each FDIN on the previous chip''s DIN net).'
      doc: tx1818bjj-a2
      page: 5
      quote: '3 FDIN 备用数据输入 备用显示信号输入'
      translation: 'Pin 3 FDIN: backup data input; backup display-signal input.'
    compatibility_claims: []
    disagreements:
      - 'Reset row differs between the two A2 sheets: 5050 p7 "Trst Reset码，低电平时间 ≥80µs --" vs 3535 p7 "Trst Reset码，低电平时间 80µS >0us" (80 µs in the typical column, ">0us" in the tolerance column). Both read as at least 80 µs.'
      - 'The switching table names the data-rate symbol "FDIN" (p6), the same name as the backup-input pin.'
      - 'Controller makers: Advatek "Data Transfer Rate 800kbps", "Redundant Data Line [check]", "PWM Rate 8000Hz", "This pixel protocol was designed by TCWIN Lighting in China"; ENTTEC "Redundant Data Line Yes", "PWM Rate 8000Hz". They agree with TCWIN on rate and PWM; neither gives timing.'
    open:
      - "How TX1818 picks between DIN and FDIN, and whether FDIN skips the first 24 bits (like LB1908's FDIN) or not: not written in the A2 sheets."

