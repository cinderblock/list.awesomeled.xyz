  # ------------------------------------------------------------------ MBI6120
  - part: MBI6120
    entry: pixel-ics/mbi6120
    maker: Macroblock, Inc.
    sourcing: 'Maker datasheet (preliminary V1.00) via the authorised distributor Neumüller.'
    documents:
      - id: mbi6120-v1.00
        url: https://www.neumueller.com/datenblatt/macroblock/MBI6120%20Datenblatt%20-%20Datasheet.pdf
        title: MBI6120 Preliminary Datasheet — Single-wire 3-Channel Constant Current Sink Driver for Small LED Clusters
        revision: V1.00
        date: 'June 2012'
        language: en
        notes: '21 pages, "©Macroblock, Inc. 2012", footer "June 2012, V1.00". The "MBI6120 Application Note" it cites for the gap symbol was not found.'
    line_coding: other
    idle: low
    bit_order: msb-first
    rates:
      - name: 'auto-detected, bit width 1–10 µs (100 kHz–1 MHz)'
        select: 'Measured by the chip from the 12 consecutive 1s that start every packet ("the 12 bits of 1''s must be programmed with the same baud rate as the gray scale data", p12)'
        T0H:
          {
            ns: null,
            tol_ns: null,
            min_ns: 80,
            max_ns: null,
            printed: 'Logic 0 = high for TW, then low to the end of Tbit; TW 0.08 us (min) to 0.25xTbit (max)',
          }
        T0L: null
        T1H: null
        T1L:
          {
            ns: null,
            tol_ns: null,
            min_ns: 80,
            max_ns: null,
            printed: 'Logic 1 = high, then low for TW at the end of Tbit; TW 0.08 us to 0.25xTbit',
          }
        period:
          {
            ns: null,
            min_ns: 1000,
            max_ns: 10000,
            printed: 'Logic 0/1 bit width SDI↑-SDI↑( logic 0/1) Tbit 1 (min) 10 (max) us',
          }
        reset:
          {
            min_ns: 750000,
            typ_ns: null,
            max_ns: null,
            level: low,
            printed: 'Before sending package, SDI must be pulled-low for longer than 750µs.',
          }
        gap:
          {
            printed: 'Symbol gap width SDI↑-SDI↑(gap) Tgap = 2xTbit; drawn as high, then low for TW at the end',
          }
        derived: 'Logic 0 low time = Tbit − TW and logic 1 high time = Tbit − TW (not printed). TW max is 0.25×Tbit, so at Tbit = 1 µs the short pulse is 80–250 ns.'
        doc: mbi6120-v1.00
        page: 10
        quote: 'Control Interface: Single-wire Interface | MBI6120 adopts the single-wire interface and samples the data (SDI) between two rising edges of SDI, typical of RZ code protocols. The following waveforms illustrate the definitions logic 0, 1, and a symbol "gap". | Logic 0/1 bit width SDI↑-SDI↑( logic 0/1) Tbit 1 10 us | Minimum pulsewidth SDI TW 0.08 0.25xTbit us | Symbol gap width SDI↑-SDI↑(gap) Tgap Tgap = 2xTbit us'
        other_quotes:
          - {
              page: 8,
              quote: 'SDO Period SDO rising to rising period tWSDO 480 (min) ns | Internal Oscillator FOSC 50 63 75 MHz',
            }
          - {
              page: 7,
              quote: 'SDI Input Voltage VSDI 3.0 - 5.5 V | SDI Input Threshold "H" level VIH 2.2 V min, "L" level VIL 0.8 V max | Pull-down Resistor RIN_SDI 45 65 85 KΩ',
            }
    clock: null
    frame:
      bits_per_channel: 12
      channels: 3
      wire_order: 'Packet: header, then IC N data first … IC1 data last; each IC: OUTA[11:0], OUTB[11:0], OUTC[11:0] (MSB first), then a gap'
      pixel_bits: 38
      extra: 'Header (36 logic bits + gap): H1 = 12 × 1 (data-rate detection), CLK 4 bits ([23:22] reserved, [21:20] GCLK 5.2 MHz / 2.6 / 1.3 / 650 kHz), CMD 8 bits (0x00 gray scale data, 0x55 software reset, others ignored), NUM 12 bits ([11:10] reserved, [9:0] number of cascaded ICs 1–1023).'
      start: 'SDI low > 750 µs, then the header'
      end: 'none; data is addressed by the NUM count "without a latch command"'
      latch: 'No latch command; the next packet is preceded by > 750 µs low.'
      doc: mbi6120-v1.00
      page: 11
      quote: "The data packet of MBI6120 is composed of two parts: 1. Header: The header defines the cascaded IC numbers and also contains a command to decide the data type. 2. Data: This is the gray scale data for each IC. | Header[35:24] H1: 12-bit strings of '1' as the preamble of the data packet | Header[23:20] CLK: 4-bit GCLK selector | Header[19:12] CMD: 8-bit command | Header[11:0] NUM: 12-bit number of cascaded devices | gap: a symbol defined in the previous page | As for the sequence of the SDI gray scale data, the data of the last IC will be sent first from the controller."
      other_quotes:
        - {
            page: 13,
            quote: 'The data for each IC contains: 12-bit OUTA gray scale data, 12-bit OUTB gray scale data, 12-bit OUTC gray scale data, a gap symbol [figure: each 12 bit width, MSB first; gap 2 bit width]',
          }
        - {
            page: 10,
            quote: 'MBI6120 provides a single-wire transmission interface to address the data without a latch command. … Before sending package, SDI must be pulled-low for longer than 750µs.',
          }
        - {
            page: 12,
            quote: "The maximum allowable cascaded IC's for MBI6120 is 1023, and therefore it takes 10 bits of corresponding registers Header[9:0] (NUM) for properly addressing the input gray scale data to the IC's.",
          }
    forwarding:
      text: 'Data regenerated on SDO ("serial data signal regeneration"); the sheet does not describe how each IC picks its 38-bit block beyond the reversed order and the NUM count.'
      doc: mbi6120-v1.00
      page: 1
      quote: 'MBI6120 features a one-wire transmission interface to make cluster-to-cluster connection much easier by eliminating the global clock signal. To improve the transmission quality, MBI6120 provides a unique protocol (patent pending) and serial data signal regeneration. MBI6120 is also featured by auto-synchronization.'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'Cascade length: p11 figure "Total N pieces of IC in cascade, N=1~1024" vs p12 "The maximum allowable cascaded IC''s for MBI6120 is 1023" (10-bit NUM, 10''b0000000001~10''b1111111111).'
      - 'p11 calls Header[11:0] "NUM: 12-bit number of cascaded devices" while the table on the same page marks [11:10] reserved and uses [9:0].'
    open:
      - 'How an IC picks its block (count down NUM? keep the last block?) and the forwarding delay: not in the sheet; the application note was not found.'
      - 'Only a preliminary V1.00 sheet was found; no later revision.'

