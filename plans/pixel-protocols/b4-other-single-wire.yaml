    forwarding:
      text: 'After its 24 bits the chip forwards the stream from DIN or FDIN out of DO (DO low before forwarding). Propagation delay 155 ns typ, 500 ns max (DIN→DO, FDIN→DO).'
      doc: lb1908-ledyi
      page: 3
      quote: 'When the 24-bit data are received, DO ports will start to forward the data continuously sent from DIN or FDIN port, which provides display data for the next cascaded chip. Prior to forwarding data, DO ports are always at low level.'
    backup_line:
      pins: 'DIN (pin 5), FDIN (pin 7)'
      behaviour: 'FDIN is wired to the previous chip''s input line (S1 to chip 2 FDIN, etc., p4 figure). Data arriving on FDIN has its first 24 bits dropped, so a controller driving FDIN directly must prepend a dummy 24-bit packet. First chip: controller to DIN, FDIN grounded; FDIN may float when break-point resume is not used. How the chip chooses between DIN and FDIN is only described as "switch between input interfaces in normal mode".'
      doc: lb1908-ledyi
      page: 4
      quote: 'Special reminder: the IC PINS DIN and FDIN as two input of data is not the same, and exactly 24 bits of data, when FDIN received data, automatically lose the Dx that packet to achieve that data (display effect) will not shift, which is the first point to connect the controller using THE DIN port instead of the FDIN port. … Data structure of Di and Fi2 ports of the controller: D1D2D3D4……Dn; Data structure of Fi port of the controller: DxD1D2D3……Dn; and the Dx is any 24bit data.'
      other_quotes:
        - {
            page: 1,
            quote: 'Single-wire dual-channel serial cascading interface: switch between input interfaces in normal mode, DIN pin inputs data in DIN working mode, FDIN pin inputs data in FDIN working mode, D0 forwards cascaded data, and the signal does not depend on a certain one. The chip is abnormal and affects the normal operation of other chips.',
          }
        - {
            page: 5,
            quote: 'The first point controller only needs to be connected to the DIN port, and the FDIN port is grounded; in addition, if the breakpoint resume function is not required, all FDINs can be left floating.',
          }
    compatibility_claims: []
    disagreements:
      - 'p3 note (1) calls a 1.2 μs cycle "frequency 800KHz" (1/1.2 μs = 833 kHz); the table''s typ cycle is 1.2 μs, not 1.25 μs.'
      - 'p3 note (1) says the low times "must accord with the corresponding values in the above table", but the table prints no low times.'
      - 'p3 labels the 800 KHz data rate "PWM refresh rate Fin".'
      - 'p3 "After power-on reset and reception of a mode setting command, the chip begins to receive display data" — no mode-setting command is defined anywhere in the sheet.'
      - 'p1 "The chip is abnormal and affects the normal operation of other chips" reads as a translation error for "does not affect".'
      - 'Features p1 "Fixed constant current output of 14mA" vs electrical table p2 Iout 9 / 10 / 11 mA at Vout 3 V (already in the database discrepancies).'
      - 'Controller makers: Advatek "Data Transfer Rate 800kbps", "Redundant Data Line [check]", "PWM Rate 8000Hz"; Falcon lists LB1908 among its "WS2811" type alternatives.'
    open:
      - 'Maker unknown; the sheet''s "Titan Micro Electronics" ESD sentence and the undefined "mode setting command" suggest text reused from a Titan Micro sheet, not checked here.'

