        url: https://monitor.espec.ws/download.php?id=205360
        title: Data Sheet Of INK1003 IC Driver — INK1003 IC (256-Gray Level)
        revision: null
        date: null
        language: en
        notes: 'Redirects to http://monitor.espec.ws/files/lnk1003_datasheet_299.pdf. 8 pages, no revision or date printed.'
      - id: adv-ink1003
        url: https://www.advateklighting.com/pixel-protocols/ink1003
        title: 'LED Pixel Protocol INK1003 (Advatek)'
        revision: null
        date: null
        language: en
      - id: falcon-pixeltypes
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: 'Pixel Types (Falcon)'
        revision: null
        date: null
        language: en
    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kHz
        select: null
        T0H: { ns: 250, tol_ns: 75, min_ns: null, max_ns: null, printed: '0.25μs ±75ns' }
        T0L: { ns: 1000, tol_ns: 75, min_ns: null, max_ns: null, printed: '1.0μs ±75ns' }
        T1H: { ns: 1000, tol_ns: 75, min_ns: null, max_ns: null, printed: '1.0μs ±75ns' }
        T1L: { ns: 250, tol_ns: 75, min_ns: null, max_ns: null, printed: '0.2 5μs ±75ns' }
        period: null
        reset:
          {
            min_ns: 24000,
            typ_ns: null,
            max_ns: null,
            level: low,
            printed: 'RESET signal( more than 24uS low signal) (p5 text); "≥24μs" on the p5 protocol figure',
          }
        derived: 'Both codes total 1250 ns ±150 ns (800 kHz); the period is not printed.'
        doc: ink1003-greeled
        page: 6
        quote: '2) THE DATA SIGNAL LEVEL TIME | NAME DISCRIPTION TYPICAL PERMISSIBLE ERROR | T0H 0 code of high level time 0.25μs ±75ns | T1H 1 code of high level time 1.0μs ±75ns | T0L 0 code of low level time 1.0μs ±75ns | T1L 1 code of low level time 0.2 5μs ±75ns'
        other_quotes:
          - { page: 1, quote: 'Data frequency range wide: 400~800KHz' }
          - { page: 1, quote: 'When 800KHz, it can achieve 1024Pixels cascade connection.' }
          - { page: 2, quote: 'Input Clock Frequency FCLK 800 KHz (Absolute Maximum Ratings)' }
          - {
              page: 8,
              quote: '20 meters can be realized at the 800 KHz clock frequency in laboratory. A series connected 50ohm resistor is needed to guarantee impedance matching and avoid signal reflection.',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low more than 24 µs ("≥24μs" on the figure)'
      doc: ink1003-greeled
      page: 5
      quote: '24 BIT DATA FORMATE R7 R6 R5 R4 R3 R2 R1 R0 G7 … G0 B7 … B0 | NOTE: MSB is sent first, LSB is sent last. In order to send data ROUT, GOUT, BOUT. | During data transfer, the first bit is the MSB of the ROUT channel, the last one transferred into the data shift register is the LSB of the BOUT channel.'
    forwarding:
      text: 'After 24 bits the chip forwards the rest from SDO (held low before forwarding) and ignores further data until a reset.'
      doc: ink1003-greeled
      page: 5
      quote: 'INK1003 uses the one-line communication mode, with return to zero code gray scale data transport. When the SDI node receives total 24 bit data, SDO node begins to send data to the next chip (set low before sending) . After that the IC no longer receives data, 3 PWM output named ROUT、GOUT、BOUT outputs signal with different duty according to the data received. The period of output signal is 3.2mS.The chip receives data again until RESET signal is sent to SDI node of the IC. … After the RESET signal( more than 24uS low signal) , 24 bit PWM data received newly will output to ROUT、GOUT、BOUT.'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'p1 "Data frequency range wide: 400~800KHz" but the only timing table (p6) is for a 1.25 µs bit (800 kHz); no 400 kHz timing or speed-select pin is given (pin 7 is POL, output polarity).'
      - 'p5 refresh example "1024X0.4X2=0.8192ms" does not match 24 bits × 1.25 µs per chip (1024 chips ≈ 30.7 ms).'
      - 'p5 figure labels the reset "RERESET CODE ≥24μs" (typo).'
      - 'Controller makers: Advatek lists "PWM Rate 400Hz", "Data Transfer Rate 800kbps", "Redundant Data Line [cross]"; Falcon lists INK1003 among its "WS2811" type alternatives. The datasheet''s 3.2 ms PWM period is 312.5 Hz.'
    open: []

  # ------------------------------------------------------------------ INK1002
  - part: INK1002
