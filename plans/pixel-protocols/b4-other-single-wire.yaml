batch: b4-other-single-wire
researched: '2026-11-20'
notes:
  - 'Summary, overlap arithmetic, disagreements and database corrections: b4-other-single-wire.md (read it first).'
  - 'Page numbers are PDF pages (1-based). In these sheets they match the printed page numbers unless a quote says otherwise.'
  - 'Values marked derived are arithmetic on printed values, not printed themselves.'
  - 'sourcing (per part) says plainly whose words each value rests on: the chip maker, an LED packager, a controller maker (Advatek, ENTTEC, Falcon), or an implementation (library / firmware source).'
  - 'ENTTEC''s protocol pages are prose generated from a spec row (e.g. "per the row"); some of their prose is wrong for parts in this batch (Pixie, TLS3001). Only their spec-table rows are quoted.'

