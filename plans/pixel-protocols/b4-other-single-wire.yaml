      quote: '3.数据传输方法 [figure: DO: 第一位24BIT | WT | 第二位24BIT | WT | 第三位24BIT | WT | 第四位24BIT | RESET CODE …; DI: 第二位24BIT | WT | 第三位24BIT | WT | 第四位24BIT | RESET CODE] | 4.24bit 的数据结构 R7 … R0 G7 … G0 B7 … B0 | 注：高位先发，按照RGB 的顺序发送数据'
      translation: '3. Data transmission method [figure: row DO: 1st 24 bits, WT, 2nd 24 bits, WT, 3rd 24 bits, WT, 4th 24 bits, RESET CODE; row DI: 2nd 24 bits, WT, 3rd, WT, 4th, RESET CODE]. 4. 24-bit data structure R7…B0. Note: high bit first, sent in R, G, B order.'
    forwarding: null
    backup_line:
      pins: '6-pin LED: DI2 (pin 1, 二号数据输入 data input 2), DI1 (pin 2, 一号数据输入 data input 1), DO2 (pin 3, 二号数据输出 data output 2). 8-pin LED: OUT (1), DI1 (2), DI2 (3). The 943 IC in the application circuit has DI1, DI2, DO1, DO2.'
      behaviour: "The controller connects to the first chip's DI1. The figure shows a second stream (DI) that starts with the 2nd pixel's 24 bits; the note says a controller may send only D0 and the chip treats the D1 input as abnormal without affecting later transmission. No selection rule is printed; the application wiring of DI2/DO2 could not be traced unambiguously."
      doc: weersom-p943-6pin
      page: null
      quote: '注：其中 DO 与 D1 为 MCU 端发送的数据，客户可以只发 D0 信号，D1 口芯片会认为信号异常，这并不异响往后信号传输。 | 单片机控制信号连接第一个芯片的DI1端口。'
      translation: "Note: DO and D1 are the data sent from the MCU; the customer may send only the D0 signal; the chip will treat the D1 port signal as abnormal, which does not affect (异响, typo for 影响) later signal transmission. | The MCU control signal connects to the first chip's DI1 port."
      other_quotes:
        - {
            doc: weersom-p943-6pin,
            quote: '六个脚P943幻彩灯珠是威尔晟光电有限公司的一款带有断点续传功能的专利灯珠。坏灯不受型号传输影响',
            translation: 'The six-pin P943 LED is a patented LED of WEERSOM with break-point resume; a dead LED does not affect signal transmission.',
          }
        - {
            doc: weersom-p943-6pin,
            quote: '建议近距离传输时，在D01和D02口各串接电阻后再输出至下级，以防止信号反射',
            translation: 'For short runs, put a series resistor on each of DO1 and DO2 before the next stage, to prevent reflections.',
          }
    compatibility_claims: []
    disagreements:
      - 'Rate: WEERSOM''s table gives a 1.71 µs bit (0.35 + 1.36 µs, ≈585 kbps) vs Advatek "Data Transfer Rate 800kbps" (ENTTEC lists no rate).'
      - 'Figure row labels "DO"/"DI" vs the note''s "DO 与 D1 … D0 信号 … D1 口" (D0/D1).'
      - 'The 6-pin LED pin table names its output "DO2" while the IC drawing has both DO1 and DO2; the 8-pin LED names it "OUT".'
    open:
      - 'Meaning of WT (12 µs "wait/processing time" between pixel packets): a required gap, an allowed gap, or the chip''s own delay — not stated.'
      - 'Backup-input rule (which input wins, whether DI2 drops 24 bits): not stated.'
      - 'No IC-maker (Power MOS / DMS) document found; WEERSOM is a packager.'

