        title: Newstar Download (page 1 of 2, 38 records)
        revision: null
        date: null
        language: en
        notes: 'Lists datasheets dated 2017-08-22 to 2022-07-05 (WS2815 RGB Chip, TC1903 IC Pixel Chip, HD107S, SK6812 …); no NS8808 or HD8808 entry. Page 2 (/download_2.html) returned errors to every fetch.'
      - id: ge8808-greeled-slideshare
        url: https://www.slideshare.net/slideshow/ge8808-led-datasheet/122749842
        title: GE8808 LED SERIES SPECIFICIFATION (Greeled)
        revision: '01 (Initial Document)'
        date: '2018 (day garbled in the extraction: "2018-0 -09")'
        language: en
        notes: 'Related, not this part: read through SlideShare''s OCR text by a fetch helper, so spelling is as extracted. Kept because Newstar''s NS8808 description names "GE8808B" and repeats this sheet''s feature wording. No NS8808 value below comes from it.'
    line_coding: single-wire
    idle: null
    bit_order: null
    rates:
      - name: 800kHz
        select: null
        T0H: null
        T0L: null
        T1H: null
        T1L: null
        period: null
        reset: null
        doc: newstar-ns8808-page
        page: null
        quote: '3·Use e-RZ code, serial data frequency 800kHz'
        other_quotes:
          - {
              quote: 'the GE8808B use the e-RZ (extended return to zero code)as the signal transmission mode,which can control the output current channel by channel and cascade infinitely',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: null
      pixel_bits: null
      extra: '"12bits build-in GAMMA correction of PWM display" (internal; the wire carries 8 bits per channel)'
      start: null
      end: null
      latch: null
      doc: newstar-ns8808-page
      page: null
      quote: '4·8bits data transfer, 12bits build-in GAMMA correction of PWM display | The NS8808 is a 3-channel constant current LED drive with resumable data transfers and internal display patterns. There are three open-drain constant current outputs'
    forwarding: null
    backup_line:
      pins: null
      behaviour: 'Two data inputs ("two-signal data input as redundant control"); pin names, selection rule and drop/skip behaviour are not given.'
      doc: newstar-ns8808-page
      page: null
      quote: "DC12V Dual-signal wires version, signal break-point continuous transmission. Any pixel's failure won't affect signal transfer and total emitting effect. | 6·With resumable data transfer function, single chip damage does not infect data transmission | it provides two-signal data input as redundant control, which ensures the transmission of the signal if any single chip damages."
    compatibility_claims:
      - {
          claim: 'NS8808 HD8808 DC12V Pixel LED Chip replace WS2815',
          doc: newstar-ns8808-page,
          page: null,
        }
      - {
          claim: 'NS8808/HD8808 DC12V Pixel LED Chip, it is same protocol with ws2815, the only one pixel LEDs can replace ws2815 directly at this moment, and it is more stable than ws2815 after long time tested.',
          doc: newstar-ns8808-page,
          page: null,
        }
    disagreements:
      - 'Newstar''s NS8808 description says "the GE8808B use the e-RZ (extended return to zero code)as the signal transmission mode" — a different part number inside the NS8808 text.'
      - 'The Greeled GE8808 sheet (SlideShare extraction) repeats Newstar''s wording ("Use e-RZ code, serial data frequency 800kHz") and adds what Newstar does not print: "Single code with 1:3 duty cycle and a standard 800kHz transmission speed", waveform labels "T=1/800kHz", "3/4T1/4T", "<10us", "Intervals between code >300us Reset", "RZ data frequency 400k 800k 1M Hz", and for the backup input "SDI2 will discard the 1-24bits data and use 25-48bits data as the display data". Whether NS8808 is a GE8808 is not established by any document read.'
      - 'Maker claim "same protocol with ws2815" vs "e-RZ (extended return to zero code)": the page never shows a waveform, so the claim cannot be checked against WS2815 timing from Newstar''s own material.'
    open:
      - 'No NS8808 timing (T0H/T1H/T0L/T1L, reset), channel order, or backup-input behaviour found from Newstar.'
      - 'Whether NS8808 = GE8808 (Greeled) relabelled: only the shared wording suggests it.'

