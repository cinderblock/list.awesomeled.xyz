    entry: pixel-ics/ink1003
    maker: 'Greeled Electronic Ltd (www.gree-leds.com) on the datasheet; the designer is not named'
    sourcing: 'Datasheet headed "Greeled Electronic Ltd" (forum-attachment copy). Advatek / ENTTEC / Falcon quoted as controller makers.'
