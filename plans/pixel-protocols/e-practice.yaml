        detail: >-
          UCS7604 comment says "(250, 625, 375 ns)" (struct: 400, 400, 450);
          WS2812B-Mini-V3 / V5 comments say "220ns, 360ns, 580ns" (struct: 225,
          355, 645); WS2811_400 comment says "(800, 800, 900 ns = 2500ns cycle"
          (struct: 500, 700, 1300). The structs are what is compiled.
