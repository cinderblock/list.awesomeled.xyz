    model:
      text: >-
        Two speeds only, chosen by a flag: NEO_KHZ800 (default) and NEO_KHZ400
        ("v1 NeoPixels" / WS2811 400 kHz). No per-chip names. The latch is a
        300 µs hold-off between show() calls (canShow). Pulse widths are set
        per platform, so "800 kHz" means different T0H/T1H on different MCUs.
      permalink:
        - https://github.com/adafruit/Adafruit_NeoPixel/blob/d514fc3beae85dd4c2b19781b93faa47bd6e996f/Adafruit_NeoPixel.h#L123-L134
