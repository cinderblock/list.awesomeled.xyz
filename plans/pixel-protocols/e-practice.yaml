# Workstream 8 (pixel protocols), research batch e-practice: what real
# transmitters send for each named "pixel type", which names they treat as the
# same thing, and what measurements say about real tolerances.
# Summary for the parent: e-practice.md (same folder).
#
# Conventions
# - Times are nanoseconds unless the key ends in _us (microseconds).
# - T0H / T1H = high time of a 0 / 1 bit; period = whole bit cell. For an
#   inverted (idle-high) protocol, T0H / T1H are the widths of the ACTIVE
#   (low) pulse.
# - Code is quoted from a pinned commit; every permalink is a GitHub blob URL
#   at that commit with #L line anchors. Quotes are verbatim (a subset of the
#   lines in the anchored range).
# - derived: true means I computed the ns value from quoted constants (cycle
#   counts, clock dividers, PIO/I2S cadence); the formula is in `derivation`.
#   Every other number is printed in the source.
# - Where FastLED gives T1/T2/T3 (its three-phase model), T0H = T1,
#   T1H = T1 + T2, period = T1 + T2 + T3 (the model is quoted under
#   libraries.fastled.model).
batch: e-practice
researched: '2026-11-20'

# ---------------------------------------------------------------------------
# 1. Libraries and controller firmware: what each sends per chip name
# ---------------------------------------------------------------------------
libraries:
  # -------------------------------------------------------------------------
  fastled:
    name: FastLED
    repo: https://github.com/FastLED/FastLED
    version: 3.10.10 (tag; GitHub release published 2026-11-20)
    commit: 5e831b8203bc9237394f7f5b01b1a2ca40740e81
    commit_date: '2026-11-20' # 2026-11-20T03:12:24Z
    model:
      text: >-
        One template (ClocklessControllerImpl) for every single-wire chip, fed a
        per-chip T1/T2/T3 in ns. The latch gap depends on the platform: the
        classic single-pin controllers wait WAIT_TIME (template default 280 µs;
        a chip changes it only through the WAIT_TIME argument), while the
        ESP32 channel drivers take the per-chip RESET field (makeTimingConfig
        -> reset_us) and the Teensy 3.x / SAM block controllers set
        WAIT_TIME = TIMING::RESET. So a chip whose struct says RESET = 0 or 80
        gets 280 µs on one platform and its struct value on another. How the
        ESP32 drivers treat RESET = 0 was not traced. FLIP (inverted line)
        exists but per the comment on TM1829 is honoured only by the nRF52
        backend.
      permalink:
        - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/fl/chipsets/led_timing.h#L7-L11
        - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/chipsets.h#L385-L393
        - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/fl/chipsets/clockless_controller_impl.h#L28-L29
        - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/fl/chipsets/chipset_timing_config.h#L62-L71
        - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/platforms/arm/k20/clockless_block_arm_k20.h#L55
      quote: |-
        ///   At T=0        : the line is raised hi to start a bit
        ///   At T=T1       : the line is dropped low to transmit a zero bit (start of low time)
        ///   At T=T1+T2    : the line is dropped low to transmit a one bit (start of low time)
        ///   At T=T1+T2+T3 : the cycle is concluded (next bit can be sent)
        ---
        //  duration = max(T0H + T0L, T1H + T1L)  # Maximum cycle time
        //  T1 = T0H                               # High time for '0' bit
        //  T2 = T1H - T0H                         # Additional time for '1' bit
        //  T3 = duration - T1H                    # Tail time after '1' bit
        ---
        template <int DATA_PIN, typename TIMING, EOrder RGB_ORDER = RGB, int XTRA0 = 0, bool FLIP = false, int WAIT_TIME = 280>
        using ClocklessControllerImpl = ClocklessController<DATA_PIN, TIMING, RGB_ORDER, XTRA0, FLIP, WAIT_TIME>;
        ---
                CHIPSET::RESET,   // reset_us
        ---
        		WAIT_TIME = TIMING::RESET
      notes: >-
        reset_us below is the struct RESET field (what the ESP32 channel
        drivers and Teensy/SAM block controllers send); the classic
        controllers wait WAIT_TIME instead (280 unless the chip passes its
        own). Platform exceptions in the WAIT_TIME defaults: nrf51 uses 75, a
        few LPC channel drivers and one SAM variant use 0 (grep of
        `WAIT_TIME = ` in src/platforms at this commit).
    settings:
      - names: [WS2812, WS2812B, WS2852, NEOPIXEL]
        timing: TIMING_WS2812_800KHZ (via WS2812Controller800Khz)
        T0H: 250
        T1H: 875
        period: 1250
        reset_us: 280 # struct RESET and the default WAIT_TIME agree
        idle: low
        special: Overridable at compile time with FASTLED_WS2812_T1/T2/T3.
        permalink:
