      - url: https://www.enttec.com/pixel-protocols/
        quote: Easily create a custom protocol on your ENTTEC pixel controller for any fixture—anytime (criteria apply), no firmware update needed.
      - url: https://www.enttec.com/pixel-protocols/buying-real-pixel-chips
        quote: Manufacturing rejects and lower-grade parts are routinely re-marked, sometimes laser-etched, with a premium chip's name. A strip sold as a well-known protocol may not contain that part at all, so two reels with identical labels can behave very differently.
      - url: https://www.enttec.com/pixel-protocols/buying-real-pixel-chips
        quote: One production run performs flawlessly; the next brings dead pixels, colour shift, timing drift, or early failures, with nothing changed on the datasheet.
    open: >-
      ENTTEC's "Custom Protocol Creation Guide" (linked from the page) was not
      found as a URL in the page source and was not read, so the parameters an
      ENTTEC custom protocol exposes are unknown here.

# ---------------------------------------------------------------------------
# 3. Measurements of real parts
# ---------------------------------------------------------------------------
measurements:
  cpldcpu_2014_ws2812:
    title: 'Light_WS2812 library V2.0 - Part I: Understanding the WS2812 (Tim, "cpldcpu")'
    url: https://cpldcpu.github.io/2014/01/14/light_ws2812-library-v2-0-part-i-understanding-the-ws2812/
    table_image: https://cpldcpu.github.io/2014/01/14/light_ws2812-library-v2-0-part-i-understanding-the-ws2812/ws2812_timing_table.png
    date: '2014-01-14'
    parts: WS2812 (6-pin, "WS2812(S)") and WS2812B (4-pin), the two revisions on the market in January 2014
    method: ATtiny85 as generator, Din and Dout on a Saleae logic analyser (24 MHz); input high time and period swept from 62.5 ns to 4 µs in 62.5 ns steps; the reshaped Dout shows how each bit was read.
    results: # read from the table image (verbatim cells)
      WS2812B:
        {
          T_HI_IN_0: '62.5 ns - 563 ns',
          T_HI_IN_1: '≥ 625 ns',
          T_PERIOD_IN: '≥ 1063 ns',
          T_DELAY_IN_OUT: '~ 208 ns',
          T_HI_OUT_0: '~ 416 ns',
          T_HI_OUT_1: '~ 832 ns',
          T_RESET: '> 9 µs',
        }
      WS2812:
        {
          T_HI_IN_0: '62.5 ns - 500 ns',
          T_HI_IN_1: '≥ 563 ns',
          T_PERIOD_IN: '≥ 875 ns',
          T_DELAY_IN_OUT: '~ 166 ns',
          T_HI_OUT_0: '~ 333 ns',
          T_HI_OUT_1: '~ 666 ns',
          T_RESET: '> 10.8 µs',
        }
      cycles:
        {
          T_HI_IN_0: '<3',
          T_HI_IN_1: '>3',
          T_PERIOD_IN: '>5',
          T_DELAY_IN_OUT: '1',
          T_HI_OUT_0: '2',
          T_HI_OUT_1: '4',
        }
    quote: |-
      One of the first observations was that the delay between the leading edge of the input pulse and the leading edge of the output pulse, T_delay_in_out , was constant regardless of the timing of the input pulse.
      Even the shortest input pulse (62.5 ns) is identified as "0", while even the longest input pulse (1250-62.5=1187.5 ns) is identified as a "1". The threshold between "0" and "1" is somewhere between 563 and 625 ns.
      The shortest pulse period time where all input pulses appeared on the data output was 1063 ns. Below that the input pulses were partially or fully rejected. Above this threshold all input pulses were interpreted correctly and the period of the output signal reflected the period of the input signal up to 9 us when the reset condition was met.
      For the WS2812 under test here, the minimum reset length was 8.95 us, way below the specifications. The suggested reset time of 50 us is therefore more than sufficient to reset the LEDs. On the other hand, it means that no more than 9 us of idle time may occur during data transfer, or a reset may mistakenly be issued.
      It is possible that there are significant differences between production batches of both types, therefore these number can only serve as a rough indication. All timings seem to be a bit shorter on the WS2812.
      An interesting observation is that the timing values for both LEDs are multiples of a smaller number, ~208 ns for the WS2812B and ~166 ns of the WS2812. It appears that the internal controller circuit is actually a clocked design - possibly realized by a small state machine.
      The internal WS2812 state machine only needs to sample the input twice per bit: First, it waits for a rising edge of the input. This will initiate the sequence above. The input is latched again after cycle 2. The voltage of the input pin at this point determines whether a '1' or a '0' is read.
      A "0" can be encoded with a pulse as short as 62.5 ns, but should not be longer than ~500 ns (maximum on WS2812).
      A "1" can be encoded with pulses almost as long as the total cycle time, but it should not be shorter than ~625 ns (minimum on WS2812B).
    sampling_point: >-
      A fixed delay after the rising edge, counted by an internal clock: the
      table puts the 0/1 boundary at 3 internal cycles (WS2812B: between 563
      and 625 ns, cycle ~208 ns; WS2812: between 500 and 563 ns, cycle ~166 ns).
      The prose says the input "is latched again after cycle 2".
    caveats:
      - One or a few samples of each type, from early 2014; batch-to-batch differences not measured ("can only serve as a rough indication").
      - The prose reset figure (8.95 µs, "the WS2812 under test") matches the table's WS2812B column (> 9 µs), not its WS2812 column (> 10.8 µs).
      - Pre-dates the 2016/2017 WS2812B revision (reset >280 µs).

  cpldcpu_2016_sk6812:
    title: The SK6812 - another intelligent RGB LED
    url: https://cpldcpu.github.io/2016/03/09/the-sk6812-another-intelligent-rgb-led/
    table_image: https://cpldcpu.github.io/2016/03/09/the-sk6812-another-intelligent-rgb-led/table.png
    date: '2016-03-09'
    parts: WS2812(S), WS2812B, WS2812D (8 mm), PD9823 (5/8 mm), SK6812 — same method as 2014
    results: # verbatim cells; parentheses and tbd as printed
      WS2812S:
        {
          T_HI_IN_0: '62.5 ns - 500 ns',
          T_HI_IN_1: '≥ 563 ns',
          T_PERIOD_IN: '≥ 875 ns',
          T_DELAY_IN_OUT: '~ 166 ns',
          T_HI_OUT_0: '~ 333 ns',
          T_HI_OUT_1: '~ 666 ns',
          T_RESET: '> 10.8 µs',
          PWM_clk: tbd,
        }
      WS2812B:
        {
          T_HI_IN_0: '62.5 ns - 563 ns',
          T_HI_IN_1: '≥ 625 ns',
          T_PERIOD_IN: '≥ 1063 ns',
          T_DELAY_IN_OUT: '~ 208 ns',
          T_HI_OUT_0: '~ 416 ns',
          T_HI_OUT_1: '~ 832 ns',
          T_RESET: '> 9 µs',
          PWM_clk: '~ 430 Hz',
        }
      WS2812D_8mm:
        {
          T_HI_IN_0: '62.5 ns - 600 ns',
          T_HI_IN_1: '≥ 625 ns',
          T_PERIOD_IN: '≥ 1063 ns',
          T_DELAY_IN_OUT: '~ 208 ns',
          T_HI_OUT_0: '~ 408 ns',
          T_HI_OUT_1: '~ 812 ns',
          T_RESET: tbd,
          PWM_clk: tbd,
        }
      PD9823:
        {
          T_HI_IN_0: '62.5 ns - 600 ns',
          T_HI_IN_1: '≥ 625 ns',
          T_PERIOD_IN: '≥ 1000 ns',
          T_DELAY_IN_OUT: '~ 190 ns',
          T_HI_OUT_0: '~ 380 ns',
          T_HI_OUT_1: '~ 760 ns',
          T_RESET: '> 14 µs',
          PWM_clk: tbd,
        }
      SK6812:
        {
          T_HI_IN_0: tbd,
          T_HI_IN_1: '(≥ 440 ns)',
          T_PERIOD_IN: '(≥ 725 ns)',
          T_DELAY_IN_OUT: tbd,
          T_HI_OUT_0: '~ 290 ns',
          T_HI_OUT_1: '(580 ns)',
          T_RESET: tbd,
          PWM_clk: '~ 1.1 kHz',
        }
    quote: |-
      The SK6812 is a direct clone of the WS2812B, while the SK6812mini comes in a smaller package with a 3.5x3.5mm^2 footprint.
      The timing of the SK6812 is slightly faster than that of the WS2812 ("High" timing is 440 ns vs. 625 ns). However, I don't expect any issues with the timing of existing WS2812 libraries, such as the light_ws2812 library .
      Apart from the standard version, the SK6812 also comes in a RGBW version with 4 channels. This adds a white channel to the normal RGB version, which can be used for better color reproduction. This version needs 4 data values per LED. Other than that it seems to be functionally identical to the normal 3 channel controller.
      As with many components from mainland china, it seems very difficult to identify the actual manufacturer of these devices, as vendors tend to rebrand data sheets.
    caveats:
      - SK6812 values are partly tbd or in parentheses (as printed); the 0/1 threshold of ~440 ns is lower than the WS2812 family's 500–625 ns.

  cpldcpu_2014_pd9823:
    title: Timing of WS2812 clones – PD9823
    url: https://web.archive.org/web/20150928223018/https://cpldcpu.wordpress.com/2014/06/16/timing-of-ws2812-clones-pd9823/
    original_url: https://cpldcpu.wordpress.com/2014/06/16/timing-of-ws2812-clones-pd9823/ # 404 on the blog's new home cpldcpu.github.io
    date: '2014-06-16'
    parts: PD9823 (controller maker given as "BaiCheng")
    quote: |-
      The internal state machine of the PD9823 seems to be identical to that of the WS2812. The base timing of the PD9823 is 190 ns, which falls exactly between the WS2812S with 166 ns and the WS2812B with 208 ns. One notable difference is a slightly longer minimum reset pulse length. However, this should not be an issue when adhering to the recommended reset timing of 50 µs.
      In conclusion: Any software library that is able to drive the WS2812(B) is also able to drive the PD9823. No need to change anything.
    note: >-
      Spelled PD9823 throughout; a pingback on the same page calls a part
      "PL9823-F5". Whether PD9823 = PL9823 is not established here. FastLED
      sends PL9823 a 1710 ns cell (350/1360) and FPP a 1750 ns cell; cpldcpu
      measured PD9823 as WS2812-compatible (period ≥ 1000 ns, 0/1 at 600/625).

  cpldcpu_2014_ws2812d:
    title: New member of the WS2812 family (8 mm through-hole WS2812D)
    url: https://web.archive.org/web/20151018235236/https://cpldcpu.wordpress.com/2014/02/18/new-member-of-the-ws2812-family/
    date: '2014-02-18'
    quote: A summary of the timing values compared with the earlier WS2812 LEDS is shown above. As you can see, the timing is virtually identical to the WS2812B timing. This means that the light_ws2812 library is able to support these devices without any modifications.

  josh_levine_2014:
    title: 'NeoPixels Revealed: How to (not need to) generate precisely timed signals'
    url: https://wp.josh.com/2014/05/13/ws2812-neopixels-are-not-so-finicky-once-you-get-to-know-them/
    date: '2014-05-13' # updates 6/12/2014, 11/11/2018, 11/2/2020
    parts: >-
      "NeoPixels and WS2812's" (2014 parts; WS2812/WS2812B, revision not
      stated; "lots and lots of NeoPixels and WS2812's").
    results:
      T0H: { min: 200, typical: 350, max: 500 } # "the single tight maximum of 500ns"
      T1H: { min: 550, typical: 700, max_in_a_string: 5500 }
      TLD_data_low: { min: 450, typical: 600, max: 5000 }
      TLL_latch_low: { min: 6000 }
    quote: |-
      Simplified timing constraints for driving a NeoPixel
      T0H | 0 code ,high voltage time | 200 | 350 | 500 | ns
      T1H | 1 code ,high voltage time | 550 | 700 | ns
      TLD | data, low voltage time | 450 | 600 | 5,000 | ns
      TLL | latch, low voltage time | 6,000 | ns
      The only tight timing parameter for NeoPixel signaling is the maximum width of a 0-bit pulse
      There is no bound for the maximum width of a 1-bit that a Neopixel will accept.
      It turns out empirically that the maximum TLD width is about 5-6us despite what the datasheet says. Really. Leave the signal low for just 6us and the LED will latch.
      A: I've tried lots and lots of NeoPixels and WS2812's and I can not find one that needs more than 6us of low signal to latch. If you find one that needs longer, please let me know!
      UPDATE 11/2/2020: There are some new WS2812B and WS2813 chips that require a minimum 250,000ns latch time. If you are seeing lots of flashing, you might have some of these new chips so try increasing the latch low time.
    caveats:
      - The table rows are HTML tables in the post; cells are joined here with " | " (Symbol | Parameter | Min | Typical | Max | Units, empty cells dropped).
      - The min/typical/max table columns are Josh's reading of the WS2812 datasheet plus his measurements; only the 5–6 µs latch and the unbounded single-pixel T1H are stated as measured.
      - The 2020 update's 250 µs figure is given without a measurement or a source document (it links Adafruit's 2017 PSA, which says 300 µs).

  josh_levine_2014_reshaping:
    title: 'NeoPixels Revealed: Eavesdroping on signal reshaping between pixels'
    url: https://wp.josh.com/2014/05/15/going-nsa-on-pixel-conversations/
    date: '2014-05-15'
    quote: |-
      Here an out-of-spec 186ns 0-bit runt gets stretched into lovely in-spec 386ns 0-bit.
      Here an out-of-spec 560ns 0-bit whale gets compressed down into lovely in-spec 376ns 0-bit.
      So, it seems that this NeoPixel's idea of a perfect 0-bit is about 380ns, and it will reshape any out of spec 0-bit to meet that ideal.
      …and a long 872ns 1-bit getting squeezed down to a 768ns 1-bit. Looks like this pixel's dream 1-bit is about 770ns long.
      Like people, each NeoPixel has its own concept of what "ideal" means, and it can change over time.
      Here, a 7,000ns 1-bit is reshaped to a 720ns 1-bit followed by 6,280ns gap. The long 1-bit is thereby converted into a normal 1-bit followed by a reset.

  josh_levine_2014_breathe:
    title: 'NeoPixels Revealed: Why you should give your bits room to breathe'
    url: https://wp.josh.com/2014/05/16/why-you-should-give-your-neopixel-bits-room-to-breathe/
    date: '2014-05-16'
    quote: |-
      Unfortunately, the "ideal" bit size varies from pixel and even changes over time for a single pixel depending on temperature and voltage
      The bottom blue trace shows a perfectly valid 560ns wide 1-bit (spec says 700ns ±150ns = 550ns min) coming in, but the purple trace shows it going out the other side now reshaped to  a 376ns wide 0-bit.

  worldsemi_change_notice_via_particle:
    title: Heads up – WS2812B NeoPixels are about to change! (Particle blog, quoting WorldSemi's upgrade notice)
    url: https://www.particle.io/blog/heads-up-ws2812b-neopixels-are-about-to-change/
    date: '2017-05-12' # datePublished in the page
    parts: WS2812B, "upgraded" parts with the same part number
    quote: |-
      The original manufacturer, WorldSemi, released a low visibility change notice last December that is just starting to hit new runs of their WS2812B NeoPixels.
      4. "Old & New chips are exactly the same as in Timing, Data transmission and Data structure. However, the Reset Time increased from >50us to >280us. It won't cause wrong reset while interruption, and what's more, it supports the lower frequency and inexpensive MCU. When the "Reset Time<280us", don't mixed up and kindly please make necessary amends."
      Our test firmware included a reset delay of only 10us, well below the new 280us minimum. As a result, we had to update our test firmware as well as Internet Button and NeoPixel firmware libraries to accommodate the new minimum reset delay.
    note: Field evidence that a 10 µs reset (which worked on the old parts) failed on new parts; the actual threshold of the new parts was not measured.

  adafruit_psa_2017:
    title: 'PSA: The WS2812B RGB LED has been revised, will require code tweak!'
    url: https://blog.adafruit.com/2017/05/03/psa-the-ws2812b-rgb-led-has-been-revised-will-require-code-tweak/
    read_via: https://web.archive.org/web/20250322030505/https://blog.adafruit.com/2017/05/03/psa-the-ws2812b-rgb-led-has-been-revised-will-require-code-tweak/ # direct fetch returned 403
    date: '2017-05-03'
    quote: |-
      The WorldSemi WS2812B RGB LED has been revised with new silicon (date codes from 2017), and an unannounced change that is breaking current code has happened: the reset time has gone from 50 microseconds to 300 microseconds according to the datasheet.
      So in order to get these to work the new minimum reset time is 300 microseconds, check your code!

  verbeure_2019:
    title: WS2812B Reset Old & New
    url: https://tomverbeure.github.io/2019/10/13/WS2812B_Reset_Old_and_New.html
    date: '2019-10-13'
    quote: |-
      The old one requires an idle time ("reset") of 50us or more. On the new one, that has been increased to 280us. That makes them
      backwards incompatible…
      You can distinguish old and new by the pattern inside the LED eye:
    note: A datasheet comparison plus an anecdote (an old-reset driver failed on a new board); no threshold measurement.

  hackaday_io_183586:
    title: WS2812B Protocol Testing w/ Attiny13a (project "WS2812 Controller")
    url: https://hackaday.io/project/183586/log/202583
    date: null # page shows dates 01/20/2022 – 01/28/2022; which is this log's is not clear
    parts: WS2812B, revision not stated
    quote: Testing the reset command, it looks like the IC follows its spec closely. It won't reset below a 50us hold time. In this capture the signal was held low for approximately 50us but the LED did not update (cursors were likely a bit offset here). Increasing the delay to 55us and the IC worked as expected.
    note: One part, hobbyist log; contrasts with cpldcpu's 2014 WS2812B (> 9 µs) and Josh's 6 µs.

field_reports_in_code: # observations embedded in transmitter source, quoted from the pinned commits above
  fastled_gs1903:
    permalink:
      - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/fl/chipsets/led_timing.h#L390-L398
    quote: |-
      /// @note Same bit timing as the SM16703, but the GS1903 datasheet specifies a
      ///       ±50ns tolerance -- a third of the WS2812's ±150ns. That is why this
      ///       has its own entry rather than reusing WS2812 timing: at TH0=250ns /
      ///       TH1=875ns the WS2812 numbers sit outside the GS1903's window, which
      ///       produced the intermittent "sometimes works, sometimes doesn't"
      ///       behavior reported in issue #739.
  fpp_dpi_417ns:
    permalink:
      - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/non-gpl/DPIPixels/DPIPixels.cpp#L66-L69
    quote: |-
      // 0-bit high of 100-400ns, SK6812/WS2815 150-450, WS2812B 250-550.  The old
      // even thirds gave 417ns, outside the WS2811 window, and the first pixel on a
      // string of older WS2811 parts (the only one that sees the Pi's raw edge,
      // every later pixel gets a regenerated one) would randomly read 0 bits as 1.
  neopixelbus_3step_ws2816b:
    url: https://github.com/Makuna/NeoPixelBus/wiki/Neo-Methods/97bea1dda774b1df6a425c670207093055228368
    quote: However, this default may not work reliably with LEDs that have tighter timing requirements, such as the WS2816B.
  espixelstick_seed_pixels:
    permalink:
      - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputWS2811.hpp#L51-L60
    quote: '    // values have been adjusted to work with seed pixels.'
  fastled_tx1813n1:
    permalink:
      - https://github.com/FastLED/FastLED/blob/5e831b8203bc9237394f7f5b01b1a2ca40740e81/src/FastLED.h#L356-L362
    quote: |-
      /// @details Protocol-compatible with TM1829 per reporter field-testing on
      /// 2.2 mm × 2.2 mm 2020-package parts. Uses the TM1829 800 kHz timing.

# ---------------------------------------------------------------------------
# 4. Disagreements between sources (each side quoted above)
# ---------------------------------------------------------------------------
disagreements:
  - topic: TM18xx polarity
    detail: >-
      NeoPixelBus sends TM1814, TM1829 and TM1914 inverted (idle high);
      ESPixelStick inverts TM1814; FPP inverts only tm1814/tm1814a, while its
      own comment says tm1914 "is inverted like the rest of the TM18xx family"
      and its ws281x (non-inverted) list contains tm1809 and tm1812. FastLED
      sends TM1809/TM1804/TM1812/TM1803 non-inverted and asks for FLIP only on
      TM1829 (honoured on nRF52 only). xLights and Falcon list TM1803, TM1804,
      TM1809, TM1812 and TM1914 as WS2811 alternatives. The chip datasheets
      (batch b1-titan) have to settle which TM18xx parts idle high.
  - topic: UCS1903 speed
    detail: >-
      FastLED "UCS1903" = 400 kHz (500/2000/2500) and "UCS1903B" = 800 kHz
      (400/850/1300); FPP ucs1903 = 400 kHz (500/2000/2500); ESPixelStick
      UCS1903 = 800 kHz (250/1000/1250) with a 25 µs idle; Advatek "400 -
      800kbps"; xLights/Falcon put UCS1903 in the WS2811 (800 kHz) group.
  - topic: APA106 / PL9823 / SK6822 cell
    detail: >-
      FastLED APA106 = SK6822 timing (375/1375, 1750 ns) and PL9823 (350/1360,
      1710 ns); NeoPixelBus/WLED "APA106/PL9823" = 350/1350, 1700 ns (ESP32
      RMT) but the 400 kbps method on ARM; FPP puts sk6822 and pl9823 on a 1750
      ns cell but apa106 in the ws281x group (320/750, 1120 ns); FastLED APA104
      = WS2811 800 kHz (250/600). xLights/Falcon list APA104, APA106, PL9823 and
      SK6822 as WS2811 alternatives.
  - topic: WS2814 and WS2805
    detail: >-
      NeoPixelBus maps NeoWs2814Method to the WS2805 class (300/790, 1090 ns,
      300 µs); FastLED WS2814 = 320/640, 1280 ns, 300 µs; WLED's
      "SK6812/WS2814 RGBW" type sends the SK6812 class (400/800, 1250 ns, 80
      µs); FPP puts ws2814 in the ws281x group (320/750, 1120 ns). NeoPixelBus's
      own WS2805 period is 1090 ns on RMT/RP2040/UART but BitSendTimeNs = 1125
      in NeoBits (I2S/DMA).
  - topic: WS2815
    detail: >-
      FastLED WS2815 = 250/1340 with a 1890 ns cell labelled "@ 400 kHz";
      everyone else that names it (FPP ws281x group, xLights/Falcon WS2811
      group) uses the 800 kHz family cell; Advatek lists 800kbps.
  - topic: GS8208 / GS1903
    detail: >-
      ESPixelStick sends GS8208 at 1 MHz (250/750); FPP lists gs8206/gs8208 in
      the ws281x group (1120 ns); Advatek "400 - 1000kbps". FastLED GS1903 =
      300/900, 1200 ns, after WS2812 timing failed in the field; NeoPixelBus
      GS1903 = 300/900, 1200 ns, 40 µs reset.
  - topic: WS2811 "800 kHz" waveform
    detail: >-
      FastLED WS2811 = 250/600 (1250); NeoPixelBus NeoWs2811Method = the
      Ws2812x class (400/800, 300 µs) although a separate Ws2811 class
      (300/900) exists; ESPixelStick WS2811 = 300/700 with 1200/1300 ns cells
      (ESP32) or 312/975 (ESP8266); ESP-IDF LED_MODEL_WS2811 is the 400 kHz
      cell (500/1200, 2500 ns, 50 µs). Advatek and ENTTEC list WS2811 and WS2811
      V1.4 as separate types ("different data timing").
  - topic: FPP's ws281x period
    detail: >-
      FPP's comment calls the family "same bit cell, same 1.25us period" but the
      authoritative timing is { 320, 750, 1120 } (a 1120 ns cell); the DPI
      driver uses a 1.25 µs cell (312/729).
  - topic: New WS2812B reset value
    detail: >-
      WorldSemi's notice (via Particle) says >280 µs; Adafruit's PSA says 300
      µs "according to the datasheet"; Josh Levine's 2020 update says 250,000
      ns. Libraries send 280 (FastLED, ESP-IDF), 300 (NeoPixelBus Ws2812x,
      Adafruit, rpi_ws281x wait), 350 (ESPixelStick), but 50 µs from
      NeoPixelBus's 800Kbps/"Ws2812" class (which WLED uses on the ESP8266 DMA
      pin and the ESP32 I2S UCS890x/FW1906 paths) and from ESP-IDF's WS2811.
  - topic: Equal bit cells
    detail: >-
      ESP-IDF WS2812 sends a 1200 ns 0-cell and a 1500 ns 1-cell; ESP-IDF
      SK6812 and ESPixelStick's ESP32 WS2811 send 1200/1300 ns. Every other
      transmitter here uses one cell length for both bit values.

database_corrections: [] # this batch read no database entries

open:
  - ENTTEC's Custom Protocol Creation Guide (what timing parameters a custom ENTTEC protocol exposes) — not located.
  - No measurement found of the 2016/2017+ WS2812B ("V5") or WS2813/WS2815/SK6812 reset threshold or 0/1 sampling point; the >280 µs figure is the maker's notice, not a measurement. The only post-2017 data point is one hobbyist WS2812B needing ~55 µs (revision unknown).
  - SK6812 threshold (≥ 440 ns, period ≥ 725 ns) is printed in parentheses / tbd in cpldcpu's table; no second measurement found.
  - Falcon's firmware cell for each "WS2811 alternative" is not published; whether Falcon sends TM1803 / UCS1903 / SK6822 on the WS2811 cell is unknown.
  - Advatek publishes no timing; whether PixLite sends distinct cells per IC type is not stated on the pages read.
  - cpldcpu's 2020 "Power analysis: Probing WS2812 RGB LEDs" post (internal oscillator) returned 404 at cpldcpu.github.io and was not read.
