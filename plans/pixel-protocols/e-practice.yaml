  # -------------------------------------------------------------------------
  neopixelbus:
    name: NeoPixelBus (Makuna)
    repo: https://github.com/Makuna/NeoPixelBus
    version: 2.8.4 (tag; release published 2025-05-02)
    commit: fd670ee534064ddf5765e4db63c213ba05bbe880
    commit_date: '2025-04-29'
    note_on_wled_pin: >-
      WLED v16.0.1 pins NeoPixelBus to commit 1d7ff38f14d04a976f9c6e365c83a232bcba04fc
      (master, 2026-02-15, 2 commits ahead of 2.8.4). I diffed the ESP32 RMT
      speed constants and NeoBits.h between the two: identical.
    model:
      text: >-
        Each chip-name "method" is an output driver bound to a speed class.
        The speed class fixes the waveform (ns high/low per bit on ESP32 RMT
        and ESP bit-bang; bit rate + a 3-step or 4-step cadence on I2S, DMA,
        UART and RP2040 PIO) and the reset time. Several chip names are
        typedefs of the same speed class. "Inverted" speed bases idle high.
      wiki:
        url: https://github.com/Makuna/NeoPixelBus/wiki/Neo-Methods/97bea1dda774b1df6a425c670207093055228368
        revision: 97bea1dda774b1df6a425c670207093055228368 (wiki commit, 2026-02-16)
        quote: |-
          * Neo**Ws2812x**Method - (WS2812a, WS2812b, WS2812c, etc) The most compatible and if yours isn't listed below a good first selection.
          * Neo**Ws2812**Method - (WS2812) An older model pre WS2812b.
          * Neo**Ws2813**Method - (WS2813)
          * Neo**Ws2811**Method - (WS2811) Standalone chip.  Also used with a SevenSegmentFeature when several drive a 7-segment LED.
          * Neo**Ws2816**Method - (WS2816) 16-bit color elements, make sure to use NeoGrbWs2816Feature.
          * Neo**Sk6812**Method - (SK6812) A RGBW variant, make sure to use a RGBW color feature.
          * Neo**Lc8812**Method - (LC8812)
          * Neo**Apa106**Method - (APA106)
          * Neo**Tx1812**Method - (TX1812)
          * Neo**Tm1814**Method - (TM1814) A RGBW variant, used with NeoWrgbTm1814Feature.
          * Neo**Tm1914**Method - (TM1914) used with NeoRgbTm1914Feature.
          * Neo**Tm1829**Method - (TM1829)
          * Neo**400Kbps**Method - old slower speed standard that started this all.
          ---
          By default NeoPixelBus on ESP32 uses a 3-step I2S cadence with a 33/66% duty cycle, which saves around 25% on memory consumption compared with the 4-step cadence. However, this default may not work reliably with LEDs that have tighter timing requirements, such as the WS2816B.
    name_groups:
      text: >-
        Same typedef on every platform: NeoWs2811Method, NeoWs2813Method,
        NeoWs2816Method -> the Ws2812x speed; NeoLc8812Method -> Sk6812;
        NeoWs2814Method -> Ws2805; NeoWs2812Method -> 800Kbps (the 50 µs
        reset); NeoTm1914 inverted methods -> Tm1814 on bit-bang and ESP8266
        DMA. NeoWs2811Method does NOT use the separate Ws2811 speed class.
      permalink:
        - https://github.com/Makuna/NeoPixelBus/blob/fd670ee534064ddf5765e4db63c213ba05bbe880/src/internal/methods/NeoEsp32RmtMethod.h#L987-L1004
        - https://github.com/Makuna/NeoPixelBus/blob/fd670ee534064ddf5765e4db63c213ba05bbe880/src/internal/methods/NeoArmMethod.h#L926-L937
      quote: |-
        typedef NeoEsp32Rmt1Ws2812xMethod NeoWs2813Method;
        typedef NeoEsp32Rmt1Ws2812xMethod NeoWs2812xMethod;
        typedef NeoEsp32Rmt1800KbpsMethod NeoWs2812Method;
        typedef NeoEsp32Rmt1Ws2812xMethod NeoWs2811Method;
        typedef NeoEsp32Rmt1Ws2812xMethod NeoWs2816Method;
        typedef NeoEsp32Rmt1Ws2805Method NeoWs2805Method;
        typedef NeoEsp32Rmt1Ws2814Method NeoWs2814Method;
        typedef NeoEsp32Rmt1Sk6812Method NeoSk6812Method;
        typedef NeoEsp32Rmt1Tm1814Method NeoTm1814Method;
        typedef NeoEsp32Rmt1Tm1829Method NeoTm1829Method;
        typedef NeoEsp32Rmt1Tm1914Method NeoTm1914Method;
        typedef NeoEsp32Rmt1Sk6812Method NeoLc8812Method;
        typedef NeoEsp32Rmt1Apa106Method NeoApa106Method;
        typedef NeoEsp32Rmt1Tx1812Method NeoTx1812Method;
        typedef NeoEsp32Rmt1Gs1903Method NeoGs1903Method;
        ---
        typedef NeoArmWs2812xMethod NeoWs2813Method;
        typedef NeoArmWs2812xMethod NeoWs2812xMethod;
        typedef NeoArmWs2812xMethod NeoWs2811Method;
        typedef NeoArmWs2812xMethod NeoWs2816Method;
        typedef NeoArmWs2805Method NeoWs2805Method;
        typedef NeoArmWs2805Method NeoWs2814Method;
        typedef NeoArmSk6812Method NeoSk6812Method;
        typedef NeoArmSk6812Method NeoLc8812Method;
        typedef NeoArm800KbpsMethod NeoWs2812Method;
        typedef NeoArmApa106Method NeoApa106Method;
      notes: >-
        The RMT block quoted is the default on ESP32-S2/S3/C3 (or with
        NEOPIXEL_ESP32_RMT_DEFAULT); on the original ESP32 the default
        NeoWs2812xMethod is I2S with the same NeoBits speed class (see
        esp32_i2s_and_esp8266_dma below). WLED does not use these defaults;
        it names the RMT/I2S methods explicitly.
    settings_esp32_rmt:
      text: ESP32 RMT speed classes (explicit ns high, ns low per bit; reset appended as low).
      permalink:
        - https://github.com/Makuna/NeoPixelBus/blob/fd670ee534064ddf5765e4db63c213ba05bbe880/src/internal/methods/NeoEsp32RmtMethod.h#L89-L296
      quote: |-
        inline constexpr static uint32_t Item32Val(uint16_t nsHigh, uint16_t nsLow)
        const static rmt_idle_level_t IdleLevel = RMT_IDLE_LEVEL_LOW;
        class NeoEsp32RmtInvertedSpeedBase : public NeoEsp32RmtSpeed
        const static rmt_idle_level_t IdleLevel = RMT_IDLE_LEVEL_HIGH;
        class NeoEsp32RmtSpeedWs2811 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(300, 950);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(900, 350);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(300000); // 300us
        class NeoEsp32RmtSpeedWs2812x : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(400, 850);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(800, 450);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(300000); // 300us
        class NeoEsp32RmtSpeedWs2805 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(300, 790);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(790, 300);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(300000); // spec is 280, intentionally longer for compatiblity use
        class NeoEsp32RmtSpeedSk6812 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(400, 850);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(800, 450);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(80000); // 80us
        // normal is inverted signal
        class NeoEsp32RmtSpeedTm1814 : public NeoEsp32RmtInvertedSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(360, 890);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(720, 530);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(200000); // 200us
        // normal is inverted signal
        class NeoEsp32RmtSpeedTm1829 : public NeoEsp32RmtInvertedSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(300, 900);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(800, 400);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(200000); // 200us
        // normal is inverted signal
        class NeoEsp32RmtSpeedTm1914 : public NeoEsp32RmtInvertedSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(360, 890);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(720, 530);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(200000); // 200us
        class NeoEsp32RmtSpeed800Kbps : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(400, 850);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(800, 450);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(50000); // 50us
        class NeoEsp32RmtSpeed400Kbps : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(800, 1700);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(1600, 900);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(50000); // 50us
        class NeoEsp32RmtSpeedApa106 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(350, 1350);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(1350, 350);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(50000); // 50us
        class NeoEsp32RmtSpeedTx1812 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(300, 600);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(600, 300);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(80000); // 80us
        class NeoEsp32RmtSpeedGs1903 : public NeoEsp32RmtSpeedBase
        const static DRAM_ATTR uint32_t RmtBit0 = Item32Val(300, 900);
        const static DRAM_ATTR uint32_t RmtBit1 = Item32Val(900, 300);
        const static DRAM_ATTR uint16_t RmtDurationReset = FromNs(40000); // 40us
