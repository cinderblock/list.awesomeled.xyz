  wled:
    name: WLED
    repo: https://github.com/wled/WLED
    version: v16.0.1 (tag; release published 2026-07-07)
    commit: 29b389df1c1aaec6ff53aea742d17063b985906c
    commit_date: '2026-06-30'
    model:
      text: >-
        WLED's "LED type" picks a NeoPixelBus method + colour feature. Timing is
        therefore NeoPixelBus's (see libraries.neopixelbus): ESP32 uses RMT
        (WLED's own high-priority RMT driver, which reuses NeoPixelBus's RMT
        speed classes) or I2S; ESP8266 uses UART0/UART1/DMA/bit-bang by pin.
        NeoPixelBus is pinned to commit 1d7ff38f.
      permalink:
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/platformio.ini#L167
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/bus_wrapper.h#L247-L253
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/lib/NeoESP32RmtHI/include/NeoEsp32RmtHIMethod.h#L184-L197
      quote: |2-
            https://github.com/Makuna/NeoPixelBus.git#1d7ff38f14d04a976f9c6e365c83a232bcba04fc
        ---
        #if !defined(WLED_USE_SHARED_RMT) && !defined(__riscv)
        #include <NeoEsp32RmtHIMethod.h>
        #define NeoEsp32RmtMethod(x) NeoEsp32RmtHIN ## x ## Method
        #else
        #define NeoEsp32RmtMethod(x) NeoEsp32RmtN ## x ## Method
        ---
        typedef NeoEsp32RmtHIMethodBase<NeoEsp32RmtSpeedWs2812x, NeoEsp32RmtChannelN> NeoEsp32RmtHINWs2812xMethod;
        typedef NeoEsp32RmtHIMethodBase<NeoEsp32RmtSpeedSk6812, NeoEsp32RmtChannelN> NeoEsp32RmtHINSk6812Method;
    led_types:
      permalink:
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/const.h#L316-L337
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/bus_manager.cpp#L352-L372
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/bus_wrapper.h#L144-L201
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/bus_wrapper.h#L255-L302
        - https://github.com/wled/WLED/blob/29b389df1c1aaec6ff53aea742d17063b985906c/wled00/bus_wrapper.h#L1314-L1386
      quote: |-
        #define TYPE_WS2812_1CH_X3       19            //white-only chips (3 channels per IC)
        #define TYPE_WS2812_WWA          21            //amber + warm + cold white
        #define TYPE_WS2812_RGB          22
        #define TYPE_GS8608              23            //same driver as WS2812, but will require signal 2x per second (else displays test pattern)
        #define TYPE_WS2811_400KHZ       24            //half-speed WS2812 protocol, used by very old WS2811 units
        #define TYPE_TM1829              25
        #define TYPE_UCS8903             26
        #define TYPE_APA106              27
        #define TYPE_FW1906              28            //RGB + CW + WW + unused channel (6 channels per IC)
        #define TYPE_UCS8904             29            //first RGBW digital type (hardcoded in busmanager.cpp)
        #define TYPE_SK6812_RGBW         30
        #define TYPE_TM1814              31
        #define TYPE_WS2805              32            //RGB + WW + CW
        #define TYPE_TM1914              33            //RGB
        #define TYPE_SM16825             34            //RGB + WW + CW
        ---
            {TYPE_WS2812_RGB,    "D",  PSTR("WS281x RGB")},
            {TYPE_WS2811_400KHZ, "D",  PSTR("400kHz RGB")},
            {TYPE_TM1829,        "D",  PSTR("TM1829 RGB")},
