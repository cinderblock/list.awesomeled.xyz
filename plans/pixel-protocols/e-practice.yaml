  espixelstick:
    name: ESPixelStick
    repo: https://github.com/forkineye/ESPixelStick
    version: main (latest GitHub release is v3.2 from 2020; main is what is developed)
    commit: 7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4
    commit_date: '2026-11-11'
    model:
      text: >-
        One output driver per protocol name: WS2811 (the single WS281x-family
        type), GS8208, UCS1903, UCS8903, TM1814, plus GECE, TLS3001, WS2801,
        APA102. Each has its own ns constants.
    settings:
      - names: [WS2811]
        esp32: { T0H: 300, T0L: 900, T1H: 700, T1L: 600 } # bit cells 1200 (0) and 1300 (1)
        esp8266: { T0H: 312, T1H: 975, period: 1250 }
        reset_us: 350
        idle: low
        special: ESP32 values "have been adjusted to work with seed pixels"; the 0 and 1 cells differ in length (1200 vs 1300 ns).
        permalink:
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputWS2811.hpp#L49-L71
        quote: |-
          #define WS2811_PIXEL_DATA_RATE              800000.0 // 800Khz
          #ifdef ARDUINO_ARCH_ESP32
              // values have been adjusted to work with seed pixels.
          //    #define WS2811_PIXEL_NS_BIT_0_HIGH      312.0 // = 312 on logic analyzer 220ns - 380ns per datasheet
          //    #define WS2811_PIXEL_NS_BIT_0_LOW       945.0 // = 937 on logic analyzer 580ns - 1.6us per datasheet
          //    #define WS2811_PIXEL_NS_BIT_1_HIGH      975.0 // = 937 on logic analyzer 580ns - 1.6us per datasheet
          //    #define WS2811_PIXEL_NS_BIT_1_LOW       300.0 // = 312 on logic analyzer 220ns - 380ns per datasheet
              #define WS2811_PIXEL_NS_BIT_0_HIGH      300.0 // 220ns - 380ns per datasheet
              #define WS2811_PIXEL_NS_BIT_0_LOW       900.0
              #define WS2811_PIXEL_NS_BIT_1_HIGH      700.0
              #define WS2811_PIXEL_NS_BIT_1_LOW       600.0
          #else
              #define WS2811_PIXEL_NS_BIT_0_HIGH      312.0 // 220ns - 380ns per datasheet
              #define WS2811_PIXEL_NS_BIT_0_LOW       (WS2811_PIXEL_NS_BIT_TOTAL - WS2811_PIXEL_NS_BIT_0_HIGH)
              #define WS2811_PIXEL_NS_BIT_1_HIGH      975.0 // 580ns - 1.6us per datasheet
              #define WS2811_PIXEL_NS_BIT_1_LOW       (WS2811_PIXEL_NS_BIT_TOTAL - WS2811_PIXEL_NS_BIT_1_HIGH)
          #endif // ARDUINO_ARCH_ESP32
          #define WS2811_PIXEL_IDLE_TIME_US           350.0 // 350us per datasheet
      - names: [GS8208]
        derived: true
        derivation: '1 MHz data rate; T0H = 0.25 × 1000 ns, T1H = 0.75 × 1000 ns'
        T0H: 250
        T1H: 750
        period: 1000
        reset_us: 300
        idle: low
        special: The comment says T1H is "600ns +/- 150ns per datasheet" while the code sends 750 ns.
        permalink:
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputGS8208.hpp#L50-L62
        quote: |-
          #define GS8208_PIXEL_DATA_RATE              1000000.0
          #define GS8208_PIXEL_NS_BIT_0_HIGH          (0.25 *  GS8208_PIXEL_NS_BIT_TOTAL) // 250ns +/- 150ns per datasheet
          #define GS8208_PIXEL_NS_BIT_1_HIGH          (0.75 * GS8208_PIXEL_NS_BIT_TOTAL) // 600ns +/- 150ns per datasheet
          #define GS8208_PIXEL_IDLE_TIME_NS           300000.0 // 300us per datasheet
      - names: [UCS1903]
        T0H: 250
        T1H: 1000
        period: 1250
        reset_us: 25
        idle: low
        special: 800 kHz with a 25 µs idle (FastLED's and FPP's "UCS1903" are 400 kHz).
        permalink:
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputUCS1903.hpp#L48-L60
        quote: |-
          #define UCS1903_PIXEL_DATA_RATE              800000.0
          #define UCS1903_PIXEL_NS_BIT_0_HIGH          250.0 // 250ns +/- 150ns per datasheet
          #define UCS1903_PIXEL_NS_BIT_1_HIGH          1000.0 // 1000ns +/- 150ns per datasheet
          #define UCS1903_PIXEL_IDLE_TIME_NS           25000.0 // 24us per datasheet
      - names: [UCS8903]
        T0H: 400
        T1H: 800
        period: 1200
        reset_us: 30
        idle: low
        special: 16-bit channels.
        permalink:
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputUCS8903.hpp#L50-L63
        quote: |-
          #define UCS8903_PIXEL_NS_BIT_TOTAL           (UCS8903_PIXEL_NS_BIT_0_HIGH + UCS8903_PIXEL_NS_BIT_0_LOW)
          #define UCS8903_PIXEL_NS_BIT_0_HIGH          400.0 // 400ns +/- 40ns per datasheet
          #define UCS8903_PIXEL_NS_BIT_0_LOW           800.0 // 800ns -0 per data sheet
          #define UCS8903_PIXEL_NS_BIT_1_HIGH          800.0 // 800ns +/- 150ns per datasheet
          #define UCS8903_PIXEL_NS_BIT_1_LOW           400.0 // 400ns -0 per data sheet
          #define UCS8903_PIXEL_IDLE_TIME_NS           30000.0 // >24us per datasheet
          #define UCS8903_INTENSITY_DATA_WIDTH         16
      - names: [TM1814]
        T0H: 375 # width of the active (low) pulse for a 0
        T1H: 800 # width of the active (low) pulse for a 1
        period: 1250
        reset_us: 500
        idle: high
        special: Data inverted (SetInvertData(true)); a current-limit preamble is prepended to every frame.
        permalink:
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/include/output/OutputTM1814.hpp#L47-L57
          - https://github.com/forkineye/ESPixelStick/blob/7f0d0e9be1743fec63c75ee29550ccc1b17f7eb4/src/output/OutputTM1814.cpp#L98-L105
        quote: |-
          #define TM1814_PIXEL_DATA_RATE              800000.0
          #define TM1814_PIXEL_NS_BIT_0_LOW           375.0 // 360ns +/- 50ns per datasheet
          #define TM1814_PIXEL_NS_BIT_0_HIGH          (TM1814_PIXEL_NS_BIT_TOTAL - TM1814_PIXEL_NS_BIT_0_LOW)
          #define TM1814_PIXEL_NS_BIT_1_LOW           800.0 // 720ns -70ns / +280ns per datasheet
          #define TM1814_PIXEL_NS_IDLE                500000.0 // 500us per datasheet
          ---
              uint8_t PreambleValue = map (CurrentLimit, 1, 100, 0, 63);
              memset ((void*)(&PreambleData.normal[0]), ~PreambleValue, sizeof (PreambleData.normal));
              memset ((void*)(&PreambleData.inverted[0]),  PreambleValue, sizeof (PreambleData.inverted));
              SetFramePrependInformation ( (uint8_t*)&PreambleData, sizeof (PreambleData));
              SetInvertData (true);

  # -------------------------------------------------------------------------
  fpp:
    name: Falcon Player (FPP)
    repo: https://github.com/FalconChristmas/fpp
    version: 10.4 (tag; release published 2026-11-09)
    commit: 123b8ca089b98a54f7f5c0b7ee7b72ed18217f21
    commit_date: '2026-11-09'
    model:
      text: >-
        The string drivers (BeagleBone PRU, Pi DPI) run ONE bit cell per
        controller, chosen from a few timing groups; every protocol name in a
        group gets the same cell. Inversion and preambles are per port.
      permalink:
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/www/co-pixelStrings.php#L949-L1018
      quote: |-
        // Bit timing groups.  T0, T1 and the end of the bit cell are single latch
        // instants shared by every port on the PRU, so a controller can only run
        // one bit cell at a time - which is exactly why this is picked once for the
        // controller and then filters what each port may be set to.
        // Each group is one exact bit cell, so every protocol in a group really is
        // interchangeable.  The timings mirror PixelString::protocolTiming(), which
        // is authoritative
            { id: 'ws281x', label: 'WS281x (800kHz)', t0: 320, t1: 750, period: 1120 },
            { id: 'ucs1903', label: 'UCS1903 (400kHz)', t0: 500, t1: 2000, period: 2500 },
            { id: 'tm1803', label: 'TM1803 (400kHz)', t0: 750, t1: 1875, period: 2625 },
            { id: 'gw6205', label: 'GW6205 (400kHz)', t0: 750, t1: 1625, period: 2375 },
            { id: 'tm1804', label: 'TM1804', t0: 500, t1: 1000, period: 1500 },
            { id: 'sk6822', label: 'SK6822', t0: 375, t1: 1375, period: 1750 },
            { id: 'ucs1912', label: 'UCS1912', t0: 250, t1: 1250, period: 1625 },
            { id: 'ge8822', label: 'GE8822', t0: 375, t1: 1000, period: 1375 }
        // Parts that are electrically a WS2811 at 800kHz: same bit cell, same
        // 1.25us period, so FPP drives them all with one timing and the choice is
        // a label rather than a behaviour.  Grouped as xLights groups them.
        // tm1914 is still absent: it is inverted like the rest of the TM18xx family
        // and wants a mode select preamble, so it needs real support rather than a
        // place in a list.
        var PIXEL_PROTOCOLS_WS281X = [
            'ws2811', 'ws2812', 'ws2812b', 'ws2813', 'ws2815', 'ws2818',
            'sk6812', 'sk6813', 'sm16703', 'gs8206', 'gs8208',
            'tm1809', 'tm1812', 'ucs1904', 'ucs2903', 'apa104', 'apa106',
            // the RGBW members of the same family - colour order picks the
            // channel count, so these behave identically too
            'apa109', 'sk6812rgbw', 'sk6818', 'sm16704', 'ucs2904', 'ws2814'
        ].join(',');
            'tm1814': { bytesPerChannel: 1, preamble: 8 },
            'tm1814a': { bytesPerChannel: 1, preamble: 8 },
            'ucs8903': { bytesPerChannel: 2, preamble: 0 },
            'ucs8904': { bytesPerChannel: 2, preamble: 0 },
            'ucs7604': { bytesPerChannel: 2, preamble: 0 },
        // Which protocols each timing group offers.  The ws281x group also carries
        // the parts that differ in polarity or bit width rather than timing -
        // tm1814 (inverted) and ucs8903/8904 (16 bit) - because those really are
        // per port and can sit alongside plain ws2811 on one controller.
            'ucs1903': 'ucs1903,ws2811slow',
            'sk6822': 'sk6822,pl9823',
    settings:
      - names:
          [
            ws2811,
            ws2812,
            ws2812b,
            ws2813,
            ws2815,
            ws2818,
            sk6812,
            sk6813,
            sm16703,
            gs8206,
            gs8208,
            tm1809,
            tm1812,
            ucs1904,
            ucs2903,
            apa104,
            apa106,
            apa109,
            sk6812rgbw,
            sk6818,
            sm16704,
            ucs2904,
            ws2814,
          ]
        T0H: 320
        T1H: 750
        period: 1120
        reset_us: null # not in these files
        idle: low
        special: tm1814/tm1814a ride the same cell inverted with an 8-byte current preamble; ucs8903/ucs8904 the same cell at 16 bits.
        permalink:
          - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/channeloutput/PixelString.cpp#L494-L529
        quote: |-
          // Per protocol bit cell.  Anything not listed is the 800kHz ws281x family,
          // which is the overwhelming majority and what the timing has always been.
          //
          // The listed ones are genuinely different parts, not aliases: driving them
          // with the ws281x cell does not merely shift an edge, it puts the pulse
          // outside the window the part decodes.  That is why they were kept out of the
          // protocol dropdown until the firmware could take its timing at runtime.
              // the ws281x family - see the alias list in co-pixelStrings.php
              static const Timing ws281x{ 320, 750, 1120 };
              // 400kHz parts: a 2.5us cell, twice the ws281x period
              if (protocol == "ucs1903" || protocol == "ws2811slow" || protocol == "ws2811 slow") {
                  return { 500, 2000, 2500 };
              if (protocol == "tm1803") {
                  return { 750, 1875, 2625 };
              if (protocol == "gw6205") {
                  return { 750, 1625, 2375 };
              // longer cell parts, between the two
              if (protocol == "tm1804" || protocol == "tm1809slow") {
                  return { 500, 1000, 1500 };
              if (protocol == "sk6822" || protocol == "pl9823") {
                  return { 375, 1375, 1750 };
              if (protocol == "ucs1912") {
                  return { 250, 1250, 1625 };
              if (protocol == "ge8822") {
                  return { 375, 1000, 1375 };
      - names: [ucs1903, ws2811slow, 'ws2811 slow']
        T0H: 500
        T1H: 2000
        period: 2500
      - names: [tm1803]
        T0H: 750
        T1H: 1875
        period: 2625
      - names: [gw6205]
        T0H: 750
        T1H: 1625
        period: 2375
      - names: [tm1804, tm1809slow]
        T0H: 500
        T1H: 1000
        period: 1500
      - names: [sk6822, pl9823]
        T0H: 375
        T1H: 1375
        period: 1750
      - names: [ucs1912]
        T0H: 250
        T1H: 1250
        period: 1625
      - names: [ge8822]
        T0H: 375
        T1H: 1000
        period: 1375
    inversion_and_preamble:
      permalink:
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/channeloutput/PixelString.cpp#L431-L461
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/channeloutput/PixelString.cpp#L544-L546
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/channeloutput/PixelString.cpp#L570-L575
      quote: |2-
                // per channel drive current; the part powers up at its 6.5mA floor, so
                // without this a TM1814 string just looks dim
                float mA = config.isMember("tm1814MilliAmps") ? config["tm1814MilliAmps"].asFloat() : 38.0f;
            // Cape declared inversion corrects a wiring defect; protocol inversion is
            // the pixel type asking for it.  Both flip the same line, so they compose
            // by xor and cancel when a TM18xx string lands on a backwards-wired port.
        ---
            return protocol == "tm1814" || protocol == "tm1814a";
        ---
        bool PixelString::isInvertedProtocol(const std::string& protocol) {
            // Only the protocols FPP can actually drive today.  The TM18xx bit cell
            // is close enough to ws2811 that the shared timing covers it; what makes
            // them different is the idle level.
            return protocol == "tm1814" || protocol == "tm1814a";
    dpi_output:
      text: >-
        Raspberry Pi DPI string output: a 1.25 µs cell of 48 framebuffer
        pixels at 38.4 MHz (26 ns each); 12 px high before the data section
        gives T0H 312 ns / T1H 729 ns. The old even-thirds layout (417 ns T0H)
        is kept only for the 4-latch-bank layout.
      T0H: 312
      T1H: 729
      period: 1250
      permalink:
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/non-gpl/DPIPixels/DPIPixels.cpp#L61-L84
        - https://github.com/FalconChristmas/fpp/blob/123b8ca089b98a54f7f5c0b7ee7b72ed18217f21/src/non-gpl/DPIPixels/DPIPixels.cpp#L110-L111
      quote: |-
        // FB pixels the non-latched WS bit stays high before its data section, i.e.
        // the 0-bit high time in 26ns steps.  The bit cell is 48 px: this many high,
        // then 16 px of data (high for a 1) written by PrepData(), then low.  12 gives
        // T0H 312ns / T1H 729ns, which is what FPP's PRU string drivers have shipped
        // for years (320/750) and sits inside every datasheet window: WS2811 wants a
        // 0-bit high of 100-400ns, SK6812/WS2815 150-450, WS2812B 250-550.  The old
        // even thirds gave 417ns, outside the WS2811 window, and the first pixel on a
        // string of older WS2811 parts (the only one that sees the Pi's raw edge,
        // every later pixel gets a regenerated one) would randomly read 0 bits as 1.
        ---
         * The width is 1920 and the pixel clock 38.4MHz, which makes each WS bit 48 FB
         * pixels (1.25us).

