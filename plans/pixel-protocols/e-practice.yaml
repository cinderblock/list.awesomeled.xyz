  xlights:
    name: xLights
    repo: https://github.com/xLightsSequencer/xLights
    version: 2026.20 (tag; release published 2026-11-12)
    commit: c86999e87f252a2ba7ad520580b134d36e434653
    commit_date: '2026-11-12'
    carries_timings: false
    model:
      text: >-
        An equivalence table used to map a model's pixel type to whatever name
        a controller lists ("exact match always wins over the group"). No
        timings. FPP's ws281x alias list says it is "Grouped as xLights groups
        them".
      permalink:
        - https://github.com/xLightsSequencer/xLights/blob/c86999e87f252a2ba7ad520580b134d36e434653/src-core/models/Pixels.cpp#L15-L29
        - https://github.com/xLightsSequencer/xLights/blob/c86999e87f252a2ba7ad520580b134d36e434653/src-core/models/Pixels.cpp#L99-L136
        - https://github.com/xLightsSequencer/xLights/blob/c86999e87f252a2ba7ad520580b134d36e434653/src-core/models/Pixels.cpp#L156-L161
      quote: |-
        // * The following table may not be accurate but it is my best understanding of protocol         *
        // * compatibility. This does not mean that controllers wont show them as separate or even that  *
        // * some controllers having timing that means that things which could be equivalent with the    *
        // * righting timing choice are not in reality. This makes things messy but I do think having    *
        // * this documented somewhere is essential.                                                     *
        // | WS2811         | RGB, 8 bit, 3 wire     | APA104, APA106, CS8812, GE8822, GS8202, GS8206,   |                                        |
        // |                |                        | GS8208, INK1002, INK1003, LPD1882,                |                                        |
        // |                |                        | LX1203, P9883, PL9823, SK6812, SK6813, SK6822,    |                                        |
        // |                |                        | SM16703, SM16711, SM16712, TM1803, TM1804,        |                                        |
        // |                |                        | TM1809, TM1812, TM1914, UCS1903, UCS1904,         |                                        |
        // |                |                        | UCS1909, UCS1912, UCS2903, UCS2909, UCS2912,      |                                        |
        // |                |                        | UCS9812, WS2811, WS2812, WS2813, WS2815, WS2818   |                                        |
        // GE8822 and PL9823 join the WS2811 group on the same basis as the SK6822 and TM1803 already
        // in it: a controller that can set its bit cell drives them as distinct parts, and one that
        // cannot is no worse off treating them as a WS2811 than it was before they were listed.
        // A controller that really does distinguish them lists them separately in its capabilities,
        // and an exact match always wins over the group.
            { "ws2811", // preferred & default
              "apa104", "apa106", "cs8812", "ge8822", "gs8202", "gs8206", "gs8208", "ink1002", "ink1003", "lb1908", "lpd1882",
              "lx1203", "p9883", "pl9823", "sk6812", "sk6813", "sk6822", "sm16703", "sm16711", "sm16712", "tm1803", "tm1804", "tm1809",
              "tm1812", "tm1914", "ucs1903", "ucs1904", "ucs1909", "ucs1912", "ucs2903", "ucs2909", "ucs2912", "ucs9812",
              "ws2812", "ws2812b", "ws2813", "ws2815", "ws2818",
              // artificial
              "tm18xx", "ws281x", "ws2811v1.4", "ws2811 slow", "gs820x", "gs8206/8"
            },
            { "apa109", "sk6812rgbw", "sk6818", "sm16704", "sm16804", "ucs2904", "ws2814" },
            { "tm1814", "tm1814a" },
            { "tm1829" },
            { "ucs9812" }, // I have not researched these
      notes: >-
        "ucs9812" appears both in the ws2811 group and as its own group (line
        161, "I have not researched these"); "ws2811 slow" is in the ws2811
        group although FPP and Falcon treat it as a 400 kHz cell.

  # -------------------------------------------------------------------------
  rpi_ws281x:
    name: rpi_ws281x (jgarff), the Raspberry Pi PWM/PCM/SPI driver
    repo: https://github.com/jgarff/rpi_ws281x
    version: master (latest tag v1.0.0)
    commit: 22f2e35012704845d82e06d2fa2e10fbc810ecaa
    commit_date: '2026-05-03'
    model:
      text: >-
        One waveform for every strip type (WS2811/WS2812/SK6812/SK6812W differ
        only in colour layout): 3 symbols per data bit at 3 × freq
        (freq default 800000), 0 = "100", 1 = "110" (from the convert table:
        0x00 encodes as 0x92 0x49 0x24 = 100 100 100 …), then 55 µs of low in the
        buffer, and the next render is held off 300 µs.
      derived: true
      T0H: 417
      T1H: 833
      period: 1250
      reset_us: 55 # in the DMA buffer; plus LED_RESET_WAIT_TIME 300 before the next render
      idle: low # invert flag per channel exists for an inverting level shifter
      permalink:
        - https://github.com/jgarff/rpi_ws281x/blob/22f2e35012704845d82e06d2fa2e10fbc810ecaa/ws2811.h#L44-L66
        - https://github.com/jgarff/rpi_ws281x/blob/22f2e35012704845d82e06d2fa2e10fbc810ecaa/ws2811.c#L61-L68
        - https://github.com/jgarff/rpi_ws281x/blob/22f2e35012704845d82e06d2fa2e10fbc810ecaa/ws2811.c#L354
        - https://github.com/jgarff/rpi_ws281x/blob/22f2e35012704845d82e06d2fa2e10fbc810ecaa/ws2811.c#L1132-L1137
        - https://github.com/jgarff/rpi_ws281x/blob/22f2e35012704845d82e06d2fa2e10fbc810ecaa/ws2811.c#L1287-L1289
      quote: |-
        #define WS2811_TARGET_FREQ                       800000   // Can go as low as 400000
        #define WS2812_STRIP                             WS2811_STRIP_GRB
        #define SK6812_STRIP                             WS2811_STRIP_GRB
        #define SK6812W_STRIP                            SK6812_STRIP_GRBW
        ---
        /* 4 colors (R, G, B + W), 8 bits per byte, 3 symbols per bit + 55uS low for reset signal */
        #define LED_RESET_uS                             55
        /* Minimum time to wait for reset to occur in microseconds. */
        #define LED_RESET_WAIT_TIME                      300
        ---
            cm_clk->div = CM_CLK_DIV_PASSWD | CM_CLK_DIV_DIVI(osc_freq / (3 * freq));
        ---
        	static uint8_t convert_table[3][256] =
        			0x92, 0x92, 0x92, 0x92, 0x92, 0x92, 0x92, 0x92, 0x92,
        ---
            // LED_RESET_WAIT_TIME is added to allow enough time for the reset to occur.
            ws2811->render_wait_time = protocol_time + LED_RESET_WAIT_TIME;

