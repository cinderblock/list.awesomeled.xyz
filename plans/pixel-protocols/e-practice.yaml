            {TYPE_APA106,        "D",  PSTR("APA106/PL9823 RGB")},
            {TYPE_TM1914,        "D",  PSTR("TM1914 RGB")},
            {TYPE_SK6812_RGBW,   "D",  PSTR("SK6812/WS2814 RGBW")},
