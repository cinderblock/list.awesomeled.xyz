      - 'Controller T1H: 0.9 µs here vs 0.85 µs in the UCS1904 and UCS1912B tables; T1L ≥0.35 µs here vs ≥0.4 µs.'
    open:
      - Frame length in 6-channel mode (SET to VDD) is not printed; 48 bits is the obvious guess but unconfirmed.

