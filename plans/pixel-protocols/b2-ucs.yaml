        doc: ucs1912b-ver2.3-cn
        page: 6
        quote: '5）下表800K 模式时间(芯片内部再生信号标准) | T0H | 0 码，高电平时间 | 0.4µs | ±40ns | T1H | 1 码，高电平时间 | 0.8µs | ±80ns | T0L | 0 码，低电平时间 | 0.85µs | T1L | 1 码，低电平时间 | 0.45µs | Treset | Reset 码，低电平时间 | 》24us'
      - name: 800K, controller send (6）控制器建议值)
        table: controller send
        select: null
