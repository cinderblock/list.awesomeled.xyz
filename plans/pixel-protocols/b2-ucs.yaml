    maker_note:
      doc: szucs-ucs1912b-note
      quote: '数据传输频率 800K/秒，可实现画面刷新速率 30 帧 / 秒时，不小于 1024 点 ; 输出端口 PWM 控制能够实现 256 级灰度调节，端口扫描频率 1.8KHz / s'
    controller_claims: []
    disagreements:
      - 'Port scan: datasheet p1 "端口扫描频率1.5KHz/s" vs maker application note and table 1.8 kHz.'
      - 'Controller table period "》1.25" has no unit (p7); the chip-output note on p6 says 1.25us.'
    open: []

