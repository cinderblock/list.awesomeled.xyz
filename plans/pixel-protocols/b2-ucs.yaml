  - part: UCS1909
    entry: pixel-ics/ucs1909
    maker: not named in the document (distributor copy); same part family as UCS1909B below
    documents:
      - id: ucs1909-cn
        url: https://datasheet4u.com/pdf/905175/UCS1909.pdf
        title: 9 路LED 驱动电路-UCS1909
        revision: null
        date: null # PDF created 2015-02-28 by datasheet4u; content same template as the 2011 UCS1912 below
        language: zh
        notes: 'Distributor copy (header "联系：13480836474"); the DB''s current datasheet link.'
      - id: falcon-pixeltypes
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: Falcon Pixel Types table
        revision: null
        date: null
        language: en
    line_coding: single-wire
    line_coding_source:
      {
        doc: ucs1909-cn,
        page: 2,
        quote: '电路采用单线通讯方式级联，数据用归零码发送。',
        translation: 'The circuits cascade over a single wire; data is sent in return-to-zero code.',
      }
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kbps (高速模式, high-speed mode)
        select: 'SET pin 2 floating: "2 SET I 接VDD：400Kbps 悬空：800Kbps" (p1)'
        T0H: { ns: 250, tol_ns: 150, min_ns: null, max_ns: null, printed: '250ns 150ns' }
        T0L: { ns: 1000, tol_ns: 150, min_ns: null, max_ns: null, printed: '1000ns 150ns' }
        T1H: { ns: 1000, tol_ns: 150, min_ns: null, max_ns: null, printed: '1000ns 150ns' }
        T1L: { ns: 250, tol_ns: 150, min_ns: null, max_ns: null, printed: '250ns 150ns' }
        period: null
        reset:
          {
            min_ns: null,
            ns: 24000,
            tol_ns: 1000,
            printed: 'Treset Reset 码，低电平 时间 24000ns 1000ns',
          }
        doc: ucs1909-cn
        page: 2
        quote: '数据码型说明：高速模式（800kbps） | 描述 | 典型时间 | 允许误差 | T0H | 0 码高 电平时间 | 250ns | 150ns || (p3) T0L | 0 码低电平时间 | 1000ns | 150ns | T1H | 1 码高电平时间 | 1000ns | 150ns | T1L | 1 码低电平时间 | 250ns | 150ns | Treset | Reset 码，低电平 时间 | 24000ns | 1000ns'
        translation: 'Data code description, high-speed mode (800 kbps): description, typical time, allowed error.'
      - name: 400kbps (低速模式, low-speed mode)
        select: 'SET pin 2 tied to VDD (接VDD：400Kbps)'
        T0H: { ns: 500, tol_ns: null, min_ns: null, max_ns: null, printed: 'doubled 250ns' }
        T0L: { ns: 2000, tol_ns: null, min_ns: null, max_ns: null, printed: 'doubled 1000ns' }
        T1H: { ns: 2000, tol_ns: null, min_ns: null, max_ns: null, printed: 'doubled 1000ns' }
        T1L: { ns: 500, tol_ns: null, min_ns: null, max_ns: null, printed: 'doubled 250ns' }
        period: null
        reset: { min_ns: null, printed: 'not restated (see open)' }
        derived: true
        doc: ucs1909-cn
        page: 3
        quote: '如果是低速模式（400kbps）， 上述时间增加一倍。'
        translation: 'In low-speed mode (400 kbps) the times above are doubled.'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 9
      wire_order: 'R1 G1 B1, R2 G2 B2, R3 G3 B3 (8 bits each, MSB first)'
      pixel_bits: 72 # per chip: three 24-bit RGB groups
      extra: null
      start: 'a reset before the first frame: "为保证第一帧输入的数据有效，在输入第一帧数据前先输入一个reset 信号" (p3)'
      end: null
      latch: reset low (24000 ns ±1000 ns as printed); all ICs latch together
      doc: ucs1909-cn
      page: 2
      quote: '一个电路有9 路LED 输出端，即3 组RGB。每路输出需要8 位二进制数设置灰度，一组RGB 需要24 位二进制数，数据高位先输入 … 一个电路需要共72 位数据来设置各个RGB 的灰度，数据输入顺序R1G1B1，R2G2B2，R3G3B3。'
      translation: 'One circuit has 9 LED outputs, i.e. 3 RGB groups. Each output needs 8 bits; one RGB group needs 24 bits, MSB first ... one circuit needs 72 bits in all, input order R1G1B1, R2G2B2, R3G3B3.'
    forwarding:
      text: After 72 bits the chip decodes, re-encodes and forwards the rest from DOUT.
      doc: ucs1909-cn
      page: 2
      quote: '当输入的数据满72 位后，电路开始转发数据，即将输入的数据经内部译码，编码处理后从DOUT 端输出进入下一级电路，从而实现多电路级联工作。'
      translation: 'Once 72 bits are in, the circuit starts forwarding: input data is decoded and re-encoded internally and sent from DOUT to the next circuit.'
    backup_line: null
    compatibility_claims: []
    controller_claims:
      - { source: falcon-pixeltypes, claim: 'UCS1909 listed as an alternative of type WS2811' }
    disagreements:
      - "SET pin: this document uses SET for 400/800 kbps; the maker's UCS1909B ver2.2 uses SET for 6 vs 9 channels and is 800K only (see UCS1909B). The DB entry's bitrate_notes describe this older document while its aliases and notes describe the UCS1909B(S)."
      - 'Treset is printed as a typical value with a tolerance (24000 ns ±1000 ns), not as a minimum; the UCS1903 and the 2012 maker datasheets print ">24µs" / "》24us".'
    open:
      - 'Whether the 400 kbps note ("上述时间增加一倍", the times above are doubled) also doubles Treset; the UCS1903 note explicitly keeps reset unchanged, this one does not say.'

