    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: low for more than 24 µs
      doc: ucs1903n-ver2.2-en
      page: 6
      quote: '6. 24-bit data format | R7 R6 R5 R4 R3 R2 R1 R0 G7 G6 G5 G4 G3 G2 G1 G0 B7 B6 B5 B4 B3 B2 B1 B0 | Note: The data is sent in the sequence of RGB, and the MSB is sent first.'
    forwarding:
      text: Takes 24 bits, then forwards the rest from DOUT; DOUT low before forwarding.
      doc: ucs1903n-ver2.2-en
      page: 4
      quote: 'When all the 24 bits of data have been received, IC no longer receive data，the DOUT port starts to forward the data to the next chip as its input data. The DOUT pin is held LOW before the data forwarding,.'
    backup_line: null
    compatibility_claims: []
    maker_table:
      doc: szucs-256
      quote: 'UCS1903B | 3 | 1.5 | 恒流 | ±5% | 17 | 17 | 18 | 800K | 256 | 普通 | SOP8 ; UCS1903H | 3 | 3.5 | 恒流 | ±5% | 17 | 17 | 28 | 800K | 256 | 准工业级 | SOP8'
      translation: 'Columns: model | channels | port refresh (kHz) | constant current/voltage | chip-to-chip accuracy | default current (mA) | max current (mA) | withstand voltage (V) | data rate | gray levels | grade | package. 恒流 = constant current.'
    controller_claims: []
    disagreements:
      - 'Same name, different wire timing: the original UCS1903 sends a 1 as 1.0 µs high + 0.25 µs low at 800 kbps (and has a 400 kbps mode); UCS1903N ver2.2 regenerates a 1 as 0.8 µs high + 0.4 µs low and has no speed pin (pin 7 NC, FMAX 800 kbps, p4).'
