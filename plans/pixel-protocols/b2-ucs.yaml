        T1H: { ns: 800, tol_ns: null, min_ns: null, max_ns: null, printed: '0.8µs' }
        T0L: { ns: 900, tol_ns: null, min_ns: null, max_ns: null, printed: '0.9µs' }
        T1L: { ns: 500, tol_ns: null, min_ns: null, max_ns: null, printed: '0.5µs' }
        period: null # 1.3 µs for both codes from the table; not printed as such
