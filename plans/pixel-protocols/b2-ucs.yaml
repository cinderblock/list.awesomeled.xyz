    line_coding: single-wire
    line_coding_source:
      {
        doc: ucs1904-cn,
        page: 4,
        quote: '芯片采用单线通讯方式，采用归零码的方式发送信号。',
        translation: 'Single-wire communication, return-to-zero codes.',
      }
    idle: low
    bit_order: msb-first
    rates:
      - name: high-speed conventional mode (高速常规模式), chip output
        table: chip output
        select: 'automatic, no pin (pin 7 NC): "UCS1904 内置控制可自动兼容以上2 种控制器发送模式" (the built-in control automatically accepts both controller send modes above), p6'
        T0H: { ns: 400, tol_ns: 40, min_ns: null, max_ns: null, printed: '0.4µs ±40ns' }
        T1H: { ns: 800, tol_ns: 80, min_ns: null, max_ns: null, printed: '0.8µs ±80ns' }
        T0L: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85µs' }
        T1L: { ns: 450, tol_ns: null, min_ns: null, max_ns: null, printed: '0.45µs' }
        period: null
        reset: { min_ns: 24000, printed: '》24us' }
        decode:
          zero_if_high_below_ns: 550
          one_if_high_above_ns: 690
          ignored_leading_high_ns: 30
          low: the low level only ends the bit; the bit value comes from the high time
          doc: ucs1904-cn
          page: 6
          quote: '注：1. IC 主要根据高电平时间判断"0"码和"1"码,IC 收到高电平的前30ns 不计（特为防干扰设计）。高电平时间<0.55us,IC 判断为"0"码,高电平时间>0.69uS,判断为“1”码.”0”码和“1”码的低电平代表此码结束，准备接收下一数据码。'
          translation: 'Note 1: the IC tells "0" from "1" mainly by the high time, ignoring the first 30 ns of a high level (anti-interference). High time <0.55 µs is a "0", >0.69 µs is a "1". The low level of a "0" or "1" ends the code; the IC then waits for the next bit.'
        reset_rule:
          max_gap_in_frame_ns: 8000
          doc: ucs1904-cn
          page: 6
          quote: '2.低电平复位时间最小为8µs，最高为24us,IC 在收到大于8us 小于24us 的低电平信号时都可能认为是RESET 码，所以一帧数据传输过程中不要中断超过8µs，否则可能会被IC 认为是reset 码。但在8µs 之内，控制器可以进行其他操作。同时控制器发reset 码时不要低于24us，以保证所有IC 都能确认为reset 码'
          translation: "2. The low-level reset time is at least 8 µs and at most 24 µs: a low longer than 8 µs and shorter than 24 µs may be taken as RESET, so never pause more than 8 µs inside a frame (within 8 µs the controller may do other work). The controller's reset must be at least 24 µs so every IC sees it."
        period_rule:
          doc: ucs1904-cn
          page: 6
          quote: '3.控制器输出码形周期务必要大于1.25us，控制器码形请参照下表发送，可保证有较大的传输数据变形空间'
          translation: "3. The controller's bit period must be greater than 1.25 µs; send per the table below to leave a large margin for waveform distortion."
        doc: ucs1904-cn
        page: 6
        quote: '5）芯片内部再生信号标准（高速常规模式） | T0H | 0 码，高电平时间 | 0.4µs | ±40ns | T1H | 1 码，高电平时间 | 0.8µs | ±80ns | T0L | 0 码，低电平时间 | 0.85µs | T1L | 1 码，低电平时间 | 0.45µs | Treset | Reset 码，低电平时间 | 》24us'
        translation: '5) Chip internal regenerated-signal standard (high-speed conventional mode).'
      - name: high-speed conventional mode, controller send (控制器建议值（高速常规模式）)
        table: controller send
        select: automatic
        T0H: { ns: 400, tol_ns: null, min_ns: null, max_ns: null, printed: '0.4us' }
        T1H: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85us' }
        T0L: { ns: null, tol_ns: null, min_ns: 850, max_ns: null, printed: '》0.85µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 400, max_ns: null, printed: '》0.4us' }
        period: { ns: null, min_ns: 1250, printed: '“0”码或“1”码周期 》1.25us' }
        reset: { min_ns: 24000, printed: '》24us' }
        doc: ucs1904-cn
        page: 7
        quote: '7）控制器建议值（高速常规模式） | T0H | 0 码，高电平时间 | 0.4us | T1H | 1 码，高电平时间 | 0.85us | T0L | 0 码，低电平时间 | 》0.85µs | T1L | 1 码，低电平时间 | 》0.4us | T | “0”码或“1”码周期 | 》1.25us | Treset | Reset 码，低电平时间 | 》24us'
        translation: '7) Controller recommended values (high-speed conventional mode).'
      - name: low-speed enhanced mode (低速增强模式), chip output
        table: chip output
        select: automatic (same paragraph as above)
        T0H: { ns: 400, tol_ns: 40, min_ns: null, max_ns: null, printed: '0.4µs ±40ns' }
        T1H: { ns: 800, tol_ns: 80, min_ns: null, max_ns: null, printed: '0.8µs ±80ns' }
        T0L: { ns: 2100, tol_ns: null, min_ns: null, max_ns: null, printed: '2.1µs' }
        T1L: { ns: 1700, tol_ns: null, min_ns: null, max_ns: null, printed: '1.7µs' }
        period: null
        reset: { min_ns: 24000, printed: '》24us' }
        doc: ucs1904-cn
        page: 6
        quote: '6）芯片内部再生信号标准：（低速增强模式） | T0H | 0 码，高电平时间 | 0.4µs | ±40ns | T1H | 1 码，高电平时间 | 0.8µs | ±80ns | T0L | 0 码，低电平时间 | 2.1µs | T1L | 1 码，低电平时间 | 1.7µs | Treset | Reset 码，低电平时间 | 》24us'
        translation: '6) Chip internal regenerated-signal standard (low-speed enhanced mode). Same high times as the fast mode; only the lows stretch.'
        mode_text:
          doc: ucs1904-cn
          page: 6
          quote: 'UCS1904 内置控制可自动兼容以上2 种控制器发送模式，IC 内置充电管理模块，在低速增强模式下具有更强的驱动能力。常规使用时控制器选择发送高速模式即可，高速模式可带1024 点/30 帧。当工程上出现抖动或时好时坏等现象，又不便对产品或布线进行排查时，可在控制器上选用2903 低速增强模式并重新生成效果文件，产品上无需任何更改。使用低速模式只可带512 点/30 帧或1024 点/15 帧。'
          translation: 'The UCS1904''s built-in control automatically accepts both controller send modes; a built-in charge-management block gives stronger drive in the low-speed enhanced mode. Normally choose the high-speed mode (1024 points at 30 frames). If an installation flickers or is intermittent and the product or wiring cannot easily be checked, select the "2903 low-speed enhanced mode" on the controller and regenerate the effect file; nothing on the product changes. The low-speed mode carries only 512 points at 30 frames or 1024 at 15.'
      - name: low-speed enhanced mode, controller send (控制器建议值：（低速增强模式）)
        table: controller send
        select: automatic
        T0H: { ns: 400, tol_ns: null, min_ns: null, max_ns: null, printed: '0.4us' }
        T1H: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85us' }
        T0L: { ns: null, tol_ns: null, min_ns: 2100, max_ns: null, printed: '》2.1µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 1650, max_ns: null, printed: '》1.65us' }
        period: { ns: null, min_ns: 2500, printed: '“0”码或“1”码周期 》2.5us' }
        reset: { min_ns: 24000, printed: '》24us' }
        doc: ucs1904-cn
        page: 7
        quote: '8）控制器建议值：（低速增强模式） | T0H | 0.4us | T1H | 0.85us | T0L | 》2.1µs | T1L | 》1.65us | T | “0”码或“1”码周期 | 》2.5us | Treset | 》24us'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low for at least 24 µs; lows of 8-24 µs may already be taken as reset'
      doc: ucs1904-cn
      page: 5
      quote: '3） 24bit 数据结构 | R7 R6 R5 R4 R3 R2 R1 R0 G7 G6 G5 G4 G3 G2 G1 G0 B7 B6 B5 B4 B3 B2 B1 B0 | 注：高位先发，按照RGB 的顺序发送数据'
    forwarding:
      text: Takes 24 bits, DO held low until then, then forwards the rest; Tflz max 300 ns.
      doc: ucs1904-cn
      page: 4
      quote: '接受够24bit 后，DO 端口开始转发数据，供下一个芯片提供输入数据。在转发之前，DO 口一直拉低。此时芯片将不接受新的数据 … 传输延迟时间 | Tflz | - | - | 300 | ns | Cl＝15pF，DIN → DOUT，Rl ＝10kΩ'
      translation: After 24 bits, DO starts forwarding to the next chip; DO is low before that and the chip accepts no new data. Transfer delay max 300 ns.
    backup_line: null
    compatibility_claims:
      - claim: '可在控制器上选用2903 低速增强模式 (select the "2903 low-speed enhanced mode" on the controller), i.e. the maker names the slow mode after the UCS2903'
        doc: ucs1904-cn
        page: 6
    maker_table:
      doc: szucs-256
      quote: 'UCS1904S | 3 | 1.8 | 恒压 | 无 | 无 | 60 | 30 | 800K | 256 | 工业级 | SOP8'
      translation: 'UCS1904S: 3 channels, 1.8 kHz, constant voltage, current max 60 mA, 30 V, 800K, 256 levels, industrial, SOP8.'
    controller_claims:
      - {
          source: advatek-ucs1904,
          claim: 'UCS1904 is an improved design of its previous version, UCS1903, operating up to 24V instead of 12V ... | Data Transfer Rate | 400 - 800kbps | PWM Rate | 1500Hz',
        }
      - {
          source: enttec-ucs1904,
          claim: 'self-clocking like the WS2812 but with steadier timing | PWM Rate | 1500Hz | Redundant Data Line | No',
        }
      - { source: falcon-pixeltypes, claim: 'UCS1904 listed as an alternative of type WS2811' }
    disagreements:
      - 'Port scan: datasheet p1 "端口扫描频率1.5KHz/s" vs the maker table''s UCS1904S row 1.8 kHz (different suffix; no UCS1904S datasheet found).'
    open:
      - No revision or date in this copy.

