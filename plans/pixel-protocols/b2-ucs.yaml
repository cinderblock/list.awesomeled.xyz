      page: 1
      quote: 'The RGB output port can reach 4096 gray levels, and the port refresh rate is 2K ; The current of each RGB channel can be set independently through the software, divided into 16 levels'
    forwarding:
      text: Skipping a dead chip, the next chip identifies which input the data came from and corrects it, so the image does not shift.
      doc: ucs5603-ver1.1-en
      page: 4
      quote: '1. UCS5603 adopts the bad point resume function of dual-channel input. In case of a bad point, the signal can skip the point and continue to download, and the next level IC will automatically identify the signal source and correct data accordingly, so the screen will not be dislocated.'
    backup_line:
      pins: 'DIN (pin 5) and FDIN (pin 7, "Auxiliary Display Data Input (800K)")'
      behaviour: 'Both inputs are decoded at once ("dual decoding engine"); the chip switches to the healthy one in real time. Wiring: chip N+1''s FDIN is fed from chip N''s input line on the cable side of chip N''s RDI resistor, so it carries the stream chip N received. The controller''s FDO may feed chip 1''s FDIN; without it chip 1 has no backup.'
      doc: ucs5603-ver1.1-en
      page: 10
      quote: 'Note 1: In the application, the connection between the controller FDO and UCS5603 can be disconnected, at this time, the first point does not have the complete breakpoint resume function. … Note 3: Note that the connection shall be between the other end (the DIN pin end that connects with RDI resistor) and the FDIN of the next IC, rather than directly connecting the DIN pin with the FDIN of the next IC'
      also:
        - {
            doc: ucs5603-ver1.1-en,
            page: 1,
            quote: 'a patented dual decoding engine is adopted to simultaneously monitor two channels, and switch in real-time to the normal channel whenever there is a signal problem',
          }
        - {
            doc: ucs5603-ver1.1-en,
            page: 6,
            quote: 'If the test controller only has DO port, and it has no FDO port, the DO port cannot be connected to the DIN and FDIN of the first light, otherwise, the first light will not give normal light instructions in the test mode.',
          }
