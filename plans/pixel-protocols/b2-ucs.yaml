        page: 6
        quote: '48bit数据发送时高位先发，按照RGB的顺序发送数据。48位可拆分成6个8位数据来发送，注意字节与字节之间的低电平时间不要超过RESET信号时间，否则芯片会复位，复位后又重新接收数据，则无法实现数据传输。'
