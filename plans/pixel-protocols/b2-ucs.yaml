        revision: null
        date: null
        language: en
      - id: enttec-ucs2904
        url: https://www.enttec.com/pixel-protocols/UCS2904
        title: ENTTEC pixel protocol page, UCS2904
        revision: null
        date: null
        language: en
    line_coding: single-wire
    line_coding_source:
      {
        doc: ucs2904b-greeled-en,
        page: 4,
        quote: 'The chip adopts single line communication mode, and sends signals by returning to zero code.',
      }
    idle: low
    bit_order: msb-first
    rates:
      - name: high-speed conventional mode, chip output ("Chip internal regeneration signal standard")
        table: chip output
        select: 'automatic: "UCS2904B has a built-in charging management module, which can automatically adapt to the "low-speed enhancement mode" of the following controllers" (p7)'
        T0H: { ns: 400, tol_ns: 40, min_ns: null, max_ns: null, printed: '0.4µs ±40ns' }
        T1H: { ns: 800, tol_ns: 80, min_ns: null, max_ns: null, printed: '0.8µs ±80ns' }
        T0L: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85µs' }
        T1L: { ns: 450, tol_ns: null, min_ns: null, max_ns: null, printed: '0.45µs' }
        period: null
        reset: { min_ns: 24000, printed: '>24us' }
        reset_rule:
          max_gap_in_frame_ns: 8000
          doc: ucs2904b-greeled-en
          page: 6
          quote: 'The minimum IC low-level reset time is 8 µ s, and the maximum is 24us. When receiving low-level signals greater than 8us but less than 24us, the IC may consider them as RESET codes. Therefore, do not interrupt more than 8 µ s during the transmission of a frame of data, or the IC may consider them as reset codes.However, within 8 µ s, the controller can perform other operations.At the same time, the reset code sent by the controller should not be lower than 24us to ensure that all ICs can be confirmed as reset codes'
        doc: ucs2904b-greeled-en
        page: 6
        quote: '5) Chip internal regeneration signal standard (high-speed conventional mode) | T0H | 0 code, high level time | 0.4µs | ±40ns | T1H | 1 code, high level time | 0.8µs | ±80ns | T0L | 0 code, low level time | 0.85µs | T1L | 1 code, low level time | 0.45µs | Treset | Reset code, low level time | >24us'
      - name: high speed normal mode, controller send ("Recommended value of controller")
        table: controller send
        select: automatic
        T0H: { ns: 400, tol_ns: null, min_ns: null, max_ns: null, printed: '0.4us' }
        T1H: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85us' }
        T0L: { ns: null, tol_ns: null, min_ns: 900, max_ns: null, printed: '>0.9µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 450, max_ns: null, printed: '>0.45us' }
        period: { ns: null, min_ns: 1300, printed: '"0" code or "1" code cycle >1.3us' }
        reset: { min_ns: 24000, printed: '>24us' }
        doc: ucs2904b-greeled-en
        page: 6
        quote: '6) Recommended value of controller (high speed normal mode) | T0H | 0 code, high level time | 0.4us | T1H | 1 code, high level time | 0.85us | T0L | 0 code, low level time | >0.9µs | T1L | 1 code, low level time | >0.45us | T | "0" code or "1" code cycle | >1.3us | Treset | Reset code, low level time | >24us'
      - name: low-speed enhancement mode, controller send
        table: controller send
        select: automatic
        T0H: { ns: 400, tol_ns: null, min_ns: null, max_ns: null, printed: '0.4us' }
        T1H: { ns: 850, tol_ns: null, min_ns: null, max_ns: null, printed: '0.85us' }
        T0L: { ns: null, tol_ns: null, min_ns: 2100, max_ns: null, printed: '>2.1µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 1650, max_ns: null, printed: '>1.65us' }
        period: { ns: null, min_ns: 2500, printed: '>2.5us' }
        reset: { min_ns: 24000, printed: '>24us' }
        doc: ucs2904b-greeled-en
        page: 7
        quote: '7) Recommended value of controller: (low-speed enhancement mode) | T0H | 0.4us | T1H | 0.85us | T0L | >2.1µs | T1L | >1.65us | T | "0" code or "1" code cycle | >2.5us | Treset | >24us'
        mode_text:
          doc: ucs2904b-greeled-en
          page: 7
          quote: 'In case of jitter or sometimes good or bad phenomena in the project, and it is inconvenient to check the product or wiring, 2903 low-speed enhancement can be selected on the controller ... Low speed mode can only be used with 512 points/30 frames or 1024 points/15 frames.'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 4
      wire_order: 'R7…R0 G7…G0 B7…B0 W7…W0'
      pixel_bits: 32
      extra: null
      start: null
      end: null
      latch: 'low above 24 µs; lows of 8-24 µs may be taken as reset'
      doc: ucs2904b-greeled-en
      page: 5
      quote: '3) 32bit data structure | R7 … R0 | G7 … G0 | B7 … B0 | W7 … W0 | Note: High bit first, send data in the order of RGBW'
    forwarding:
      text: Takes 32 bits, DO low until then, then forwards.
      doc: ucs2904b-greeled-en
      page: 4
      quote: 'After receiving enough 32bit, the DO port starts to transmit data for the next chip to provide input data.Before forwarding, the DO port is always pulled down.At this time, the chip will not accept new data.'
    backup_line: null
    compatibility_claims:
      - claim: '"2903 low-speed enhancement can be selected on the controller" (the slow mode is named after the UCS2903)'
        doc: ucs2904b-greeled-en
        page: 7
    maker_table:
      doc: szucs-256
      quote: 'UCS2904B | 4 | 1.8 | 恒流 | ±5% | 17 | 17 | 30 | 800K | 256 | 工业级 | SOP8'
    controller_claims:
      - {
          source: advatek-ucs2904,
          url: 'https://www.advateklighting.com/pixel-protocols/ucs2904',
          claim: 'UCS2904 offers all the same features as its RGB version, UCS2903, but is dedicated to RGBW | Data Transfer Rate | 800kbps | PWM Rate | 1800Hz',
        }
      - {
          source: enttec-ucs2904,
          url: 'https://www.enttec.com/pixel-protocols/UCS2904',
          claim: 'WS2812-style self-clocking timing and 32-bit color | Redundant Data Line | No',
        }
    disagreements:
      - 'Function description p4 says "outputs the 24 bit PWM data pulse width just received to OUTR, OUTG, OUTB and OUTW pins" while the same paragraph and p5 say 32 bits.'
      - 'Controller table (p6): T0L >0.9 µs, T1L >0.45 µs, period >1.3 µs; the UCS1904 and UCS1912B tables say ≥0.85, ≥0.4 and ≥1.25 µs.'
      - 'Power-on self test: ucs2904b-sll p1 "IC self-inspection then LED light connection on the pin B port. Lighting Blue color." vs ucs2904b-greeled-2021 p1 "power on self test (white color)".'
      - 'p4 "The signal cycle is OAbout 6 ms" (garbled; the features give a 1.8 kHz port scan).'
    open:
      - No decision threshold (0.55/0.69 µs) is printed in this translation; the UCS1904 family datasheets print one.

