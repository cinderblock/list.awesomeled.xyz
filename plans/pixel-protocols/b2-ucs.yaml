  - part: UCS1904
    entry: pixel-ics/ucs1904
    maker: UCS / Lianxinke Microelectronics
    documents:
      - id: ucs1904-cn
        url: https://datasheet4u.com/pdf/1350120/UCS1904.pdf
        title: 3通道LED恒压驱动电路 UCS1904
        revision: null
