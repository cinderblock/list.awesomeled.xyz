          source: advatek-ucs7604,
          claim: 'selection between RGB/RGBW is made available through digital configuration ... | Color Resolution | 16 Bits | Current Control | Per Color: 4 Bits | Data Transfer Rate | 800 or 1600 kbps | PWM Rate | 16,000Hz | Physical Package | SOP10',
        }
      - {
          source: enttec-ucs7604,
          claim: '16-bit per-channel colour depth, RGB or RGBW output, and a redundant data path | Redundant Data Line | Yes',
        }
    third_party_claims: # NOT from the maker; recorded because the maker datasheets omit the frame
      - source: teensy-ucs7604
        claim: 'Bit timing "from the datasheet": 800k T0H 0.40 / T0L 0.85 / T1H 0.80 / T1L 0.45 µs; 1.6M T0H 0.20 / T0L 0.45 / T1H 0.40 / T1L 0.25 µs. Reset "spec says ≥250 µs". Configuration ("work code"): 8-byte verification code FF FF FF FF FF FF 00 03, then a low "W-code" gap ("spec says 10–50 µs"), then S byte ([7]=B1, [4]=speed, [3]=B0, [1:0]=field ZD), four current bytes C0-C3 (R, G, B, W, low nibble = n/16 of the REXT current), C4 = C5 = 0x00. Pixel data 16-bit RGBW MSB-first in its example.'
        quote: 'const uint8_t  VERIFY_CODE[8]              = { 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x03 }; … /* S byte per spec: [7]=B1, [6:5]=00, [4]=S (speed), [3]=B0, [2]=0, [1:0]=ZD */ … /* Reset (latch) duration in microseconds (spec says ≥250 µs) */ … /* W-code low delay in microseconds (spec says 10–50 µs) */'
      - source: fastled-ucs7604
        claim: '15-byte preamble: 6 x 0xFF, 0x00 0x03, mode byte (0x03 = 8-bit 800 kHz, 0x8B = 16-bit 800 kHz, 0x9B = 16-bit 1600 kHz), four 4-bit currents (wire order RGBW), 2 reserved 0x00; FastLED sends it without the gap.'
        quote: '/// @note KNOWN LIMITATION: The UCS7604 protocol spec requires a ~20us "W-code low" /// delay between the 8-byte verification code and the 7-byte configuration block.'
      - source: fastled-issue-2088
        claim: 'Capture of a commercial controller: two preamble chunks of 8 and 7 bytes, separated from each other and from the colour data by ~260 µs.'
        quote: 'There is a two-chunk preamble that sets things like max current per channel, speed of data section (800k vs. 1.6M), etc. First chunk is 8 bytes, second is 7, they are separated from each other and the main color data by ~260uS.'
      - source: neopixelbus-841
        claim: 'Captures of two controllers: header FFFF_FFFF_FFFF_0003 followed by an 8-16 µs space; maintainer: "The only spec on found really doesn''t describe the header in detail".'
        quote: 'Both controllers have a 8-16us space after the header, that MAY not be needed.'
    disagreements:
      - 'VER1.0 (LEDYi) heads the pin section "SOP 8" and draws no pins, while its pin table has 10 pins and the package page is SOP 10; VER1.1 p2 draws the SOP10 pinout (DO 10, VDD 9, DIN 8, REXT 7, FDIN 6).'
      - 'Third-party gap timings disagree: ~20 µs (FastLED) / "10–50 µs" (Teensy sketch, citing a spec) / 8-16 µs (NeoPixelBus captures) / ~260 µs (FastLED issue capture). None of these documents is the maker''s.'
    open:
      - 'No maker document read gives the bit timing, reset, configuration frame or channel order. The Teensy sketch quotes a "spec" with these values, so a fuller maker document probably exists; not found (no Chinese UCS7604 datasheet online).'

