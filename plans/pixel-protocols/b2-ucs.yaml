        decode:
          zero_if_high_below_ns: 550
          one_if_high_above_ns: 690
          ignored_leading_high_ns: 30
          doc: ucs1909b-ver2.2-cn
          page: 5
          quote: '注：1. IC 主要根据高电平时间判断"0"码和"1"码,IC 收到高电平的前30ns 不计（特为防干扰设计）。高电平时间<0.55us,IC 判断为"0"码,高电平时间>0.69uS,判断为“1”码.”0”码和“1”码的低电平代表此码结束，准备接收下一数据码。'
        reset_rule:
          max_gap_in_frame_ns: 8000
          doc: ucs1909b-ver2.2-cn
          page: 5
          quote: '2.低电平复位时间最小为8µs，最高为24us,IC 在收到大于8us 小于24us 的低电平信号时都可能认为是RESET 码，所以一帧数据传输过程中不要中断超过8µs … 同时控制器发reset 码时不要低于24us'
