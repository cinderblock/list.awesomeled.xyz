              doc: ucs5603-ver1.1-en,
              page: 4,
              quote: 'Oscillation frequency | FOSC1 | - | 800 | - | KHz | Vdd =5V ; FOSC2 | - | 20 | - | MHz ; Data transfer rate | Fd | 800 | - | - | Kbps | Duty cycle 50%',
