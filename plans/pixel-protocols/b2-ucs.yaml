        period: { ns: null, min_ns: 1250, printed: '》1.25µs' }
        reset: { min_ns: 24000, printed: '》24µs' }
        doc: ucs1909b-ver2.2-cn
        page: 5
        quote: '6）控制器建议值 | T0H | 0 码，高电平时间 | 0.4µs | T1H | 1 码，高电平时间 | 0.9µs | T0L | 0 码，低电平时间 | 》0.85µs | T1L | 1 码，低电平时间 | 》0.35µs | T | “0”码或“1”码周期 | 》1.25µs | Treset | Reset 码，低电平时间 | 》24µs'
    clock: null
    frame:
      bits_per_channel: 8
      channels: '9 (SET floating) or 6 (SET to VDD)'
      wire_order: 'first 24 bits R1 G1 B1 as R7…R0 G7…G0 B7…B0; groups 2 and 3 follow (not drawn)'
      pixel_bits: 72 # 9-channel mode, per chip
      extra: null
      start: null
      end: null
      latch: 'low ≥24 µs (outputs update); lows of 8-24 µs may be taken as reset'
      doc: ucs1909b-ver2.2-cn
      page: 4
      quote: '3） 72bit 数据结构（以下是前24 位数据 R1,G1，B1） | R7 R6 R5 R4 R3 R2 R1 R0 G7 … B0 | 注：高位先发，按照RGB 的顺序发送数据'
      translation: '72-bit data structure (shown: the first 24 bits, R1, G1, B1). MSB first, RGB order.'
      set_pin:
        {
          doc: ucs1909b-ver2.2-cn,
          page: 2,
          quote: '2 | SET | 接VDD：6 通道 悬空：9 通道',
          translation: 'SET: to VDD = 6 channels, floating = 9 channels',
        }
    forwarding:
      text: Takes 72 bits, DO low until then, then forwards; outputs update on a ≥24 µs low.
      doc: ucs1909b-ver2.2-cn
      page: 3
      quote: '接受够72bit 后，DO 端口开始转发数据，供下一个芯片提供输入数据。在转发之前，DO 口一直拉低。此时芯片将不接受新的数据 … 当接受到24µs 以上低电平RESET 码后，芯片将刚才接收到的72bit PWM 数据脉宽输出到OUTR、OUTG、OUTB 引脚上。'
    backup_line: null
    compatibility_claims: []
    maker_table:
      doc: szucs-256
      quote: 'UCS1909BS | 6/9 | 1.8 | 恒压 | 无 | 无 | 50 | 30 | 800K | 256 | 准工业级 | SOP14'
    controller_claims: []
    disagreements:
