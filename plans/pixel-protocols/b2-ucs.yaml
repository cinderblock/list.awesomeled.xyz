        T1L: { ns: null, tol_ns: null, min_ns: 400, max_ns: null, printed: '》0.4us' }
        period: { ns: null, min_ns: 1250, printed: '》1.25 (no unit printed)' }
        reset: { min_ns: 24000, printed: '》24us' }
        doc: ucs1912b-ver2.3-cn
        page: 7
        quote: '6）控制器建议值 | T0H | 0.4us | T1H | 0.85us | T0L | 》0.85µs | T1L | 》0.4us | T | “0”码或“1”码周期 | 》1.25 | Treset | 》24us'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 12
      wire_order: 'first 24 bits R1 G1 B1 as R7…R0 G7…G0 B7…B0; groups 2-4 follow (not drawn)'
      pixel_bits: 96 # per chip
      extra: null
      start: null
      end: null
      latch: 'low ≥24 µs'
      doc: ucs1912b-ver2.3-cn
      page: 5
      quote: '3） 96bit 数据结构（以下是前24 位数据 R1,G1，B1） | R7 R6 R5 R4 R3 R2 R1 R0 G7 … B0 | 注：高位先发，按照RGB 的顺序发送数据'
    forwarding:
      text: Takes 96 bits, then forwards; Tflz max 300 ns.
      doc: ucs1912b-ver2.3-cn
      page: 4
      quote: '接受够96bit 后，DO 端口开始转发数据，供下一个芯片提供输入数据。在转发之前，DO 口一直拉低。此时芯片将不接受新的数据'
    backup_line: null
    compatibility_claims: []
