# Workstream 8 (pixel protocols), research batch b2-ucs: UCS / Lianxinke parts.
# Summary for the parent: b2-ucs.md (same folder). Read that first.
#
# Conventions in this file (on top of BRIEF.md):
# - Quotes are verbatim; runs of spaces in table rows are collapsed to " | ".
#   Chinese quotes carry an English translation in `translation`.
# - `table: chip output` = the maker's "芯片内部再生信号标准" / "code time of IC forward"
#   (what the chip regenerates on DOUT); `table: controller send` = "控制器建议值" /
#   "code time of controller send" (what the maker tells the transmitter to send).
# - The UCS tables write minimums as "》24us" (》 = "at least"); those go in min_ns.
# - `controller_claims` = Advatek / ENTTEC / Falcon pages (what a controller maker says),
#   `third_party_claims` = libraries and forum captures. Neither is the chip maker's spec.
# - Web pages have no page numbers: page is null and the quote is the table row.
batch: b2-ucs
researched: '2026-11-20'
parts:
  # ---------------------------------------------------------------------------
  - part: UCS1903
    entry: pixel-ics/ucs1903
    maker: UCS / Lianxinke Microelectronics (深圳联芯科微电子, www.szucs.cn)
    documents:
      - id: ucs1903-cn
        url: https://d1.amobbs.com/bbs_upload782111/files_40/ourdev_643603HLLVCD.pdf
        title: 三通道LED驱动控制电路UCS1903
        revision: null
        date: null # PDF metadata only: Word file "UCS1903.doc", created 2011-05-25
        language: zh
        notes: Forum (amobbs/ourdev) upload of the Chinese datasheet; no maker imprint in the text. Oldest UCS1903 text found.
      - id: ucs1903-v1.0-en
        url: https://www.superlightingled.com/PDF/UCS1903%20datasheet.pdf
        title: UCS1903 3-Channel LED Driver / Controller
        revision: V. 1.0
        date: null
        language: en
        notes: Superlighting LED re-typeset English translation of the Chinese datasheet (figure labels still read 芯片 1/2/3). Same tables as ucs1903-cn.
      - id: szucs-256
        url: http://szucs.cn/page136
        title: 级联单线驱动 IC -256 级 (maker product table, cascade single-wire driver ICs, 256 levels)
        revision: null
        date: null
        language: zh
      - id: advatek-ucs1903
        url: https://www.advateklighting.com/pixel-protocols/ucs1903
        title: Advatek pixel protocol page, UCS1903
        revision: null
        date: null
        language: en
      - id: enttec-ucs1903
        url: https://www.enttec.com/pixel-protocols/UCS1903
        title: ENTTEC pixel protocol page, UCS1903
        revision: null
        date: null
        language: en
      - id: falcon-pixeltypes
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: Falcon Pixel Types table (data inline in the page script)
        revision: null
        date: null
        language: en
    line_coding: single-wire
    line_coding_source:
      doc: ucs1903-cn
      page: 3
      quote: '芯片采用单线通讯方式，采用归零码的方式发送信号。'
      translation: The chip communicates over a single wire and sends the signal as return-to-zero codes.
    idle: low
    bit_order: msb-first
    rates:
      - name: 400kbps (低速模式, low-speed mode)
        select: 'SET pin 7 tied to VDD. "7 SET 模式设定 接VDD：低速模式；悬空：高速模式" (SET mode setting: to VDD = low-speed mode, floating = high-speed mode), ucs1903-cn p2; V1.0 English p2 "Connected to VDD: Low speed mode; Floating: High speed mode"'
        T0H: { ns: 500, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.5µs ±150ns' }
        T1H: { ns: 2000, tol_ns: 150, min_ns: null, max_ns: null, printed: '2.0µs ±150ns' }
        T0L: { ns: 2000, tol_ns: 150, min_ns: null, max_ns: null, printed: '2.0µs ±150ns' }
        T1L: { ns: 500, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.5µs ±150ns' }
        period: null # not printed; the four values give 2.5 µs for both codes (400 kbps)
        reset: { min_ns: 24000, printed: '当接受到24µs以上低电平RESET 码后' }
        doc: ucs1903-cn
        page: 3
        quote: '2）低速模式时间 | 名称 | 描 述 | 典型值 | 容许误差 | T0H | 0 码，高电平时间 | 0.5µs | ±150ns | T1H | 1 码，高电平时间 | 2.0µs | ±150ns | T0L | 0 码，低电平时间 | 2.0µs | ±150ns | T1L | 1 码，低电平时间 | 0.5µs | ±150ns'
        translation: '2) Low-speed mode times: name, description, typical, allowed error.'
        also:
          - doc: ucs1903-v1.0-en
            page: 4
            quote: '2 Low-speed mode time | T0H | code 0, high level time | 0.5µs | ±150ns | T1H | code 1, high level time | 2.0µs | ±150ns | T0L | code 0, low level time | 2.0µs | ±150ns | T1L | code 1, low level time | 0.5µs | ±150ns'
          - doc: ucs1903-cn
            page: 2
            quote: '数据传输率 | FMAX | 400 | - | - | Kbps | 占空比50% ; 振荡频率 | FOSC1 | - | 400 | - | kHz ; FOSC2 | - | 800 | - | kHz'
            translation: Data transfer rate FMAX min 400 kbps at 50% duty; oscillator FOSC1 400 kHz, FOSC2 800 kHz.
      - name: 800kbps (高速模式, high-speed mode)
        select: SET pin 7 floating (悬空：高速模式)
        T0H:
          {
            ns: 250,
            tol_ns: null,
            min_ns: null,
            max_ns: null,
            printed: 'half of 0.5µs (note below)',
          }
        T1H:
          {
            ns: 1000,
            tol_ns: null,
            min_ns: null,
            max_ns: null,
            printed: 'half of 2.0µs (note below)',
          }
        T0L:
          {
            ns: 1000,
            tol_ns: null,
            min_ns: null,
            max_ns: null,
            printed: 'half of 2.0µs (note below)',
          }
        T1L:
          {
            ns: 250,
            tol_ns: null,
            min_ns: null,
            max_ns: null,
            printed: 'half of 0.5µs (note below)',
          }
        period: null
        reset: { min_ns: 24000, printed: 'Reset 码时间不变 (reset time unchanged): 24µs以上' }
        derived: true # the high-speed values are not tabulated; the note halves the low-speed table. Whether the ±150ns tolerance also halves is not said.
        doc: ucs1903-cn
        page: 3
        quote: '注：当为高速模式时，以上时间仅需一半(Reset 码时间不变)。'
        translation: 'Note: in high-speed mode the times above are only half (the Reset code time does not change).'
        also:
          - doc: ucs1903-v1.0-en
            page: 4
            quote: 'Note: In the high-speed mode, only half of the above time is needed (the time for code RESET is not changed).'
          - doc: ucs1903-v1.0-en
            page: 1
            quote: 'Data transfer rates of up to 400kbps or 800kbps.'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: low for more than 24 µs (RESET code); outputs keep their old values until then
      doc: ucs1903-cn
      page: 4
      quote: '5）24bit 的数据结构 | R7 R6 R5 R4 R3 R2 R1 R0 G7 G6 G5 G4 G3 G2 G1 G0 B7 B6 B5 B4 B3 B2 B1 B0 | 注：高位先发，按照RGB 的顺序发送数据'
      translation: '24-bit data structure ... Note: MSB first, data sent in RGB order.'
      latch_source:
        doc: ucs1903-v1.0-en
        page: 3
        quote: 'Before the RESET signal is received, the output at the OUTR, OUTG and OUTB pins will remain unchanged. When a low level RESET code longer than 24µs is received, the UCS1903 will output the 24-bit PWM data just received to the OUTR, OUTG and OUTB pins.'
    forwarding:
      text: Takes the first 24 bits, holds DO low until then, then reshapes and forwards everything after them from DO. Data delay 0.4 µs per chip; propagation delay tPLZ max 300 ns.
      doc: ucs1903-cn
      page: 3
      quote: '接受够24bit 后，DO 端口开始转发数据，供下一个芯片提供输入数据。在转发之前，DO 口一直拉低。此时芯片将不接受新的数据 … 芯片采用自动整形转发技术 … （芯片的数据延迟时间为0.4µs）'
      translation: "After receiving 24 bits, the DO port starts forwarding data as the next chip's input. Before forwarding, DO stays low; the chip then accepts no new data ... automatic reshape-and-forward ... (the chip's data delay is 0.4µs)."
      delay:
        {
          doc: ucs1903-cn,
          page: 2,
          quote: '传输延迟时间 | tPLZ | - | - | 300 | ns | CL ＝15pF，DIN → DOUT，RL ＝10kΩ',
        }
    backup_line: null
    compatibility_claims: []
    maker_table: null # the maker's current table (szucs-256) lists UCS1903B and UCS1903H, not UCS1903; see UCS1903N below
    controller_claims:
      - {
          source: advatek-ucs1903,
          claim: 'Data Transfer Rate | 400 - 800kbps ; PWM Rate | 400Hz ; Output Pixel Voltage | 5 - 12V',
        }
      - {
          source: enttec-ucs1903,
          claim: 'Faster, more stable timing than the earliest WS2811-class parts ... | PWM Rate | 400Hz | Redundant Data Line | No',
        }
      - {
          source: falcon-pixeltypes,
          claim: 'Type WS2811, alternatives include UCS1903 (with UCS1904, UCS1909, UCS1912, UCS2903, UCS2909, UCS2912, UCS9812); type "WS2811 Slow": "Same as WS2811 but @ 400KHz"',
        }
    disagreements:
      - 'Supply voltage: ucs1903-cn p6 "UCS 1903 可以配置成6～24V 电压供电" (6-24 V; 24 V needs an external NPN transistor) vs ucs1903-v1.0-en p7 "The power supply voltage for the UCS1903 may be selected from 6V to 12V".'
      - 'Timing vs WorldSemi WS2811 (2011 datasheet, low-speed table 0.5/1.2/2.0/1.3 µs): the 0-code is the same, the 1-code is not (UCS1903 T1H 2.0 µs / T1L 0.5 µs). See b2-ucs.md for the arithmetic.'
    open:
      - The high-speed tolerance is never printed (the note halves "the time" only).
      - 'Mouser hosts a "UCS1903 IC manul" (https://www.mouser.com/datasheet/2/813/UCS1903_IC-manul-1290933.pdf); it returned a bot-block page, and the Wayback Machine has no copy. Not read.'
      - No datasheet for the maker's current UCS1903B or UCS1903H (szucs-256 rows below under UCS1903N).

