      doc: szucs-4096
      quote: '(model cell empty) | 3 | 2 | 恒流 | ± 3% | 18 | 24 | 16 | 3 | 800K | 4096 | 工业级 | SOP8 ; (model cell empty) | 3 | 2 | 恒流 | ± 3% | 36 | 48 | 16 | 3 | 800K | 4096 | 工业级 | SOP8'
      translation: 'Bad-point-resume driver ICs, 4096 levels: two unnamed 3-channel rows (18/24 mA and 36/48 mA, 16 current levels, 800K) matching the datasheet''s UCS5603A and UCS5603B; the withstand-voltage cell reads "3".'
    controller_claims:
      - {
          source: advatek-ucs5603,
          claim: 'UCS5603 is very similar to UCS8903 but is built on an 12-bit color data design ... there is also a redundant data line | Data Transfer Rate | 800kbps | PWM Rate | 1000Hz',
        }
      - { source: enttec-ucs5603, claim: 'Redundant Data Line | Yes | PWM Rate | 1000Hz' }
      - {
          source: falcon-pixeltypes,
          claim: 'type SJ1221 (3 channels, 12 bits), alternative UCS5603',
        }
