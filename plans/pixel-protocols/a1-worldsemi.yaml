      pins: 'WS2814B only: DIN (pin 8) + BIN (pin 9). WS2814A and WS2814F: single DIN.'
      behaviour: "WS2814B: DIN main, BIN backup; the IC after a damaged IC takes BIN; first IC's BIN to GND."
      doc: ws2814b-v1.3-en
      page: 6
      quote: "1.DIN is the main input signal and BIN is the backup input signal. Under normal circumstances, the IC extracts signals from the DIN. When one IC among them is damaged, the latter IC extracts the signal from the BIN without affecting the signal transmission of the subsequent ics. 2. For the finished product application, the BIN pin of the first IC can't be left floating. It is recommended to connect it to GND."
    compatibility_claims: []
    disagreements:
      - 'WS2814A V2.1: RES >350 µs in the table (p3) vs ">280µs" in the figure (p4); WS2814B V1.3 and WS2814F V2.1 say >280 µs.'
