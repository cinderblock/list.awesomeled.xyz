batch: a1-worldsemi
researched: '2026-11-20'
# Summary, intersection arithmetic, disagreements and database corrections: a1-worldsemi.md (same folder).
# Conventions used below:
# - Every value is copied from the document named in `doc`, page `page`. Ranges are printed as "min~max";
#   they are stored as min_ns/max_ns. Values printed as typ ± tol are stored as ns + tol_ns.
# - `also_in` lists other documents that print the identical table (checked line by line).
# - Page numbers are the PDF page index (1-based), which matches the printed "n / N" on every sheet here.
# - "derived" marks a value computed from a rule printed in the same document (WS2811 high-speed only).
# - WorldSemi's current sheets on world-semi.com are image-only PDFs; they were read from page renders.
parts:
  # ───────────────────────────────────────────── WS2811 ─────────────────────────────────────────────
  - part: WS2811
    entry: pixel-ics/ws2811
    maker: WorldSemi
    documents:
      - id: ws2811-2011
        url: https://cdn-shop.adafruit.com/datasheets/WS2811.pdf
        title: WS2811 Signal line 256 Gray level 3 channal Constant current LED drive IC
        revision: null
        date: null # not printed; PDF metadata creationDate 2011-12-31
        language: en
        note: 'Identical text at https://www.superlightingled.com/PDF/WS2811.pdf (same 2011-12-31 creation date, Superlighting metadata).'
      - id: ws2811-v1.5-en
        url: https://www.world-semi.com/web/userfiles/productfile/WS2811_V1.5_EN.pdf
        title: WS2811 Signal line 256 Gray level 3 channel Constant current LED driver IC
        revision: V1.5 (revision log); page footers say V1.4
        date: '2019-09-20 per this log (the Chinese logs date V1.5 2018-09-20)'
        language: en
      - id: ws2811-v2.2-cn
        url: https://www.lcsc.com/datasheet/C114581.pdf
        title: WS2811 单线256级灰度三通道恒流LED驱动IC
        revision: V2.2
        date: '2024-08-06'
        language: zh
        note: 'LCSC wrapper; PDF at https://datasheet.lcsc.com/datasheet/pdf/6d22d3665addacf1ad7c32678eb754ae.pdf?productCode=C114581'
      - id: ws2811-v1.52-en
        url: https://www.world-semi.com/downloads/datasheets/en/ws2811-2.5.pdf
        title: WS2811 Single wire, 256 grayscale, 3 Channels Constant Current LED Drive IC
        revision: V1.52 (page footers and log); world-semi.com's datasheet index calls this file version 2.5
        date: '2026-07-28'
        language: en
      - id: ws2811-v2.5-cn
        url: https://www.world-semi.com/downloads/datasheets/zh-CN/ws2811-2.5.pdf
        title: WS2811 单线256级灰度三通道恒流LED驱动IC
        revision: V2.5
        date: '2026-07-28'
        language: zh
      - id: advatek-ws2811
        url: https://www.advateklighting.com/pixel-protocols/ws2811
        title: 'Advatek: LED Pixel Protocol WS2811 (controller maker page)'
        revision: null
        date: null
        language: en
      - id: advatek-ws2811-v1-4
        url: https://www.advateklighting.com/pixel-protocols/ws2811-v1-4
        title: 'Advatek: LED Pixel Protocol WS2811 V1.4 (controller maker page)'
        revision: null
        date: null
        language: en
    line_coding: single-wire
    line_coding_quotes:
      - { doc: ws2811-2011, page: 1, quote: 'IC use single NZR communication mode.' }
      - {
          doc: ws2811-v2.2-cn,
          page: 1,
          quote: '芯片采用单线归零码的通讯方式 (the chip uses single-wire return-to-zero code communication)',
        }
      - { doc: ws2811-v1.52-en, page: 1, quote: 'IC use single single wire RZ protocol.' }
    idle: low
    idle_quote: { doc: ws2811-v1.5-en, page: 3, quote: 'RES Frame unit, low voltage time >280µs' }
    bit_order: msb-first
    rates:
      - name: 400kHz low speed (2011 sheet)
        select: 'SET pin (pin 7) connected to VDD'
        select_quote:
          {
            doc: ws2811-2011,
            page: 2,
            quote: '7 SET Set work mode of IC as low speed model(connect VDD) or high speed model(vacant)',
          }
        T0H: { ns: 500, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.5 µs ±150ns' }
        T0L: { ns: 2000, tol_ns: 150, min_ns: null, max_ns: null, printed: '2.0 µs ±150ns' }
        T1H: { ns: 1200, tol_ns: 150, min_ns: null, max_ns: null, printed: '1.2 µs ±150ns' }
        T1L: { ns: 1300, tol_ns: 150, min_ns: null, max_ns: null, printed: '1.3 µs ±150ns' }
        period: null
        reset: { min_ns: 50000, printed: 'Above 50µs' }
        doc: ws2811-2011
        page: 3
        quote: 'Low Speed mode time / T0H 0 code,high voltage time 0.5 µs ±150ns / T1H 1 code,high voltage time 1.2 µs ±150ns / T0L 0 code,low voltage time 2.0 µs ±150ns / T1L 1 code,low voltage time 1.3 µs ±150ns / RES low voltage time Above 50µs / Note: It is one half of the time when high speed mode(reset time unchanged)'
        other: 'Switching table, same page: Operation frequency Fosc1 400 KHz, Fosc2 800 KHz; Data transmission rate FMAX min 400 Kbps (Duty ratio50%). Features p1: "Send data at speeds of up to 400 Kbps and 800 Kbps two patterns."'
      - name: 800kHz high speed (2011 sheet)
        select: 'SET pin (pin 7) left unconnected ("vacant")'
        select_quote:
          {
            doc: ws2811-2011,
            page: 2,
            quote: '7 SET Set work mode of IC as low speed model(connect VDD) or high speed model(vacant)',
          }
        T0H:
          {
            ns: 250,
            tol_ns: null,
            min_ns: null,
            max_ns: null,
            printed: 'derived: 0.5 µs ÷ 2; no high-speed table or tolerance is printed',
          }
        T0L: { ns: 1000, tol_ns: null, min_ns: null, max_ns: null, printed: 'derived: 2.0 µs ÷ 2' }
        T1H: { ns: 600, tol_ns: null, min_ns: null, max_ns: null, printed: 'derived: 1.2 µs ÷ 2' }
        T1L: { ns: 650, tol_ns: null, min_ns: null, max_ns: null, printed: 'derived: 1.3 µs ÷ 2' }
        period: null
        reset: { min_ns: 50000, printed: 'Above 50µs ("reset time unchanged")' }
        doc: ws2811-2011
        page: 3
        quote: 'Note: It is one half of the time when high speed mode(reset time unchanged)'
        other: 'The sheet does not say whether the ±150ns tolerance is also halved. Values here are the low-speed table divided by two, nothing else.'
      - name: 800kHz (V1.4 / V1.5, 2018-2019; same table in V2.2, 2024)
        select: null # pin 7 is NC
        select_quote: { doc: ws2811-v1.5-en, page: 2, quote: 'PIN function ... 7 NC NC' }
        T0H: { ns: null, tol_ns: null, min_ns: 220, max_ns: 380, printed: '220ns~380ns' }
        T0L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        T1H: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        T1L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        period: null
        reset: { min_ns: 280000, printed: '>280µs' }
        doc: ws2811-v1.5-en
        also_in: [ws2811-v2.2-cn]
        page: 3
        quote: 'Data Transfer Time / T0H 0 code, high voltage time 220ns~380ns / T1H 1 code, high voltage time 580ns~1us / T0L 0 code, low voltage time 580ns~1us / T1L 1 code, low voltage time 580ns~1us / RES Frame unit, low voltage time >280µs'
        other: 'Same page: Oscillation frequency Fosc 800 KHz; Data transmission rate FMAX min 600 Kbps (Duty ratio 50%). V2.2 (zh, p3) prints the same five rows: "T0H 0码，高电平时间 220ns~380ns ... RES 帧单位，低电平时间 280µs以上".'
      - name: 800kHz (English V1.52, 2026)
        select: null
        T0H: { ns: null, tol_ns: null, min_ns: 220, max_ns: 380, printed: '220ns~380ns' }
        T0L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1µs' }
        T1H: { ns: null, tol_ns: null, min_ns: 540, max_ns: 1000, printed: '540ns~1µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1µs' }
        period:
          {
            ns: null,
            tol_ns: null,
            min_ns: 1250,
            max_ns: null,
            printed: 'TDATA Data Cycle ≥1.25us',
          }
        reset: { min_ns: 280000, printed: '>280 µs' }
        doc: ws2811-v1.52-en
        page: 4
        quote: 'Data Transmission Time / T0H 0 code, high level duration 220ns~380ns / T1H 1 code, high level duration 540ns~1µs / T0L 0 code, low-level duration 580ns~1µs / T1L 1 code, low-level duration 580ns~1µs / RES Frame unit, low-level duration >280 µs / TDATA Data Cycle ≥1.25us'
        other: 'Revision log p9: "V1.51 M T1H timing modification 2025-11-01". Its own data-transmission figure on p4 labels the first RESET ">350µs" and the second ">280µs".'
      - name: 800kHz (Chinese V2.5, 2026)
        select: null
        T0H: { ns: null, tol_ns: null, min_ns: 220, max_ns: 380, printed: '220ns~380ns' }
        T0L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        T1H: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        T1L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1us' }
        period:
          { ns: null, tol_ns: null, min_ns: 1250, max_ns: null, printed: 'TDATA 数据周期 ≥1.25us' }
        reset: { min_ns: 350000, printed: '350µs以上' }
        doc: ws2811-v2.5-cn
        page: 3
        quote: '数据传输时间 / T0H 0码，高电平时间 220ns~380ns / T1H 1码，高电平时间 580ns~1us / T0L 0码，低电平时间 580ns~1us / T1L 1码，低电平时间 580ns~1us / RES 帧单位，低电平时间 350µs以上 (350 µs or more) / TDATA 数据周期 ≥1.25us'
        other: 'p1: "当接收到350µs以上低电平RESET码后" (after a low RESET code of 350 µs or more). p4 figure: both RESET labels ">350 µs". Log p10: "V2.3 M 修改高电平输入和RES复位时间 20260114" (changed high-level input and RES reset time); "V2.4 M 更正数据传输方法的RESET描述 20260121" (corrected the RESET description of the data transmission method).'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R G B'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low for >50 µs (2011), >280 µs (V1.4-V2.2 and English V1.52), ≥350 µs (Chinese V2.5)'
      doc: ws2811-v1.5-en
      page: 4
      quote: 'Composition of 24bit Data / R7 R6 R5 R4 R3 R2 R1 R0 G7 G6 G5 G4 G3 G2 G1 G0 B7 B6 B5 B4 B3 B2 B1 B0 / Note: Data transmit in order of RGB, high bit data at first.'
      also: 'Every revision read prints RGB: 2011 p4 "Note: Follow the order of RGB to sent data and the high bit sent at first."; V2.2 p4 / V2.5 p4 "注：高位先发，按照RGB 的顺序发送数据。"; V1.52 p5 "Note: Data transmit in order of RGB, high bit data at first."'
    forwarding:
      text: 'Each IC keeps the first 24 bits and re-shapes and forwards the rest on DO; the signal is 24 bits shorter after every chip. Printed DIN→DOUT transmission delay tPLZ max 300 ns (CL=15pF, RL=10KΩ).'
      doc: ws2811-2011
      page: 1
      quote: 'After the chip power-on reset, the DIN port receivedata from controller, the first IC collect initial 24bit data then sent to the internal data latch, theother data which reshaping by the internal signal reshaping amplification circuit sent to the next cascade IC through the DO port. After transmission for each chip,the signal to reduce 24bit.'
      delay:
        {
          max_ns: 300,
          doc: ws2811-2011,
          page: 3,
          quote: 'Transmission delay time tPLZ CL=15pF,DIN→DOUT,RL=10KΩ 300 ns',
        }
    backup_line: null
    compatibility_claims:
      - {
          claim: 'WS2811 V1.4 is the newly revised version of WS2811 , featuring a higher PWM rate and different data timing.',
          doc: advatek-ws2811-v1-4,
          page: null,
          by: controller maker (Advatek),
        }
      - {
          claim: 'Advatek WS2811 page lists PWM Rate 400Hz, Data Transfer Rate 800kbps; WS2811 V1.4 page lists PWM Rate 2000Hz, 800kbps.',
          doc: advatek-ws2811,
          page: null,
          by: controller maker (Advatek),
        }
    disagreements:
      - 'English V1.52 (2026-07-28, p4) prints T1H 540ns~1µs and RES >280 µs; Chinese V2.5 of the same date (p3) prints T1H 580ns~1us and RES 350µs以上. The English log lists "V1.51 T1H timing modification 2025-11-01"; the Chinese log lists V2.3 "修改高电平输入和RES复位时间" (2026-01-14). The two current sheets disagree on T1H min and on the reset time.'
      - 'English V1.52 p4: the timing table says RES >280 µs while the data-transmission figure on the same page labels the first RESET ">350µs" (second ">280µs").'
      - 'Revision dates: English V1.5 log (p8) "V1.5 ... 20190920", "V1.3 ... 20182207" (not a valid date); Chinese V2.2 / V2.5 logs give V1.3 2018-2-7 and V1.5 2018-9-20, and V1.0 20170524 vs English V1.0 20170523, V1.1 20171014 vs 20171009.'
      - 'V1.5 English p1 "Output port compression 20V." vs its own p2 Absolute Maximum "R/G/B Channel Output Port Withstand Voltage Vout 12 V". (Chinese V2.5 p1 describes "40V高压可编程定电流输出驱动器", 40 V.) Electrical, not wire-level.'
      - 'V1.5 English p3 lists input-level conditions "DIN, SET" although pin 7 is NC (leftover from the SET-pin sheet).'
      - 'Terminology: the 2011 and V1.5 English sheets say "single NZR communication mode"; V1.52 English says "single wire RZ protocol"; Chinese sheets say 单线归零码 (return-to-zero). Same waveform drawings in all.'
    open:
      - 'Tables between 2011 and V1.4 (e.g. WorldSemi V1.0-V1.3, 2017-2018) not found; the V1.4 log entry says T1L changed on 2018-09-10 but the earlier T1L value is unknown.'
      - 'FastLED maintainer (https://github.com/FastLED/FastLED/issues/523) recalls an "original" translated Chinese datasheet with low-speed 800 ns high / 1700 ns low for a 0 and 1600 / 900 for a 1. Not verified: no such document found.'
      - 'The 2011 sheet gives no tolerance for the halved high-speed values.'

