      - 'WS2812B-V7 English: page footers say V1.3, revision log ends at V1.2 (2026-07-24).'
      - 'V5 log (p8) mixes two products: "V1.0 N New WS2812B - V5 20190219" above "V1.0 N New 20170523".'
    open:
      - 'WorldSemi WS2812B revisions V1.1 (2017-10-09) and V1.2 (2018-02-07, "Maximum Ratings, Data Transfer Time") named in the V5 log were not found; the table between Mar-2017 and V5 is undocumented here.'
      - 'The Superlighting copy (0.35/0.9/0.9/0.35 µs, TH+TL ±150 ns) cannot be tied to a WorldSemi revision.'

