      doc: ws2813-2016
      page: 2
      quote: 'the first pixel collect initial 24bit data then sent to the internal data latch, the other data which reshaping by the internal signal reshaping amplification circuit sent to the next cascade pixel through the DO port. After transmission for each pixel, the signal to reduce 24bit.'
    backup_line:
      pins: 'DIN (pin 4) + BIN (pin 6); WS2813B-V6 adds BO (pin 1, "Bypass signal output"); 2016 / WS2813B-B / WS2813A-V7 have pin 1 NC'
      behaviour: 'Each pixel normally takes DIN. BIN of pixel n is fed from the input of pixel n-1 (WS2813A-V7 circuit) or from pixel n-1''s BO pin (WS2813B-V6 circuit). The 2016 text says the chip drops ("phagocytosis of") the first 24 bits arriving on BIN and compares the rest with DIN; if DIN carries nothing it switches to BIN, and (2016) stays on BIN until power-off. Reading of that quote with the drawn wiring: the 24 dropped bits are pixel n-1''s, so pixel n keeps its own colour and only the dead pixel goes dark (the sheets do not say this in so many words). First pixel''s BIN must not float (tie to GND).'
      doc: ws2813-2016
      page: 2
      quote: "The BIN receives the data signal, and then compare the data with the DIN side after phagocytosis of 24bit data, if DIN do NOT receive the signal, then switching to BIN for receiving the input signal, which ensure that any the IC's damage does not affect the signal cascade transmission and make the BIN in state of receiving signal until restart after power-off."
      also:
        - {
            doc: ws2813b-v6-en,
            page: 6,
            quote: "1.DIN is the main input signal and BIN is the bypass input signal. Under normal circumstances, the IC extracts signals from the DIN. When one IC among them is damaged, the latter IC extracts the signal from the BIN without affecting the signal transmission of the subsequent ics. 2. For the finished product application, the BIN pin of the first IC can't be left floating. It is recommended to connect it to GND.",
          }
        - {
            doc: ws2813b-v6-en,
            page: 3,
            quote: '1 BO Bypass signal output ... 6 BIN Bypass signal input',
          }
        - {
            doc: ws2813b-v6-en,
            page: 6,
            quote: 'Typical application circuit: DI→LED1 DI, BI→LED1 BI, LED1 DO→LED2 DI, LED1 BO→LED2 BI ... LEDn DO→DO, LEDn BO→BO (drawn, not text)',
          }
        - {
            doc: ws2813a-v7-en,
            page: 6,
            quote: 'Typical application circuit (drawn): pin 1 NC; DI → first DI and second BI; each DO → next DI and the BI after it; same Remark 1/2 text as WS2813B-V6.',
          }
        - {
            doc: ws2813b-b-2025,
            page: 2,
            quote: '6 BIN 辅数据输入 辅助数据信号输入脚 (auxiliary data input)',
          }
    compatibility_claims:
      - {
          claim: 'WS2813 ... the first in the series to offer both a redundant data line and a much higher PWM rate ... There are multiple variants of WS2813, including A, B, C and D. These variants offer different brightness levels',
          doc: advatek-ws2813,
          page: null,
          by: controller maker (Advatek),
        }
    disagreements:
      - '2016 sheet: reset "250us or more" (p2 text) and ">250us" (p6 figure) vs "300µs or more" (p5 table).'
      - '2016 sheet: 24-bit table drawn R G B (p6) vs note "order of GRB" (p6). All later WS2813B sheets draw and state GRB.'
      - "WS2813B-V6 (pin 1 = BO, bypass output) and WS2813A-V7 (pin 1 = NC, BIN wired to previous pixel's DI) are two backup wirings under one family name. The V6 sheet does not say whether BO is an internal copy of DIN or a regenerated output."
      - 'The 2016 timing (T0H 300-450 ns, T1H 750-1000 ns) and the 2025+ timing (T0H 220-380, T1H 580-1000) overlap only for T0H 300-380 and T1H 750-1000 ns.'
    open:
      - 'WorldSemi WS2813 tables from 2017-2024 (WS2813B-V5/W era) were not found; WS2813B-V6 says it is an "Upgrade from WS2813B-V5/W".'
      - 'What BO outputs on WS2813B-V6 (copy of DIN, or regenerated data) is not stated.'

