      also: '2016 p6: table drawn "R7 ... R0 G7 ... G0 B7 ... B0" but "Note: Data transmit in order of GRB, high bit data is first."; WS2813B-B p4 "注：高位先发，按照GRB 的顺序发送数据。"'
