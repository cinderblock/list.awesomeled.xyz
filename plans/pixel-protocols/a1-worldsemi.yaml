      pins: 'DIN (pin 4) + BIN (pin 6) on WS2815 2017; DIN1 (pin 4) + DIN2 (pin 6) on WS2815B-V1'
      behaviour: "Same as WS2813: DIN is main; if DIN carries nothing, take BIN (2017: and stay on BIN until power-off). Application circuits wire BIN of pixel n to DIN of pixel n-1 and tie the first pixel's BIN to GND."
      doc: ws2815-2017
      page: 1
      quote: "The BIN receives the data signal, and then compare the data with the DIN side after phagocytosis of 24bit data, if DIN do NOT receive the signal, then switching to BIN for receiving the input signal, which ensure that any the IC's damage does not affect the signal cascade transmission and make the BIN in state of receiving signal until restart after power-off."
      also:
        - {
            doc: ws2815-2017,
            page: 4,
            quote: 'Typical application circuit (drawn): L1 BI tied to GND; DI → L1 DI and L2 BI; L1 DO → L2 DI and the next BI.',
          }
        - {
            doc: ws2815b-v1-v2.4-cn,
            page: 4,
            quote: "1. DIN1 是主输入信号，DIN2 是辅助输入信号。正常情况下，LED 从DIN1 提取信号；当中间某一颗LED 损坏时，后一颗LED 从DIN2 提取信号，不影响后面LED 的信号传输。2. 成品应用时，第一颗LED 的DIN2 引脚不可悬空，建议接GND。 (DIN1 is the main input, DIN2 the auxiliary input. Normally the LED takes DIN1; when an LED in the middle is damaged, the next LED takes DIN2, without affecting transmission to later LEDs. The first LED's DIN2 must not float; tie it to GND.)",
          }
        - {
            doc: ws2815b-v1-v2.2-en,
            page: 1,
            quote: 'Realize two-way signal transmission, in the case of damage to a single pixel, it does not affect the display of the overall color.',
          }
    twelve_volt:
      text: '12 V supply straight to the package; logic powered internally. 2017: pin 1 VCC "IC POWER SUPPLY, Suspended or connected with a filter capacitor to GROUND", pin 2 VDD "LED POWER SUPPLY, connect to +12V", VDD +9.5~+13.5 V. WS2815B-V1: pin 1 NC, pin 2 VDD "+12V"; input high level VIH min 2.7 V (English V2.2) / 3.0 V (Chinese V2.4), max 5.7 V.'
      doc: ws2815-2017
      page: 2
      quote: '1 VCC VCC IC POWER SUPPLY, Suspended or connected with a filter capacitor to GROUND / 2 VDD VDD LED POWER SUPPLY, connect to "+12V" ... Power supply voltage VDD +9.5~+13.5 V'
    compatibility_claims:
      - {
          claim: 'It uses 12V as its main power input for each chip, VDD, which is then dropped down to 5V inside each pixel for its logic requirements.',
          doc: advatek-ws2815,
          page: null,
          by: controller maker (Advatek),
        }
    disagreements:
      - 'Timing changed twice: 2017-2018 (T1H/T0L 580ns~1.6µs, T1L 220~420 ns) → V1.1 2019-05-07 "Brightness, Timing" (table not found) → V2.2 (T1H 580~840, T0L 900~5000, T1L 600~5000 ns).'
      - 'V2.2 date: English log 2023-03-15, Chinese log 2022-12-21.'
      - 'English V2.2 p1: feature list "scan frequency is of 2KHz" vs description "Refresh Frequency updates to 4KHz". Chinese V2.4 says 4KHz.'
      - 'VIH min 2.7 V (English V2.2, p3) vs 3.0 V (Chinese V2.4, p3; log "修改高电平").'
      - 'Chinese V2.4 p4 24-bit table prints "G1 R0" where G0 belongs (typo); the note says GRB.'
    open:
      - 'The WS2815B-V1 table in force 2019-05-07 to 2022/2023 (V1.1-V2.1) was not found.'

