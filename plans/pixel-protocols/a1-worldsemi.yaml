        T1L: { ns: null, tol_ns: null, min_ns: 600, max_ns: 5000, printed: '600ns~5000ns' }
        period:
          {
            ns: null,
            tol_ns: null,
            min_ns: 1250,
            max_ns: null,
            printed: 'TDATA Data cycling time ≥1.25µs',
          }
        reset: { min_ns: 280000, printed: '>280µs' }
        doc: ws2808-v1.1-en
        also_in: [ws2808-v1.2-cn]
        page: 3
        quote: 'Data Transfer Time / T0H 0 code, high voltage time 220ns~380ns / T1H 1 code, high voltage time 580ns~840ns / T0L 0 code, low voltage time 900ns~5000ns / T1L 1 code, low voltage time 600ns~5000ns / RES Frame unit, low voltage time >280µs / TDATA Data cycling time ≥1.25µs'
        other: 'Log p6: "V1.1 M Optimization of Timing Description 20221221". p1: "Send data at speed of 800Kbps."; p3: FMAX min 600 Kbps.'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'G R B'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low >280 µs'
      doc: ws2808-v1.1-en
      page: 4
      quote: 'Composition of 24bit Data / G7 G6 G5 G4 G3 G2 G1 R0 R7 R6 R5 R4 R3 R2 R1 R0 B7 B6 B5 B4 B3 B2 B1 B0 / Note: Data transmit in order of GRB, high bit data sent at first.'
      also: 'V1.0 Chinese p4: "注：高位先发，按照GRB 的顺序发送数据。" (the "G1 R0" slot in the English table is a typo for G0; world-semi Chinese V1.2 p4 has the same typo).'
    forwarding:
      {
        text: 'First IC keeps 24 bits; re-shaped remainder on DO; tPLZ max 300 ns.',
        doc: ws2808-v1.1-en,
        page: 1,
        quote: 'After the chip power-on reset, the DIN1 port receive data from controller, the first IC collect initial 24bit data then sent to the internal data latch, the other data which reshaping by the internal signal reshaping amplification circuit sent to the next cascade IC through the DO port.',
      }
    backup_line:
      pins: 'DIN1 (pin 5, main) + DIN2 (pin 7, backup)'
      behaviour: "DI main, BI auxiliary; normally DI; if a middle LED is damaged the next LED takes BI. First LED's BI must not float; tie to GND."
      doc: ws2808-v1.2-cn
      page: 4
      quote: "1. DI 是主输入信号，BI 是辅助输入信号。正常情况下，LED 从DI 提取信号；当中间某一颗LED 损坏时，后一颗LED 从BI 提取信号，不影响后面LED 的信号传输。2. 成品应用时，第一颗LED 的BI 引脚不可悬空，建议接GND。 (DI is the main input, BI the auxiliary input. Normally the LED takes DI; when an LED in the middle fails, the next LED takes BI, without affecting later LEDs. The first LED's BI must not float; tie it to GND.)"
      also:
        - {
            doc: ws2808-v1.1-en,
            page: 1,
            quote: 'With the funtion of the dual signal input, even if one IC is damaged, the rest of ICs can work normally.',
          }
        - {
            doc: ws2808-v1.1-en,
            page: 2,
            quote: '5 DIN1 Data-1 input Control data signal input ... 7 DIN2 Data-2 input backup data signal input',
          }
        - {
            doc: ws2808-v1.0-cn,
            page: 1,
            quote: '具备断点续传功能，即使一颗IC损坏其余IC也能正常工作。 (breakpoint resume: the other ICs keep working if one is damaged)',
          }
    compatibility_claims:
      - {
          claim: 'Advatek WS2808 page: "The control circuit and LEDs are integrated in a 5050 SMD package" (WorldSemi sells WS2808 as an SOP8/FSOP8 driver IC).',
          doc: advatek-ws2808,
          page: null,
          by: controller maker (Advatek),
        }
    disagreements:
      - 'Two documents both labelled V1.2 print different timing: the szlcsc "WS2808F" V1.2 (2025-12-02) keeps the V1.0 table (T1H/T0L/T1L 580ns~1us), while the world-semi.com V1.2 (2026-07-16) prints T1H 580~840, T0L 900~5000, T1L 600~5000 ns like English V1.1. The two logs also differ (V1.2 "修改应用电路" by 何文镔 vs "更新logo；增加应用电路" by 陈永昭).'
      - 'English V1.1 p1 calls the part "WS28108" once (typo).'
    open: []

