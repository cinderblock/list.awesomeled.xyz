      - id: falcon-pixeltypes
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: Pixel Types (Falcon)
        revision: null
        date: null
        language: en
    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kHz standard (max 1MHz)
        select: null
        T0H: { ns: 312.5, tol_ns: null, printed: '0 code 1/4T high (computed at T=1/800kHz)' }
        T0L: { ns: 937.5, tol_ns: null, printed: '0 code 3/4T low (computed)' }
        T1H: { ns: 937.5, tol_ns: null, printed: '1 code 3/4T high (computed)' }
        T1L: { ns: 312.5, tol_ns: null, printed: '1 code 1/4T low (computed)' }
        period:
          {
            ns: 1250,
            min_ns: 1000,
            max_ns: null,
            printed: 'T=1/800kHz; "The maximum frequency can reach 1MHz"; RZ data frequency typical 800k Hz (p4)',
          }
        reset: { min_ns: 300000, printed: 'Reset >300us' }
        doc: gs8206-v0.2
        page: 6
        quote: 'Single code with 1:3 duty cycle and a standard 800kHz transmission speed. The maximum frequency can reach 1MHz. GS8206 re-code the data before transmission. Data delay is less than 0.7us from chip to chip, meets the dynamic image needs. / figure: 0 code 1/4T 3/4T; 1 code 3/4T 1/4T; T=1/800kHz; Intervals between code <10us; Reset >300us'
        notes: no tolerances are printed; "Intervals between code <10us" is the only limit on a stretched low time
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'Ch00b7…Ch00b0 Ch01b7…Ch01b0 Ch02b7…Ch02b0 (which Ch drives OUTR/OUTG/OUTB is not stated; the block diagram labels OUT1/2/3 Driver (R)/(G)/(B))'
      pixel_bits: 24
      extra: null
      start: 'Reset (drawn before the data)'
      end: null
      latch: 'low >300 µs'
      doc: gs8206-v0.2
      page: 6
      quote: 'GS8206 adopts the extended return to zero code (e-RZ) data transmission mode, 8bits data for single channel, each IC supports 3 channel for display. The transmission data is filtered internally to support the data anti-jitter function. / figure: Reset; Ch00b7 Ch00b6 Ch00b5 ---- Ch00b2 Ch00b1 Ch00b0; Ch01b7 … Ch01b0; Ch02b7 … Ch02b0; … Ch(N+2)b0; Reset'
    forwarding:
      text: Re-codes data before forwarding; chip-to-chip delay under 0.7 µs.
      doc: gs8206-v0.2
      page: 6
      quote: 'GS8206 re-code the data before transmission. Data delay is less than 0.7us from chip to chip'
    backup_line:
      pins: 'SDI (input), SDI2 (redundant input), SDO (output). SOP8 "GS8206": 5 SDO, 6 SDI, 7 SDI2; "GS8206B": 4 SDO, 5 SDI, 6 GND, 7 SDI2 (p2)'
      behaviour: "SDI2 is wired to the previous chip's SDI (application drawing p5: chip 1 input also feeds chip 2's SDI2, and so on; chip 1's SDI2 unconnected with an external controller). SDI is the default after power-on; the chip switches to the other line when the data is abnormal. SDI uses received bits 1–24; SDI2 discards bits 1–24 and uses bits 25–48, so a pixel still gets its own data when the pixel before it has failed. Under a test controller a pixel with a faulty channel shows white. Internal pattern mode: first chip's SDI/SDI2 tied to GND."
      doc: gs8206-v0.2
      page: 7
      quote: "Dual channel redundant control can be used to effectively avoid the failure of any single device damage … The SDI signal is used as the default transmission channel while the system is power on. The transmission channel priority is switched between SDI and SDI2 when the transmission data is abnormal. The device will choose the clear transmission channel after data detection. … When the external control data is transmitted, SDI uses the 1-24bits received data as the display data, meanwhile, SDI2 will discard the 1-24bits data and use 25-48bits data as the display data. … While any channel appears Weld, short, open or other abnormal communication, the chip will display in white … Under the internal display mode, the first chip's SDI/SDI2 needs to be connected to GND."
    compatibility_claims:
      - claim: '"The extension type is compatible with the traditional RZ code. So it is suitable for most of the RZ code controller in the market."'
        doc: gs8206-v0.2
        page: 6
      - claim: 'Falcon lists GS8206 among the alternatives of its "WS2811" type.'
        doc: falcon-pixeltypes
        page: null
    disagreements:
      - 'Advatek lists "Current Control Global: 2 Bits" ("Use the 2-bit global current control to lower the brightness") and "Data Transfer Rate 400 - 1000kbps"; the V0.2 datasheet shows no current-control bits in the frame and prints only typical 800 kHz (max 1 MHz in text).'
      - 'Built-in behaviour: "GS8206 gets into RGB test mode right after power on. If the device does not receive the external display data for a long time, the chip will go into the built-in display patterns mode." (p7)'
    open:
      - 'Acceptance window (tolerance) of the 1:3 code is not printed; mapping of Ch00/Ch01/Ch02 to OUTR/OUTG/OUTB is not stated.'

