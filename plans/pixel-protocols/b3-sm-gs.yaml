      latch: 'low ≥200 µs'
      doc: sm16714p-ibgsibv1.1-zh
      page: 5
      quote: 'Trst+第一颗芯片32bits 数据+第二颗芯片32bits 数据+......+第N 颗芯片32bits 数据+20bits 电流增益+Trst [… + 20-bit current gain + Trst] / 32bit 灰度数据结构：高位在前，按照RGBW 的顺序发送 [high bit first, RGBW order]; p6: 电流增益数据共20bits，红绿蓝白灯电流增益调节位各5bits，分别对应5bits（S4~S0），系统发送顺序是先发白灯5bits，然后是蓝灯的5bits，再发绿灯5bits，最后发红灯5bits，先发高位S4，最后发低位S0。[gain data is 20 bits, 5 bits each for R, G, B, W; sent white first, then blue, then green, then red; S4 first]'
