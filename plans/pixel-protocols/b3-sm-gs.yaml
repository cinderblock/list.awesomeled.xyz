      page: 4
      quote: 'tPLH 信号传输延迟 DOUT 端口对地负载电容30pF，DIN 至DOUT 的信号传输延时 - 75 - ns / tPHL - 64 - ns; p5 各芯片输入数据流: 芯片3 … 第三组32bits数据 20bits电流增益 Trst [chip 3 input: third 32-bit set, 20-bit current gain, Trst]'
    backup_line: null
    compatibility_claims:
      - claim: 'Sunmoon lists SM16714P and SM16714PHT as protocol "SID", 4 ch, current gain "32级" [32 levels].'
        doc: sunmoon-guide-2023q1
        page: 16
      - claim: 'Advatek: "SM16714, also known as SM16714P, is very similar to, SM16712, but is dedicated to RGBW"; "Current Control Per Color: 5 Bits".'
        doc: advatek-sm16714
        page: null
    disagreements:
      - 'SM16714P IBGSIBV1.1 prints T1H 0.6 µs ±0.05 (550–650 ns) and T1L 0.6 µs ±0.05; SM16714PHT IBGSZZV1.0 prints T1H 700–1000 ns (typ 900) and T1L ≥200 ns. The two T1H windows do not overlap.'
      - 'Port withstand voltage: SM16714P "OUT R/G/B/W 端口耐压15V" (p1) vs SM16714PHT/TH briefs "26V".'
      - 'Current range: briefs say 2.5~40mA; the datasheets'' gain table tops out at 39.7 mA; the 2023 guide says "2.5～38mA".'
    open:
      - 'What a chip does if the 20-bit gain word is missing (a plain 32-bit-per-pixel stream) is not documented.'

