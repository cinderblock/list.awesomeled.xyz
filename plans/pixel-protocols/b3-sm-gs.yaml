        quote: 'T0H 0 码，高电平时间 - 0.3 - ± 0.05 us / T0L 0 码，低电平时间 - 0.9 - ± 0.05 us / T1H 1 码，高电平时间 - 0.9 - ± 0.05 us / T1L 1 码，低电平时间 - 0.3 - ± 0.05 us / Trst Reset 码，低电平时间 200 - - - us (same table in SM16804EB IBSZZOV1.0 p6 and English IBSZZIV1.1 p6: "T0H 0，HIGH level - 0.3 - ±0.05 us … Trst Reset，LOW level 200 - - - us")'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 4
      wire_order: 'R7…R0 G7…G0 B7…B0 W7…W0'
      pixel_bits: 32
      extra: "16-bit current-gain word after the last chip's data: R, G, B, W, 4 bits each (S3…S0, S3 first), no reserved bits (Chinese IBSZZOV1.0, PB and EB); 0000 = 1.8 mA … 1111 = 19 mA."
      start: null
      end: '16-bit current-gain word, then Trst'
      latch: 'low ≥200 µs'
      doc: sm16804pb-ibszzov1.0-zh
      page: 6
      quote: 'Trst+第一颗芯片32bits 数据+第二颗芯片32bits 数据+……+第N 颗芯片32bits 数据+16bits 电流增益+Trst / 32bits 灰度数据结构：高位在前，按照RGBW 的顺序发送; p7: 电流增益数据共16bits，红绿蓝白灯电流增益调节位各4bits，分别对应4bits（S3~S0），系统发送顺序是先发红灯4bits，然后是绿灯的4bits，再发蓝灯4bits，最后发白灯4bits，先发高位S3，最后发低位S0。[gain data is 16 bits, 4 bits each for R, G, B, W; R first, then G, B, W; S3 first]'
    forwarding:
      text: Every chip's input ends with the 16-bit gain word (diagram); DIN→DOUT 73 ns typical; DIN and DOUT are both labelled input/output on PB and EB.
      doc: sm16804pb-ibszziv1.1-en
      page: 2
      quote: '5 DOUT Cascade signal output port/signal input port / 7 DIN Signal input port/cascade signal output port; p5: tPLH Signal transmission delay … DIN to DOUT signal: transmission delay - 73 - ns / tPHL - 73 - ns; p6 Input Data Stream of every chip: Chip3 Trst 3rd Set of 32bits Data 16bits Current Gain Trst'
    backup_line: null
    compatibility_claims:
      - claim: 'Advatek: "SM16804 is equipped with all the same features as its previous version, SM16803, but is dedicated to RGBW."'
        doc: advatek-sm16804
        page: null
      - claim: 'Falcon lists SM16804 under its plain 4-channel "APA109" type ("These expect 4 channels of input data per pixel.") — no gain word mentioned.'
        doc: falcon-pixeltypes
        page: null
      - claim: 'NeoPixelBus writes a 2-byte settings word "RGBW 4 bits each" at the end of the stream for SM16804EB/SM16824E.'
        doc: neopixelbus-sm168x4
        page: null
    disagreements:
      - 'English IBSZZIV1.1 p7: "Total current gain data: 16bits, with 4 reserved bits and 4 bits RGBW current gain adjustment for each color … send 4 bits of reserved first, then 4 bits of R, 4 bits of G, 4 bits of B,4 bits of W" — 4+16 = 20 bits, contradicting its own "16bits" and its R/G/B/W-only table. The Chinese IBSZZOV1.0 (PB and EB) says 16 bits = R, G, B, W with no reserved bits. The reserved-bits sentence matches the 3-channel SM16803PB text.'
      - 'The English SM16804PB datasheet and Sunmoon''s own SM16804PB brief carry the header "SM16804EB Landscape Decoration Driver IBSZZIV1.1".'
    open:
      - "Behaviour without the gain word (as Falcon's plain 4-channel setting would send) is not documented; how the bidirectional DIN/DOUT choose a direction is not described."

