      - 'Max data rate: V0.1 "can reach 1MHz" / 400k–1M; V0.7 "up to 1.2 MHz" / FDATA 400–1200 kHz.'
      - 'Supply: V0.1 "The range of input power is from +9V to +15V, and voltage-endurance of LED port is +12V"; V0.7 "input voltage range of 8V to 36V, with a maximum port voltage tolerance of 50V".'
      - 'No-input behaviour: V0.1 "In the absence of signal input, GS8208 displays the built-in display patterns"; V0.7 lists GS8208 (built-in animations), GS8208B and GS8208B_10 (without), and says no input "in the external control state" turns the PWM off.'
      - 'Output stagger order: V0.1 "OUT1, OUT2, OUT3 will work in accordance with the 80ns interval sequence"; V0.7 "OUTB, OUTG, and OUTR will output current in sequence at 80ns intervals".'
      - 'Advatek lists "Current Control Global: 2 Bits" and 400–1000 kbps; neither Genesis revision shows current-control bits in the frame.'
    open:
      - 'Acceptance window of the 1:3 code not printed; Ch00/Ch01/Ch02 to OUTR/OUTG/OUTB mapping not stated.'

