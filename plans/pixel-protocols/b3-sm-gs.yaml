# Workstream 8 (pixel protocols), research batch b3-sm-gs.
# Summary for the parent: b3-sm-gs.md (same folder).
# Conventions used here:
# - Chinese quotes are followed by an English translation in [brackets].
# - Sunmoon documents are identified by the code printed in their page header
#   (e.g. IBZGZIV1.3). Page numbers are the PDF's printed page numbers.
# - Where a datasheet prints a bit time as a fraction of the period (GS82xx
#   "1/4T"), ns is computed at the printed T=1/800kHz and `printed` says so.
# - `notes` on documents and `extra` fields are additions to the brief's schema.
batch: b3-sm-gs
researched: '2026-11-20'

# WorldSemi windows used for the overlap arithmetic in b3-sm-gs.md.
