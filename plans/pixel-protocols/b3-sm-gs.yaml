          }
        doc: sm16703p-iav1.1
        page: 4
        quote: '名称 描述 最小值 典型值 最大值 容许误差 单位 [name, description, min, typ, max, tolerance, unit] / T0H 0 码，高电平时间 - 0.3 - ±0.05 us / T1H 1 码，高电平时间 - 0.9 - ±0.05 us / T0L 0 码，低电平时间 - 0.9 - ±0.05 us / T1L 1 码，低电平时间 - 0.3 - ±0.05 us / Trst Reset 码，低电平时间 - 80 - - us'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0 (outputs OUTR, OUTG, OUTB)'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low ≥200 µs (IBZGZIV1.3); 80 µs typical (IAV1.1)'
      doc: sm16703p-ibzgziv1.3
      page: 6
      quote: 'Trst+ first chip 24bits data + second chip 24bits data +... + Nth chip 24bits data + Trst / 24bit grayscale data structure: RGB data transmission in high-order: R7 R6 R5 R4 R3 R2 R1 R0 G7 G6 G5 G4 G3 G2 G1 G0 B7 B6 B5 B4 B3 B2 B1 B0 bit23…bit0 (IAV1.1 p4: 高位先发，按照RGB 的顺序发送数据。[high bit first, sent in RGB order])'
    forwarding:
      text: Each chip takes the first 24 bits and reshapes and forwards the rest from DOUT. DIN→DOUT delay tPLH 85 ns / tPHL 70 ns typical (IBZGZIV1.3); tPLZ max 500 ns (IAV1.1 p3).
      doc: sm16703p-ibzgziv1.3
      page: 5
      quote: 'tPLH signal transmission delay ... DOUT port to ground load capacitance 30pF, Signal transmission delay from DIN to DOUT - 85 - ns / tPHL - 70 - ns; p1: Cascaded data shaping output to prevent data attenuation'
    backup_line: null
    compatibility_claims:
      - claim: 'Falcon lists SM16703 among the alternatives of its "WS2811" type (3 channels, 8 bits, 3 wires).'
        doc: falcon-pixeltypes
        page: null
      - claim: 'Sunmoon labels the protocol "SID" (单线归零码（SID）串联驱动 [single-wire RZ (SID) series drivers]): "SM16703P SID 3 256 30V 17mA 无 1KHz" [protocol SID, 3 ch, 256 levels, current gain: none].'
        doc: sunmoon-guide-2023q1
        page: 16
    disagreements:
      - 'IAV1.1 (2014) prints typ ±0.05 µs (T0H 0.3, T1H 0.9, T0L 0.9, T1L 0.3) and Trst 80 µs typical; IBZGZIV1.3 prints min/typ/max (T0H 200–400 ns, T1H 800–1000 ns, T0L ≥800 ns, T1L ≥200 ns, T ≥1200 ns) and Trst ≥200 µs.'
      - 'IAV1.1 p3 gives the data-rate test condition "占空比67%(数据1)" [duty 67% for a 1], while its own table gives T1H 0.9 / (0.9+0.3) = 75%.'
    open:
      - 'IAV1.1 prints the 80 µs reset only as a typical value; no minimum.'

