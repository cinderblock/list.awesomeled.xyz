    forwarding:
      text: Re-codes data before forwarding; chip-to-chip delay under 0.7 µs.
      doc: gs8208-v0.1-normand
      page: 6
      quote: 'GS8208 re-code the data before transmission. Data delay is less than 0.7us from chip to chip'
    backup_line:
      pins: 'SDI, SDI2 ("Redundant series data input"), SDO; SOP8: 4 SDO, 5 SDI, 6 GND, 7 SDI2 (V0.1 p2)'
      behaviour: 'Same text as GS8206: SDI default; switches on abnormal data; SDI uses bits 1–24, SDI2 discards bits 1–24 and uses 25–48. V0.7 p9 drawing wires each chip''s SDI2 to the previous chip''s SDI. V0.7 adds: reversed data cable turns that pixel''s PWM off; with no input "in the external control state" the chip turns its PWM off instead of entering the internal patterns.'
      doc: gs8208-v0.7
      page: 12
      quote: 'The system defaults to using SDI signals for display and transmission pathways upon power-up, with the capability to switch between SDI and SDI2 based on channel priority conditions. In the event of data transmission anomalies, the chip assesses interference within the channel and initiates a switch in the data transmission channel accordingly. When transmitting external control data, SDI utilizes the received 1-24 bits of data as the display data, whereas SDI2 discards the 1-24 bits of data and employs the 25-48 bits of data as the display data. (p13: When the data cable is reversed, the PWM display at the current point is turned off … When the chip detects no input data in the external control state, GS8208 will turn off the PWM display and not enter the internal control state)'
    compatibility_claims:
      - claim: '"The extension type is compatible with the traditional RZ code. So it is suitable for most of the RZ code controller in the market."'
        doc: gs8208-v0.1-normand
        page: 6
      - claim: 'Falcon lists GS8208 among the alternatives of its "WS2811" type.'
        doc: falcon-pixeltypes
        page: null
