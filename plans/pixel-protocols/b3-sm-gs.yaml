      start: null
      end: null
      latch: null
      doc: sm16711-igtt-izv1.2
      page: 4
      quote: 'p4: 该芯片协议采用的是单极性归零码，每一个码元都必须有低电平。本协议的每个码元起始为高电平，高电平时间宽度决定"0"码或者"1"码。"0"码和"1"码的周期一样，可以认为高低电平是一种互补的关系 [unipolar RZ; every code element starts high and must contain a low; the high width decides 0/1; 0 and 1 have the same period, high and low are complementary]; p1: 芯片输出电流由输入数据设定 [output current is set by the input data]; 指令数据寄存器控制输出极性选择 [an instruction data register selects output polarity]; p2: R 端口驱动电流 IOUT_R VDS_R=1V,R 白平衡增益Bit14-16=101 [R drive current at R white-balance gain bits 14–16 = 101]; p6: 设置指令寄存器数据bit23 值 P = 1 [set instruction register data bit23 P = 1 (to invert the outputs)]'
    forwarding:
      text: Reshapes and forwards data after taking its own; DIN→DOUT tPLZ max 500 ns.
      doc: sm16711-igtt-izv1.2
      page: 3
      quote: 'DOUT 传输延迟 tPLZ DIN→DOUT - - 500 ns; p1: 数据整形：接受完本单元数据自动将后续数据整形输出 [after receiving its own data, reshapes and outputs the following data]'
    backup_line: null
    compatibility_claims:
      - claim: 'Falcon lists SM16711 among the alternatives of its "WS2811" type.'
        doc: falcon-pixeltypes
        page: null
    disagreements: []
    open:
      - 'T0H/T0L/T1H/T1L values, reset time, bit order and the frame layout (where the instruction/white-balance bits sit) are not in the only copy found. No other SM16711 datasheet found (searched Sunmoon site, linkage.cn list, web).'

