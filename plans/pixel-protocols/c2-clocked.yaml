# Workstream 8 (pixel protocols), research batch c2-clocked: clocked (clock + data) pixel ICs.
# Brief: plans/pixel-protocols/BRIEF.md. Summary: plans/pixel-protocols/c2-clocked.md (read that first).
#
# Conventions used in this file
# - "page" is the PDF page number (1-based) of the document named in "doc", not the printed page
#   number, unless a value says "printed page".
# - All quotes are verbatim, typos included. Chinese quotes carry an English translation next to them.
# - Clocked parts have no pulse-width bit timing, so "rates" is [] for every part here. Clock limits are
#   under "clock". Extra keys beyond the brief's schema: clock.recommended_max_hz, clock.min_hz,
#   clock.min_high_ns, clock.min_low_ns, clock.setup_ns, clock.hold_ns, clock.propagation,
#   frame.chip_bits, frame.alternatives, pwm_clock (does the controller have to keep clocking?),
#   idle_note.
# - Documents whose kind is "library" or "controller" are third-party: quoted as what that party
#   implements or claims, never as the chip's specification.
batch: c2-clocked
researched: '2026-11-20'
parts:
  # ------------------------------------------------------------------------------------------------
  - part: WS2801
    entry: pixel-ics/ws2801
    maker: WorldSemi
    documents:
      - id: ws2801s-v2.0
        url: https://www.world-semi.com/web/userfiles/productfile/WS2801S_V2.0_EN.pdf
        title: 'WS2801S 3-Channel Constant Current LED Driver With Programmable PWM Outputs'
        revision: 'V2.0 (from the file name; no revision is printed in the document)'
        date: null
        language: en
      - id: ws2801-prelim-v0.3
        url: https://cdn-shop.adafruit.com/datasheets/WS2801.pdf
        title: 'Preliminary WS2801 3-Channel Constant Current LED Driver With Programmable PWM Outputs'
        revision: WS-Preliminary-V0.3
        date: Nov. 2008
        language: en
      - id: advatek-ws2801
        kind: controller
        url: https://www.advateklighting.com/pixel-protocols/ws2801
        title: 'Advatek: LED Pixel Protocol WS2801'
        revision: null
        date: null
        language: en
      - id: falcon-pixeltypes
        kind: controller
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: 'Falcon (pixelcontroller.com): Pixel Types (table data in the page script, "pixelTypes")'
        revision: null
        date: null
        language: en
      - id: fastled-ws2801
        kind: library
        url: https://github.com/FastLED/FastLED/blob/master/src/fl/chipsets/ws2801.h
        title: 'FastLED src/fl/chipsets/ws2801.h (master)'
        revision: null
        date: null
        language: en
    line_coding: clocked
    idle: low
    idle_note: 'Clock rests low between frames: "CLK pin keeps low more than 500uS" (ws2801s-v2.0 p14); Fig 10 draws CKI and DAI "Low" before and after the frame (p15).'
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 25000000
      recommended_max_hz: null
      min_hz: null
      min_high_ns: null
      min_low_ns: null
      setup_ns: null
      hold_ns: null
      sample_edge: rising
      shift_edge: null
      regenerated: 'buffered relay, not described as regenerated'
      propagation: 'CKI-to-CKO 8 ns (L to H) and 8.6 ns at VCC=5V; 9.0 ns and 13 ns at VCC=3.3V (both typical)'
      printed: 'Maximum input clock frequency 25MHz.'
      doc: ws2801s-v2.0
      page: 1
      quote: >-
        p1: "Maximum input clock frequency 25MHz." p2 (Absolute Maximum Ratings): "Input Clock Frequency FCLK 25 MHz".
        p1: "The serial data is read into the shift registers at the rise edge of the external clock. The data and clock
        output buffers are designed for cascading another chip." p4: "Propagation Delay CKI-to-CKO TpLH ... 8 ... ns",
        "TpHL ... 8.6 ... ns" (VCC=5V); "TpLH ... 9.0", "TpHL ... 13" (VCC=3.3V). No set-up, hold or minimum pulse
        width is printed in either revision.
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      chip_bits: 24
      extra: null
      start: 'none in the data; the frame starts after the clock has been low >500 µs (Fig 10: "Prepair for data transport > 500us")'
      end: null
      latch: 'clock (CKI) held low for more than 500 µs'
      doc: ws2801s-v2.0
      page: 14
      quote: >-
        p14: "CLK pin keeps low more than 500uS will make the WS2801 internal status register reset, and at this moment,
        the gray scale data in the data shift registers will be latched. Now WS2801 is ready for gray scale data
        transport. When the WS2801 receives total 24 clock rising edges, the WS2801 enters relay mode, which relays the
        input signal got from CKI and SDI with very low distortion (100pS typical) and very low delay time ( 8ns
        typical)." "The gray scale data frame is comprised of 3 gray data words, each data word is composed of 8 gray
        scale data bits, total 24 bits." "During data transfer, the first bit is the data frame signal, then is the MSB
        of the ROUT channel, the last one transferred into the data shift register is the LSB of the BOUT channel."
        p15 (Fig 10, "The Gray Scale Data Formate of WS2801"): R[7] (MSB) … R[0] G[7] … G[0] B[7] … B[0] (LSB); notes
        "1, when the data transport is completed, the gray scale data will be latched" and "2, When is gray scale data
        is latched, the gray scale data will be taken effect at the start of the next PWM cycle".
    pwm_clock:
      source: internal oscillator
      keep_clocking: false
      doc: ws2801s-v2.0
      page: 1
      quote: '"Build in PWM dimming scheme for each output channel, supports free-run, especially suitable for low cost controller application." "PWM free-run capability(refresh rate(2.5KHz)."'
    forwarding:
      text: 'Takes the first 24 bits, then relays CKI and SDI to CKO and SDO (8 ns typical delay), so the first 24 bits go to the chip nearest the controller.'
      doc: ws2801s-v2.0
      page: 14
      quote: '"When the WS2801 receives total 24 clock rising edges, the WS2801 enters relay mode, which relays the input signal got from CKI and SDI with very low distortion (100pS typical) and very low delay time ( 8ns typical)."'
    backup_line: null
    compatibility_claims:
      - claim: '"constant voltage driving mode, which is compatible with ZQL9712" (an output-stage claim, not a data-line claim)'
        doc: ws2801s-v2.0
        page: 11
      - claim: 'Falcon pixel type "WS2801": 3 channels, 8 bits, 4 wires; alternatives "WS2801", "WS2803" (controller grouping)'
        doc: falcon-pixeltypes
        page: null
      - claim: 'FastLED: "No frame overhead (latch is timing-based, not data-based)"; the controller waits between frames ("CMinWait<1000>  mWaitDelay;"). Library practice, not a maker claim.'
        doc: fastled-ws2801
        page: null
    disagreements:
      - 'Text vs figure on the first bit: p14 says "the first bit is the data frame signal, then is the MSB of the ROUT channel", which reads as if a framing bit precedes R7; Fig 10 (p15) numbers the clocks 0 to 23 with R[7] on clock 0, and p14 itself says the chip relays after "total 24 clock rising edges". The figure and the 24-edge count agree: no extra bit (ws2801s-v2.0 p14 vs p15; same wording in ws2801-prelim-v0.3 p11 vs p12).'
      - 'POL polarity pin, V0.3 vs V2.0: V0.3 p5 "When this pin is pull to GND, the driver output will be reversed; when floating or pulled high, the output polarity will not be reversed." V2.0 p6 "When POL is pulled to VCC, the driver output will be reversed; when floating or pulled high, the output polarity will not be reversed." (V2.0 contradicts itself.) Likewise V0.3 p9 "when POL is pull to GND" vs V2.0 p12 "when POL is pull to VCC". Not a data-line issue.'
      - 'Output voltage, V0.3 vs V2.0: V0.3 p2 "Output Voltage VOUT -0.4 to 7V", "Output Pin Voltage VXOUT -0.3 to 7V" and electrical characteristics "VOUT ... 7.0 V"; V2.0 p2 "-0.4 to 6V", "-0.3 to 6V" and p3 "Output Voltage VOUT IOUT=1uA -0.3 -- 5.5 V".'
      - 'ESD: V0.3 p2 "ESD susceptibility 4000 V"; V2.0 p2 "2000 V".'
      - 'Packages: V0.3 p1 "available in both SOP-14 and DIP-14 packages"; V2.0 p1 "available in SOP-14 packages".'
      - 'Cross-reference typo: V0.3 p11 says "can be seen in Fig 11" but the figure on p12 is captioned "Fig 10". Both revisions write "WS2081" for WS2801 (p1).'
    open:
      - 'No set-up/hold times, minimum clock high/low widths or minimum clock frequency are printed in either revision.'
      - 'What happens if the clock pauses for less than 500 µs mid-frame is not stated.'
