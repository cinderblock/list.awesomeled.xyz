  - part: ICND2110
    entry: pixel-ics/icnd2110
    maker: Chipone Technology (Beijing) Co., Ltd.
    documents:
      - id: icnd2110-v1.1
        url: https://downloads.olympianled.com/PDF/Driver%20ICs/ICND2110-datasheet-EN-2018-V1.1-including-PG.pdf
        title: 'ICND2110 12-Channel PWM Constant Current LED Sink Driver (Chipone; hosted by Olympian LED, a NovaStar distributor)'
        revision: V1.1
        date: Aug 2018
        language: en
      - id: advatek-icnd2110
        kind: controller
        url: https://www.advateklighting.com/pixel-protocols/icnd2110
        title: 'Advatek: LED Pixel Protocol ICND2110'
        revision: null
        date: null
        language: en
      - id: enttec-icnd2110
        kind: controller
        url: https://www.enttec.com/pixel-protocols/ICND2110
        title: 'ENTTEC: ICND2110 Pixel Protocol'
        revision: null
        date: null
        language: en
    line_coding: clocked
    idle: null
    idle_note: 'The clock never stops ("CLK needs to be sent continuously, without interruption"); SDI rests low between frames ("SDI pulls down until the next frame begins").'
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 30000000
      recommended_max_hz: null
      min_hz: null
      min_high_ns: null
      min_low_ns: null
      setup_ns: null
      hold_ns: null
      sample_edge: rising
      shift_edge: null
      regenerated: null
      propagation: null
      printed: 'Data transfer frequency:fMAX=30MHz(Max)'
      doc: icnd2110-v1.1
      page: 7
      quote: >-
        p2: "Data transfer frequency:fMAX=30MHz(Max)". p4: "Clock Frequency FCLK 30 MHz". p3: "CLKI Clock input terminal
        for data shift on rising edge", "CLKO Clock output to the following IC", "SDO Serial-data or command output to
        the following IC". p7: "Using dual line transmission mode, the CLK signal is transmitted at a fixed frequency and
        needs to be sent continuously, without interruption. The SDI signal is transmitted for the data and instruction,
        and is collected and written when the CLK signal is on the rising edge."
    frame:
      bits_per_channel: 16
      channels: 12
      wire_order: 'per chip: OUT5…OUT0 (96 bits), blank, OUT11…OUT6 (96 bits), blank; OUT0_R1 OUT1_G1 OUT2_B1 OUT3_R2 … OUT11_B4, so the first word is OUT5 = B2'
      pixel_bits: 48
      chip_bits: '192 data + 2 × 16 blank'
      extra: "16-bit register once per frame (bits 15:5 reserved, 4 PWM-wider, 3 UP ghosting reduction, 2:0 test, default 3'h7); 16-bit blanks of 0 between all elements"
      start: '128 bits of 1'
      end: '145 bits of 1, then SDI low until the next frame'
      latch: 'end marker (145 ones)'
      doc: icnd2110-v1.1
      page: 8
      quote: >-
        p7 table: "Start Frame start 128bit date=1" "End Frame end 145bit date=1" "Blank Blank signal 16bit
        data=0,Blank should be send between Start,Reg,Data of each chip,End" "Reg Reg input 16bit Register" "Data Date
        input 96bit data,Corresponding to OUT5~OUT0 and OUT11~OUT6 output channel 16bit data, first send OUT5 or OUT11,
        high bit in front, low bit in the rear". p8: "1. Send Start at the begin of each frame; 2. Send Blank; 3. Send
        Reg, input 16bit register; 4. Send Blank; 5. Send Date of chip1- OUT5~OUT0; 6. Send Blank; 7. Send Date of
        chip1- OUT11~OUT6; 8. Send Blank; 9. Repeat step 5~8, in turn, write chip 1, chip 2, until chip N; 10. Send End,
        frame data transmission end; 11. SDI pulls down until the next frame begins. Note: 1. Data 0 is sent when no
        data or instruction is sent; 2. CLK needs to be sent continuously, without interruption." p3 pins: "OUT0_R1",
        "OUT1_G1", "OUT2_B1", "OUT3_R2", "OUT4_G2", "OUT5_B2", "OUT6_R3", "OUT7_G3", "OUT8_B3", "OUT9_R4", "OUT10_G4",
        "OUT11_B4".
    pwm_clock:
      source: null
      keep_clocking: true
      doc: icnd2110-v1.1
      page: 8
      quote: '"2. CLK needs to be sent continuously, without interruption." (p8); p7 "the CLK signal is transmitted at a fixed frequency and needs to be sent continuously, without interruption." The datasheet does not say whether CLK is the PWM clock.'
    forwarding:
      text: "The first chip's data are sent first (chip 0 / chip 1 is the one next to the controller in the application drawing)."
      doc: icnd2110-v1.1
      page: 7
      quote: '"Each chip drives 4 sets of RGB, a total of 4 RGB-LED lights. The data is transferred and configured by dual line serial concatenation. The data of chip0 is sent first, and the data of chip N is sent at last."'
    backup_line: null
    compatibility_claims:
      - claim: 'Advatek: "ICND2110 allows connection of three RGB LEDs per chip. It is a 16-bit protocol"; "PWM Rate 3840Hz"'
        doc: advatek-icnd2110
        page: null
      - claim: 'ENTTEC: "a clocked (two-wire) RGB pixel driver with 16-bit per-channel greyscale and a 5 to 10V supply"; "Redundant Data Line No"'
        doc: enttec-icnd2110
        page: null
    disagreements:
      - 'Chips per RGB: datasheet p7 "Each chip drives 4 sets of RGB" and 12 outputs (p3); Advatek "allows connection of three RGB LEDs per chip".'
      - 'Supply: datasheet p2 "Power supply voltage: VDD =3.3～5V", p5 "VDD 3.3 5 5.5 V", p4 absolute "VDD 0~5.5 V", "Output voltage VOUT 10V"; ENTTEC calls 5-10 V the chip''s "supply"; Advatek "Input Voltage 5V", "Output Pixel Voltage 5 - 10V".'
      - 'Chip numbering: p7 drawing and text use "CHIP 0" … "chip N"; p8 steps use "chip1" … "chip N".'
      - 'The p8 waveform draws one "96b data" block per chip, while steps 5-8 send two 96-bit blocks (OUT5~OUT0, OUT11~OUT6) per chip.'
    open:
      - 'Whether the continuous CLK also clocks the PWM is not stated; no oscillator is mentioned. Minimum clock rate, set-up/hold and propagation are not printed.'
      - 'How the chip tells Start (128 ones) and End (145 ones) apart from data is not explained (each 96-bit block is at most 96 ones and blanks are zeros).'

