      - 'Falcon''s "MY9231?" grouping with the MY9221 is contradicted by the libraries: the MY9221 datasheet uses a 16-bit command inside a 208-bit frame and a 4-DI-pulse latch after >220 µs; the libraries use an 8-bit command in a separate phase and an 8-DI-pulse latch after ≥12 µs.'
    open:
      - 'No full MY9231 datasheet was found (searches, alldatasheet, datasheet4u: its "MY9291" file 1328926 is the MY9221 V1.0 datasheet). Command, data-width, latch and command-phase details here come only from two libraries derived from the MaiKe Labs C driver (not independent); set-up/hold, minimum DCKI widths, the latch timing limits and the chip order are unverified.'
