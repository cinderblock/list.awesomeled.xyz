      - 'Supply: p1 "voltage range is 3-8v"; p2 "VCC LDO power, range is 4.5v---8v"; p3 "Supply voltage VDD 3-8 V"; p4 suggested "VDD 5-7.5 V".'
      - 'p2 OMODE row says "OMODE=1, output is in-constant current/voltage drive mode,CMODE=0, output is out drive mode" (CMODE written for OMODE).'
    open:
      - 'The outputs are named OUT1, OUT2, OUT3 (p2); no page maps the three 5-bit groups to OUT1/2/3. Only the C51 example calls them red, green, blue (dr, dg, db).'
      - 'Grey level: GMODE=0 maps 5-bit data to a 256-step gamma 1.8 table, GMODE=1 to linear 32 steps (p2, p9-11). Output only; the wire is the same.'
