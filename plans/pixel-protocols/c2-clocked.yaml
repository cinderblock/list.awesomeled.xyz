    forwarding:
      text: 'Plain 208-bit shift register: DO shifts out what was shifted in, so the first 208 bits sent end up in the chip farthest from the controller (implied by the shift-register description; not stated in words). During the latch cycle DI pulses are re-timed onto DO.'
      doc: my9221-v1.0
      page: 13
      quote: '"The serial data will be shifted out from the DO pin on the synchronization of the rising and falling edge of DCKI." p16: "MY9221 provides DO signal retiming function which is fixed at Tw_re = 90ns@VDD=5V under internal-latch control cycle to prevent variation of the duty ratio caused by long cascading"'
