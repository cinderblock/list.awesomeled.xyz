  - part: MBI6020
    entry: pixel-ics/mbi6020
    maker: Macroblock
    documents:
      - id: mbi6020-v2.00
        url: https://www.neumueller.com/datenblatt/macroblock/MBI6020%20Preliminary%20Datasheet%20V2.00-EN.pdf
        title: 'MBI6020 PWM-Embedded 3-Channel Constant Current LED Sink Driver for Small RGB Cluster, Preliminary Datasheet (Neumüller copy)'
        revision: V2.00
        date: March 2012
        language: en
      - id: mbi6020-v1.01
        url: https://www.neumueller.com/datenblatt/macroblock/MBI6020%20Datenblatt%20-%20Datasheet.pdf
        title: 'MBI6020 datasheet (Neumüller copy)'
        revision: V1.01
        date: May 2010
        language: en
      - id: mbi6020-va.00
        url: https://www.mblock.com.tw/upload/Datasheet/RGB/MBI6020/MBI6020%20Datasheet%20VA%2000_EN.pdf
        title: 'MBI6020 Datasheet (two-page public summary, Macroblock)'
        revision: VA.00
        date: August 2015
        language: en
      - id: falcon-pixeltypes
        kind: controller
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: 'Falcon (pixelcontroller.com): Pixel Types'
        revision: null
        date: null
        language: en
    line_coding: clocked
    idle: low
    idle_note: 'Between packets both lines rest low: "both CKI and SDI should be tied-low and stop for more than 172 CKI cycles" (mbi6020-v2.00 p14).'
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 10000000
      recommended_max_hz: null
      min_hz: 200000
      min_high_ns: 15
      min_low_ns: null
      setup_ns: 7.5
      hold_ns: 7.5
      sample_edge: falling
      shift_edge: null
      regenerated: 'phase-inverted output clock (CKO is CKI inverted)'
      propagation: 'CKI↑–CKO↓ 25 / 30 / 35 ns (min/typ/max, VDD = 5 V); SDO↑↓–CKO↑ 7 / 10 / 14 ns'
      printed: 'Frequency CKI* FCKI 0.2 - 10 MHz'
      doc: mbi6020-v2.00
      page: 10
      quote: >-
        p13: "By SPI-like interface, MBI6020 samples the data (SDI) at the falling edge of the clock (CKI)." "By
        phase-inversed output clock, the clock phase will be inversed from CKI to CKO to eliminate the accumulation of
        the pulse width deviation." p10 (VDD=5.0V): "Setup Time SDI–CKI↓ tSU 7.5 - - ns", "Hold Time CKI↓–SDI tHD 7.5 -
        - ns", "Propagation Delay Time ("H" to "L") CKI↑–CKO↓ tPHL1 25 30 35 ns", "Pulse Width CKI* tw(I) 15 - - ns",
        "Frequency CKI* FCKI 0.2 - 10 MHz", "*The maximum frequency may be limited by different application conditions.
        Please refer to the application note for details."
    frame:
      bits_per_channel: '16 or 10 (selected per packet by the header)'
      channels: 3
      wire_order: 'packet: prefix, preamble, then per IC (last IC first) C, B, A words (OUTC first)'
      pixel_bits: '48 (16-bit) or 30 (10-bit)'
      chip_bits: '48 or 30, plus one 48-bit or 30-bit preamble per packet'
      extra: >-
        Preamble, 16-bit modes (48 bits): H[5:0], A[9:0] = 0, H[5:0] again, L[9:0] = N−1, P[3:0] parity, X1[1:0], L[9:0]
        again. 10-bit modes (30 bits): H[5:0], P[3:0], A[9:0] = 0, L[9:0]. Headers: 6'b111111 16-bit gray scale,
        6'b101011 10-bit gray scale, 6'b110011 8-bit dot correction, 6'b100111 6-bit dot correction, 6'b100011 16-bit
        configuration, 6'b110111 10-bit configuration.
      start: 'prefix: CKI and SDI both low and stopped for more than 172 CKI cycles'
      end: null
      latch: 'no latch command; data are taken when the packet is "correctly recognized" (auto-sync: at the end of the running PWM cycle; manual-sync: immediately)'
      doc: mbi6020-v2.00
      page: 22
      quote: >-
        p14: "MBI6020's data packet contains three parts: 1. Prefix: The prefix is a symbol of "Silent-to-Reset", i.e. a
        time period for MBI6020 to distinguish two data packets. During the prefix, both CKI and SDI should be tied-low
        and stop for more than 172 CKI cycles. 2. Preamble: The preamble defines the cascaded IC numbers and also
        contains a command to decide the data type. 3. Data: This is the data for each IC." p15: "Once MBI6020 receives
        the SDI=1 (1'b1), MBI6020 will start to check if the data is a valid header or not." p22: "For 16-bit gray scale
        data, each word is 16 bits. Each MBI6020 needs 3 words (3x16=48 bits) for the gray scale data of OUTC , OUTB
        and OUTA . Prior to the gray scale data, there is a 48-bit preamble." "47:42 H[5:0] 111111 The header of 16-bit
        gray scale data" "41:32 A[9:0] 0000000000 Address. Always send 10'b 0000000000" "31:26 H[5:0] 111111 Double
        check the header" "25:16 L[9:0] N -1. N=Number of IC in series" "15:12 P[3:0]" "11:10 X1[1:0] XX Don't care.
        Recommend to fill in 00." "9:0 L[9:0] N-1. N=Number of IC in series Double check the number of IC in series"
        "47:32 CN[15:0] ... OUTC" "31:16 BN[15:0] ... OUTB" "15:0 AN[15:0] ... OUTA" "The gray scale data of the last IC
        is sent first, followed by the previous ICs, and the first IC's gray scale data is sent in the end of the
        packet." p13: "MBI6020 provides SPI-like interface (CKI, SDI), a two-wire only transmission interface, to
        address the data, so that MBI6020 receives the data directly without latching data."
    pwm_clock:
      source: 'embedded oscillator (FOSC 18–22 MHz), GCLK = FOSC / 1…128'
      keep_clocking: false
      doc: mbi6020-v2.00
      page: 21
      quote: '"MBI6020 continuously repeats the PWM cycle and turns on the output ports according to the image data until the next image data is correctly recognized." p10: "Internal Oscillator FOSC 18.0 20.0 22.0" (MHz). p2: "The gray scale clock, GCLK, is generated by the embedded oscillator."'
    forwarding:
      text: "Data of the last IC are sent first and the first IC's data last; each IC learns the chain length from L[9:0] = N−1 in the preamble."
      doc: mbi6020-v2.00
      page: 22
      quote: '"The gray scale data of the last IC is sent first, followed by the previous ICs, and the first IC''s gray scale data is sent in the end of the packet."'
    backup_line: null
    compatibility_claims:
      - claim: 'Falcon: "MBI6020 (Not supported)", 10 bits'
        doc: falcon-pixeltypes
        page: null
    disagreements:
      - 'CKI time-out: V2.00 p15 "MBI6020 CKI signal cannot be stopped for more than 95 CKI cycles during the data transmission ... If the CKI is stopped for more than 95 CKI cycles, MBI6020 will ignore the present input data"; V1.01 p25 makes it configurable: "CF2[2] Time-out 1 (default) Enable 0 Disable", "1:0 CKI time-out period selection 11(default) 95~172 cycles 10 47~86 cycles 01 23~44 cycles 00 11~22 cycles"; V2.00 p17-18 reserves CF2: "Bit 2 Reserved 1 (Default) Must fill in 1", "1:0 Reserved 11 (Default) Must fill in 11". The V1.01 window (95~172) explains both numbers in V2.00.'
      - 'GCLK source: V1.01 p13 "The gray scale clock of PWM generator, GCLK, can be used as the embedded oscillator or the external clock source"; V2.00 p13 "is generated by the embedded oscillator" (the V2.00 pin drawing on p3 still shows an "E-GCLK" pin).'
      - 'V2.00 set-up/hold labels swap between tables: p10 "Setup Time SDI–CKI↓", "Hold Time CKI↓–SDI"; p11 "Setup Time CKI↓–SDI", "Hold Time SDI–CKI↓".'
    open:
      - 'Bit order is from the bit tables (bit 47 first, header at 47:42) and the packet figures; no sentence says "MSB first".'
