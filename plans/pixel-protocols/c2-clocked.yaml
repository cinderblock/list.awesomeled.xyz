  - part: LPD6803
    entry: pixel-ics/lpd6803
    maker: 'not named in the datasheet (database says Greeled Electronic; Advatek says "designed by Qiancai Electronics in China")'
    documents:
      - id: lpd6803-en
        url: https://cdn-shop.adafruit.com/datasheets/LPD6803.pdf
        title: 'LPD6803 datasheet (English translation, Adafruit-hosted)'
        revision: null
        date: null
        language: en
      - id: advatek-lpd6803
        kind: controller
        url: https://www.advateklighting.com/pixel-protocols/lpd6803
        title: 'Advatek: LED Pixel Protocol LPD6803'
        revision: null
        date: null
        language: en
      - id: falcon-pixeltypes
        kind: controller
        url: https://pixelcontroller.com/store/PixelTypes.html
        title: 'Falcon (pixelcontroller.com): Pixel Types'
        revision: null
        date: null
        language: en
    line_coding: clocked
    idle: null
    idle_note: 'Not stated. The C51 example (p9) starts with "SCLK=0;" and pulses "SCLK=1;SCLK=0;", i.e. the clock rests low in that example.'
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 25000000
      recommended_max_hz: 15000000
      min_hz: null
      min_high_ns: 30
      min_low_ns: 30
      setup_ns: 10
      hold_ns: 5
      sample_edge: rising
      shift_edge: null
      regenerated: true
      propagation: 'TPD and TCO < 12 ns (CL=30pF, RL=1K)'
      printed: 'Data Clock Frequency FCLK 25(compatible with grey level at 10) MHZ'
      doc: lpd6803-en
      page: 3
      quote: >-
        p1: "Adopt self-add token-ring technology dual shift line, shift clock can reah 24MHz." "Data clock signal is
        drived strongly to next chip to enhance level after built-in phase-lock circuit." p3 (Limited parameter):
        "Data Clock Frequency FCLK 25(compatible with grey level at 10) MHZ". p4 (Suggested working parameter): "Data
        clock frequency FCLK 0-15 MHZ", "Clock high-level voltage width TCLKH >30 ns", "Clock low-level voltage width
        TCLKL >30 ns", "Data build time TSETUP >10 ns", "Data keep time THOLD >5 ns"; timing: "Maxim delay time of
        concatenation output TPD ... <12 ns", "TCO <12". p2: "DCLK0 Serial clock output, after inside pll and strongly
        drive".
    frame:
      bits_per_channel: 5
      channels: 3
      wire_order: '1, R4…R0, G4…G0, B4…B0 (colour order from the C51 example; the frame text only says "1bit as start "1" plus 3 groups 5bits grey level")'
      pixel_bits: 16
      chip_bits: 16
      extra: 'one start bit "1" per pixel'
      start: '32 bits of 0'
      end: 'one extra DCLK pulse per pixel, DIN = 0'
      latch: 'new data takes effect after the extra pulses ("new data start valid")'
      doc: lpd6803-en
      page: 3
      quote: >-
        p3 (Basic timing sequence; figure: "32bit start frame data", "Point1 16bit grey data", "Point2 16bit grey
        data"): "A. First shift in 32bit "0" as start frame, then shift in all data frame, start frame and data frame
        both are shift by high-bit, every data is input on DCLK rising edge. B. The first data frame is corresponding
        LED light nearest from shift-in polar, its format includes 1bit as start "1" plus 3 groups 5bits grey level. C.
        Turn shift in all data, add append pulse of corresponding point, new data start valid." p9: "Notice: after all
        data are input in chip on the up-edge of DCLK, it may need send more DCLK pulse (DIN=0), on principle, how many
        group point in the transfer link, how many related pulse need to be sent out, it is important to which later
        chip built-in PLL re-gernate circuit can work in gear." p9-10 (C51 example): "// first output 32 "0" start
        frame", "{ SD0=1;SCLK=1;SCLK=0; //first output one "1" as start bit //output 5 bits red data Mask=0x10;", "//
        output 5 bits green data", "//output 5bits blue data", "// after output all nDots data, need add nDots pulse
        SD0=0; For (i=0;i<nDots;i++){SCLK=1;SCLK=0;}".
    pwm_clock:
      source: 'selectable: DCLK (CMODE=0) or internal 1.2 MHz oscillator (CMODE=1 or floating, the default via pull-up)'
      keep_clocking: 'only with CMODE=0'
      doc: lpd6803-en
      page: 8
      quote: >-
        p2: "CMODE choose inside grey clock GCLK, CMODE=0, GCLK=DCLK, CMODE=1, GCLK= inside oscillator output, built-in
        pull-up". p8: "Via set CMODE, LPD6803 grey level counter can adapt DCLK as clock( CMODE=0), Also can adapt
        built-in 1.2M(error ±15%)osscilator output of as clock(CMODE=1 Or dangle), prior one is normally used in those
        based on CPLD/FPGA high cost control system, later one is often used in low cost MCU control system." p8-9: "In
        CMODE=1 mode, MCU write display data into chip via SPI or two GPIO interface line, then each chip will
        automatically produce drive output with related duty cycle according to input grey level value, after data
        transfered, MCU can deal with other task, during this time, each LPD6803 will continue keeping original duty
        cycle drive output(FREE-RUN mode), till MCU send out next updated data."
    forwarding:
      text: 'The first 16-bit word goes to the chip nearest the controller; clock and data are regenerated (PLL) and driven to the next chip.'
      doc: lpd6803-en
      page: 3
      quote: '"The first data frame is corresponding LED light nearest from shift-in polar" (p3); "DOUT Serial data output, after inside strongly drive", "DCLK0 Serial clock output, after inside pll and strongly drive" (p2)'
    backup_line: null
    compatibility_claims:
      - claim: 'Falcon pixel type "LPD6803": 3 channels, 5 bits, 4 wires; alternatives "D705", "LPD1101", "LPD6803", "UCS6909", "UCS6912S" (controller grouping)'
        doc: falcon-pixeltypes
        page: null
