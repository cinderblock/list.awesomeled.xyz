  - part: LD1510
    entry: pixel-ics/ld1510
    maker: LDT Inc.
    documents:
      - id: ld1510-v3.0
        url: https://datasheetbank.com/pdf-view/LD1510-LDT.pdf
        title: 'LD1510 3Channel Output LED Driver with 12 bit PWM Controller (LDT Inc.); served from www.qdatasheet.com'
        revision: Ver. 3.0
        date: Feb. 2009 (data sheet dated 2009.02.17)
        language: en
    line_coding: clocked
    idle: low
    idle_note: 'The strobe is sent while CLKI is low; DO carries data when CLKI is high and repeats the strobe when CLKI is low ("DO Serial data output when CLKI is ''H'', strobe transmit when CLKI is ''L''.", p4).'
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 10000000
      recommended_max_hz: null
      min_hz: 500000
      min_high_ns: 40
      min_low_ns: 40
      setup_ns: 18
      hold_ns: 30
      sample_edge: rising
      shift_edge: null
      regenerated: 'CLKO re-generated: fixed width tW 45 ns typ, delay tCKD 13 ns typ, cycle tCY 100–2000 ns'
      propagation: 'CLKI-DO tPLH / tPHL 13 ns typ, 20 ns max'
      printed: 'Maximum CLKI Frequency fCKMAX (*1) 0.5 8 10 MHz (*1: Cascade Operation)'
      doc: ld1510-v3.0
      page: 9
      quote: >-
        p4: "Maximum serial input frequency : 10MHz". p9 AC CHARACTERISTICS: "Maximum CLKI Frequency fCKMAX (*1) 0.5 8 10
        MHz", "Pulse Width CLKI tWH0 / tWL0 40", "tWH1 40", "Data Setup Time tsetup 18", "Data Hold Time thold 30", "DI
        Width twsh 100 + 1 x N (*2)", "twsl 100 + 1 x N (*2)", "twss 10,000 (*3)", "Clock Delay CLKO tCKD 13", "Clock
        Width CLKO tW 45", "Clock Cycle CLKO tCY 100 2000"; "*1 : Cascade Operation *2 : N= Number of Chips in Serial *3 :
        N= 2000ea". p3 revision history: "'Maximum serial input frequency : 20MHz ' Is revised to 'Maximum serial input
        frequency : 10MHz )'". The sampling edge is drawn, not written: p10 "CLKI, DI, DO (Data Transmit)" puts tsetup and
        thold around the CLKI rising edge.
    frame:
      bits_per_channel: '8 (MOD = L) or 12 (MOD = H)'
      channels: 3
      wire_order: 'R, G, B, MSB first (8-bit: R7…R0 G7…G0 B7…B0)'
      pixel_bits: '24 (MOD = L) or 36 (MOD = H)'
      chip_bits: '24 or 36'
      extra: null
      start: null
      end: null
      latch: 'strobe: at least 10 µs after the last clock, with CLKI low, DI toggles 5 times (each high and low ≥ 100 ns + 1 ns × chips)'
      doc: ld1510-v3.0
      page: 15
      quote: >-
        p4: "MOD 4 Input data transfer mode selection. L : 8bit luminance data transfer. H : 12bit luminance data
        transfer". p15 (8bit Mode): "When 2 chips are connected in series, strobe signal shall be applied after 48ea of
        clock input. When more than 2 chips are connected in series, strobe signal shall be applied after N x 24ea of
        clock input. ('N' is the number of chip.) **Note) Apply the strobe signal after minimum 10us from the last clock
        (e.g. 48th clock in 2 chips)". p16 (12bit Mode): "strobe signal shall be applied after N x 36ea of clock input."
        p3 revision history: "Strobe Transmit 'DI : 2 times toggle when CLKI=L' is revised to 'DI : 5 times toggle when
        CLKI=L'". p10 "CLKI, DI (Strobe Transmit)": CLKI low, Twss, then five DI pulses (twsh / twsl).
    pwm_clock:
      source: 'built-in RC oscillator (internal PWM clock up to 12 MHz)'
      keep_clocking: false
      doc: ld1510-v3.0
      page: 4
      quote: '"• Built in internal RC oscillator" (p4); "Internal PWM Clock Frequency fPWMCK 12 MHz" (p6)'
    forwarding:
      text: "Shift register: after 24 (or 36) clocks the earlier bits leave on DO, so the first chip's worth of data sent ends in the farthest chip (from the figures); the strobe is repeated on DO while CLKI is low."
      doc: ld1510-v3.0
      page: 15
      quote: 'p15 figure, clocks 25-48: DI carries "R17 … R10 G17 … G10 B17 … B10" while DO carries "R07 … R00 G07 … G00 B07 …", then DI and DO both show the five strobe pulses and the internal ST pulse.'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'Clock maximum lowered between revisions: p3 "''Maximum serial input frequency : 20MHz '' Is revised to ''Maximum serial input frequency : 10MHz )''" and "''CLKI Frequency 20MHZ '' Is revised to ''CLKI Frequency 10MHZ ''" (V3.0, 2009.2.17).'
      - 'Strobe changed between revisions: V2.0 (2009.1.12) "''DI : 2 times toggle when CLKI=L'' is revised to ''DI : 5 times toggle when CLKI=L''".'
      - 'Figure label typos: the 8-bit figure (p15) labels clock 1 "R00" where the pattern (G07 at clock 9, B07 at 17, R17 at 25) needs R07; the 12-bit figure (p16) labels the first bit of each 12-bit word "R012"/"G012"/"B012" (bit 12) although each colour has 12 clocks (bits 11…0).'
    open:
      - '"twss 10,000 (*3)" with "*3 : N= 2000ea" reads as the 10 µs minimum for a 2000-chip chain; whether shorter chains may use less is not stated (p15-16 say "minimum 10us").'
