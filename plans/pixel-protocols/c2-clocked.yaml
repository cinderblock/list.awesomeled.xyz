      wire_order: '1, then three 8-bit groups; which group drives OUT1, OUT2, OUT3 is not printed'
      pixel_bits: 25
      chip_bits: 25
      extra: 'one start bit "1" per chip'
      start: '50 bits of 0'
      end: 'one extra DCLK pulse per chip, data low'
      latch: 'data take effect after the extra pulses'
      doc: sm16716-v1.1
      page: 5
      quote: >-
        p5 Function Description (figure: "50BIT data of initial frame", "First 25BIT grey data", "Second 25BIT grey
        data"): "1. Shift in 50Bits "0" to be the initial frame at first, and then shift in every data frame. The
        initial frame and the data frame are shifted in MSB first. Every data bit is shifted in at the rising edge of
        DCLK. 2. The first data frame corresponds to the closest LED light, the format includes the initial bit of 1Bit
        "1" and three sets of 8Bits gray data; 3. When all the data of the chip are transferred, transfer extra DCLK
        pulse counts which correspond to the number of the chip, and the above data starts to take into effect. The
        data signal of the extra DCLK pulse counts transferred is low –level. (The data signal issues "0", and the clock
        signal issues based on the above format); 4. Every set of the gray data is composed with the 1Bit"1"+24Bit gray
        data."
    pwm_clock:
      source: 'internal oscillator ("Interior PWM clock frequency fOSC 1.03 MHz")'
      keep_clocking: false
      doc: sm16716-v1.1
      page: 3
      quote: '"Interior PWM clock frequency fOSC 1.03 MHz VDD = 5.0V"'
    forwarding:
      text: 'The first 25-bit frame goes to the closest chip; clock regenerated through a PLL, push-pull outputs.'
      doc: sm16716-v1.1
      page: 5
      quote: '"The first data frame corresponds to the closest LED light" "The transport protocol adopts the double-line transport protocol that self-adjusts the signal, it can eliminate the race hazard between the clock signal and the data signal. In addition, the DOUT and DCLKO design the push-pull driving circuit."'
    backup_line: null
    compatibility_claims:
      - claim: 'SM16726 datasheet: "SET = 1（默认态），与SM16716 相同的双线数据协议。" [SET = 1 (default): the same two-wire data protocol as SM16716] and "封装兼容SM16716" [package compatible with SM16716]'
        doc: sm16726-v1.0
        page: 5
      - claim: 'Falcon pixel type "SM16716": 3 channels, 8 bits, 4 wires; alternatives "SM16716", "SM16726"'
        doc: falcon-pixeltypes
        page: null
      - claim: 'FastLED sends the pixels with a leading 1 bit per pixel ("FLAG_START_BIT ... an extra 1 bit is sent at the start of each triplet of bytes") and then 50 zero bits ("Write out 50 zeros to the spi line (6 blocks of 8 followed by two single bit writes)") after the pixels, which doubles as the next frame''s start. Library practice.'
        doc: fastled-sm16716
        page: null
    disagreements:
      - 'p2 pin table calls the clock output "DCLKO Clock input ... Serial clock input, regenerate through the interior PLL".'
      - 'Supply: p1 "Built-in LDO circuit, VDD range: 3.3-6.0V"; p2 "VDD ... 5V± 10%"; p3 absolute "VDD -0.5——+6.0 V" but electrical characteristics "VDD voltage VDD 3.3 5.0 7.0 V" (maximum above the absolute maximum).'
      - 'p6 gamma chart is labelled "Original 32bits Data" (an x axis of 0-32) on an 8-bit part.'
    open:
      - 'Mapping of the three 8-bit groups to OUT1/OUT2/OUT3 (and so R, G, B) is not printed. The SM16726 order (b23-b16 OUTR, b15-b8 OUTG, b7-b0 OUTB) is not copied here.'
