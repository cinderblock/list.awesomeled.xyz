      doc: lpd8803-8806-greeled
      page: 1
      quote: >-
        p1 Features: "3. Two-wire control mode, the shift clock up to 20MHz. 4. Unique data clock regeneration mechanism,
        super signal drive capability, support cascading length over 2000 pixels." p2 Absolute parameter: "clk/dat
        frequcy FCLK 20 MHz"; Recommand parameter: "dat/clk frequency FCLK 0~2 MHz", "High-level width TCLKH >40 ns",
        "low-level width TCLKL >40 ns", "data setup time TSETUP >10 ns", "data hold time THOLD >5 ns". p3: "max delay
        time for cascade output signal TPD ... <12 ... TCO <12 ns". p2: "SCLK0: Serial clock output, strong internal
        drive and renewable output". The datasheet does not say which clock edge samples data.
    frame:
      bits_per_channel: 7
      channels: 6
      wire_order: 'G, R, B per LED as Adafruit''s strips are wired (library: "Strip color order is GRB, not the more common RGB"); the datasheet names only OUT1-OUT6'
      pixel_bits: 24
      chip_bits: 48
      extra: 'every colour byte has its top bit set (library), so values are 7-bit'
      start: null
      end: 'zero bytes, (LEDs + 31) / 32 of them (library)'
      latch: 'per byte as data arrive; zero bytes reset the pass-through (library)'
      doc: adafruit-lpd8806-lib
      page: null
      quote: >-
        Library (not maker): "The LPD8806 is not a FIFO shift register. The first data out controls the LED *closest*
        to the processor ... Each LED driver 'fills up' with data and then passes through all subsequent bytes until a
        latch condition takes place." "All color data bytes have the high bit (128) set, with the remaining seven bits
        containing a brightness value (0-127). A byte with the high bit clear has special meaning (explained later)."
        "each individual byte (even the separate G, R, B components of each LED) is latched AS IT ARRIVES... or more
        accurately, as the first bit of the subsequent byte arrives and is passed through." "To reset the pass-through
        behavior and begin sending new data to the start of the strip, a number of zero bytes must be issued" "zero
        bytes can only travel 32 LEDs down the line before needing backup; the next 32 LEDs require an extra zero byte,
        and so forth." Code: "dataBytes = n * 3; latchBytes = (n + 31) / 32;" "*p++ = g | 0x80; // Strip color order is
        GRB," "*p++ = r | 0x80; // not the more common RGB," "*p++ = b | 0x80;". Datasheet (p2) only: "PMOD: Control
        single-pixel output, PMOD=1 or Null, 6-channel output independent; PMOD=0,OUT1 and OUT2, OUT3 and OUT4, OUT5 and
        OUT6 are sync output, occupies only three sets of data on the data link".
    pwm_clock:
      source: internal 1.2 MHz oscillator
      keep_clocking: false
      doc: lpd8803-8806-greeled
      page: 1
      quote: '"5. Built-in 1.2M oscillation circuit, support FREE-RUN mode, easy to programable design (refresh rate greater than 4000Hz). 6. Built-in 256 independent PWM grayscale control circuit for each channel, 1024 grayscale effect can be achieved by programming."'
    forwarding:
      text: 'Datasheet: regenerated clock and data out. Library: the first bytes go to the nearest LED, each chip fills up then passes the rest through.'
      doc: adafruit-lpd8806-lib
      page: null
      quote: '"The first data out controls the LED *closest* to the processor (unlike a typical shift register, where the first data out winds up at the *furthest* LED)." Datasheet p2: "SD0: Serial data output ,the strong internal drive output", "SCLK0: Serial clock output, strong internal drive and renewable output".'
    backup_line: null
    compatibility_claims:
      - claim: '"LPD8803/LPD8806 as a new generation of driver chips" and "LPD8803 support three-way output (pin downward compatible with LPD6803)" (pin compatibility, not protocol)'
        doc: lpd8803-8806-greeled
        page: 1
      - claim: 'Advatek: "Very similar to its previous version, LPD6803, LPD8806 provides 7 bits of data"; table "Color Resolution 7 Bits", "PWM Rate 4000Hz"'
        doc: advatek-lpd8806
        page: null
      - claim: 'Falcon pixel type "LPD8806": 3 channels, 7 bits, 4 wires; alternatives "LPD8803", "LPD8806", "LPD8809", "UCS8812"'
        doc: falcon-pixeltypes
        page: null
    disagreements:
      - 'Colour depth: datasheet p1 "Built-in 256 independent PWM grayscale control circuit for each channel"; Adafruit library and Advatek: 7 data bits; ENTTEC (enttec-lpd8806): "Color Resolution 8 Bits" and "Each channel carries 8-bit resolution for 24-bit RGB colour".'
      - 'Clock: p1 "the shift clock up to 20MHz" and absolute FCLK 20 MHz vs recommended "dat/clk frequency FCLK 0~2 MHz" (p2).'
      - 'Supply: p2 pin list "VCC: Power supply voltage is 3.3-5.5V"; absolute "supply voltage VCC 2.7~5.5 V"; recommended "VDD 4.5~5.5 V".'
    open:
      - 'The maker frame format (bits per channel on the wire, header bit, channel order, latch) is not in the English datasheet; every frame value here is from the Adafruit library (reverse-engineered behaviour, "Tested. Confirmed. Fact."). No Chinese original was found.'
      - 'Which clock edge samples data is not printed.'
