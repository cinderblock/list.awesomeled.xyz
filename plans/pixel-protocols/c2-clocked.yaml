      recommended_max_hz: '20 MHz single chip or cascaded with SDO = H; 10 MHz cascaded with SDO = L'
      min_hz: 0
      min_high_ns: 20
      min_low_ns: 20
      setup_ns: 15
      hold_ns: 15
      sample_edge: rising
      shift_edge: 'selectable: DAO changes on the CKO falling edge (SDO = H, recommended for cascades) or rising edge (SDO = L)'
      regenerated: 'buffered clock, data and strobe outputs'
      propagation: 'CKI-to-CKO 11.5 ns (L→H) / 7.2 ns (H→L); CKO-to-DAO 8.4 ns (SDO = L) / 4.0 ns (SDO = H)'
      printed: 'Maximum serial-in clock frequency: 20 MHz'
      doc: dm412-a.003
      page: 6
      quote: >-
        p2: "z Maximum serial-in clock frequency: 20 MHz" "z Built-in buffers for cascading clock, data, and strobe to
        next driver" "z Selectable auto/manual strobe (Patent pending)". p4: "CKI Synchronous clock input terminal for
        serial data transfer. Data is sampled at the rising edge of CKI." "SDO*1 Serial data output trigger mode
        selection: 'H' means data is shifted out on synchronization to falling edge of CKO, 'L' means data is shifted
        out on synchronization to rising edge of CKO." "*1 It is recommended that SDO should be set to high level in
        cascading system applications." p6: "Input Clock Frequency FCKI Single Chip Operation 20M; Cascade Operation
        (SDO='H', CL=13pF) 20M; Cascade Operation (SDO='L', CL=13pF) DC ⎯ 10M Hz", "STI Pulse Width tw STI 20", "CKI Pulse
        Width tw CLK 20", "Set-up Time for DAI tsetup(D) 15", "Hold Time for DAI thold(D) 15", "Set-up Time for STI
        tsetup(L) 15 ns", "Set-up Time for Internal Strobe tsetup(istb) 1 us". p8: "CKI-to-CKO ⎯ 11.5", "CKO-to-DAO (SDO =
        'L') tpLH ⎯ 8.4", "CKI-to-CKO ⎯ 7.2", "CKO-to-DAO (SDO = 'H') tpHL ⎯ 4.0".
    frame:
      bits_per_channel: 16
      channels: 3
      wire_order: 'R15…R0 G15…G0 B15…B0'
      pixel_bits: 48
      chip_bits: 48
      extra: 'none on input; on read-back the LSB of each word carries the LED-open flag (E[R], E[G], E[B]; 1 = normal)'
      start: null
      end: null
      latch: 'manual: STI strobe pin (H = latched, L = transparent), passed on as STO; auto (SDO = H only): CKI held high and eight DAI pulses'
      doc: dm412-a.003
      page: 13
      quote: >-
        p10 Input Data Format: "shift in first" R[15] … R[0] (MSB … LSB), then G[15] … G[0], then B[15] … B[0]. p4: "STI
        Input terminal of data strobe: 'H' means data is latched, 'L' means data on shift register goes through latch
        (level latch)." "STO Strobe output terminal." p13 timing notes: "*1 Keeping CKI in high level and sending into
        eight DAI pulses successively will trigger internal strobe automatically." "*2 Error message of LED open
        detection will be sent out from DAO." "*5 Internal strobe signal. Auto latch function is only for SDO = 'H'."
        Figure: "1 cell" = clocks 1…48; after the 48th clock either STI pulses low, or "CKI kept high" while DAI carries
        8 pulses ("8th*1") and ISTB (internal) pulses.
    pwm_clock:
      source: 'internal oscillator (~17.5 MHz), free-running'
      keep_clocking: false
      doc: dm412-a.003
      page: 2
      quote: '"z PWM free-running capability (refresh rate (~ 267 Hz) with internal oscillator (~ 17.5 MHz))"'
    forwarding:
      text: 'Plain 48-bit shift register per chip ("1 cell"): DAO shifts out the previous contents, so the first 48 bits sent end in the farthest chip (from the timing figure; not stated in words).'
      doc: dm412-a.003
      page: 13
      quote: 'Timing figure: DAO*3 / DAO*4 show RA[15] … BA[0] leaving while RB[15] … BB[0] enter on DAI ("1 cell" = 48 clocks). p2: "Data, clock, and latch buffer outputs are designed for cascading another chip."'
    backup_line: null
    compatibility_claims: []
    disagreements: []
    open:
      - 'How long STI must stay low and whether the auto strobe needs a CKI-high time before the DAI pulses beyond "tsetup(istb) 1 us" is only in the figure.'
