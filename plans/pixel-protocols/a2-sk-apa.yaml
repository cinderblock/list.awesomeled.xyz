      - "Channel order: rev 01 (2019) G R B; A/2 (2023) and B/1 (2025) R G B, with 'send data in RGB order (R7 → R6 →.... B0)'. A controller set for one would swap red and green on the other, if both sheets are right."
      - "DIN2 called 'Standby control signal input data' (2019), 'Thermal data processing' (2023), '备用信号 Standby signal' (2025)."
      - "B/1 cover '版本号 Version No.: B/0' vs page headers 'Rev. No.: B/1'."
      - 'B/1 p8 connection-method figure shows only DIN→DO; its p9 application circuit wires DIN2.'
    open:
      - "Which revision (A/0 2021-03-20 'Modify product specifications' or A/1 2022-04-20 'Modify pin definition') switched GRB → RGB; A/0 and A/1 not found."

