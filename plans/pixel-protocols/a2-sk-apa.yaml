          by: Advatek (controller maker),
          doc: advatek-sk6818,
          page: null,
        }
      - {
          claim: 'A single-wire, self-clocking RGBW pixel with an integrated driver IC in a 5050 package, running 8-bit-per-channel colour at 5V … Redundant Data Line No',
          by: ENTTEC (controller maker),
          doc: enttec-sk6818,
          page: null,
        }
      - {
          claim: 'Falcon pixel type "APA109" (4 channels) alternatives include SK6818',
          by: Falcon (controller maker),
          doc: falcon-pixeltypes,
          page: null,
        }
      - {
          claim: 'IC Type sk6818/sk6812 (strip sheet)',
          by: Thomsen/Conrad strip sheet,
          doc: conrad-sk6818-strip,
          page: 1,
        }
    disagreements:
      - "Table minimum symbol period 0.9µs vs note 2 'minimum required code period is 1.2 µ s' on the same page."
      - 'Advatek calls SK6818 the RGBW version of SK6822 (which has 0.35/1.36µs timing and a backup line per its own sheets); the Normand SK6818 sheet has the SK6812-style table and no backup pin.'
    open:
      - "No 5 V SK6818 maker sheet found; the Normand sheet is a provisional spec for a 24 V 5249-package variant. The 5 V part's timing and channel order are unverified."

