        period: { ns: 1250, tol_ns: 600, printed: 'TH+TL=1.25µs±600ns' }
        reset: { min_ns: 24000, printed: 'Above 24µs (method diagram: >=50us)' }
        doc: apa104-newstar
        page: 4
        quote: 'Data transfer time( TH+TL=1.25µs±600ns) | T0H 0 code ,high voltage time 0.35us ±150ns | T1H 1 code ,high voltage time 1.36us ±150ns | T0L 0 code , low voltage time 1.36us ±150ns | T1L 1 code ,low voltage time 0.35us ±150ns | RES low voltage time Above 24µs'
