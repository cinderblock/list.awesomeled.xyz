# Batch a2-sk-apa: Opsco/Normand SK68xx, APA Electronic / Newstar APA10x, BaiCheng PL9823.
# Research notes for workstream 8 (pixel protocols). Summary: a2-sk-apa.md (read it first).
# Conventions: one `rates` item per datasheet revision (they differ); `ns` holds the printed
# typical ("Actual value"/"Standard value"), min_ns/max_ns the printed range, tol_ns a printed ±.
# Extra keys used beyond the brief's template: other_entries (same part, second DB entry),
# frame_variants (revisions that print a different frame), baseline (reference part).
batch: a2-sk-apa
researched: '2026-11-20'
parts:
  # ---------------------------------------------------------------- baseline (not in batch)
  - part: WS2812B
    entry: pixels/ws2812
    baseline: true # the comparison reference for this batch; read both sheets
    maker: WorldSemi
    documents:
      - id: ws2812b-old
        url: https://cdn-shop.adafruit.com/datasheets/WS2812B.pdf
        title: WS2812B Intelligent control LED integrated light source
        revision: null # none printed
        date: null
        language: en
      - id: ws2812b-v5
        url: https://www.lcsc.com/datasheet/C2761795.pdf # resolves to datasheet.lcsc.com/datasheet/pdf/bc8264a6d62c958a89e25ec8cc82b690.pdf
        title: WS2812B Ver. No.:V5 Intelligent control LED integrated light source
        revision: V5 (history row 'V5.0 … 20190323'; first row 'New WS2812B - V5 20190219')
        date: '2019-03-23'
        language: en
    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kbps (undated sheet)
        select: null
        T0H: { ns: 400, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.4us ±150ns' }
        T0L: { ns: 850, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.85us ±150ns' }
        T1H: { ns: 800, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.8us ±150ns' }
        T1L: { ns: 450, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.45us ±150ns' }
        period: { ns: 1250, tol_ns: 600, printed: 'TH+TL=1.25µs±600ns' }
        reset: { min_ns: 50000, printed: 'Above 50µs' }
        doc: ws2812b-old
        page: 3
        quote: 'Data transfer time( TH+TL=1.25µs±600ns) | T0H 0 code ,high voltage time 0.4us ±150ns | T1H 1 code ,high voltage time 0.8us ±150ns | T0L 0 code , low voltage time 0.85us ±150ns | T1L 1 code ,low voltage time 0.45us ±150ns | RES low voltage time Above 50µs'
      - name: 800kbps (V5)
        select: null
        T0H: { ns: null, tol_ns: null, min_ns: 220, max_ns: 380, printed: '220ns~380ns' }
        T0L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1µs' }
        T1H: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 580, max_ns: 1000, printed: '580ns~1µs' }
        period: null
        reset: { min_ns: 280000, printed: '>280µs' }
        doc: ws2812b-v5
        page: 3
        quote: 'Data Transfer Time | T0H 0 code, high voltage time 220ns~380ns | T1H 1 code, high voltage time 580ns~1µs | T0L 0 code, low voltage time 580ns~1µs | T1L 1 code, low voltage time 580ns~1µs | RES Frame unit, low voltage time >280µs'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'G R B'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low >50µs (old sheet) / >280µs (V5)'
      doc: ws2812b-old
      page: 5
      quote: 'Composition of 24bit data: G7 G6 G5 G4 G3 G2 G1 G0 R7 … B0 | Note: Follow the order of GRB to sent data and the high bit sent at first.'
    forwarding:
      text: first pixel keeps the first 24 bits, reshapes and forwards the rest on DO
      doc: ws2812b-old
      page: 1
      quote: 'the first pixel collect initial 24bit data then sent to the internal data latch, the other data which reshaping by the internal signal reshaping amplification circuit sent to the next cascade pixel through the DO port. After transmission for each pixel，the signal to reduce 24bit.'
      delay: 'tPLZ max 300 ns (CL=15pF, DIN→DOUT,RL=10KΩ), old sheet p3 and V5 p3'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'The two WorldSemi sheets do not print the same windows: old sheet T0H 0.4us ±150ns, T1H 0.8us ±150ns, T1L 0.45us ±150ns, RES above 50µs; V5 T0H 220ns~380ns, T1H 580ns~1µs, T1L 580ns~1µs, RES >280µs. Their T1L windows meet only at 580–600 ns.'
    open: []

