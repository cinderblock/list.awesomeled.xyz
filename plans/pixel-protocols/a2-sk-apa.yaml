    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'G R B'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'reset low: 80µs (2015) / >80µs (2019, 2022) / >200µs (2025)'
      doc: sk6812-opsco-b1
      page: 8
      quote: '13. 24bit数据结构 24 bit data structure: G7 G6 G5 G4 G3 G2 G1 G0 R7 R6 R5 R4 R3 R2 R1 R0 B7 B6 B5 B4 B3 B2 B1 B0 | 注Note：高位先发，按照GRB的顺序发送数据 High bit first send, send data in GRB order (G7 → G6 →.... B0)'
      also: 'Every SK6812 revision read draws the same G…R…B 24-bit structure (rev 02 p6, LED Color rev 01 p6, Normand rev 06 p7, A/0 p9).'
    forwarding:
      text: each pixel keeps the first 24 bits, reshapes and forwards the rest on DOUT
      doc: sk6812-opsco-r02
      page: 2
      quote: 'The 24-bit data is transmitted from the controller to DIN of the first element, and if it is accepted it is extracted pixel to pixel. After an internal data latch, the remaining data is passed through the internal amplification circuit and sent out on the DO port to the remaining pixels. The pixel is reset after the end of DIN.'
      delay: "rev 02 p4: 'DOUT transmission delay TPLH --- --- 500 ns DIN→DOUT / TPHL --- --- 500 ns'; A/0 p7: 'TPLH --- 67 --- ns … TPHL --- 82 --- ns … The load capacitance of dout port to ground is 30pf,Signal transmission delay from DIN to dout'"
    backup_line: null
    compatibility_claims:
      - {
          claim: 'This pixel protocol was designed by OPSCO in China.',
          by: Advatek (controller maker),
          doc: advatek-sk6812,
          page: null,
        }
      - {
          claim: 'Falcon pixel type "WS2811" alternatives include ''SK6812 (RGB)''',
          by: Falcon (controller maker),
          doc: falcon-pixeltypes,
          page: null,
        }
      - {
          claim: "The SK6812 is a direct clone of the WS2812B … I don't expect any issues with the timing of existing WS2812 libraries",
          by: cpldcpu (third-party measurement),
          doc: cpldcpu-sk6812,
          page: null,
        }
    disagreements:
      - "Reset: LED Color rev 01 table says 'Trst Reset code，low level time 80µs' (p5) but its own transmission diagram says 'reset code >=50us' (p6). Later sheets: >80µs (Normand rev 06, Opsco A/0), >200µs (Opsco B/1)."
      - 'High-time windows move between revisions: T0H 0.3µs ±0.15µs (2015) → 0.2–0.4µs (2019, 2022) → 0.25–0.40µs (2025); T1H 0.6µs ±0.15µs = 0.45–0.75µs (2015) → 0.58–1.0µs (2019) → 0.6–1.0µs (2022) → 0.65–1.00µs (2025). The 2015 T1H upper limit (0.75µs) sits inside every later window.'
      - "Normand rev 06 and Opsco A/0 keep the heading 'TH+TL=1.25µs±600ns' (i.e. 0.65–1.85µs) above a table whose code period is '1.20 -- --' µs minimum, and a note 'the minimum symbol period is 1.2μs'."
      - "Overviews call it 'unipolar NRZ communication mode' (rev 02 p2, Normand rev 06 p3) while the notes under the table say 'The protocol uses a unipolar zeroing code. Each symbol must have a low level' (Normand rev 06 p7, B/1 p7)."
      - "B/1 revision record (p13) lists '2021-11-15 A/0 First issue'; the A/0 sheet itself (LEDYi copy) is dated 2022/07/13 with '2022-07-13 A0 Initial Document'."
    open:
      - "B/0 (2024-03-02) Opsco revision not found; B/1 says it 'Upgrade[d] IC electrical parameters', so the 80→200µs reset change happened at B/0 or B/1."
      - "No sampling point or maximum period printed in any revision beyond 'low-level time … less than 20 µs'."

