      - name: 800kbps — APA-104-4-12V A/0 (2021), 12 V variant
        select: null
        T0H: { ns: 250, tol_ns: null, min_ns: 200, max_ns: 400, printed: '0.2 / 0.25 / 0.4 µs' }
        T0L: { ns: null, tol_ns: null, min_ns: 800, max_ns: null, printed: '0.8 / -- / -- µs' }
        T1H: { ns: 750, tol_ns: null, min_ns: 650, max_ns: 1000, printed: '0.65 / 0.75 / 1.0 µs' }
        T1L: { ns: null, tol_ns: null, min_ns: 200, max_ns: null, printed: '0.2 / -- / -- µs' }
        period: null
        reset: { min_ns: 80000, printed: '≧80 µs' }
        doc: apa104-4-12v
        page: 7
        quote: 'T0H 0 code, high level time 0.2 0.25 0.4 µs | T0L 0 code, low level time 0.8 -- -- µs | T1H 1 code, high level time 0.65 0.75 1.0 µs | T1L 1 code, low level time 0.2 -- -- µs | Trst Reset code，low level time ≧80 -- -- µs'
