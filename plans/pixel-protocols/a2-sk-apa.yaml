        doc: sk6822-ledcolor-r01
        page: 5
        quote: '9. The data transmission time (TH+TL=1.7µs±600ns): T0H 0 code, high level time 0.35µs ±0.150ns | T0L 0 code, low level time 1.36µs ±0.150ns | T1H 1 code, high level time 1.36µs ±0.150ns | T1L 1 code, low level time 0.35µs ±0.150ns | WT Wait for the processing time 12µs ±0.150ns | Trst Reset code，low level time 50µs'
        also: "p2: 'Using a typical data transmission frequency of 800 Kbps'. Same table in sk6822-newstar-r01 p5 and apa104-22c p4 (where T1L is mislabelled '1 code, high level time')."
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R G B'
      pixel_bits: 24
      extra: "A 'WT' (12µs) gap is drawn between every 24-bit group on both data rows of the transmission diagram"
      start: null
      end: null
      latch: 'reset low 50µs'
      doc: sk6822-ledcolor-r01
      page: 5
      quote: "12. The data structure of 24bit: R7 … R0 G7 … G0 B7 … B0 | Note: high starting, in order to send data (R7 - R6 - ...... ..B0). 11. The method of data transmission (figure): DO row '第一位24BIT, WT, 第二位24BIT, WT, 第三位24BIT, WT, 第四位24BIT, RESET CODE'; DI row '第二位24BIT, WT, 第三位24BIT, WT, 第四位24BIT, RESET CODE' (第一位24BIT = first 24 bits)"
    forwarding:
      text: overview repeats the SK6812 single-chain text; the pin table and application circuit show a dual-line scheme
      doc: sk6822-ledcolor-r01
      page: 2
      quote: 'The 24-bit data is transmitted from the controller to DIN of the first element, and if it is accepted it is extracted pixel to pixel. After an internal data latch, the remaining data is passed through the internal amplification circuit and sent out on the DO port to the remaining pixels.'
      delay: null
    backup_line:
      pins: "DIN1 (pin 2), 'DIN2 AND DOUT1' (pin 3, shared input/output), DOUT2 (pin 1)"
      behaviour: 'Application circuit (p6): controller lines DI1 and DI2; U1 DI1 ← DI1; U1 DI2/DOUT1 pin on the DI2 line, which is also U2 DI1; U1 DOUT2 → U2 DI2/DOUT1 pin, which is also U3 DI1. So each node between pixels is a shared DIN2/DOUT1 pin driven by two chips. Selection logic is only hinted at by the note.'
      doc: sk6822-ledcolor-r01
      page: 3
      quote: "1 DOUT2 Data2 Output control signal output data | 2 DIN1 Data Input control signal input data | 3 DIN2 AND DOUT1 Data2 Input And Dout1 output control signal input data and output data | 4 VDD | 5 VCC | 6 GND. p5 note: 'where D0 and D1 for the MCU side of the data, the default D0 port signal, D1 chip will think that the signal is abnormal, which does not affect the signal transmission.'"
    compatibility_claims:
      - {
          claim: 'It offers all the same features as its RGBW version, SK6818 , but is dedicated to RGB and also offers a backup data line for redundancy in case of a chip failure.',
          by: Advatek (controller maker),
          doc: advatek-sk6822,
          page: null,
        }
      - {
          claim: 'Manufacturer: Opsco Optoelectronic (Normand) … Redundant Data Line Yes',
          by: ENTTEC (controller maker),
          doc: enttec-sk6822,
          page: null,
        }
      - {
          claim: 'Falcon pixel type "WS2811" alternatives include SK6822',
          by: Falcon (controller maker),
          doc: falcon-pixeltypes,
          page: null,
        }
    disagreements:
      - "Bit rate: overview says 'typical data transmission frequency of 800 Kbps' but the table gives TH+TL=1.7µs (0.35+1.36 = 1.71µs per bit, about 585 kbit/s) plus a 12µs WT per pixel."
      - "Tolerances printed '±0.150ns' (0.15 ns) on every row, including WT; probably a unit slip for ±0.150µs, not resolved."
      - "p4 electrical table lists clock parameters for a part with no clock pin: 'The clock high level width TCLKH >30 ns', 'The clock low level width TCLKL >30 ns', 'Data set up time TSETUP >10 ns'."
      - "Transmission-diagram rows are labelled 'DO' and 'DI' while the note calls them 'D0 and D1'."
      - "Advatek pairs SK6822 with SK6818 ('its RGBW version'), but the only SK6818 sheet found uses the SK6812-style table (0.2–0.4 / 0.7–1.0µs, >200µs) with no backup line."
    open:
      - 'No Opsco or Normand SK6822 sheet found; maker unconfirmed.'
      - 'Whether WT (12µs between pixels) is required from the controller or describes internal processing.'
      - 'How the chip decides between DIN1 and DIN2 and what happens when one pixel dies.'

