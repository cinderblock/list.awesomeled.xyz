    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'G R B (APA-104-4RGB)'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'reset low 80µs / >=80us (APA-104-4RGB)'
      doc: apa104-4rgb
      page: 6
      quote: '13. The data structure of 24bit: G7 … G0 R7 … R0 B7 … B0 | Note: high starting, in order to send data (G7 - G6 - ...... ..B0)'
      also: 'APA-104-4-12V A/0 p8: same G…R…B 24-bit structure.'
    frame_variants:
      - wire_order: 'R G B'
        doc: apa104-newstar
        page: 5
        quote: 'Composition of 24bit data: R7 … R0 G7 … G0 B7 … B0 | Note: Follow the order of RGB to sent data and the high bit sent at first.'
    forwarding:
      text: standard extract-24-bits-and-forward
      doc: apa104-newstar
      page: 1
      quote: 'the first pixel collect initial 24bit data then sent to the internal data latch, the other data which reshaping by the internal signal reshaping amplification circuit sent to the next cascade pixel through the DO port. After transmission for each pixel，the signal to reduce 24bit.'
      delay: 'APA-104-4RGB p4: TPLH/TPHL max 500 ns; Newstar p3: tPLZ max 300 ns'
    backup_line: null
    compatibility_claims:
      - {
          claim: 'This pixel protocol was designed by APA Electronic Co. in Taiwan. Also known as “Superled”',
          by: Advatek (controller maker),
          doc: advatek-apa104,
          page: null,
        }
      - {
          claim: 'Falcon pixel type "WS2811" alternatives include APA104',
          by: Falcon (controller maker),
          doc: falcon-pixeltypes,
          page: null,
        }
    disagreements:
      - "The two APA104 sheets describe different signals: APA Electronic's APA-104-4RGB prints 0.3/0.6µs ±0.15µs, Trst 80µs, G R B; the Newstar-hosted 'APA104 LED CHIP' prints 0.35/1.36µs ±150ns, RES above 24µs, R G B."
      - "The Newstar sheet is the undated WorldSemi WS2812B sheet's text almost word for word (same Features, General description, ratings, switching table), with the name changed to APA104 and the timing, reset and order rows changed."
      - "Newstar sheet heading 'TH+TL=1.25µs±600ns' but its rows sum to 1.71µs; RES 'Above 24µs' in the table vs '>=50us' in its own diagram."
      - "APA-104-4RGB overview (p1) says 'The 32-bit data is transmitted from the controller to DIN' while its section 13 (p6) is 'The data structure of 24bit' and draws 24 bits."
      - 'APA-104-22C (6-pin, same model family name) prints the SK6822 table (0.35/1.36µs, WT 12µs, 50µs, R G B) — see SK6822.'
    open:
      - 'No revision or date printed on either APA104 sheet.'

