        - 'BREAK | 5000 | NS | 1000000 | us'
        - 'MAB | 8 | 12 | 88 | us'
        - 'Frame width | | 44 | | us'
        - 'Start Bit/Data Bit | | 4 | | us'
        - 'Stop Bit | | 8 | | us'
        - 'MTBF | 0 | NS | 1000000 | us'
      address_frames:
        printed: 'Channel NO. | To set up the address values | Frame width channel0 | channel(1+m) | channel(2+m) | channel(3+m): 0~255 | Channel value | 00h | 00h~FFh | F0h | D2h; 256~512 ... E1h; 513~768 ... D2h; 769~1024 ... C3h; 1025~1280 ... B4h; 1281~1536 ... A5h; >1536 ... 96h (channel(3+m) is D2h in every row). Note:m is a multiple of 3'
        reading: 'Three frames per pixel: address low byte, a range byte (F0h, E1h, D2h, C3h, B4h, A5h, 96h), then D2h. Read from the waveform below: first frame for the first pixel is 4 = 0b00000100 sent MSB first (24 us low = start + five 0s, 4 us high, 8 us low, 8 us stop).'
      waveform:
        doc: ws2822s-ws
        page: PDF 8 (printed 7)
        quote: 'Following graph is a waveform of addressing first pixel to be 4, 5, 6 and the second pixels to be 7, 8, 9 :'
        reading: "ADRI: 5ms low, 88 high, start code (36 low, 8 high), then 04h F0h D2h, then 07h F0h D2h. ADRO of the first pixel: 5ms low, 88 high, start code, line held high during the first pixel's three frames, then 07h F0h D2h. Durations labelled in us on the drawing."
    forwarding:
      {
        text: 'Gray data: none (parallel). Address packet: the pixel strips its three frames and passes the rest on ADRO (waveform above).',
        doc: ws2822s-ws,
        page: PDF 8 (printed 7),
        quote: 'Schematic diagram of Many pixel in parallel control',
      }
    backup_line: null
    standard_dmx_250k: true
    compatibility_claims:
      - {
          claim: 'Signal can compatible and expand the DMX512(1990) protocol signal.',
          doc: ws2822s-ws,
          page: 1,
        }
    controller_makers:
      - { doc: advatek-dmx512, quote: 'WS2822 | RGB | 250 - 750 kbps' }
      - {
          doc: falcon-pixeltypes,
          quote: "n: 'DMX512P', c: 3, b: 8, w: 2, ... t: 'These pixels expect true DMX protocol. They can be run from the DMX port or from the receiver port using custom wiring. ...', a: ['DMX512', 'UCS512', 'WS2822']",
        }
    disagreements:
      - 'Rate: "250Kbps~750Kbps" (features, general description) vs "200KHZ to 750KHZ" (protocol text, PDF 6).'
      - 'Bit order: gray data "low first" (PDF 6) but the address-write format "usually high bit comes first" (PDF 7), and the PDF 8 waveform agrees with MSB first.'
      - 'Address table ranges are uneven: "0~255", "256~512", "513~768", ... (257 values in the second row, 256 in the others).'
      - 'MAB "4 8 12 us" (same issue as WS2821) for gray data; address packet MAB "8 12 88 us".'
    open: []

