      doc: ws2822s-ws
      page: PDF 7 (printed 6), PDF 8 (printed 7)
      quote: 'Write address code data format: Use a similar gray control data protocol, frequency is 250kHz. Channel data package maximum has 3072 frames, when sending data usually high bit comes first. Each time you can send a data package for one time. Data package must be high level before and after sending the data package, before sending the data ,must have a above 5ms low level.'
