    - id: e127-1
      url: https://tsp.esta.org/tsp/documents/docs/E1.27-1%20-%202006%20(R202x).pdf
      title: E1.27-1 - 2006 (R202x) Entertainment Technology--Standard for Portable Control Cables for Use with ANSI E1.11 (DMX512-A) and USITT DMX512/1990 Products
      revision: CP/2003-1028r6 ('DRAFT FOR REAFFIRMATION REVIEW')
      date: null # copyright 2021
      language: en
      notes: >-
        Reaffirmation-review draft. ESTA's published list describes the result, ANSI E1.27-1 - 2006 (R2021),
        as 'a reaffirmation of the prior version. No substantive changes have been made.' Body-page headers
        still say '(R2016)'.
    - id: bsr-e111-1999-draft
      url: https://web.archive.org/web/20241105154501/https://www.mikrocontroller.net/attachment/4868/DMX_512.PDF
      title: BSR E1.11, Entertainment Technology - USITT DMX512 ... Revision 1.1a (CP98/1031r1.1a, 1999)
      revision: 1.1a
      date: '1999-11-23'
      language: en
      notes: Read, NOT used. It is a 1999 ESTA working draft marked as not for publication, not the USITT DMX512/1990 text.
  overview:
    text: Asynchronous UART bytes on a balanced EIA-485 pair; packets of up to 513 slots, slot 0 being the START Code.
    doc: e111-2024
    page: PDF 15 (printed 1), clause 1.2
    quote: 'This standard uses a simple asynchronous eight-bit serial protocol consisting of an untyped byte stream produced by standard UARTs. The physical media, not addressed in this document, is normally, but not exclusively, a two-pair cable, with each pair serving as a data link. The media is driven using ANSI/TIA/EIA-485-A-1998 (hereafter referred to as EIA-485-A in this document) balanced data transmission techniques. Physical connection at devices is via 5-pin XLR connectors or by "hard-wiring" to terminals. Restricted use of connectors other than 5-pin XLR is allowed if certain conditions apply (see clause 7). Data on the primary data link is sent in packets of up to 513 slots. The first slot is a START Code, which defines the information in the subsequent slots in the packet.'
  line_coding: dmx512
  idle: high
  idle_quote:
    doc: e111-2024
    page: PDF 17 (printed 3) clause 3.16; PDF 18 (printed 4) clause 3.24
    quote: '3.16 Idle: the time between slots that the DMX512 line is high and not sending any information (also known as the ‘Mark’ condition). ... 3.24 Mark: a line condition where Signal True is high with respect to Signal Complement. A Mark represents a binary 1.'
  bit_order: lsb-first
  bit_rate:
    min_kbps: 245
    typ_kbps: 250
    max_kbps: 255
    bit_time: { min_ns: 3920, typ_ns: 4000, max_ns: 4080, printed: 'Bit Time 3.92 4 4.08 µs' }
    printed: 'Bit Rate 245 250 255 kbit / s'
    doc: e111-2024
    page: PDF 30 (printed 16), Table 6 and Table 7 (same rows in both)
    quote: 'Table 6 - Timing Diagram Values - output of transmitting UART ... - Bit Rate 245 250 255 kbit / s; - Bit Time 3.92 4 4.08 µs'
    note: Unchanged in E1.11-2004 (PDF 31, printed 20) and E1.11-2008 (R2018) (PDF 32, printed 18).
  slot_format:
    start_bits: 1
    data_bits: 8
    stop_bits: 2
    parity: none
    slot_time:
      {
        typ_ns: 44000,
        printed: 'derived: 11 bits x 4 µs (the standard prints no slot-time row; Figure 5 item 3 is "Slot Time")',
      }
    doc: e111-2024
    page: PDF 26 (printed 12), clause 8.2 Table 5; PDF 19 (printed 5) clauses 3.39, 3.41
    quote: 'The data transmission format for each data value transmitted are as shown in table 5. Note that no parity is transmitted. Table 5 - Data Slot Format: Bit Position 1 - Start Bit, Low or SPACE; 2 through 9 - Slot Value Data Bits, Least Significant Bit to Most Significant Bit; 10, 11 - Stop Bits, High or MARK'
    quote_2: '3.39 Start Bit: ... The start bit is always low, i.e., Space. ... 3.41 Stop Bit: the additional bit(s) attached to a byte to indicate the end of the byte - DMX512 has 2 stop bits. The stop bit is always high, i.e., Mark.'
    receiver_framing:
      doc: e111-2024
      page: PDF 30 (printed 16), clause 9.1
      quote: 'A receiver shall check the first stop bit and should check the second stop bit of all received slots to determine if they have the correct value. If a missing stop bit is detected, the receiver shall discard the improperly framed slot data and all following slots in the packet.'
  timing_tables:
    # Rows copied from the 2024 tables (rendered page read visually; the text layer is scrambled).
    # Columns: Designation | Description | Min | Typical | Max | Unit. "/" separates the two
    # units the table prints in one cell (µs for Min, s for Max).
    transmitter_table_6:
      doc: e111-2024
      page: PDF 30 (printed 16)
      title: 'Table 6 - Timing Diagram Values - output of transmitting UART'
      rows:
        - '- | Bit Rate | 245 | 250 | 255 | kbit / s'
        - '- | Bit Time | 3.92 | 4 | 4.08 | µs'
        - '- | Minimum Update Time for 513 slots | – | 22.7 | – | ms'
        - '- | Maximum Refresh Rate for 513 slots | – | 44 | – | updates / s'
        - '1 | “SPACE” for BREAK | 92 | 176 | – | µs'
        - '2 | “MARK” After BREAK (MAB) | 12 | – | < 1.00 | µs / s'
        - '9 | “MARK” Time between slots | 0 | – | < 1.00 | s'
        - '10 | “MARK” Before BREAK (MBB) | 0 | – | < 1.00 | s'
        - '11 | BREAK to BREAK Time | 1204 | – | 1.00 | µs / s'
        - '13 | DMX512 Packet | 1204 | – | 1.00 | µs / s'
    receiver_table_7:
      doc: e111-2024
      page: PDF 30 (printed 16)
      title: 'Table 7 - Timing Diagram Values for Receivers'
      rows:
        - '- | Bit Rate | 245 | 250 | 255 | kbit / s'
        - '- | Bit Time | 3.92 | 4 | 4.08 | µs'
        - '- | Minimum Update Time for 513 slots | – | 22.7 | – | ms'
        - '- | Maximum Refresh Rate for 513 slots | – | 44 | – | updates / s'
        - '1 | “SPACE” for BREAK | 88 | – | –< 1.00 | µs / s'
        - '2 | “MARK” After BREAK (MAB) | 8 | – | < 1.00 | µs / s'
        - '9 | “MARK” Time between slots | 0 | – | < 1.00 | s'
        - '10 | “MARK” Before BREAK (MBB) | 0 | – | < 1.00 | s'
        - '11 | BREAK to BREAK Time | 1196 | – | 1.25 | µs / s'
        - '13 | DMX512 Packet | 1196 | – | 1.25 | µs / s'
    table_notes:
      doc: e111-2024
      page: PDF 30 (printed 16)
      quote: 'Note 1: Given the range of timing parameters shown in tables 6 and 7, a transmitter may produce a signal with a refresh rate in the range of 1 Hz to approximately 830 Hz. A receiver must be capable of accepting a signal with a refresh rate of 0.8 Hz to approximately 836 Hz. Note 2: Receivers may accept BREAK timings less than the minimum value defined in Table 7 unless specifically disallowed elsewhere in the standard.'
    edition_differences:
      - what: Receiver BREAK row (Table 7, designation 1)
        e111_2004: '88 | 176 | - | µs (PDF 31, printed 20)'
        e111_2008r2018: '88 | 176 | – | µs (PDF 32, printed 18)'
        e111_2024: '88 | – | –< 1.00 | µs / s (PDF 30, printed 16)'
      - what: Note 2 (receivers may accept shorter BREAKs) exists only in 2024; 2008 has the single refresh-rate note, 2004 has no note under the tables.
      - what: The 2004 tables label designation 2 '“MARK” After BREAK (MB)'; 2008 and 2024 say '(MAB)'. All other Table 6/7 values are identical across 2004, 2008 (R2018) and 2024.
  break:
    transmit:
      { min_ns: 92000, typ_ns: 176000, max_ns: null, printed: '“SPACE” for BREAK 92 176 – µs' }
    receive:
      {
        min_ns: 88000,
        max_ns: 1000000000,
        printed: '“SPACE” for BREAK 88 – –< 1.00 µs / s (2024); 88 176 – µs (2008)',
      }
    doc: e111-2024
    page: PDF 26-27 (printed 12-13), clause 8.3; Tables 6/7 on PDF 30
    quote: 'The BREAK indicates the start of a new packet. The BREAK generated by a transmitter is defined as a mark-to-space transition followed by a low of at least the minimum duration shown in table 6 (Timing Diagram, Designation #1) followed by a low to high transition. Table 7 (Timing Diagram, Designation 1) defines the minimum duration break a receiver is required to recognize as the start of a new packet.'
    dmx512_1990:
      transmit_min_ns: 88000
      doc: rp-dmx512
      page: PDF 77 (printed 76); PDF 80 (printed 79)
      quote: '(transmitted maximum length packet table) Break 1 (note 1) 92µs ... Note 1: Previously was 88µs'
      quote_2: 'If a DMX512(1990) transmitter is sending a Break of exactly 88µs, due to tolerances the receiver may decide that it is longer or shorter than 88µs. ... Therefore transmitters must always be set to produce a Break of at least 92µs. ... A DMX512 compliant receiving device should be able to detect a Break of 88µs or greater.'
      note: The DMX512/1990 document itself was not found; this value is the ESTA-hosted PLASA guide's statement.
  mab:
    transmit:
      { min_ns: 12000, max_ns: 1000000000, printed: '“MARK” After BREAK (MAB) 12 – < 1.00 µs / s' }
    receive:
      { min_ns: 8000, max_ns: 1000000000, printed: '“MARK” After BREAK (MAB) 8 – < 1.00 µs / s' }
    doc: e111-2024
    page: PDF 27 (printed 13), clause 8.4; Tables 6/7 on PDF 30
    quote: 'The MARK separating the BREAK and the START Code (Timing Diagram, Designation #2) is defined as the MARK AFTER BREAK. DMX512 transmitters produce a MARK AFTER BREAK that complies with the minimum and maximum values for designator 2 in table 6. Compliant receivers correctly respond to data streams with a MARK AFTER BREAK at least as long as the minimum shown in table 7.'
    history:
      doc: e111-2024
      page: PDF 27 (printed 13), note under clause 8.4 (same note in e111-2004 PDF 27, printed 16, and e111-2008r2018 PDF 28, printed 14)
      quote: 'Note: The 1986 version of this Standard specified a 4 microsecond MARK AFTER BREAK. The 1990 version of the standard changed that value to 8 microseconds, but added an option for receivers capable of recognizing the 4 microsecond MARK AFTER BREAK to be identified as having that capability. Some transmitters may still be in use that generate the shorter 4 microsecond MARK AFTER BREAK, and they may not work with equipment built to this Standard.'
      quote_2: '(rp-dmx512, PDF 81, printed 80) The DMX512 (1990) spec. changed m.a.b. time to 8µs minimum which largely cleared up this problem. Now the DMX512 A specification requires a m.a.b. time of at least 12µs. The extra time is provided so that any small delays that might occur through splitter or repeater amplifiers cannot reduce the time to less than the 8µs minimum.'
  history_summary:
    - '1986: MAB 4 µs (E1.11 note under 8.4)'
    - '1990: MAB 8 µs; transmitted BREAK 88 µs (rp-dmx512: "Previously was 88µs")'
    - '2004, 2008, 2024 (DMX512-A): transmit BREAK ≥ 92 µs (typ 176), MAB ≥ 12 µs; receivers must still accept BREAK ≥ 88 µs and MAB ≥ 8 µs'
    - 'rp-dmx512 PDF 78 (printed 77): "Timings for receivers are unchanged from the previous version of the Standard, to ensure compatibility with older equipment."'
  start_code:
    null_start_code: '0x00'
    doc: e111-2024
    page: PDF 27 (printed 13), clauses 8.5-8.5.3; PDF 18 (printed 4) clause 3.28
    quote: 'The START Code is the first slot (slot 0) following a MARK AFTER BREAK. The START Code identifies the function of subsequent data in that packet. ... A NULL START Code identifies subsequent data slots as a block of un-typed sequential 8-bit information. Packets identified by a NULL START Code are the default packets sent on DMX512 networks. ... Each NULL START Code packet contains no formal data or addressing structure. The device using data from the packet must know the position of that data within the packet.'
    quote_null: '3.28 NULL START Code: a START Code with a value of zero (00h).'
    quote_dimmer: '8.5.2 Dimmer class data: Dimmer level data should be sent in NULL START Code packets. Valid dimmer levels shall be 0 to 255 decimal (00 to FF hexadecimal) representing dimmer control input.'
    alternate_start_codes:
      quote: 'In order to provide for future expansion and flexibility, DMX512 makes provision for 255 additional non NULL START Codes (1 through 255 decimal, 01 through FF hexadecimal), henceforth referred to as Alternate START Codes. Where it is required to send proprietary information over a DMX512 data link, a packet starting with a registered Alternate START Code shall be used.'
      quote_interleave: '8.5.3.1 ... A DMX512 transmitter interleaving NULL START Code packets with Alternate START Code packets shall send a NULL START Code packet at least once per second.'
      quote_receivers: '8.5.4 (PDF 28, printed 14) All receiving devices other than in-line processing devices shall process the START Code and differentiate between those packets with NULL START Codes and those with Alternate START Codes. Devices shall not ignore START Codes by assuming that all packets received are NULL START Code packets.'
      reserved: # Annex D Table D1, PDF 44 (printed 30)
        - '17h (23) ASCII Text Packet'
        - '55h (85) Test Packet'
        - '90h (144) UTF-8 Text Packet'
        - '91h (145) 91h followed by a 2-byte Manufacturer ID field ... Manufacturer/Organization specific use'
        - 'CCh (204) E1.20 (RDM) START Code'
        - 'CFh (207) System Information Packet'
        - 'F0h-F7h (240-247) prototyping/experimental use ... Not permitted in shipping product'
        - '92h-A9h, ABh-CBh, CDh-CEh: possible future revisions of this Standard, use not currently permitted'
  slots:
    max_data_slots: 512
    max_slots_incl_start_code: 513
    min_data_slots: 0
    doc: e111-2024
    page: PDF 26 (printed 12) clause 8.1; PDF 28 (printed 14) clauses 8.6, 8.7; PDF 18 (printed 4) clause 3.36
    quote: 'DMX512 slots shall be transmitted sequentially in asynchronous serial format, beginning with slot 0 and ending with the last implemented slot, up to slot 512 (a maximum total of 513 slots). Prior to the first data slot being transmitted, a Reset Sequence shall be transmitted - a BREAK, followed by a MARK AFTER BREAK, and a START Code.'
    quote_2: '8.6 ... Each data link shall support up to 512 data slots. Multiple links shall be used where larger numbers of slots are required. 8.7 ... There is no required minimum number of data slots on the data link. DMX512 data packets with fewer than 512 slots may be transmitted, subject to the minimum timing requirements of this Standard - see clause 8.10 and figure 5.'
    quote_3: '3.36 Slot: a sequentially numbered framed byte in a DMX512 packet. A single Universe contains a maximum of 513 Slots, starting at slot 0. Slot 0 is the START Code. Slots 1 through 512 are data slots.'
    quote_universe: '3.45 Universe: a DMX512 data link originating from a single DMX512 source. Control of up to 512 DMX512 data slots comprises a single universe.'
  marks:
    between_slots:
      { min_ns: 0, max_ns: 1000000000, printed: '“MARK” Time between slots 0 – < 1.00 s' }
    before_break:
      { min_ns: 0, max_ns: 1000000000, printed: '“MARK” Before BREAK (MBB) 0 – < 1.00 s' }
    doc: e111-2024
    page: PDF 28 (printed 14), clauses 8.8, 8.9
    quote: 'The time between any two slots of a data packet (Timing Diagram, Designation #9) may vary between minimum and maximum values shown for designator #9 of table 6. The line shall remain in a marking state during any such idle period. ... The time between the second stop bit of the last data slot of one data packet and the falling edge of the beginning of the BREAK for the next data packet (Timing Diagram, Designation #10) may vary between minimum and maximum values shown for designator #10 of table 6. The line shall remain in a marking state throughout any such period. Transmitters, therefore, shall not produce multiple BREAKs between data packets.'
  break_to_break:
    transmit:
      { min_ns: 1204000, max_ns: 1000000000, printed: 'BREAK to BREAK Time 1204 – 1.00 µs / s' }
    receive:
      { min_ns: 1196000, max_ns: 1250000000, printed: 'BREAK to BREAK Time 1196 – 1.25 µs / s' }
    doc: e111-2024
    page: PDF 28 (printed 14), clause 8.10; Tables 6/7 on PDF 30
    quote: 'Transmitters produce packets so that the period between the falling edge at the start of any one BREAK and the falling edge at the start of the next BREAK are not be less than the minimum value in table 6 designator #13. This period is also not more than the maximum value in table 6 designator #13.'
    note: Clause 8.10 points at designator #13 ("DMX512 Packet") while Table 6 and Figure 5 call designator 11 "BREAK to BREAK Time"; both rows hold the same numbers (1204 µs / 1.00 s), so nothing changes. Same wording in 2004 and 2008.
  refresh_arithmetic:
    # Derived by this batch from the Table 6/7 values; the standard's own figures are quoted.
    full_packet_transmit_min:
      formula: 'BREAK + MAB + 513 slots x (11 bits x 4 µs), MBB and inter-slot marks 0'
      values: '92 µs + 12 µs + 513 x 44 µs = 92 + 12 + 22 572 = 22 676 µs'
      max_refresh_hz: 44.10 # 1 / 22.676 ms
    full_packet_receiver_min: { values: '88 + 8 + 22 572 = 22 668 µs', max_refresh_hz: 44.12 }
    typical_break: { values: '176 + 12 + 22 572 = 22 760 µs', refresh_hz: 43.94 }
    bit_rate_extremes:
      at_255_kbps: '92 + 12 + 513 x 11 x 3.9216 µs = 22 233 µs -> 44.98 Hz'
      at_245_kbps: '92 + 12 + 513 x 11 x 4.0816 µs = 23 137 µs -> 43.22 Hz'
    rgb_universe_510_slots: '92 + 12 + 511 x 44 = 22 588 µs -> 44.27 Hz (start code + 510 data slots = 170 RGB pixels)'
    shortest_packet: '1204 µs minimum break-to-break -> 830.6 Hz (transmitter); 1196 µs -> 836.1 Hz (receiver). 92 + 12 + 25 x 44 = 1204 µs, i.e. start code + 24 slots back to back.'
    standard_says:
      doc: e111-2024
      page: PDF 30 (printed 16), Table 6
      quote: '- Minimum Update Time for 513 slots – 22.7 – ms; - Maximum Refresh Rate for 513 slots – 44 – updates / s'
    guide_says:
      doc: rp-dmx512
      page: PDF 77 (printed 76)
      quote: 'Transmitted maximum length packet: Break 1 92µs 92µs; Mark-after-Break 1 12µs 12µs; Start-code 1 44µs 44µs; Data bytes 512 44µs 22,528µs; TOTAL 22,676µs ... This yields a refresh rate of 44.1Hz. ... The fastest rate from a typical 24 channel console would be obtained with packets 1204µs long, giving 830Hz.'
  electrical:
    standard: EIA-485-A (ANSI/TIA/EIA-485-A-1998)
    signalling: differential (balanced) pair, Data+ / Data-
    doc: e111-2024
    page: PDF 19 (printed 5) clauses 4.1, 4.3, 4.4; PDF 17 (printed 3) clause 3.2
    quote: 'The electrical specifications of this Standard are those of EIA-485-A, except where specifically stated in this document. ... A data link shall consist of a single active differential line driver, a terminated transmission line and one or more differential line receivers meeting the requirements of EIA-485-A and all additional requirements of this Standard. ... A DMX512 port carries four signals and a common reference, designated data 1-, data 1+, data 2-, data 2+, and data link common.'
    quote_balanced: '3.2 Balanced Transmission Line: a data communications line where two wires are present, the signal and its opposite (complement), the actual signal being the difference between the voltages on the two wires. Balanced lines have excellent noise and interference rejection properties.'
    termination:
      value: 120 ohm +5%/-10% between Data+ and Data-, at the far end (both ends if the transmitter is not at one end)
      doc: e111-2024
      page: PDF 20 (printed 6), clause 4.9
      quote: 'DMX512 data links shall be terminated to eliminate ringing and signal reflection, which can cause mis-operation of an otherwise properly designed system. ... The terminator shall be a 120 ohm +5%/-10% impedance placed between Data+ and Data-. In the preferred topology where the transmitter is connected to one end of the data link, the far end of the data link shall be terminated. In the case where the transmitter cannot be connected at one end of the data link, then both ends of the data link shall be terminated.'
    unit_loads:
      value: 32 unit loads per data link; each receiving port 1 unit load or less
      doc: e111-2024
      page: PDF 24 (printed 10), clause 5.10
      quote: 'As per EIA-485-A, the total load permitted on a DMX512 data link is 32 unit loads. Transmitters designed for this Standard shall be capable of driving 32 unit loads on a DMX512 data link. Each receiving port on a DMX512 device shall have a unit load of 1 or less as per EIA-485.'
      guide_quote: '(rp-dmx512 PDF 28, printed 27) A line can have up to 32 unit loads (less if the receivers do not comply with the EIA-485 spec. - see page 35) hung off it anywhere down its length. A typical EIA-485 receiver represents approximately one unit load.'
    connector:
      value: 5-pin XLR; pin 1 Data Link Common, 2 Data 1-, 3 Data 1+, 4 Data 2-, 5 Data 2+; sockets (female) on transmitters, plugs (male) on receivers
      doc: e111-2024
      page: PDF 25 (printed 11), clauses 7.1, 7.1.1, Table 3
      quote: 'Socket connectors shall be used on controllers and other transmitting devices (primary data link) and plug connectors shall be used on receiving devices. ... Equipment in this category shall use 5-pin XLR connectors with the physical pinout of the 5-pin XLR in accordance with Table 3. Table 3- Signal designations summary: 1 Data Link Common; 2 Data 1-; 3 Data 1+; 4 Data 2-; 5 Data 2+'
      rj45_note: 'Clause 7.3 (PDF 25-26, printed 11-12) allows IEC 60603-7 8-position (RJ45) connectors only for fixed installations not normally accessible; Table 4: pin 1 data 1+, pin 2 data 1-, pins 7/8 Data Link Common.'
    cable:
      scope_quote: '(e111-2024 PDF 15, printed 1, clause 1.1) Cable requirements and premises wiring are not within the scope of this Standard.'
      doc: e127-1
      page: PDF 8 (printed 1) clause 1.2; PDF 10 (printed 3) clauses 4.1-4.3; PDF 11 (printed 4) clause 4.4
      quote: 'The means of transport of DMX512-A digital data from one compliant device to another is normally a two-pair cable, with each pair serving as a data link. ... Portable cable shall be shielded to protect the data links from interference (RFI and EMI). The physical connection of portable cables at any device is via a 5-pin XLR connector.'
      quote_impedance: '4.4 Impedance: Portable DMX512 cables shall have a characteristic impedance in the range 100 to 120 ohms. Due to the characteristic impedance of 120 ohms in EIA-485 systems, 120 ohms is preferred.'
      quote_length: '4.2 Maximum and minimum cable lengths: Maximum and minimum run lengths are specifically omitted from this standard.'
      quote_audio: '4.1 ... Cables intended for use with audio systems (such as microphone cables), while having the convenience of flexibility, availability and relative low cost, may not be suitable for use with DMX512 because of their high capacitance and incorrect characteristic impedance'
      guide_length_quote: "(rp-dmx512 PDF 28, printed 27) The EIA-485 link as used by DMX512-A is capable of operation on lines of up to 1km (3281') in length. This is the absolute maximum. It is recommended to keep the line length below about 300m (1000'), beyond which signal amplifiers (repeaters) should be considered."
  disagreements:
    - 'ESTA''s published-documents list gives the 2024 control number as "CP/2024-1011r2a"; the PDF prints "CP/2023-1011r2a".'
    - 'Clause 8.10 cites designator #13 for break-to-break spacing; Table 6 / Figure 5 name designator 11 "BREAK to BREAK Time" (#13 is "DMX512 Packet"). Same numbers, so harmless.'
  open:
    - The USITT DMX512/1990 document itself was not found online; the 1990 BREAK (88 µs) comes from the PLASA guide hosted by ESTA, the 1990/1986 MAB values from E1.11's own note.
    - ESTA's official 2024 download sits behind an email sign-in; the archived copy read here is the same file name ESTA serves (not compared byte for byte with a fresh download).

# ---------------------------------------------------------------------------
# 2. sACN (ANSI E1.31) and Art-Net: one or two sentences' worth
# ---------------------------------------------------------------------------
sacn:
  documents:
    - id: e131-2018
      url: https://web.archive.org/web/20220407060206/https://tsp.esta.org/tsp/documents/docs/ANSI_E1-31-2018.pdf
      title: ANSI E1.31 -- 2018 Entertainment Technology Lightweight streaming protocol for transport of DMX512 using ACN
      revision: CP/2014-1009r6a
      date: '2018-11-07'
      language: en
    - id: e131-draft-2025
      url: https://web.archive.org/web/20250514112044/https://tsp.esta.org/tsp/documents/docs/BSR%20E1.31-202x_2014-1009r7c.pdf
      title: BSR E1.31 -- 202x (DRAFT) Lightweight streaming protocol for transport of DMX512 using ACN
      revision: CP/2014-1009r7c
      date: null
      language: en
      notes: Public-review draft of the edition ESTA now lists as 'ANSI E1.31 - 2025' (that published PDF is behind the same email sign-in; not read). Checked only that the universe range is unchanged.
  carries_dmx:
    doc: e131-2018
    page: PDF 13 (printed 1), clauses 1.1, 1.2
    quote: 'This standard describes a mechanism to transfer DMX512-A [DMX] packets over an IP network using a subset of the ACN protocol suite. ... This standard can be used to transfer DMX512-A [DMX] packets of all START Codes via an ANSI E1.17 [ACN] supported network. ... For the use of this standard, the ACN wrapper is carried in UDP [UDP] packets.'
  universe:
    doc: e131-2018
    page: PDF 17 (printed 5), clauses 3.2, 3.4
    quote: '3.2 Universe: A set of up to 512 data slots identified by universe number. ... 3.4 Slot: A slot is a sequentially numbered octet in a DMX512-A [DMX] packet. A single Universe contains a maximum of 513 Slots, starting at slot 0. Slot 0 is the DMX512-A [DMX] START Code. Slots 1 through 512 are data slots.'
  universe_range:
    min: 1
    max: 63999
    doc: e131-2018
    page: PDF 29 (printed 17), clause 6.2.7
    quote: 'The Universe is a 16-bit field that defines the universe number of the data carried in the packet. Universe values shall be limited to the range 1 to 63999. Universe value 0 and those between 64000 and 65535 are reserved for future use.'
    draft_2025_check: '(e131-draft-2025 PDF 23) "... shall be limited to the range 1 to 63999. Universe value 0 and those between 64000 and 65535 are reserved for ..." (unchanged)'
artnet:
  documents:
    - id: artnet4
      url: https://artisticlicence.com/WebSiteMaster/User%20Guides/art-net.pdf
      title: Art-Net 4, Specification for the Art-Net 4 Ethernet Communication Protocol
      revision: Art-Net 4 Protocol Release V1.4, Document Revision 1.4dp
      date: '2025-10-23' # printed '23/10/2025'
      language: en
  same_job:
    doc: artnet4
    page: PDF 17 (printed - 6 -)
    quote: 'Art-Net is an Ethernet protocol based on the TCP/IP protocol suite. Its purpose is to allow transfer of large amounts of DMX512 data over a wide area using standard networking technology. Art-Net was invented by Wayne Howell, the founder of Artistic Licence.'
  universe:
    doc: artnet4
    page: PDF 21 (printed - 10 -); PDF 20 (printed - 9 -)
    quote: 'Universe: A single DMX512 frame of 512 channels is referred to as a Universe. ... The Port-Address valid range is 1 - 32,767. The value of zero is deprecated to enhance sACN compatibility.'
  transport_quote: '(PDF 21) Port: Actual data transmission on Art-Net uses the UDP protocol ... Art-Net uses only one port of 0x1936.'
  licence_quote: '(PDF 3) Art-Net™ is a trade mark of Artistic Licence. ... Any third parties are welcome to use this communication protocol without royalty.'

# ---------------------------------------------------------------------------
# 3. Universe arithmetic as controller makers state it
# ---------------------------------------------------------------------------
universe_arithmetic:
  rgb_pixels_per_universe: 170 # 510 of 512 slots
  rgbw_pixels_per_universe: 128 # 512 of 512 slots
  arithmetic: '512 / 3 = 170.67 -> 170 whole RGB pixels (slots 1-510, 511-512 unused); 512 / 4 = 128 RGBW pixels'
  statements:
    - maker: ENTTEC
      url: https://support.enttec.com/pixel/pixel-general-knowledge/how-many-pixels-per-dmx-universe
      title: How Many Pixels Per DMX Universe? 170 RGB, 128 RGBW - ENTTEC Support
      date: '2026-07-19' # page says 'Updated Jul 19, 2026'
      retrieved: '2026-11-20'
      quote: 'One DMX universe fits 170 RGB pixels (using 510 of its 512 channels) or 128 RGBW pixels (using all 512 channels exactly). The reason: a universe carries 512 control channels, each pixel consumes one channel per colour emitter, and almost all controllers and software refuse to split a pixel across a universe boundary, so the count rounds down to a whole pixel.'
      quote_2: 'RGB pixel: 3 channels. 512 ÷ 3 = 170.67, so 170 whole pixels, occupying channels 1 to 510. RGBW pixel: 4 channels. 512 ÷ 4 = 128 exactly, occupying channels 1 to 512 with nothing spare.'
    - maker: Advatek
      url: https://www.advateklighting.com/blog/guides/using-dmx-pixels-with-pixlite-r-mk3
      title: Using DMX Pixels with PixLite® Mk3 - Advatek
      date: null
      retrieved: '2026-11-20'
      quote: 'Traditional DMX512 limits each universe to 512 channels. Which translates to 170 RGB or 128 RGBW pixels per universe.'
  falcon: No 170/128 statement found on Falcon's pixel-types page (pixelcontroller.com/store/PixelTypes.html); not searched further.

