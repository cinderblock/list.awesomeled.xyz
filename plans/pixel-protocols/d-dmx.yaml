# 4. DMX-addressed pixel ICs
# ---------------------------------------------------------------------------
# Extra keys used for these parts (not in the brief's template):
#   input: single-ended (one logic-level data pin) | differential (A/B pair, built-in "485" receiver)
#   topology: how the chips sit on the data line
#   addressing: where the address lives, how it is written, slots taken
parts:
  - part: UCS512B3
    entry: pixel-ics/ucs512b
    maker: Lianxinke Microelectronics (联芯科, Shenzhen; www.szucs.cn)
    documents:
      - id: ucs512b3-ledyi
        url: https://media.ledyi.com/ucs512b-datasheet_d3027bf8ccef6f06edc736bf690f6939f39e2a8707101b5e40ef2d278d3b9787.pdf
        title: The DMX 512 3 channel constant current drives the IC UCS512B3 (PDF metadata title 'UCS512B datasheet', author LEDYi)
        revision: 'VER 1.2 (last row of the version table: VER 1.0 201312-25 first edition; VER1. 1 20151-28 content correction; VER 1.2 2020-411 parameter correction); page footers print "ver" / "2.2"'
        date: '2020-04-11'
        language: en (machine-translated from Chinese; the Chinese original was not found)
      - id: ucs512b3-ledyi-2
        url: https://media.ledyi.com/ucs512b3-datasheet_8c7b137827d5ad9fe6e7dcca8d318bd9acb6f06bc4fb98c674334cbd3ce2bc92.pdf
        title: same document (PDF metadata 'UCS512B3 datasheet'); text identical except the maker's address block on PDF 2 is missing
        revision: same
        date: null
        language: en
      - id: enttec-ucs512b
        url: https://www.enttec.com/pixel-protocols/UCS512B
        title: UCS512B Pixel Protocol (ENTTEC, controller maker)
        revision: null
        date: null
        language: en
    line_coding: dmx512
    input: single-ended
    input_quote:
      {
        doc: ucs512b3-ledyi,
        page: PDF 3,
        quote: 'Footposition instructions: 6 DA I DMX 512, the data entry; 7 P I Address write code line input, built-in pull-up; 1 P O Address write code line output',
      }
    idle: high # timing diagram (PDF 6) shows line A high before item 1 and between packets
    bit_order: null # field drawn 'S D0 D1 D2 D3 D4 D5 D6 D7 T'; which end D0 is, is not stated in words
    rates:
      - name: adaptive 200-800 kbps (table) / 250-750 kbps (features)
        select: 'automatic: "without any speed setting"'
        table:
          doc: ucs512b3-ledyi
          page: PDF 6
          columns: 'grade | description | least value | representative value | crest value | unit'
          rows:
            - ' | bit rate | 200 | 250 | 800 | K bps'
            - ' | bit time | 5 | 4 | 1.25 | us'
            - 'S | start bit | 5 | 4 | 1.25 | us'
            - 'D 0~D 7 | Eight bits of data | 40 | 32 | 10 | us'
            - 'T | The 2-bit stop bits | 4 | 8 | 2.5 | us'
            - '1 | Labeling before reduction | 0 | | 1000000 | us'
            - '2 | reset signal | 88 | | | us'
            - '3 | The markers were marked after reduction | 8 | | 1000000 | us'
            - '4 | Field (note 1) | 55 | 44 | 27.5 | us'
            - '5 | Occupy between fields | 0 | | 1000000 | us'
            - '6 | The length of the data packet | | | 1000000 | us'
            - '7 | Reset the signal interval | | | 1000000 | us'
          note_1: 'Note 1:11 fields, including 0 start, 8, bit data, and 2 bit stop. Where the 0 start level is low level and the stop level is high level. If the data in the data bit is 0, the corresponding time period is a low level. If the data in the data bit is 1, the corresponding time period is a high level.0 Start, stop and data bits must be the same time'
          reading: 'Machine translation of the DMX names: 1 = mark before break, 2 = BREAK ("reset signal"), 3 = MAB, 4 = slot ("field"), 5 = mark between slots, 6 = packet length, 7 = break-to-break.'
        break: { min_ns: 88000, max_ns: null, printed: 'reset signal 88 us' }
        mab: { min_ns: 8000, max_ns: 1000000000, printed: '8 ... 1000000 us' }
        reset: null
        doc: ucs512b3-ledyi
        page: 6
        quote: 'The UCS 512B 3 data reception is compatible with the standard DMX 512 (1990) protocol and the expanded DMX 512 protocol, with a data transmission rate of 250kbps to 750K for adaptive decoding.'
        quote_features: '(PDF 1) Exclusive adaptive decoding technology, the DMX 512 signal with the signal transmission rate of 250K ~750kbps can be fully adaptive decoded'
        quote_switching: '(PDF 5) data-signalling rate F 750 Kbps'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: R G B (three consecutive slots from the stored address)
      pixel_bits: 33 # 3 slots x 11 bit-times on the wire (24 data bits)
      start: 'start code slot must be 0x00'
      latch: 'BREAK ("reset signal") starts the next packet'
      doc: ucs512b3-ledyi
      page: PDF 7
      quote: '1. When the reset signal appears on the DAI line, the IC enters the receiving preparation state. Address counter clear 0 2. The first field in the packet is the starting field, whose 8-bit data must be "0000_0000", which is not used as the display data. The valid field for display starts from the second field, and the second field of the 512 packet is the first data field. ... 3. The I C determines the corresponding field in the intercept 512 packet according to the address in its E 2. If the chip address is 0000_0000_0000, the interception starts from the second field 2 (the data field 1) of the packet, and the address 0000_0000_0001 is intercepted from the third field 3 (the data field 2). IC intercept 3 field data from each packet.'
    topology:
      text: All chips on one data line in parallel; a failed chip does not affect the others.
      doc: ucs512b3-ledyi
      page: PDF 1
      quote: 'Control mode: single line in parallel, the maximum support of 4096 channels ... suitable for the required and connected LED lighting system, the exception of a certain chip does not affect the normal work of other chips, maintenance is simple and convenient.'
    addressing:
      stored_in: EEPROM ("built-in E 2PROM")
      written_by: 'a separate address write line daisy-chained PI -> PO chip to chip, written in one pass from a writer; the data line (DAI) is held high by the writer meanwhile'
      slots_per_chip: 3
      address_range: '12-bit address (0000_0000_0000 = data slot 1); "addressing can reach 4096 channels"'
      doc: ucs512b3-ledyi
      page: PDF 1, PDF 8
      quote: 'UCS 512B 3 has built-in E 2PROM, no external connection, and supports online writing code, can be through the address writing code line cascade point and point spacing within 50 meters of any many UCS 512B 3 chips once online writing code. ... Separate address series write code line, can automatically write code at one time, support the first installation before writing code mode ... Enhanced online cascade code writing code mode, support 100 meters (point spacing) * 1024 (UCS 512 cascade points) one-time online writing code'
      quote_write: '(PDF 8) When entering the address code writing function, both the PI (write address port) and the DAI port will remain at a high level before the screen data is sent. ... The writer has A / D + terminal except the address terminal (PO). The DAI line shall be connected to the writer A / D + terminal. The A terminal of the writer shall maintain a high level when writing the code, and the IC shall write the code normally under the DAI high level mount state'
      address_write_format: null # not documented
    forwarding:
      text: 'No data forwarding: every chip listens to the same DAI line. Only the address line is chained (PI in, PO out).'
      doc: ucs512b3-ledyi
      page: PDF 11
      quote: 'Application Figure 1: General Application'
      reading: "Schematic (zoomed): controller (控制器) PO -> R_PI -> #1 PI; #1 PO -> R_PO -> R_PI -> #2 PI; controller DAI runs on a common line that reaches each chip's DAI through its own RD resistor; controller GND to the GND rail."
    backup_line: null
    standard_dmx_250k: true # 250 k is inside every range the document prints
    practical_notes:
      - doc: ucs512b3-ledyi
        page: PDF 11
        quote: 'When no routing amplifier is applied, it is recommended to use 250K standard speed, but not to expand to 500K. At 250K standard speed, to reach nearly 25 frames, and the number of single port connection points of the controller should not exceed 220 points.'
      - doc: ucs512b3-ledyi
        page: PDF 13
        quote: 'In routing amplifier applications, 485 differential transmission between controller and amplifier transfers the differential signal to a single line signal, and the distance between the amplifier and lamps should be as short as possible.'
    compatibility_claims:
      - {
          claim: 'Compatible with and extend the DMX 512 (1990) signal protocol;',
          doc: ucs512b3-ledyi,
          page: 1,
        }
    disagreements:
      - 'Bit-rate range printed four ways: features "250K ~750kbps" (PDF 1); protocol text "250kbps to 750K" (PDF 6); receiving/sending notes "200K-750K" (PDF 7, PDF 8); table "200 / 250 / 800 K bps" (PDF 6); switching table "data-signalling rate F 750 Kbps" (PDF 5).'
      - 'Table rows do not agree with the bit-time row: "The 2-bit stop bits" least value 4 us, but 2 x 5 us = 10 us at the table''s own 200 k bit time; "Field" crest value 27.5 us = 11 x 2.5 us (a 400 k bit), not 11 x 1.25 us = 13.75 us at the 800 k bit time printed in the same column.'
      - 'Address-write reach: "point spacing within 50 meters" (PDF 1 description) vs "100 meters (point spacing) * 1024" (PDF 1 features).'
      - 'ENTTEC''s UCS512B page says "a single cable break or failed IC halts everything downstream"; the datasheet says "the exception of a certain chip does not affect the normal work of other chips" (parallel bus).'
    open:
      - Chinese original of the UCS512B3 datasheet not found (szucs.cn hosts no PDFs); the LEDYi English text is a rough machine translation.
      - Address-write packet format (what the writer sends on PI) is not documented.
      - No document for a plain "UCS512B" (non-B3); the DB entry's datasheet is the UCS512B3 document.

