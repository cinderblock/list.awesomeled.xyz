        asks for an email sign-in, which was not submitted; this is the Wayback Machine capture of the PDF
        ESTA serves. ESTA's list says the current control number is 'CP/2024-1011r2a'; the PDF itself
        prints 'CP/2023-1011r2a' on every page.
    - id: e111-2008r2018
      url: https://web.archive.org/web/20181123143754/http://tsp.esta.org/tsp/documents/docs/ANSI-ESTA_E1-11_2008R2018.pdf
      title: ANSI E1.11 - 2008 (R2018) Entertainment Technology--USITT DMX512-A
