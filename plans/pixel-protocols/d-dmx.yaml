    disagreements:
      - 'Advatek''s DMX512P rate changed: 2023 page "250 – 650 kbps", current page "250 - 750 kbps".'
      - 'ENTTEC''s DMX512 page says each node holds "an address and passing frames down the chain" and that "a broken node or severed line stops every pixel downstream"; every DMX pixel datasheet read here (UCS512, WS2821, WS2822S, SM16511BK) describes a parallel bus where one failed chip does not affect the others.'
      - 'Advatek''s guide says the AUX port should "adhere to the DMX512-A standard of 300m maximum per bus"; E1.11 puts cabling out of scope (clause 1.1) and E1.27-1 4.2 says "Maximum and minimum run lengths are specifically omitted from this standard". 300 m is the PLASA guide''s recommendation (rp-dmx512 PDF 28).'
      - 'ENTTEC DMX512-D page: "Standard DMX512 runs at a fixed 250 kbit/s"; E1.11 Table 6 allows 245-255 kbit/s.'
    open:
      - No datasheet for a chip actually named "DMX512" / "DMX512P"; Advatek's 2023 attribution to "Tianli New Technology Co." is unverified.
      - Falcon's "Wires" column is 2 for DMX512P (3 for WS2811, 4 for APA102); what the 2 counts is not explained.

