# Workstream 8 (pixel protocols), research batch d-dmx: DMX512 itself, a short
# sACN / Art-Net note, the universe arithmetic, and the DMX-addressed pixel ICs.
# Summary for the parent: d-dmx.md (same folder). Every value below carries a
# verbatim quote; "printed" strings copy the document's own text and units.
# Page references: "PDF n" is the page index in the file; "printed n" is the
# number in the page footer, where there is one.
batch: d-dmx
researched: '2026-11-20'

# ---------------------------------------------------------------------------
# 1. DMX512 (ANSI E1.11, USITT DMX512-A)
# ---------------------------------------------------------------------------
dmx512_standard:
  documents:
    - id: e111-2024
      url: https://web.archive.org/web/20260225154802/https://tsp.esta.org/tsp/documents/docs/ANSI%20E1.11%20-%202024.pdf
