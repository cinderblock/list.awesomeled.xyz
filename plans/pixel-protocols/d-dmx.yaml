    - id: rp-dmx512
      url: https://web.archive.org/web/20240407165055/https://tsp.esta.org/tsp/documents/docs/DMX512-A_Guide_(8x10)_ESTA.PDF
      title: Recommended Practice for DMX512, A guide for users and installers, 2nd Edition, Incorporating USITT DMX512-A and Remote Device Management - RDM (Adam Bennette)
      revision: 2nd Edition (PLASA 2008, reprinted 2012), ISBN 978-0-9557035-2-2
