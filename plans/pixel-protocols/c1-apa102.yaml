  # ------------------------------------------------------------------ APA102
  - part: APA102
    entry: pixels/apa102
    maker: >-
      APA Electronic Co. (Taiwan) designed it. The datasheet the entry links is Shiji Lighting /
      iPixel LED's (Shenzhen) image-only sheet, headed "APA102C" on pages 1-4 and "APA102" on page 5.
    documents:
      - id: shiji-apa102c
        url: https://cdn-shop.adafruit.com/datasheets/APA102.pdf
        title: APA102C, RGB Full Color LED control IC (iPixel LED / Shiji Lighting)
        revision: null
        date: null
        language: en (headings also zh)
        source_type: LED packager's datasheet (the entry's datasheet.url)
        notes: 5 pages, images only (PDF metadata created 2014-10-17). Quotes transcribed from the rendered pages.
      - id: normand-apa102-2020
        url: https://cdn-shop.adafruit.com/product-files/3341/APA102-2020-8A+LED+Datasheet.pdf
        title: APA 102-2020-256-8A
        revision: null
        date: null
        language: en
        source_type: datasheet on Shenzhen Normand Electronic letterhead, hosted by Adafruit for its APA102-2020 "DotStar Micro" (product 3341)
        notes: >-
          13 pages; every footer reads "Shenzhen Normand Electronic Co.,Ltd www.normandled.com". PDF
          created 2019-03-22, modified 2020-03-09, author "Robert.lo（羅俊仁）". Covers the 2020 package in the entry.
      - id: superlighting-apa102-2020
        url: https://www.superlightingled.com/PDF/APA102-2020-LED-Chip.pdf
        title: APA-102-2020 Series, Top Mount IC+RGB Chip LED (Preliminary)
        revision: null
        date: null
