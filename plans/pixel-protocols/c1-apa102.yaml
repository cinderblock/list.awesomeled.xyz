        page: null
        by: controller maker (Advatek)
    disagreements:
      - >-
        Oscillator: this sheet's table gives FOSC typ "5.1" MHz (p. 2) and p. 4 says "Built-in ring
        vibration (5.1MHZ)", where the Shiji sheet and Newstar's APA107 sheet give FOSC 800-1200 KHz in the
        same table.
      - >-
        Clock limits in one document: absolute limit 30 MHz, recommended 0-5 MHz (p. 6), "lighting
        application When the clock frequency is controlled below 2MHz" (p. 4), "cascaded at 1MHZ data
        transmission speed Point source can reach 1000" (p. 4). TCLKH > 30 ns plus TCLKL > 30 ns means a
        period over 60 ns, i.e. under 16.7 MHz, which does not reach 30 MHz.
      - >-
        "Adopt special global clock latching mode to make the picture more consistent;" (p. 4) suggests a
        common latch, but the frame text has no latch step and cpldcpu measured APA102s updating each LED
        right after its own frame. Whether this 2018 "APA-102C-NEW" part latches differently is unknown.
      - >-
        Rose Lighting's HD107S sheet (see HD107S) calls "APA102C (packaged in china ) (fake APA102)" and lists
        APA102C at "20Mbps" in its comparison chart; APA Electronic's own APA102C sheet gives 30 MHz.
    open:
      - No measurement of the APA-102C-NEW-260's latch behaviour or clock limit found.

