      doc: apa-apa102c-2018
      page: 3
      quote: '(transcribed from image) "Global bit：5-bit（32 level）brightness setting，while controlling R, G, B three-color constant current output value，if set the Global bit for the 10000（16/31）is the output current is half again the original PWM settings."'
