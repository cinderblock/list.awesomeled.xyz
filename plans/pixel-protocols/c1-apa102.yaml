      latch: 'not explained; p. 4 says "Adopt special global clock latching mode to make the picture more consistent;"'
      bit_map: 'b31-b29 = 1 1 1 ("flag"); b28-b24 = D4 D3 D2 D1 D0; b23-b16 = B7..B0; b15-b8 = G7..G0; b7-b0 = R7..R0'
      doc: apa-apa102c-2018
      page: 5
      quote: >-
        (drawing) CIN / DIN: 32bit起始帧 [32-bit start frame] | 标志位 [flag bits] | D4 | D3 | D2 | D1 | D0 |
        B7B6··B1B0 | G7G6··G1G0 | R7R6··R1R0 | 标志位 [flag bits] | B7' … / 第一点32bit灰度数据 [first pixel's 32-bit
