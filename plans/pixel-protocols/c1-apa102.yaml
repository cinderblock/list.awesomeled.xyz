        language: en
        source_type: maker datasheet, hosted by Pololu (the entry's datasheet.url)
      - id: ledyi-sk9822
        url: https://www.ledyilighting.com/wp-content/uploads/2022/02/SK9822-RGB-LED-specification.pdf
        title: SK9822-RGB-LED specification (LEDYi Lighting)
        revision: '02'
        date: '2018-07-09'
        language: en
        source_type: reseller re-issue ("Modify Records / SK9822 RGB / 02 / Initial Document / Andy Zhu / 2018-07-09", p. 12)
        notes: Same text, tables and figures as opsco-sk9822-r01 (30MHZ, FPWM 1.2 KHZ). Same layout and revision record as LED Color's LC8823 sheet (see LC8823).
      - {
          id: cpldcpu-sk9822,
          url: 'https://cpldcpu.com/2016/12/13/sk9822-a-clone-of-the-apa102/',
          source_type: independent,
        }
      - {
          id: cpldcpu-apa102,
          url: 'https://cpldcpu.com/2014/11/30/understanding-the-apa102-superled/',
          source_type: independent,
        }
      - {
          id: advatek-pages,
          url: 'https://www.advateklighting.com/pixel-protocols/sk9822',
          source_type: controller maker,
        }
    line_coding: clocked
    idle: null
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 30000000
      sample_edge: rising
      shift_edge: null
      regenerated: null
      printed: The maximum frequency of 30MHZ serial data input
      doc: opsco-sk9822-r01
      page: 2
      quote: '●The maximum frequency of 30MHZ serial data input'
      timing:
        - doc: opsco-sk9822-r01
          page: 4
          quote: 'The clock high level width / TCLKH / --- / --- / >30 / ns // The clock low level width / TCLKL / --- / --- / >30 / ns // Data set up time / TSETUP / --- / --- / >10 / ns // The frequency of PWM / FPWM / --- / 1.2 / --- / KHZ (">30" and ">10" printed in the Max column)'
        - doc: opsco-sk9822-r01
          page: 5
          what: sampling edge
          quote: '(drawing) "(3) PWM input / output signal relationship:" / SDI 7 6 5 4 3 2 1 0 (MSB … LSB) / CKI with an up-arrow on each rising edge'
      independent:
        - doc: cpldcpu-sk9822
          quote: 'As shown above, the data format itself seems to be identical, and data forwarding from one LED to the next seems to work in the same way as with the APA102.'
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: B G R
      pixel_bits: 32
      extra: 3 header bits "111", then a 5-bit Global brightness field
      start: 32 bits of 0
      end: 32 bits of 1 as printed
      latch: >-
        Not in the datasheet. Measured: the SK9822 shows a frame only at the first clock after the next
        32-zero start frame, so an extra 32-bit zero "reset frame" is needed after the data (cpldcpu-sk9822).
      bit_map: 'b31-b29 = 1 1 1; b28-b24 = Global; b23-b16 = BLUE; b15-b8 = GREEN; b7-b0 = RED'
      doc: opsco-sk9822-r01
      page: 4
      quote: '(drawing) "(1) Series data structure" / SDI 0*32 | LED1 | LED2 | LED3 | LED4 | ---- | LED N | 1*32 (Start Frame, LED Frame, Data Field, End Frame) / Start Frame 32 Bits 0000 0000 x4 / LED Frame 32 Bits 111 | Global | BLUE | GREEN | RED (3 Bits, 5 Bits, 8 Bits x3) / End Frame 32 Bits 1111 1111 x4'
      other:
        - doc: opsco-sk9822-r01
          page: 6
          what: frame overhead
          quote: '(5) Refresh Rate： / Frame rate (=1/ (64+ (32* points)) *CKI (cycle) unit: frames per second ) / Such as: 1024 points, CKI frequency is 1MHZ, is =30 frames per second frame rate.'
        - doc: cpldcpu-sk9822
          what: latch
          quote: >-
            However, every colour combination written to the SK9822, only was shown during the next update
            cycle. Some more probing isolated the issue: The SK9822 updates the PWM registers in the first cycle
            after the next start frame (0x00000000), while the APA102 updates the PWM register immediately after
            receiving the data. Since the next start frame is sent at the beginning of the next update, this
            means that the color update is delayed.
        - doc: cpldcpu-sk9822
          what: a stream both parts accept
          quote: >-
            The only way to get the SK9822 to work properly is to send an additional "reset frame" of 32 zero
            bits at the end of the bitstream to trigger the PWM register update. … A protocol that is compatible
            to both the SK9822 and the APA102 consists of the following: A start frame of 32 zero bits (<0x00>
            <0x00> <0x00> <0x00> ) / A 32 bit LED frame for each LED in the string (<0xE0+brightness> <blue>
            <green> <red>) / A SK9822 reset frame of 32 zero bits (<0x00> <0x00> <0x00> <0x00> ). / An end frame
            consisting of at least (n/2) bits of 0, where n is the number of LEDs in the string.
        - doc: cpldcpu-sk9822
          what: summary table
          quote: 'APA102 | SK9822 / Update: Staggered | Simultaneous / Update trigger: RGB data transmission | Reset frame (0x00000000) / PWM Frequency: ~19 kHz | ~4.7 kHz / Global brightness control: PWM at ~440 Hz | Programmable current source / Chip size: ~1 mm² | ~0.65 mm²'
    forwarding:
      text: Same as APA102 as far as measured.
      doc: cpldcpu-sk9822
      page: null
      quote: 'data forwarding from one LED to the next seems to work in the same way as with the APA102.'
    brightness:
      printed: current ("simultaneous control of OUTR\OUTG\OUTB three port current")
      measured: current (cpldcpu-sk9822)
      doc: opsco-sk9822-r01
      page: 5
      quote: '(4) 5-Bit (level 32) brightness adjustment (simultaneous control of OUTR\OUTG\OUTB three port current):'
      independent_quote: '(cpldcpu-sk9822) "It appears that the SK9822 uses a controlled current source to set the global brightness. … The global brightness setting does indeed control the driver current setting."'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - >-
        The datasheet gives the same frame as the APA102 and says nothing about when data is shown;
        cpldcpu measured that it is shown only after the next start frame (a different latch rule from
        the APA102, with an identical bit format).
      - 'PWM: FPWM 1.2 KHZ (p. 4) vs 4.7 kHz measured (cpldcpu-sk9822); Advatek lists "PWM Rate 4600Hz".'
      - >-
        Clock: 30 MHz (p. 2) vs TCLKH > 30 ns and TCLKL > 30 ns (p. 4), which allow at most 16.7 MHz at
        50 % duty. Rose Lighting (reseller) lists "SK9822 … PWM frequency 2MHZ" and "2Mbps" (HD107S sheet
        pp. 7-8).
      - 'A commenter on cpldcpu-sk9822 (Sasha, 2019-09-09, comment 10400): "it looks like sending a zero frame does not cut through the shift register chain delay" — i.e. the reset frame itself must be clocked through the string.'
    open:
      - No newer Opsco revision of the SK9822 sheet was found (normandled.com has none in search results).

