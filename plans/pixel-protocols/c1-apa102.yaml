        - doc: fastled-hd108
          what: SPI mode used by FastLED
          quote: '// HD108/NS108 16-bit SPI chipset // - SPI mode: MODE3 recommended (CPOL=1, CPHA=1)'
    frame:
      bits_per_channel: 16
      channels: 3
      wire_order: R G B
      pixel_bits: 64
      extra: 'start bit "1", then 15 brightness bits: 5 for R, 5 for G, 5 for B (per-colour current gain)'
      start: at least 128 bits of 0
      end: '"the end frame is not required"'
      latch: not stated
      bit_map: 'b63 = 1; b62-b58 = R gain; b57-b53 = G gain; b52-b48 = B gain; b47-b32 = RED 15..0; b31-b16 = GREEN 15..0; b15-b0 = BLUE 15..0'
      doc: rose-hd108-v110
      page: 6
      quote: >-
        (drawing) SDI Signal: 128 bits of zero | LED1 | LED2 | LED3 | ……. | LEDn (Start Frame, LED Frame, Data
        Field) / LED Frame - 64 Bits: 1 | 5bits for R/G/B | RED | GREEN | BLUE (1 bit, 15 bits (Brightness), 16
        bits, 16 bits, 16 bits (Gray Scale)) / LED Frame_Brightness - 16 Bits: 1 | RED | GREEN | BLUE (1 bits, 5
        bits, 5 bits, 5 bits). (text) "Each update of data format consists of a start frame of 128 zeroes, 64
        bits for every LED frame and but the end frame is not required. A minimum of 128 zeroes are required to
        initiate a new data update, and increasing the number of zeroes does not affect. The LED frame consists
        of brightness bits and RGB gray scale bits, and it is identified by the first one bit following the
        start frame. Brightness bits: 5 bits (32 level) for R/G/B brightness setting, while controlling R,G,B
        three-color constant current output value separately and in turn correspondingly."
      other:
        - doc: rose-hd108-v110
          page: 7
          what: frame overhead
          quote: 'Frame rate = 1 / [ ( 128 + (64 x points) ) x T-CKI ] ; … Number of LED points = (F-CKI / Frame rate - 128) / 64;'
        - doc: newstar-ns108-voron
          page: 7
          what: the IC maker's frame (differs in channel order and end frame; see NS108)
          quote: '(drawing) b63 = 1 | b62 … b48 电流增益调节 [current gain adjustment] | b47 … b32 OUTG | b31 … b16 OUTR | b15 … b0 OUTB; (D) "After the completion of the gray data transmission, additional pulse corresponding to the number of chips need to add additional DCLK (that is, 512 chips in cascade, need to send additional 512 DCLK), DIN remains high, the new data that comes into effect;"'
        - doc: fastled-hd108
          what: what FastLED sends
          quote: >-
            // Protocol: // - Start frame: 64 bits (8 bytes) of zeros // - Per LED: 2 header bytes + 6 color
            bytes (RGB @ 16-bit each) // - End frame: (num_leds / 2) + 4 bytes of 0xFF for latching … // Note:
            Some sources mention 128 bits (16 bytes), but 64 bits works reliably … // f0: [1][RRRRR][GG] - marker
            bit, 5-bit R gain, 2 MSBs of G gain // f1: [GGG][BBBBB] - 3 LSBs of G gain, 5-bit B gain … template
            <int DATA_PIN, fl::u8 CLOCK_PIN, EOrder RGB_ORDER = GRB, fl::u32 SPI_SPEED = DATA_RATE_MHZ(25)>
        - doc: braydenm-hd108
          what: community sketch that sends R, G, B
          quote: >-
            // Start frame - 128bit of 0 / for (int i = 0; i < 8; i++) {SPI.transfer16(0);} … global = (up << 15)|
            (redb << 10) | (greenb << 5) | blueb; … SPI.transfer16(red[i]); SPI.transfer16(green[i]);
            SPI.transfer16(blue[i]); … // End Frame- write "1"s equal to at least how many pixels are in the
            string. / for (int i = 0; i < NUMPIXELS/16 +1; i++) {SPI.transfer16(0xFFFF);}
        - doc: fastled-issue-1045
          what: first community summary of the Newstar sheet (ccoenen, 2020-06-28)
          quote: 'overall: 128bits `0` are the start frame / 64 bits per LED: 1 bit `1` / 15 bits gain adjustment (5 bit per channel, table in the datasheet) / 16 bits green / 16 bits red / 16 bits blue / overall: 1bit `1` per led to end the frame (i.e.: 300 leds connected? send 300 bits)'
    forwarding:
      text: as printed (the HD107S wording, adapted to 64 bits)
      doc: rose-hd108-v110
      page: 7
      quote: >-
        The HD108 receives a valid SPI signal and outputs a valid SPI signal to the next devices. Once a device
        detects a start frame, it will interpret the next"1"bit as start of its LED frame. 64 bits are clocked
        into the shift registers, while zeroes are pushed to the output. After the entire LED frame has been
        read, any subsequent data is simply forwarded until another start frame is detected. The data line is
        valid only during the rise edge of the clock signal.
    brightness:
      printed: per-colour 5-bit current setting
      doc: rose-hd108-v110
      page: 6
      quote: 'DATA MSB←→LSB | Percentage of Driving Current / 00000 1/32 / 00001 2/32 / 000 3/32 / ….. / 11110 32/32 / 11111 32/32(max)'
    backup_line: null
    compatibility_claims:
      - claim: Also, HD108 has a bigger improvement to the digital RGB LED of APA102 and APA107 which support 65536 (16bits) grade color depth in R/G/B.
        doc: rose-hd108-v110
        page: 3
      - claim: Also, HD108 is a more advanced version of digital RGB LED of APA102, so it is fully compatible with APA102.
        doc: rose-hd108-v101
        page: 3
        notes: earlier sheet only; dropped in V1.1.0
      - claim: Building upon the expansive feature set of HD107S, HD108 boasts an even more impressive design, featuring 16 bit operation and a higher PWM rate.
        doc: advatek-pages
        page: null
        by: controller maker (Advatek)
      - claim: 'HD108 is a clocked, individually addressable RGB pixel that carries data and a separate clock on two wires, placing it in the APA102/SK9822 family rather than the single-wire WS2812 group.'
        doc: enttec-pages
        page: null
        by: controller maker (ENTTEC)
    disagreements:
      - >-
        Colour order of the 16-bit fields: Rose V1.1.0 draws RED | GREEN | BLUE (p. 6); Newstar's NS108 sheet
        and Opsco's identical SK9826 sheet draw OUTG | OUTR | OUTB and say "GRB order to light". FastLED's
        HD108 driver defaults to GRB; braydenm's sketch sends red, green, blue. No measurement settles it,
        and it may differ by LED maker.
      - >-
        End of frame: Rose V1.1.0 "the end frame is not required" (p. 6); Newstar/Opsco "need to send
        additional 512 DCLK" for 512 chips "DIN remains high, the new data that comes into effect" (NS108
        p. 7); FastLED sends (n/2)+4 bytes of 0xFF; braydenm sends at least n one-bits.
      - 'Start frame: all sheets say at least 128 zero bits; FastLED sends 64 and says "64 bits works reliably".'
      - 'Clock: Rose V1.1.0 cover "Over 20MHz" and "an arbitrary clock rate over 20MHz" vs "40MHz in laboratory condition"; Rose V1.0.1 "40MHz Clock Drive Frequency"; Newstar NS108 40MHZ.'
      - >-
        Rose V1.0.1 (2019) is internally inconsistent: it claims "fully compatible with APA102", prints the
        HD107S 32-bit text ("a start frame of 32 zeroes, 32 bits for every LED frame and an end frame of 32
        ones", p. 6), lists "256 Gray scale (8bits), (16bits optional …)" (p. 3), and its p. 6 drawing is the
        HD107S frame with "16bits"/"16" painted over the 8-bit labels.
      - 'Brightness table (Rose V1.1.0 p. 6): both 11110 and 11111 map to 32/32, and the third row reads "000 3/32".'
    open:
      - Which 16-bit colour order real HD108 LEDs use (and whether it differs between Newstar-made and other HD108s).
      - Whether any end clocks are needed, and how many; whether 64 zero bits are always enough to start.
      - "No document describes an APA102 32-bit compatibility mode except Rose's superseded V1.0.1 sheet, whose frame text is copied from the HD107S; untested."

