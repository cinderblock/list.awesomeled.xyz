  - part: SK9822
    entry: pixels/sk9822
    maker: Dongguan Opsco Optoelectronics Co., Ltd
    documents:
      - id: opsco-sk9822-r01
        url: https://www.pololu.com/file/0J1234/sk9822_datasheet.pdf
        title: SK9822 SPECIFICATION, Integrated light source intelligent control (Double line transmission) of chip-on-top SMD type LED (Document No. SPC/ SK9822)
        revision: '01'
