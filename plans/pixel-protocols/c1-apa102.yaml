  # ------------------------------------------------------------------ HD107S
  - part: HD107S
    entry: pixels/hd107s
    maker: Rose Lighting's sheet; the IC is Newstar's NS107S (see NS107S)
    documents:
      - id: rose-hd107s
        url: https://web.archive.org/web/20220216171018id_/https://www.rose-lighting.com/wp-content/uploads/sites/53/2019/10/0000155-1.pdf
        original_url: https://www.rose-lighting.com/wp-content/uploads/sites/53/2019/10/0000155-1.pdf
        title: HD107S SPECIFICATION, The upgrade LED of APA102 RGB, Model HD107S 5050-RGB, 40MHz Clock Drive Frequency
        revision: V1.0.1
        date: '2019-03-18'
        language: en
        source_type: LED maker/vendor datasheet (Rose Lighting), Wayback capture; the entry's datasheet.url
        notes: 'Version table p. 2: "V1.0 January 3, 2019 Create the document" / "V1.0.1 March 18, 2019 Insert the block diagram; Add the part of "The difference of all kinds of digital LED"".'
      - id: newstar-ns107s
        url: https://web.archive.org/web/20220216171258id_/http://www.newstar-ledstrip.com/product/20190710114547839.pdf
        title: NS107S SPECIFICATION, The upgrade LED of RGB APA107 (see NS107S)
        revision: '01'
        date: null
        language: en
        source_type: IC maker datasheet
      - {
          id: advatek-pages,
          url: 'https://www.advateklighting.com/pixel-protocols/hd107s',
          source_type: controller maker,
        }
    line_coding: clocked
    idle: null
    bit_order: msb-first
    rates: []
    clock:
      max_hz: 40000000
      sample_edge: rising
      shift_edge: null
      regenerated: 'as printed: "signal reshaping amplification drive circuit"'
      printed: 'MAX Transfer Speed Fts_max 40 MHz; "an arbitrary clock rate under 40MHz"'
      doc: rose-hd107s
      page: 6
      quote: >-
        HD107S is a full color digital control LED, and it uses a standard two wire SPI protocol, one clock
        line and one data line. Each LED has two inputs and two outputs which can be daisy chained, so it has a
        great advantage of being supported by standard micro-controller periphery and it is insensitive to
        timing variations, and the data can be transferred reliably at an arbitrary clock rate under 40MHz.
        … NOTE: The maximum clock rate is mainly limited by the parasitics of the wiring, so take care of the
        layout of components and wiring.
      timing:
        - doc: rose-hd107s
          page: 5
          quote: 'The clock high level width / TCLKH / --- / --- / >30 / ns // The clock low level width / TCLKL / --- / --- / >30 / ns // Data set up time / Tsetup / --- / --- / >10 / ns // The frequency of PWM / Fpwm / --- / + 26 / --- / KHz // … MAX Transfer Speed / Fts_max / --- / 40 / --- / MHz'
        - doc: rose-hd107s
          page: 3
          quote: 'It can operates at a oscillator frequency of 40MHz thus allowing a super fast data transmission rate and fastest PWM refresh rate over 26kHz … Oscillator frequency / clock drive frequency / CKI: 40MHz … Also date transmission speed: 40Mbps'
        - doc: rose-hd107s
          page: 7
          what: sampling edge
          quote: 'The data line is valid only during the rise edge of the clock signal. / (drawing) DIN 7 … 0 (MSB … LSB) / CKI with an up-arrow on each rising edge'
        - doc: rose-hd107s
          page: 3
          what: regeneration
          quote: 'HD107S internally include intelligent digital port data latch, signal reshaping amplification drive circuit and a programmable constant current driver for RGB leds'
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: B G R
      pixel_bits: 32
      extra: 3 header bits "111", then a 5-bit Global brightness field
      start: 32 bits of 0 ("A minimum of 32 zeroes … increasing the number of zeroes does not affect")
      end: 32 bits of 1 as printed
      latch: 'as printed (copied from cpldcpu''s APA102 finding): "The LED output color is updated immediately after the first valid LED frame"'
      bit_map: 'b31-b29 = 1 1 1; b28-b24 = Global; b23-b16 = BLUE; b15-b8 = GREEN; b7-b0 = RED'
      doc: rose-hd107s
      page: 6
      quote: >-
        (drawing) SDI Signal: 32 bits of zero | LED1 | LED2 | LED3 | ……. | LEDn | 32 bits of one / Start Frame -
        32 Bits 0000 0000 x4 / LED Frame - 32 Bits 111 | Global | BLUE | GREEN | RED (3 bits, 5 bits, 8 bits x3)
        / End Frame - 32 Bits 1111 1111 x4. (text) "Each update of data format consists of a start frame of 32
        zeroes, 32 bits for every LED frame and an end frame of 32 ones.A minimum of 32 zeroes are required for
        it to initiate a new data update, and increasing the number of zeroes does not affect. The LED frame
        consists of global bit and RGB bit, and it is identified by the first one bit following the start
        frame.The LED output color is updated immediately after the first valid LED frame, and the most
        significant bit of the LED frame has to be "1", as it is used to identify the start of the frame. And
        the next two bits serve no function but recommend to set them to "1"."
      other:
        - doc: rose-hd107s
          page: 7
          what: channel order check
          quote: 'RGB bit: 8 bit (256 level) gray scale setting, while controlling R,G,B color depth, and it generates 16777216 colors, if set the RGB bit for the "00000000 00000000 11111111" is the output of full RED.'
        - doc: rose-hd107s
          page: 7
          what: frame overhead
          quote: 'Frame rate = 1 / [ ( 64 + (32 x points) ) x T-CKI ] ; … Number of LED points = (F-CKI / Frame rate - 64 ) / 32;'
    forwarding:
      text: as printed (wording copied from cpldcpu's APA102 analysis)
      doc: rose-hd107s
      page: 7
      quote: >-
        The HD107S receives a valid SPI signal and outputs a valid SPI signal to the next devices. Once a device
        detects a start frame (more than 31 zero bits), it will interpret the next "1" bit as start of its LED
        frame. 32 bits are clocked into the shift registers, while zeroes are pushed to the output. After the
        entire LED frame has been read, any subsequent data is simply forwarded until another start frame is
        detected. The data line is valid only during the rise edge of the clock signal.
    brightness:
      printed: current, in the copied APA text
      doc: rose-hd107s
      page: 6
      quote: 'Global bit: 5 bit (32 level) brightness setting, while controlling R,G,B three-color constant current output value, if set the global bit for the 10000( 16/31 ) is the output current is half again the original PWM settings.'
    backup_line: null
    compatibility_claims:
      - claim: The upgrade LED of APA102 RGB
        doc: rose-hd107s
        page: 1
      - claim: Also, HD107S is a more advanced version of digital RGB LED of APA102, so it is fully compatible with APA102.
        doc: rose-hd107s
        page: 3
      - claim: HD107S is very similar to the APA range and boasts everything APA102C brings, with a higher PWM rate and brighter LEDs.
        doc: advatek-pages
        page: null
        by: controller maker (Advatek)
    disagreements:
      - 'Maximum clock: 40 MHz (Rose HD107S V1.0.1, pp. 1, 3, 5, 6) vs 30 MHz in Newstar''s NS107S sheet for the same IC ("Oscillator Frequency: 30MHz" p. 1, "MAX Transfer Speed … 30 MHZ" p. 5) and ">30MHz" on Newstar''s NS107S page.'
      - 'TCLKH > 30 ns and TCLKL > 30 ns (p. 5) allow at most 16.7 MHz at 50 % duty, not 40 MHz.'
      - >-
        Pages 6-7 reproduce cpldcpu's APA102 findings nearly word for word (start-frame minimum, "updated
        immediately", "next two bits serve no function", forwarding text), so they are not independent
        evidence of how the HD107S behaves.
      - >-
        Rose's "difference" list and chart (pp. 7-8) contradict the other makers' sheets: "APA102 original …
        PWM frequency is 20MHZ", "SK9822 … PWM frequency 2MHZ" (Opsco: 30MHZ), "APA107 … 30MHZ" (Newstar:
        none printed); the sheet uses "PWM frequency" for the clock rate.
      - 'p. 3: "256 Gray scale (8bits), (16bits optional ,which will be on marker in September 2019)" — the 16-bit part became the HD108 with a different frame.'
    open:
      - No measurement of the HD107S's latch rule or clock limit was found; the sheet's behaviour text is copied.

