# Workstream 8 (pixel protocols), research batch c1-apa102: the APA102-style clocked parts
# and the 16-bit NS108 / HD108 / NS108E / SK9826 family. The summary is the sibling file
# c1-apa102.md (read it first).
batch: c1-apa102
researched: '2026-11-20'
conventions:
  page: PDF page number, 1-based. Where the printed page number differs it is said.
  quotes: >-
    Verbatim, keeping the makers' spelling, grammar and spacing quirks. Several sheets are
    images with no text layer; those pages were rendered and read by eye, and their quotes are
    marked "(transcribed from image)". Chinese labels are quoted as printed with an English
    translation in square brackets. " / " separates lines or cells of one figure or table.
  clocked_parts: >-
    Every part in this batch is clocked (data + clock), so rates is empty and the timing is
    under clock. idle is null throughout: no document states the idle level of the clock or
    data line, and the drawings disagree (the APA/Shiji/Opsco bit diagrams draw CKI high
    before the first bit; APA Electronic's protocol drawing starts CIN low).
  bit_map: >-
    frame.bit_map is the drawn frame written out bit by bit (b31 = first bit on the wire);
    it adds nothing that is not in the cited drawing.

