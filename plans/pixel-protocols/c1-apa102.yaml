    line_coding: clocked
    idle: null
    bit_order: msb-first
    rates: []
    clock:
      max_hz: null
      max_hz_by_document:
        - doc: shiji-apa102c
          max_hz: null
          notes: no clock rating printed; only FOSC (the internal oscillator), 800-1200 KHz (p. 3)
        - doc: normand-apa102-2020
          max_hz: 15000000
          page: 2
          quote: 'Maximum Rating / Rate of data signal / FCLK / 15 / MHZ'
          notes: 'p. 3 Electrical Characteristics: "Rate of data signal / FCLK / 5 / - / MHZ" (5 in the Typ. column, Max. "-")'
        - doc: superlighting-apa102-2020
          max_hz: 15000000
          page: 8
          quote: 'Maximum serial input data clock frequency 15MHZ (lighting applications, please control the clock frequency below 2MHz);'
      min_hz: null
      sample_edge: rising
      shift_edge: >-
        Not printed by any maker. Measured: SDO changes on the rising edge of the incoming clock and the
        LED drives CKO as the incoming clock inverted, so the next LED samples it half a clock later
        (cpldcpu-apa102); at the end of a strip the data changes on the falling edge of the clock seen
        there, about 15 ns after it at 24 MHz (pjrc-24mhz).
      regenerated: >-
        The clock out is the incoming clock inverted, with no internal clock source (cpldcpu-apa102);
        each LED slightly lengthens the high time and shortens the low time it passes on (pjrc-24mhz).
      data_delayed_half_clock: true
      clock_delayed: false
      printed: rising-edge arrows on CKI under DIN bits 7..0
      doc: shiji-apa102c
      page: 4
      quote: '(transcribed from image) "PWM input and output signals Relations" / MSB … LSB / DIN 7 6 5 4 3 2 1 0 / CKI drawn with an up-arrow on each rising edge'
      timing:
        - doc: normand-apa102-2020
          page: 3
          quote: 'The clock high level widch / TCLKH / 30 / - / - / ns // The clock low level widch / TCLKL / 30 / - / - / ns // Data set up time / TSETUP / 10 / - / - / ns // Data hold time / THOLD / 5 / - / - / ns (30, 30, 10, 5 in the Min. column)'
        - doc: superlighting-apa102-2020
          page: 8
          quote: 'Cascade output signal maximum delay time / TPD / CL=30pF,RL=1K / <12 / ns / TCO / <12'
      independent:
        - doc: cpldcpu-apa102
          quote: >-
            By definition, the data line is valid only during the rise edge of the clock signal. … To
            work around this issue, the APA102 delays the data on the output by half a cycle. As shown in
            the figure above, this is accomplished by inverting the incoming clock signal at the output.
            The data output is forwarded during the rising edge of the incoming clock, but only becomes
            valid for the next device at the rising edge of the outgoing clock.
        - doc: cpldcpu-apa102
          quote: >-
            I have no recommendation for a maximum or minimum SPI clock speed. There is no specification
            for this in the datasheet. So far, it seems that the LED is able to handle any clock setting
            that is thrown at it. I had no issues with 4 MHz and others have successfully tested 10 MHz and above.
        - doc: pjrc-24mhz
          quote: >-
            The main thing to observe here is the APA102 output changes its data line (blue) at the
            falling edge of the clock (red). … At 24 MHz, the delay is much more significant. In this
            case I measured approximately 15 ns delay from clock to the data changing. … But it appears
            each APA102 lengthens the clock high time and shortens the clock low time slightly. … After
            144 LEDs, the clock low time on this strip has shrunk from 20.83 ns to approximately 18 ns.
            With the data output delayed 15 ns after the falling edge, this leaves only 3 ns before the
            next APA102 LED captures the data on the rising edge of the clock.
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: B G R
      pixel_bits: 32
      extra: 3 header bits "111", then a 5-bit "Global" brightness field, MSB first
      start: 32 bits of 0
      end: 32 bits of 1 as printed (captioned "LED Frame 32 Bits" by mistake)
      latch: >-
        Nothing printed. Measured: no latch; each LED shows its data right after its own LED frame
        (cpldcpu-apa102).
      bit_map: 'b31-b29 = 1 1 1; b28-b24 = Global (MSB first); b23-b16 = BLUE 7..0; b15-b8 = GREEN 7..0; b7-b0 = RED 7..0'
      doc: shiji-apa102c
      page: 3
      quote: >-
        (transcribed from image) "(1).cascading data structure / Tabdem N-LED / SDI | 0*32 | LED1 | LED2 |
        LED3 | LED4 | ---- | LEDN | 1*32 / Start Frame | LED Frame | Date Field | End Frame / Start Frame 32
        Bits / 00000000 00000000 00000000 00000000 (8Bits each) / LED Frame 32 Bits / MSB LSB MSB LSB / 111 |
        Global | BLUE | GREEN | RED / 3Bits 5Bits 8Bits 8Bits 8Bits / LED Frame 32 Bits / 11111111 11111111
        11111111 11111111 (8Bits each)"
      other:
        - doc: normand-apa102-2020
          page: 5
          quote: '(transcribed from image) same drawing: SDI 0*32 | LED1 … LEDN | 1*32; LED Frame 32 Bits 111 | Global | BLUE | GREEN | RED (3Bits 5Bits 8Bits 8Bits 8Bits); the end frame again captioned "LED Frame 32 Bits" over 11111111 x4'
        - doc: cpldcpu-apa102
          quote: >-
            It turns out that a minimum of 32 zeroes are required to initiate an update. Increasing the
            number of zeroes does not have any impact. The LED frame is identified by the first one bit
            following the start frame. … the most significant bit of the LED frame has to be "1", since it
            is used to identify the start of the frame. It appears that the next two bits serve no function
            and can have arbitrary values. To stay compliant with the data sheet, it makes sense to set them
            to "1", though.
        - doc: cpldcpu-apa102
          what: why the end frame needs n/2 clock edges
          quote: >-
            Since the data for each subsequent LED is delayed by half a clock cycle, but the clock is not,
            additional clock cycles have to be fed to the string even after all data has been sent. This is
            the sole reason for the existence of the "End frame" … the only function of the "End frame" is to
            supply more clock pulses to the string until the data has permeated to the last LED. The number of
            clock pulses required is exactly half the total number of LEDs in the string. The recommended end
            frame length of 32 is only sufficient for strings up to 64 LEDs. … It should not matter, whether
            the end frame consists of ones or zeroes. Just don't mix them. Furthermore, omitting the end frame
            will not mean that data from the update is discarded. Instead it will be loaded in to the PWM
            registers at the start of the next update.
        - doc: cpldcpu-apa102
          what: summary protocol
          quote: >-
            A start frame of 32 zero bits (<0x00> <0x00> <0x00> <0x00>) / A 32 bit LED frame for each LED in
            the string (<0xE0+brightness> <blue> <green> <red>) / An end frame consisting of at least (n/2)
            bits of 1, where n is the number of LEDs in the string. Unlike the WS2812 protocol, no waiting
            period is required before the next update.
        - doc: cpldcpu-apa102
          what: when the colour changes
          quote: >-
            The LED output color is updated immediately after the first valid LED frame. This is quite
            interesting, since it means that almost arbitrary update rates of the APA102 are possible.
            However, this may lead to a "staggered" update for longer strings, where the first LEDs in a
            string are updated earlier than the later ones.
    forwarding:
      text: >-
        The maker sheet only says the clock is passed on ("two-output WAY"). Measured: after a start frame
        each LED keeps the first LED frame, sends zeroes downstream while it reads it, then forwards the rest,
        data delayed half a clock.
      doc: cpldcpu-apa102
      page: null
      quote: >-
        Once a device detects a start frame (more than 31 zero bits), it will interpret the next "1" bit as
        start of its own LED frame. 32 bits are clocked into the PWM registers, while zeroes are pushed to the
        output. After the entire LED frame as been read, any subsequent data is simply forwarded until another
        start frame is detected.
      maker_quote: '(shiji-apa102c p. 1, transcribed from image) "APA102 with two-output WAY ,the CLK signal by synchronization，so that the crystal cascadePiece of output movements synchronized."'
    brightness:
      printed: 'the 5-bit Global field sets the "Driving Current" of R, G and B together'
      measured: 'a low-frequency PWM (~440 Hz) laid over the ~19 kHz PWM, not a current change (cpldcpu-sk9822)'
      doc: shiji-apa102c
      page: 4
      quote: '(transcribed from image) "Global bit：5-bit（32 level）brightness setting，while controlling R, G, B three-color constant current output value，if set the Global bit for the 10000（16/31）is the output current is half again the original PWM settings." / DATA MSB↔LSB | Driving Current / 00000 0/31 … 11111 31/31(max)'
      independent_quote: '(cpldcpu-sk9822, summary table) "Global brightness control / PWM at ~440 Hz / Programmable current source" (APA102 column, SK9822 column); text: "the APA102, which superimposed a lower frequency PWM pattern if the global brightness was not set to its maximum"'
    backup_line: null
    compatibility_claims:
      - claim: 'APA102C uses the same protocol, but provides a larger metallic area for better heat dissipation.'
        doc: advatek-pages
        page: null
        by: controller maker (Advatek)
    disagreements:
      - >-
        Brightness method: the sheet says the Global bits set the output current ("Driving Current",
        p. 4; the Normand 2020 sheet p. 5: "simultaneous control of OUTR\OUTG\OUTB three port current"),
        while cpldcpu measured a ~440 Hz PWM on the APA102 (cpldcpu-sk9822). Advatek also says "5-bit
        global current control".
      - >-
        End frame: drawn as 32 ones (captioned "LED Frame 32 Bits" in shiji-apa102c p. 3 and
        normand-apa102-2020 p. 5), but cpldcpu measured that it is only extra clocks, n/2 of them, so 32
        bits only cover 64 LEDs, and ones or zeroes both work.
      - >-
        Overhead arithmetic (shiji-apa102c p. 4): "minus the Start Frame bit divided by the number 40 … the
        pixel number（512000-40）/32=15998" subtracts 40 bits, while the same sheet draws a 32-bit start
        frame and a 32-bit end frame.
      - >-
        Maximum clock: none in the entry's datasheet; 15 MHz in both 2020-package sheets
        (normand-apa102-2020 p. 2, superlighting-apa102-2020 p. 8); 30 MHz in APA Electronic's APA102C
        sheet (see APA102C). The entry says bitrate 30MHz for both packages.
      - >-
        PWM rate: Advatek and ENTTEC list "PWM Rate 1920Hz"; normand-apa102-2020 p. 3 prints "The
        frequency of PWM FPWM 20 KHz"; cpldcpu measured 19.2 kHz (cpldcpu-sk9822: "~19 kHz"). Not a wire
        matter.
      - >-
        Self-test pin (bare IC, shiji-apa102c p. 4): "(4).VEN：Self-detection / Data Field to the middle of
        3bit were B, G, R in the MSB of the opposite phase， otherwise regarded as invalid data. VEN close to
        empty when the self-detection：when VEN VSS then activated self-detection." With self-detection on,
        the three header bits would have to be the inverse of the B, G, R MSBs, not "111". The LED package
        has no VEN pin, and cpldcpu found the two bits after the leading 1 are ignored, so the option is
        evidently off in packaged LEDs; recorded because it explains the otherwise unused header bits.
      - >-
        Clock polarity option (bare IC, shiji-apa102c p. 4): "(5).CSEL to empty when the CKO and CKI RP
        :CSEL connected with VSS when the CKO compared with CKI." (pin 6 CSEL, p. 2: "Invert the clock
        signal cascade"). The garbled sentence appears to say CKO is in phase with CKI when CSEL is open and
        inverted when tied to VSS; cpldcpu measured an inverted CKO on packaged LEDs.
      - >-
        Who makes the "APA102-2020": Adafruit's datasheet for it carries Shenzhen Normand's letterhead
        (normand-apa102-2020). cpldcpu wrote (comment 983 on cpldcpu-sk9822, 2016-12-18): "The APA102-2C and
        APA102-22C that APA is selling actually seem to be the SK9822 and SK6822." Whether a given
        "APA102-2020" behaves like an APA102 or an SK9822 (see SK9822 latch) is not settled by any document.
    open:
      - No maker document gives the shift edge, the half-clock data delay or the n/2 end-frame rule; they rest on cpldcpu's and PJRC's measurements.
      - 'No document states a minimum clock rate or any timeout (cpldcpu: "I have no recommendation for a maximum or minimum SPI clock speed").'
      - No maker document gives a maximum clock for the 5050 APA102 other than APA Electronic's APA102C sheet (30 MHz).

