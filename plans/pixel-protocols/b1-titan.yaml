      - name: 800kHz (V1.0 and English V1.0)
        select: null
        pulse_level: low
        T0H: null
        T0L: { ns: 360, min_ns: 310, max_ns: 410, printed: 'T0l 310 / 360 / 410 ns' }
        T1H: null
        T1L: { ns: 720, min_ns: 650, max_ns: 1000, printed: 'T1l 650 / 720 / 1000 ns' }
        period: { ns: 1250, printed: '1.25 μs; note (1) "0 码或1 码周期在1.25μs 范围内"' }
        reset:
          {
            min_ns: 200000,
            max_ns: 20000000,
            level: high,
            printed: 'Treset Reset码，高电平时间 200 20000 μs',
          }
        output: { T0L: 350, T1L: 700 }
        inter_byte_high_max_ns: 126000
        doc: tm1814-v1.0
        page: 4
        quote: '输入0码，低电平时间 T0l 310 360 410 ns | 输入1码，低电平时间 T1l 650 720 1000 ns | 输出0码 T0l’ 350 ns | 输出1码 T1l’ 700 ns | 0码或1码周期 T0/T1 1.25 μs | Reset码，高电平时间 Treset 200 20000 μs | （2）不需复位时，字节之间的高电平时间不要超过126μs'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 4
      wire_order: 'C1 (32 bits), C2 (32 bits), then per chip W7…W0 R7…R0 G7…G0 B7…B0'
      pixel_bits: 32
      extra: 'C1 = constant-current command, 32 bits W R G B, MSB first; bits 7 and 6 of each byte fixed 0; bits [5:0] of each byte set that channel''s current, all 0 = 6.5 mA, all 1 = 38 mA, 64 steps. C2 = C1 with every bit inverted ("否则芯片将不能对数据进行正确解码", or the chip cannot decode the data). Every chip receives and forwards C1 and C2; on Reset each chip checks C1 against C2 and, if valid, applies the currents and its PWM packet.'
      start: 'C1 C2 at the start of every frame (both refresh cycles drawn with C1 C2, p5–6)'
      end: null
      latch: 'HIGH for 200–20000 μs'
      doc: tm1814-v1.1
      page: 5
      quote: '1、一帧完整数据结构 C1 C2 D1 D2 D3 D4 ... Dn Reset | C1、C2为恒流值设置命令，每个芯片都会接收并转发C1、C2。D1、D2、D3、D4、……、Dn为各芯片的PWM设置命令。Reset表示复位信号，高电平有效。 | 2、C1的数据格式 W7 … W0 R7 … R0 G7 … G0 B7 … B0 C1命令包含8×4bit数据位，高位先发，W7、W6、R7、R6、G7、G6、B7、B6固定设为0。W[5:0]:用于设置OUTW输出恒流值。全0码为6.5mA，全1码为38mA，64级可调。(R, G, B likewise) | 3、C2的数据格式 … C2命令是C1命令的对应bit按位取反，否则芯片将不能对数据进行正确解码。 | 4、Dn的数据格式 W7 … W0 R7 … R0 G7 … G0 B7 … B0 每组PWM设置命令包含8×4bit数据位，高位先发。'
      translation: "Frame: C1 C2 D1 … Dn Reset. C1 and C2 are constant-current commands; every chip receives and forwards them. D1…Dn are each chip's PWM commands. Reset is active HIGH. C1: 8×4 bits, high bit first, W7 W6 R7 R6 G7 G6 B7 B6 fixed 0; W[5:0] sets OUTW current, all-0 = 6.5 mA, all-1 = 38 mA, 64 steps (R, G, B likewise). C2 is C1 with every bit inverted, or the chip cannot decode. Dn: W R G B, 8×4 bits, high bit first."
    forwarding:
      text: 'Forwards with a fixed 32-bit lag: C1 goes out while C2 comes in, C2 goes out while D1 comes in, then D2…Dn pass through. Each chip keeps the first 32-bit PWM packet after C1 C2. DO is held HIGH before forwarding. Tplz 155 ns typ (V1.1), 178 ns (V1.0).'
      doc: tm1814-v1.1
      page: 6
      quote: '数据传输与转发流程：芯片1在接收C1的数据时无转发，当开始接收C2时，就会将C1的数据转发出去，在芯片1接收完C2之后，芯片1也将C1转发完成了；此后控制器再将D1发送给芯片1，芯片1则开始将C2转出去。…芯片1转发的数据与控制器发送给它的数据，始终是有32bit的差值。当控制器发送一个复位信号时，芯片1就会校验C1与C2，如果合法则将恒流值设置到端口，并将D1转化为实际的PWM控制。在后面级联的芯片2、芯片3…芯片n中，…都会将C1和C2之后的第一组PWM控制的数据(8×4bit)截留下来，并且将其他的PWM控制数据转发出去。'
      translation: 'Chip 1 forwards nothing while receiving C1; when C2 starts arriving it forwards C1, finishing as C2 ends; while D1 arrives it forwards C2; it then forwards D2, D3, … The forwarded data always lags the input by 32 bits. On reset chip 1 checks C1 against C2; if valid it applies the currents and turns D1 into PWM. Chips 2…n do the same, each keeping the first 32-bit PWM packet after C1 and C2 and forwarding the rest.'
    backup_line: null
    other_behaviour:
      - 'Internal control (内控) fallback: after ~500 ms without input (Tos 450/500/550 ms) the chip cycles fixed WRGB patterns and sends its own data downstream at 500 kHz for 1918 points (V1.1) / 2048 points (V1.0, English V1.0), so following chips run in sync. (V1.1 p4, p7–8; "当芯片电源正常，且检测到DIN没有信号输入，或本来信号正常，之后突然丢失500ms左右后，芯片进入内控模式")'
      - 'Idle level: p5 "本芯片采用单线通讯方式，采用归一码的方式发送信号。…在转发数据之前，DO口一直为高电平。" (single-wire, "return-to-one" code; DO stays HIGH before forwarding). Timing diagram p4: DIN idles high, each bit starts with a low pulse T0l/T1l.'
    compatibility_claims: []
    disagreements:
      - 'V1.1 (2021) vs V1.0 (2014): T0l min 310 → not printed; T1l max 1000 → not printed; outputs 350/700 → 360/720 ns; Tplz 178 → 155 ns; inter-byte HIGH limit 126 μs → 50 μs; period note "在1.25μs 范围内" → "1.25μs（800KHz）至2.5μs（400KHz）"; internal-mode output 2048 → 1918 points.'
      - 'V1.0 p5 typo: "W[7:0]:用于设置OUTR输出的PWM占空比" (W sets OUTR); V1.1 corrects to OUTW. V1.0 p8 current-expansion text says "WRGB三个OUT端口" (three ports) where V1.1 says four.'
    open:
      - 'What a chip does when C2 is not the inverse of C1 is only described as "cannot decode correctly"; whether a frame without C1 C2 is accepted is not stated.'

