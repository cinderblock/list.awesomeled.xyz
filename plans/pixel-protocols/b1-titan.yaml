    compatibility_claims: []
    disagreements:
      - 'Reset inside V1.6 and V1.8: table p6 Treset ≥200 us vs forwarding text p7 "此时如果控制器发送一个大于15us的RESET低电平信号，所有芯片就会复位" (if the controller sends a RESET low signal longer than 15 us, all chips reset).'
