      - 'English V1.2 p6: "To make the chip reset, the low level time should be maintained at more than 200μs. Please be noted that the low level time should not be more than 20000μs, or else the chip might be close output." V1.0/V1.3 give Treset max 20000 μs with no explanation.'
      - 'Windows: English V1.2 prints T0H min 310 and T1H max 1000 ns and outputs 350/700 ns; V1.0/V1.3 print no T0H min, no T1H max, outputs 360/720 ns.'
      - 'V1.0 p1 feature "单线单通道串行级联接口：由DIN脚输入数据，D0 转发级联的数据，信号不因某颗芯片异常而影响其他芯片正常工作" (claims one faulty chip does not stop the others, on a part with one data input); V1.3 drops the last clause.'
    open:
      - 'Whether TM1903 really blanks its outputs after >20 ms of continuous low (English V1.2 wording) is not stated in the Chinese sheets.'

