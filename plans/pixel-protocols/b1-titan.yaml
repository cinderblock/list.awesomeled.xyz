        translation: 'T0h 310/360/410 ns; T1h 650/720/1000 ns; outputs 360/720 ns; period 1.25 μs; reset low ≥200 μs. (1) 1.25–2.5 μs periods work if the high times fit. (2) When no reset is wanted, the HIGH time [sic] between bytes must not exceed 50 μs.'
        other_quotes:
          - {
              page: 1,
              quote: '采用单极性归零码数据协议 | 上电亮灯状态：灭灯 | 数据传输速率800KHz',
              translation: 'Uses a unipolar return-to-zero data protocol; LEDs off at power-up; data rate 800 kHz',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 4
      wire_order: 'R7…R0 G7…G0 B7…B0 W7…W0'
      pixel_bits: 32
      extra: null
      start: null
      end: null
      latch: 'low ≥200 μs'
      doc: tm1824-v1.2
      page: 5
      quote: '1、一帧完整数据结构 D1 D2 D3 D4 ... Dn Reset | D1、D2、D3、D4、……、Dn为各芯片的PWM设置命令。Reset表示复位信号，低电平有效。 | 2、Dn的数据格式 R7 … R0 G7 … G0 B7 … B0 W7 … W0 每组PWM设置命令包含8×4bit数据位，高位先发。'
      translation: "Frame: D1 … Dn Reset; each Dn is one chip's PWM command; Reset is active low. Dn: R G B W, 8×4 bits, high bit first."
    forwarding:
      text: 'Each chip keeps the first 32 bits and forwards the rest with a 32-bit lag; DO low before forwarding. Tplz 155 ns typ.'
      doc: tm1824-v1.2
      page: 6
      quote: '数据传输与转发流程：控制器发送数据D1，D2，D3…Dn，芯片1接收D1并转发D2，D3…Dn给芯片2，芯片2接收D2并转发D3…Dn，最后一级级联芯片芯片n接收Dn且无数据可转发。芯片1转发的数据与控制器发送给它的数据，始终是有32bit的差值。'
      translation: "The controller sends D1…Dn; chip 1 takes D1 and forwards D2…Dn to chip 2, and so on; the last chip takes Dn. Chip 1's output always lags its input by 32 bits."
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'V1.2 p4 note (2) says the HIGH time between bytes must not exceed 50 μs ("字节之间的高电平时间不要超过50μs"), but the part idles low (p4: "在转发数据之前，DO口一直为低电平") and resets on a LOW level; the wording matches the inverted TM1814 sheet. The low-level inter-byte limit is therefore not stated correctly.'
    open:
      - 'Inter-byte low-time limit (the note is mis-worded; see disagreements).'

  # ------------------------------------------------------------------ TM1829
  - part: TM1829
    entry: pixel-ics/tm1829
    maker: Titan Micro Electronics
    documents:
      - id: tm1829-v1.5-en
        url: https://www.lumikit.com.br/firmware/hslc-tm/datasheets/TM1829_V1.5_EN.pdf
        title: Three-channel LED Constant-current Drive TM1829
        revision: V1.5
        date: null
        language: en
        notes: "Titan-branded English sheet (PDF metadata 2017-04-25). Text-identical to LCSC C5174518 https://datasheet.lcsc.com/datasheet/pdf/8aa67c4ab22ab7c661890e6e97d95523.pdf and (minus headers) to the database's LEDYi copy https://media.ledyi.com/tm1829-datasheet_ca2ab7a03d12522a298c2629fca3707f0d867407a3e374072246eff71b992370.pdf. TM1829 is not listed on titanmec.com."
      - id: tm1829b-v1.0
        url: https://datasheet.lcsc.com/datasheet/pdf/b3457266985477c4a79c75dd89d81ec9.pdf
        title: 3通道LED恒流驱动专用电路 TM1829B
        revision: V1.0
        date: null
        language: zh
        notes: 'LCSC C52109855 TM1829B-SOP8-TA2105B, the part the database prices TM1829 from. PDF metadata 2024-12-02. A different protocol from TM1829; see disagreements.'
    line_coding: single-wire
    idle: high
    bit_order: msb-first
    rates:
      - name: 800kHz
        select: 'p5 switching table: "fosc High -speed mode DIN dangling or connect GND 800 KHz" (no speed pin exists; pin 7 is NC)'
        pulse_level: low
        T0H: null
        T0L:
          {
            ns: 300,
            min_ns: 150,
            max_ns: 450,
            printed: 'T0L Input 0 code，low level time 150 / 300 / 450 ns',
          }
        T1H: null
        T1L:
          {
            ns: 800,
            min_ns: 600,
            max_ns: 1000,
            printed: 'T1L Input 1 code，low level time 600 / 800 / 1000 ns',
          }
        period: { min_ns: 1200, printed: 'T 0 code or 1 code cycle time 1200 (min) -- (max) ns' }
        reset:
          {
            min_ns: 140000,
            typ_ns: 500000,
            level: high,
            printed: 'Treset Reset code，high level time 140 (min) 500 (typ) us',
          }
        output: { T0L: 340, T1L: 680 }
        doc: tm1829-v1.5-en
        page: 7
        quote: 'T0L Input 0 code，low level time VDD=5V GND=0V 150 300 450 ns | T1L Input 1 code，low level time 600 800 1000 ns | T0L’ Output 0 code，low level time -- 340 -- ns | T1L’ Output 1code，low level time -- 680 -- ns | T 0 code or 1 code cycle time 1200 -- ns | Treset Reset code，high level time 140 500 us'
        other_quotes:
          - { page: 1, quote: 'Data transmission rate can reach 800Kbps.' }
          - { page: 5, quote: 'tPLZ Transmission delay time DIN → DOUT 200 ns (max)' }
          - {
              page: 7,
              quote: 'Be noted that the high level time between bytes can not exceed the RESET signal time, otherwise chip will be reset to receive data again, then data transmission can not be realized.',
            }
      - name: 800kHz (TM1829B V1.0, for comparison)
        select: null
        pulse_level: low
        T0H: null
        T0L: { ns: 360, min_ns: null, max_ns: 410, printed: 'T0l — / 360 / 410 ns' }
        T1H: null
        T1L: { ns: 720, min_ns: 650, max_ns: null, printed: 'T1l 650 / 720 / — ns' }
        period: { ns: 1250, printed: '1.25 μs' }
        reset: { min_ns: 200000, level: high, printed: 'Treset Reset码，高电平时间 200 μs (min)' }
        output: { T0L: 360, T1L: 720 }
        inter_byte_high_max_ns: 50000
        doc: tm1829b-v1.0
        page: 4
        quote: '输入0码，低电平时间 T0l 360 410 ns | 输入1码，低电平时间 T1l 650 720 ns | 输出0码 T0l’ 360 ns | 输出1码 T1l’ 720 ns | 0码或1码周期 T0/T1 1.25 μs | Reset码，高电平时间 Treset 200 μs | （2）不需要复位时，字节之间的高电平时间不要超过50μs'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0 (PWM packet; R must not be 0xFF)'
      pixel_bits: 24
      extra: "Any 24-bit packet whose top byte [23:16] is 0xFF is a constant-current packet instead of PWM: [15:11] R current, [10:6] G current, [5:1] B current (I = 10 + value mA, 10–41 mA, 32 steps), [0] T test-mode bit (1 = test mode, 0 = normal, OUT outputs PWM). Consequently a PWM packet's R byte cannot be 0xFF (max 0xFE)."
      start: null
      end: null
      latch: 'HIGH for ≥140 μs (typ 500 μs)'
      doc: tm1829-v1.5-en
      page: 5
      quote: 'Constant-current mode command： After chip is power-on and reset，data input by DIN is complete data packet after each continuous 24bit. Firstly send high byte，if high 8 bits [bit23~bit16] are 1 in full，and then the data packet is constant-current set data. … RI [bit15~bit11]:Set R channel constant-current value，Ir=10+RI[4:0]mA, namely minimum 10+0=10mA,maxium 10+31=41mA | GI [bit10~bit6] … BI [bit5~bit1] … T: Test mode bit. 1：When it is in this position，test mode 0：When this bit is reset，normal working mode，OUT outputs PWM | (p7) PWM mode command： If high 8 bits are not 1 in full in 24bit data packet, the data packet is PWM setting data. … R7…R0 BIT23-BIT16 Set OUTR output PWM duty ration，can not be 1 fully | G7…G0 BIT15-BIT8 | B7…B0 BIT7-BITO … The high bits are sent firstly when 24bit data is sent. It is sent according to the sequence of RGB'
    forwarding:
      text: 'Keeps the first 24 bits after reset (PWM or current packet), forwards the rest; DO held HIGH before forwarding. tPLZ 200 ns max.'
      doc: tm1829-v1.5-en
      page: 5
      quote: 'After the chip is power-on and reset, it receives the data sent by DIN terminal. After finishing receiving 24bit, DO port begins to retransmit the data sent by DIN terminal continuously to provide the input data for the next cascaded chip. Before retransmitting data, DO port is always high level. If DIN inputs RESET signal, chip will output corresponding PWM duty ration wave form according to the received 24bit data after resetting successfully'
    backup_line: null
    other_behaviour:
      - 'Usage (p10): "5.2 Chip is power-on and reset. Initialize and set constant-current value firstly and the test mode bit T is 0（allow PWM to output）." and "it is suggested that the constant-current register should be refreshed regularly or the PWM register is refreshed once when the constant-current register is refreshed". The power-on default current is not printed.'
      - 'FastLED (library, not Titan) treats TM1829 as inverted with a 500 μs latch: see reference_documents fastled-chipsets-h ("FLIP is currently only honored by the nRF52 backend").'
    compatibility_claims:
      - {
          claim: 'Transmission distance between any two points is not less than 30 meters.',
          doc: tm1829-v1.5-en,
          page: 1,
        }
    disagreements:
      - 'TM1829B V1.0 (2024) is not TM1829 V1.5 on the wire: TM1829B uses the TM1814 frame "C1 C2 D1 … Dn Reset" (p5) with 32-bit packets whose W byte is unused ("W[7:0]为无效数据位，固定设置为0"), C2 = inverse of C1, currents 6.5–38 mA in 64 steps ("恒流电流能够实现64级调节（6.5mA—38mA）", p1), T0l ≤410 / T1l ≥650 ns, reset HIGH ≥200 μs, PWM 900/1000/1100 Hz. TM1829 V1.5 uses 24-bit packets, an 0xFF-header current packet (10–41 mA, 32 steps), T0L 150–450 / T1L 600–1000 ns, reset HIGH ≥140 μs, PWM 6.5/7/7.5 kHz. Both are inverted.'
      - 'Refresh-rate arithmetic p8: "The highest transmission rate of BIT is 1200ns（frequency800KHZ）… Transmission time is 24×0.6uS=28.8uS" — 1200 ns is 833 kHz (800 kHz is 1250 ns), and 24 × 0.6 μs = 14.4 μs; 28.8 μs is 24 × 1.2 μs, which the p9 table uses.'
      - 'Bit labels p5: the diagram names the current bits "R14 R13 R12 R11 R10" while the text uses RI[4:0] (likewise G1x/GI, B1x/BI).'
      - 'p5 switching table condition "DIN dangling or connect GND" for the 800 kHz mode; TM1829 has no mode pin (pin 7 NC, p2), so the condition reads as a leftover.'
    open:
      - 'Power-on default constant current and whether PWM output is enabled before any current packet: not printed.'
      - 'No Chinese TM1829 sheet or revision newer than V1.5 found; titanmec.com does not list TM1829.'

