      translation: 'A frame is D1 … Dn then Reset; each packet is 24 bits; Reset is active low. Dn is R7…R0 G7…G0 B7…B0, 8×3 bits, high bit first.'
    forwarding:
      text: 'Keeps the first 24 bits, forwards the rest; DO low before forwarding. Reset: low for more than 200 μs (p6). Tplz 155 ns typ (p4).'
      doc: tm1903-v1.3
      page: 6
      quote: '此时如果控制器发送一个Reset信号，所有芯片将会复位并把各自接收到的24bit数据解码后控制OUT端口输出，完成一个数据刷新周期，芯片又回到接收准备状态。Reset低电平有效，保持低电平时间大于200μs，芯片复位;'
      translation: 'When the controller sends a Reset, all chips reset and drive their outputs from the 24 bits each received. Reset is active low; held low for more than 200 μs, the chip resets.'
