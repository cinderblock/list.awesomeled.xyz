        page: 4
        quote: 'Input 0 code,high level time T0H VDD=5.0V GND=0V 310 360 410 ns | Input 1 code,high level time T1H 650 720 1000 ns | Output 0 code,high level time T0H’ 350 ns | Output 1 code,high level time THl’ 700 ns | 0 code or 1 code cycle T0/T1 1.25 μs | Reset code, low level time Treset 200 20000 μs | (2) When reset is not required, the low level time between bytes should not exceed 50μs'
