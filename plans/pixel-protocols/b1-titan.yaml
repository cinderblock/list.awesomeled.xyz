            max_ns: 410,
            printed: 'T0l 输入0码，低电平时间 — / 360 / 410 ns',
          }
        T1H: null
        T1L:
          {
            ns: 720,
            min_ns: 650,
            max_ns: null,
            printed: 'T1l 输入1码，低电平时间 650 / 720 / — ns',
