        doc: tm1814-v1.1
        page: 4
        quote: '十一、时序特性 | 输入0码，低电平时间 T0l VDD=5.0V GND=0V 360 410 ns | 输入1码，低电平时间 T1l 650 720 ns | 输出0码，低电平时间 T0l’ 360 ns | 输出1码，低电平时间 T1l’ 720 ns | 0码或1码周期 T0/T1 1.25 μs | Reset码，高电平时间 Treset 200 20000 μs | （1）0 码或1 码周期在1.25μs（频率800KHz）至2.5μs（频率400KHz）范围内，芯片均可正常工作，但是0 码和1 码低电平时间必须符合上表中相应数值范围；（2）不需要复位时，字节之间的高电平时间不要超过50μs，否则芯片可能复位'
        translation: 'Input 0-code LOW time typ 360, max 410 ns; input 1-code LOW time min 650, typ 720 ns; outputs 360/720 ns; period 1.25 μs; reset is a HIGH level of 200–20000 μs. (1) 1.25–2.5 μs periods work if the low times fit. (2) When no reset is wanted, the HIGH time between bytes must not exceed 50 μs.'
        other_quotes:
          - {
              page: 4,
              quote: '外控切换至内控时间 Tos DIN 无脉冲输入 450 500 550 ms',
              translation: 'Switch from external to internal control after DIN has had no pulses for 450/500/550 ms',
            }
          - {
              page: 1,
              quote: '外控模式数据传输速率800KHz | 内控模式数据传输速率500KHz | 内控模式芯片发送数据1918点',
