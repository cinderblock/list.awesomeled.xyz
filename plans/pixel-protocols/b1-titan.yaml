        page: 4
        quote: 'Input 0 ode, high level time T0H 310 360 410 ns | Input 1 ode, high level time T1H 650 720 1000 ns | Output 0 ode, high level time T0H’ 350 ns | Output 1 ode, high level time T1H’ 700 ns | 0 code or 1 code cycle T0/T1 1.25 μs | Reset code, low level time Treset 200 μs | (1) … the low level time of 0 code and 1 code must accord with the corresponding values in the above table; (2) When reset is not required, the low level time between bytes should not exceed 50μs'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low >200 μs (table max 20000 μs)'
      doc: tm1934-v1.4
      page: 5
      quote: '1、一帧完整数据结构 D1 D2 D3 D4 ... Dn Reset … 每个显示数据包包含24bit数据位。Reset表示复位信号，低电平有效。 | 2、Dn 的数据格式 R7 … R0 G7 … G0 B7 … B0 每个显示数据包包含8×3bit数据位，高位先发。'
    forwarding:
      text: 'Keeps the first 24 bits from DIN or FDIN, forwards the rest on DO; DO low before forwarding. Reset low >200 μs (p6). Tplz DIN→DO / FDIN→DO 155 ns.'
      doc: tm1934-v1.4
      page: 5
      quote: '芯片上电复位后，开始接收显示数据，接收完24bit后，DO端口开始转发DIN或FDIN端继续发来的数据，为下颗级联芯片提供显示数据。在转发数据之前，DO端口一直为低电平。'
      translation: 'After power-on reset the chip receives display data; after 24 bits, DO forwards the data that keeps arriving on DIN or FDIN. Before forwarding, DO stays low.'
    backup_line:
      pins: 'DIN (pin 5, 数据输入 data input), FDIN (pin 7, 备用数据输入 backup data input), DO (pin 4)'
      behaviour: 'Wiring (V1.4 fig. 5, p5): controller Di → chip 1 DIN; controller Fi → chip 1 FDIN; the Di line also feeds chip 2 FDIN; chip k DO → chip k+1 DIN and chip k+2 FDIN. Controller Di carries D1…Dn; Fi carries Dx D1…Dn (Dx any 24 bits), i.e. each FDIN sees the stream meant for the chip before it. The sheets do not say how the chip picks DIN or FDIN (no switching rule, no timeout, no mode command is defined); they only name normal / DIN / FDIN modes.'
      doc: tm1934-v1.4
      page: 5
      quote: '其中S1 为控制器Di端口发送的数据，S2、S3、S4 为级联TM1934 转发的数据。控制器Di端口数据结构：D1D2D3D4……Dn；控制器Fi端口数据结构：DxD1D2D3D4……Dn；其中Dx为任意24bit数据位。 | (p1) 单线双通道串行级联接口：正常模式下输入接口相互切换，DIN工作模式下由DIN脚输入数据，FDIN工作模式下由FDIN脚输入数据，D0 转发级联的数据，信号不因某颗芯片异常而影响其他芯片正常工作'
      translation: "S1 is sent by the controller's Di port; S2–S4 are forwarded by cascaded TM1934. Controller Di data: D1D2D3D4…Dn; controller Fi data: DxD1D2D3D4…Dn, where Dx is any 24 bits. (p1) Single-wire dual-channel cascade interface: in normal mode the inputs switch between each other; in DIN mode data enters on DIN, in FDIN mode on FDIN; DO forwards; one abnormal chip does not stop the others."
    compatibility_claims: []
    disagreements:
      - 'English V1.0 describes a mode command that neither sheet defines: p1 "The chip data interface can configure DI or FDI pin input through the command", p5 "After power-on reset and reception of a mode setting command, the chip begins to receive display data", p7 "(omitting C1, C2 and Reset signal time)", p7 "Functions of different operating modes" (normal mode in use; DI / FDI modes for aging and installation tests). Its frame (p5) is only D1…Dn + Reset. V1.4 drops "through the command" and the C1/C2 wording but still names the three modes.'
      - 'English V1.0 p8 "The SET pin connected to GND of TM1934 applies to constant current drive" — TM1934 has no SET pin (V1.4 p2 pin table: DIN, FDIN, DO, GND, OUTR/G/B, VDD).'
      - 'English V1.0 p4 note (1) "the low level time of 0 code and 1 code must accord" vs V1.4 p4 "0 码和1 码高电平时间必须符合" (high time).'
      - 'Windows: English V1.0 prints T0H 310–410, T1H 650–1000, outputs 350/700 ns, Treset ≥200 μs (no max); V1.4 prints T0H ≤410 (typ 360), T1H ≥650 (typ 720), outputs 360/720 ns, Treset 200–20000 μs.'
      - 'Current and packages: V1.4 p1 "固定恒流输出14mA" and "封装形式：SOP8" vs English V1.0 p1 "15mA fixed constant current output" and "Packaging mode: SOP8 and SOT23-8".'
    open:
      - 'How a TM1934 chooses between DIN and FDIN in normal mode (timeout? activity detect?) and whether it discards the first 24-bit packet on FDIN: not printed in either sheet. The Fi = Dx D1…Dn structure implies FDIN skips one packet, but that is an inference.'
      - 'How DIN-only / FDIN-only test modes are entered: not printed.'

