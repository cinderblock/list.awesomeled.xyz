    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 800kHz (V2.3)
        select: 'SET pin floating ("SET 7 7 - 接VDD：低速模式；悬空：高速模式", p2: to VDD = low-speed, floating = high-speed)'
        T0H: { ns: 360, min_ns: 300, max_ns: 390, printed: '300 / 360 / 390 ns' }
        T0L: null
        T1H: { ns: 720, min_ns: 650, max_ns: 1000, printed: '650 / 720 / 1000 ns' }
        T1L: null
        period:
          {
            ns: 1250,
            printed: '1.25 us (typ); note (1): 1.25–2.5 μs works if the high times fit the table',
          }
        reset: { min_ns: 40000, level: low, printed: 'Treset Reset码，低电平时间 40 (min) us' }
        output: { T0H: 360, T1H: 720 }
        inter_byte_low_max_ns: 5000
        doc: tm1804-v2.3
        page: 4
        quote: '3. 高速模式时间 | T0H 输入0 码，高电平时间 VDD=5.0V GND=0V 300 360 390 ns | T1H 输入1 码，高电平时间 650 720 1000 ns | T0H’ 输出0 码，高电平时间 -- 360 -- ns | T1H’ 输出1 码，高电平时间 -- 720 -- ns | T 0 码或1 码的周期时间 -- 1.25 -- us | Treset Reset码，低电平时间 40 -- -- us | （1）0 码或1 码周期在1.25μs（频率800KHz）至2.5μs（频率400KHz）范围内，芯片均可正常工作，但是0 码和1 码高电平时间必须符合上表中相应数值范围；（2）不需复位时，字节之间的低电平时间不要超过5μs，否则芯片可能复位，复位后又重新接收数据，无法实现数据正确传送。'
        translation: '3. High-speed mode timing: T0H 300/360/390 ns; T1H 650/720/1000 ns; output T0H’ 360, T1H’ 720 ns; period 1.25 us; Treset low ≥40 us. (1) The chip works with 0/1-code periods from 1.25 μs (800 kHz) to 2.5 μs (400 kHz), but the high times must fit the table. (2) When no reset is wanted, the low time between bytes must not exceed 5 μs, or the chip may reset and start receiving again.'
      - name: 400kHz (V2.3)
        select: 'SET pin to VDD'
        T0H: { ns: 720, min_ns: 600, max_ns: 780, printed: '600 / 720 / 780 ns' }
        T0L: null
        T1H: { ns: 1440, min_ns: 1300, max_ns: 2000, printed: '1300 / 1440 / 2000 ns' }
        T1L: null
        period: { ns: 2500, printed: '2.5 us (typ)' }
        reset: { min_ns: 40000, level: low, printed: '40 us (min)' }
        output: { T0H: 720, T1H: 1440 }
        doc: tm1804-v2.3
        page: 4
        quote: '2. 低速模式时间 | T0H 输入0 码，高电平时间 600 720 780 ns | T1H 输入1 码，高电平时间 1300 1440 2000 ns | T0H’ 输出0 码 -- 720 -- ns | T1H’ 输出1 码 -- 1440 -- ns | T 0 码或1 码的周期时间 -- 2.5 -- us | Treset Reset码，低电平时间 40 -- -- us'
      - name: 800kHz (V1.9)
        select: 'SET pin floating (p2, same wording as V2.3)'
        T0H: { ns: 400, min_ns: 350, max_ns: 450, printed: '350 / 400 / 450 ns' }
        T0L: null
        T1H: { ns: 850, min_ns: 700, max_ns: 1000, printed: '700 / 850 / 1000 ns' }
        T1L: null
        period: { ns: 1250, printed: '1.25 us (typ)' }
        reset: { min_ns: 40000, level: low, printed: '40 us (min)' }
        output: { T0H: 320, T1H: 700 }
        doc: tm1804-v1.9
        page: 4
        quote: '3、高速模式时间 | T0H 输入0 码，高电平时间 350 400 450 ns | T1H 输入1 码，高电平时间 700 850 1000 ns | T0H’ 输出0 码 -- 320 -- ns | T1H’ 输出1 码 -- 700 -- ns | T 0 码或1 码的周期时间 -- 1.25 -- us | Treset Reset码，低电平时间 40 -- -- us | 注意：发送1 码或0 码的周期时间为1.25us（频率800KHz）。'
      - name: 400kHz (V1.9)
        select: 'SET pin to VDD'
        T0H: { ns: 700, min_ns: 500, max_ns: 900, printed: '500 / 700 / 900 ns' }
        T0L: null
        T1H: { ns: 1800, min_ns: 1600, max_ns: 2000, printed: '1600 / 1800 / 2000 ns' }
        T1L: null
        period: { ns: 2500, printed: '2.5 us (typ)' }
        reset: { min_ns: 40000, level: low, printed: '40 us (min)' }
        output: { T0H: 700, T1H: 1300 }
        doc: tm1804-v1.9
        page: 4
        quote: '2、低速模式时间 | T0H 500 700 900 ns | T1H 1600 1800 2000 ns | T0H’ -- 700 -- ns | T1H’ -- 1300 -- ns | T -- 2.5 -- us | Treset 40 -- -- us | 注意：发送1 码或0 码的周期时间为2.5us（频率400KHz）。'
      - name: 'both speeds (English, 2014)'
        select: 'p2: "SET Mode set Connect VDD:low-speed mode;vacant;high-speed mode"'
        T0H: { printed: 'high-speed 350 / 400 / 450 ns; low-speed 500 / 700 / 900 ns' }
        T1H: { printed: 'high-speed 700 / 850 / 1000 ns; low-speed 1600 / 1800 / 2000 ns' }
        T0L: null
        T1L: null
        period: { printed: 'high-speed 1.25 uS; low-speed 2.5 uS' }
        reset:
          {
            min_ns: 10000,
            typ_ns: 24000,
            level: low,
            printed: 'Treset Reset code, ,low level time 10 (min) 24 (typ) uS (both modes)',
          }
        doc: tm1804-en-2014
        page: 5
        quote: 'High-speed mode time: T0H 0 Code,high level time 350 400 450 ns | T1H 1 code, high level time 700 850 1000 ns | T0H’ O code, high level time 320 ns | T1H’ 1 code, high level time 700 ns | T 0 code or 1 code cycle time 1.25 uS | Treset Reset code, ,low level time 10 24 uS | Note:The cycle time of send 1 mode or 2 mode is 2.5uS (Frequency：800KHz)'
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low ≥40 μs (V1.9, V2.3); the 2014 English sheet says ≥10 μs'
      doc: tm1804-v2.3
      page: 4
      quote: '1. 24bit 的数据结构 R7…R0 G7…G0 B7…B0 | 高位先发，按照RGB的顺序发送数据。'
      translation: 'High bit first, sent in R, G, B order.'
    forwarding:
      text: 'Same as TM1803: first 24 bits kept, the rest re-shaped and forwarded; DO low until forwarding. Td DIN→DOUT 300 ns (V2.3 p3).'
      doc: tm1804-v2.3
      page: 4
      quote: '芯片在上电复位以后，接受DIN端送来的数据，接收完24bit后，DO端口开始转发DIN端继续发来的数据，为下个级联芯片提供输入数据。在转发数据之前，DO口一直为低电平。'
      translation: 'After power-on reset the chip takes data from DIN; after 24 bits, DO forwards the data DIN keeps receiving. Before forwarding, DO stays low.'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'V2.3 (2025) narrowed and shifted the windows of V1.9 (2022): high-speed T0H 300–390 vs 350–450 ns, T1H 650–1000 vs 700–1000 ns, output T0H’/T1H’ 360/720 vs 320/700 ns; low-speed T0H 600–780 vs 500–900 ns, T1H 1300–2000 vs 1600–2000 ns. V2.3 adds note (1) (period 1.25–2.5 μs OK) and note (2) (inter-byte low ≤5 μs). Treset ≥40 μs in both.'
      - 'Reset: English 2014 sheet p4 "After accepting low level RESET code which more than 10Us" and p5 Treset 10 (min) 24 (typ) uS vs V1.9/V2.3 Treset ≥40 us.'
      - 'English 2014 sheet internal errors: p4 switching table "High-speed mode Fc2 400 KHz" (V1.9/V2.3 p3: 高速模式 Fc2 800 KHz); p5 high-speed note "The cycle time of send 1 mode or 2 mode is 2.5uS (Frequency：800KHz)" contradicts its own table row "T … 1.25 uS".'
    open: []

