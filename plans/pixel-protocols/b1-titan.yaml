      page: 5
      quote: '芯片在上电复位以后，接收DIN端打来的数据，接收够3 组24bit后，DO端口开始转发数据，为下一个芯片提供输入数据。在转发之前，DOUT口一直拉低。'
      translation: 'After power-on reset the chip receives data from DIN; once it has 3 groups of 24 bits, DO starts forwarding data for the next chip. Before forwarding, DOUT is held low.'
