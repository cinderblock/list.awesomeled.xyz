      - 'English Rev 01 (2011) timing is disjoint from the Chinese sheets: high-speed T1H 530–670 ns (V1.6/V1.8: ≥700 / ≥650 ns; V1.8 overlaps only at 650–670), T0H 250–390; low-speed T1H 1050–1350 vs 1600–2000 / 1300–2000; reset typ 24 us vs ≥200 us. Its high-speed typ period is 320 + 600 = 920 ns, not 1.25 us.'
      - 'PWM cycle: English Rev 01 p4 "the cycle of signal is 4ms" vs V1.6/V1.8 p5 "该信号周期为1.3ms" and TPWM p4 "1 1.3 1.5 ms". Features (all) "扫描频率不低于400Hz" / "scan frequency not less than 400hz".'
    open: []

