batch: b1-titan
researched: '2026-11-20'
notes:
  - 'Summary, overlap arithmetic, disagreements and database corrections: b1-titan.md (read it first).'
  - 'Page numbers are PDF pages (1-based); in these sheets they match the printed page numbers.'
  - "Titan's own files (www.titanmec.com/upload/twdz_cn/...) are linked from its product lists through /index/article/download.html?file=<base64 of the upload URL>; they were fetched with a titanmec.com Referer header."
  - 'Inverted parts (TM1814, TM1829, TM1913, TM1914): the sheets time the LOW pulse that starts each bit (T0l/T1l) and reset on a HIGH level. Those rates carry pulse_level: low and put the printed T0l/T1l rows under T0L/T1L; T0H/T1H stay null.'
  - 'Values marked derived are arithmetic on printed values, not printed themselves.'

