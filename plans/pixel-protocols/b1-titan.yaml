        notes: "The database's datasheet.url (UTF-8 BOM before %PDF). PDF metadata 2021-03-10. Not listed on titanmec.com; no English edition found."
    line_coding: single-wire
    idle: high
    bit_order: msb-first
    rates:
      - name: 800kHz
        select: null
        pulse_level: low
        T0H: null
        T0L:
          {
            ns: 360,
            min_ns: 310,
            max_ns: 410,
            printed: 'T0l 输入0码，低电平时间 310 / 360 / 410 ns',
          }
        T1H: null
        T1L:
          {
            ns: 720,
            min_ns: 650,
            max_ns: 1000,
            printed: 'T1l 输入1码，低电平时间 650 / 720 / 1000 ns',
          }
        period: { ns: 1250, printed: '1.25 μs; note (1): 1.25–2.5 μs works if the low times fit' }
        reset:
          {
            min_ns: 200000,
            max_ns: 20000000,
            level: high,
            printed: 'Treset Reset码，高电平时间 200 (min) 20000 (max) μs',
          }
        output: { T0L: 350, T1L: 700 }
        inter_byte_high_max_ns: 50000
        doc: tm1913-v1.3
        page: 4
        quote: '时序特性 | 输入0码，低电平时间 T0l VDD=5.0V GND=0V 310 360 410 ns | 输入1码，低电平时间 T1l 650 720 1000 ns | 输出0码，低电平时间 T0l’ 350 ns | 输出1码，低电平时间 T1l’ 700 ns | 0码或1码周期 T0/T1 1.25 μs | Reset码，高电平时间 Treset 200 20000 μs | （1）0 码或1 码周期在1.25μs（频率800KHz）至2.5μs（频率400KHz）范围内，芯片均可正常工作，但是0 码和1 码低电平时间必须符合上表中相应数值范围；（2）不需复位时，字节之间的高电平时间不要超过50μs'
        translation: 'Input 0-code LOW time 310/360/410 ns; 1-code LOW time 650/720/1000 ns; outputs 350/700 ns; period 1.25 μs; reset HIGH 200–20000 μs; inter-byte HIGH ≤50 μs.'
        other_quotes:
          - {
              page: 4,
              quote: '外控切换至内控时间 Tos DIN 无脉冲输入 600 (min) ms',
              translation: 'External→internal control after DIN has no pulses for at least 600 ms',
            }
          - {
              page: 1,
              quote: '外控模式数据传输速率800KHz | 内控模式数据传输速率500KHz | 内控模式芯片发送数据2048点',
            }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'HIGH for >200 μs, but not more than 20000 μs (p6)'
      doc: tm1913-v1.3
      page: 5
      quote: '1、一帧完整数据结构 D1 D2 D3 D4 … Dn Reset … 每个数据包包含24bit数据位。Reset表示复位信号，高电平有效。 | 2、Dn的数据格式 R7 … R0 G7 … G0 B7 … B0 每个数据包包含8×3bit数据位，高位先发。'
      translation: 'Frame D1 … Dn Reset; 24-bit packets; Reset is active HIGH. Dn: R G B, 8×3 bits, high bit first.'
    forwarding:
      text: 'Keeps the first 24 bits, forwards the rest; DO HIGH before forwarding. Tplz 155 ns typ.'
      doc: tm1913-v1.3
      page: 5
      quote: '本芯片为单线通讯，采用归一码的方式发送信号。芯片上电复位后，接收DIN端发来的数据，接收完24bit后，DO端口开始转发DIN端继续发来的数据，为下颗级联芯片提供输入数据。在转发数据之前，DO端口一直为高电平。'
      translation: 'Single-wire, "return-to-one" code. After power-on reset the chip receives data on DIN; after 24 bits, DO forwards the data that keeps arriving. Before forwarding, DO stays HIGH.'
    backup_line: null
    other_behaviour:
      - 'Internal control fallback (p7): "当芯片电源正常，且检测到DIN没有信号输入，或本来信号正常，之后突然丢失300ms左右后，芯片进入内控模式，进行如下循环闪烁" (with power normal and no DIN input, or after the signal suddenly disappears for about 300 ms, the chip enters internal-control mode and cycles a 7-state R/G/B pattern), and "芯片进入内控模式后，发送数据2048点" (it then sends data for 2048 points downstream).'
      - 'Reset ceiling (p6): "Reset高电平有效，保持高电平时间大于200μs，芯片复位，但需注意高电平时间不应大于20000μs，否则芯片有可能切换至内控模式。" (Reset is active high; >200 μs resets the chip, but the high time should not exceed 20000 μs or the chip may switch to internal-control mode.)'
    compatibility_claims: []
    disagreements:
      - 'Time to internal control, three values in one sheet: Tos ≥600 ms (p4 table), "突然丢失300ms左右后" about 300 ms (p7), and a reset HIGH longer than 20000 μs "有可能切换至内控模式" may switch (p6).'
    open:
      - 'Whether the idle HIGH between frames (which is the reset level) counts toward the 20 ms / 300 ms / 600 ms limits in normal operation, i.e. how often a controller must refresh to keep TM1913 out of internal control.'

  # ------------------------------------------------------------------ TM1914
