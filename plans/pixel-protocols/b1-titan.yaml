      - id: tm1914-en-v1.2
        url: https://www.superlightingled.com/PDF/SPEC/TM1914-Datasheet.pdf
        title: Dedicated Circuit for 3-channel LED Constant Current Drive TM1914
        revision: V1.2
        date: null
        language: en
        notes: "The database's datasheet.url; same text as the LEDYi copy https://media.ledyi.com/tm1914-datasheet_f53245ad945ae995c5711ffc5932c07ab88babf15d0e6f1a5859cfa9bc8c20e2.pdf. Matches the Chinese V1.2."
      - id: tm1914a-v1.3
        url: https://datasheet.lcsc.com/datasheet/pdf/0c61609de407a25217befc6cdfa5e456.pdf
        title: 3 通道LED 恒流驱动专用电路 TM1914A
        revision: V1.3
        date: null
        language: zh
        notes: 'LCSC C5174521 (SOP8, single DO). PDF metadata 2021-03-12. Same timing and mode commands as TM1914.'
    line_coding: single-wire
    idle: high
    bit_order: msb-first
    rates:
      - name: 800kHz
        select: null
        pulse_level: low
        T0H: null
        T0L:
          {
            ns: 360,
            min_ns: 310,
            max_ns: 410,
            printed: 'T0l 输入0码，低电平时间 310 / 360 / 410 ns',
          }
        T1H: null
        T1L:
          {
            ns: 720,
            min_ns: 650,
            max_ns: 1000,
            printed: 'T1l 输入1码，低电平时间 650 / 720 / 1000 ns',
          }
        period: { ns: 1250, printed: '1.25 μs; note (1): 1.25–2.5 μs works if the low times fit' }
        reset: { min_ns: 200000, level: high, printed: 'Treset Reset码，高电平时间 200 μs (min)' }
        output: { T0L: 350, T1L: 700 }
        inter_byte_high_max_ns: 50000
        doc: tm1914-v1.2
        page: 4
        quote: '时序特性 | 输入0码，低电平时间 T0l VDD=5.0V GND=0V 310 360 410 ns | 输入1码，低电平时间 T1l 650 720 1000 ns | 输出0码，低电平时间 T0l’ 350 ns | 输出1码，低电平时间 T1l’ 700 ns | 0码或1码周期 T0/T1 1.25 μs | Reset码，高电平时间 Treset 200 μs | （2）不需复位时，字节之间的高电平时间不要超过50μs'
        other_quotes:
          - { page: 4, quote: '传输延迟时间 Tplz DIN → DO1、DO2 / FDIN → DO1、DO2 155 ns' }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'C1 (24 bits), C2 (24 bits), then per chip R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: 'Mode-setting command, 48 bits = C1 (24-bit command code) + C2 (24-bit inverse check). Three commands: 0xFFFFFF_000000 normal mode (inputs switch DIN↔FDIN after 300 ms without data); 0xFFFFFA_000005 DIN-only mode (FDIN ignored); 0xFFFFF5_00000A FDIN-only mode (DIN ignored). Every chip checks C1/C2, forwards them, then takes its own 24-bit packet.'
      start: 'C1 C2 at the start of every frame (both refresh cycles drawn with C1 C2, p5–6)'
      end: null
      latch: 'HIGH for >200 μs'
      doc: tm1914-v1.2
      page: 5
      quote: '1、模式设置 本芯片为单线双通道通讯，采用归一码的方式发送信号。芯片接收显示数据前需要配置正确的工作模式，选择接收显示数据的方式。模式设置命令共48bit，其中前24bit为命令码，后24bit为检验反码，芯片复位开始接收数据，模式设置命令共有如下3种：（1）0xFFFFFF_000000命令：芯片配置为正常工作模式。在此模式下，首次默认DIN接收显示数据，芯片检测到该端口有信号输入则一直保持该端口接收，如果超过300ms未接收到数据，则切换到FDIN接收显示数据，芯片检测到该端口有信号输入则一直保持该端口接收，如果超过300ms未接收到数据，则再次切换到DIN接收显示数据。DIN和FDIN依此循环切换，接收显示数据。（2）0xFFFFFA_000005命令：芯片配置为DIN工作模式。在此模式下，芯片只接收DIN端输入的显示数据，FDIN端数据无效。（3）0xFFFFF5_00000A命令：芯片配置为FDIN工作模式。在此模式下，芯片只接收FDIN端输入的显示数据，DIN端数据无效。 | 3、一帧完整数据结构 C1 C2 D1 D2 D3 D4 … Dn Reset | C1、C2为模式设置命令，各包含24bit数据位，每个芯片都会接收并转发C1、C2 … Reset表示复位信号，高电平有效。'
      translation: '1. Mode setting: single-wire dual-channel, "return-to-one" code. Before display data the chip must be configured with the right operating mode. The mode command is 48 bits: the first 24 bits are the command code, the last 24 bits its inverse as a check; the chip starts receiving after reset. (1) 0xFFFFFF_000000: normal mode. DIN receives first by default; while that port has signal the chip stays on it; after more than 300 ms without data it switches to FDIN, stays while FDIN has signal, and after 300 ms without data switches back to DIN, cycling. (2) 0xFFFFFA_000005: DIN mode, only DIN data is accepted, FDIN ignored. (3) 0xFFFFF5_00000A: FDIN mode, only FDIN, DIN ignored. 3. Frame: C1 C2 D1 … Dn Reset; C1 and C2 are the mode command, 24 bits each, received and forwarded by every chip; Reset is active HIGH.'
    forwarding:
      text: 'Each chip checks C1/C2, forwards them if valid, keeps its own 24-bit packet, forwards the rest on DO1 and DO2 (TM1914A: DO). DO1/DO2 are HIGH before forwarding.'
      doc: tm1914-v1.2
      page: 6
      quote: '芯片级联和数据传输并转发过程如下：控制器发送数据S1，芯片1接收C1和C2进行校验，如果命令正确，则转发C1和C2，同时吸收D1，如果此时没有Reset复位信号，芯片1将一直转发控制器继续发来的数据；芯片2也接收C1和C2进行校验，如果命令正确，则转发C1和C2，同时吸收D2 … 直到控制器发送Reset复位信号 … Reset高电平有效，保持高电平时间大于200μs，芯片复位。'
      translation: 'The controller sends S1; chip 1 receives and checks C1 and C2; if correct it forwards C1 and C2 and keeps D1, and keeps forwarding until a Reset. Chip 2 does the same and keeps D2, and so on. Reset is active HIGH; held high for more than 200 μs, the chip resets.'
    backup_line:
      pins: 'DIN (数据输入), FDIN (备用数据输入, backup data input), DO1 and DO2 (数据输出1/2) on MSOP10/SSOP10/ESOP8; TM1914A (SOP8) has one DO. SET (MSOP10/SSOP10 pin 9): "测试脚，正常应用必需接GND" (test pin, must be grounded in normal use).'
      behaviour: 'Normal mode: start on DIN; stay on whichever input has signal; after >300 ms without data, switch to the other input; repeat. DIN-only and FDIN-only modes (set by the C1/C2 command) are for aging and installation tests (p7: "产品在老化及安装过程中，可将芯片分别设置为DIN工作模式和FDIN工作模式"). Wiring (TM1914 fig. 6, p6): controller Di → chip 1 DIN; Fi → chip 1 FDIN; Fi2 → chip 2 FDIN; chip k DO1 → chip k+1 DIN; chip k DO2 → chip k+2 FDIN. Data: Di and Fi2 carry C1 C2 D1…Dn; Fi carries C1 C2 Dx D1…Dn (Dx any 24 bits), so each FDIN sees the stream meant for the chip before it. TM1914A (fig. 5, p6): chip k DO → chip k+1 DIN and chip k+2 FDIN, and "注：如果控制器只有一个信号端口，把第一个点的FDIN悬空，DIN连接到控制器，其他点按上图连接。" (if the controller has one port, leave the first chip''s FDIN floating).'
      doc: tm1914-v1.2
      page: 6
      quote: '其中S1为控制器Di端口发送的数据，S2、S3、S4为级联TM1914转发的数据。控制器Di和Fi2端口数据结构：C1C2D1D2D3D4……Dn；控制器Fi端口数据结构：C1C2DxD1D2D3……Dn；其中，Dx为任意24bit数据位。'
      translation: "S1 is sent by the controller's Di port; S2–S4 are forwarded by cascaded TM1914. Controller Di and Fi2 data: C1C2D1D2D3D4…Dn; controller Fi data: C1C2DxD1D2D3…Dn, where Dx is any 24 bits."
    compatibility_claims: []
    disagreements: []
    open:
      - 'That a chip running from FDIN discards the first 24-bit packet after C1 C2 is implied by the Fi = C1 C2 Dx D1… structure but not stated.'
      - 'Behaviour on a C1/C2 mismatch (no mode command, or C2 not the inverse of C1) is not described beyond "如果命令正确，则转发C1和C2".'
