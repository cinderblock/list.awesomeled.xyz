parts:
  # ------------------------------------------------------------------ TM1803
  - part: TM1803
    entry: pixel-ics/tm1803
    maker: Titan Micro Electronics
    documents:
      - id: tm1803-v1.5
        url: https://www.titanmec.com/upload/twdz_cn/20221202/20221202110627637.pdf
        title: 三通道LED 驱动控制专用电路 TM1803
        revision: V1.5
        date: null
        language: zh
        notes: "Titan's current download. Byte-identical to https://www.lumikit.com.br/firmware/hslc-tm/datasheets/TM1803_V1.5.pdf (after its UTF-8 BOM); text-identical to LCSC C5159541 https://datasheet.lcsc.com/datasheet/pdf/0a98745b6f7daab54bad80a979aef1f6.pdf. PDF metadata created 2013-08-30."
      - id: tm1803-en-old
        url: https://media.ledyi.com/tm1803-datasheet_1b245d169446ce40cd2040738412bfc19511917f20c4d9c8a77c679cfab57aad.pdf
        title: 'TM1803 (untitled English sheet: "Summarize / Feature / PIN Configuration")'
        revision: null
        date: null
        language: en
        notes: "The database's datasheet.url. No Titan branding and no revision printed; PDF metadata created 2011-01-19. Describes a SET pin and two speeds that V1.5 does not have."
    line_coding: single-wire
    idle: low
    bit_order: msb-first
    rates:
      - name: 400kHz
        select: 'none: V1.5 has no speed pin ("NC 7 - 空脚", p2)'
        T0H:
          {
            ns: 700,
            tol_ns: null,
            min_ns: 500,
            max_ns: 900,
            printed: '500 / 700 / 900 ns (min / typ / max)',
          }
        T0L: null
        T1H:
          { ns: 1800, tol_ns: null, min_ns: 1600, max_ns: 2000, printed: '1600 / 1800 / 2000 ns' }
        T1L: null
        period: { ns: 2500, printed: '2.5 μs (typ only)' }
        reset:
          {
            min_ns: 8000,
            typ_ns: 24000,
            max_ns: null,
            level: low,
            printed: 'Treset Reset码，低电平时间 8 (min) 24 (typ) μs',
          }
        output: { T0H: 700, T1H: 1300, printed: 'T0h’ 输出0码 700 ns; T1h’ 输出1码 1300 ns (typ)' }
        derived: 'T0L ≈ 2500 − 700 = 1800 ns, T1L ≈ 2500 − 1800 = 700 ns at the typ period (lows are not printed).'
        doc: tm1803-v1.5
        page: 4
        quote: '2、低速模式时间 | T0h 输入0码，高电平时间 VDD=5.0V GND=0V 500 700 900 ns | T1h 输入1码，高电平时间 1600 1800 2000 ns | T0h’ 输出0码，高电平时间 700 ns | T1h’ 输出1码，高电平时间 1300 ns | T 0码或1码的周期时间 2.5 μs | Treset Reset码，低电平时间 8 24 μs | 注意：发送1 码或0 码的周期时间为2.5μs（频率400KHz）。'
        translation: '2. Low-speed mode timing: T0h input 0-code high time 500/700/900 ns; T1h input 1-code high time 1600/1800/2000 ns; T0h’ output 0-code high time 700 ns; T1h’ output 1-code high time 1300 ns; T 0/1-code period 2.5 μs; Treset reset-code low time 8 (min) 24 (typ) μs. Note: the period of a 1 or 0 code is 2.5 μs (400 kHz).'
        other_quotes:
          - {
              page: 1,
              quote: '数据发送速度为400Kbps',
              translation: 'Data sending speed is 400 Kbps',
            }
          - {
              page: 3,
              quote: '开关频率 Fc 400 KHz (typ); 传输延迟 Td DIN → DOUT 300 ns (max)',
              translation: 'Switching frequency 400 kHz; propagation delay DIN→DOUT 300 ns max',
            }
      - name: 'low-speed (older English sheet)'
        select: 'SET pin 7 to VDD ("1)SET toVDD：Low-speed mode 2)SET flaoting: High-speed mode", p2)'
        T0H: { ns: 680, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.68us ±150ns' }
        T0L: { ns: 1360, tol_ns: 150, min_ns: null, max_ns: null, printed: '1.36us ±150ns' }
        T1H: { ns: 1360, tol_ns: 150, min_ns: null, max_ns: null, printed: '1.36us ±150ns' }
        T1L: { ns: 680, tol_ns: 150, min_ns: null, max_ns: null, printed: '0.68us ±150ns' }
        period: null
        reset:
          { min_ns: null, typ_ns: 24000, level: low, printed: 'Treset 24us - Resetcode，low time' }
        doc: tm1803-en-old
        page: 4
        quote: 'Low-speed mode time | T0H 0 code, high time 0.68us ±150ns | T1H 1 code, high time 1.36us ±150ns | T0L 0 code, low time 1.36us ±150ns | T1L 1 code, low time 0.68us ±150ns | Treset Resetcode，low time 24us - | Note: When on high-speed mode, half the above time only.'
      - name: 'high-speed (older English sheet)'
        select: 'SET pin 7 floating'
        T0H:
          {
            ns: 340,
            tol_ns: null,
            printed: 'half of 0.68us (derived from the note; tolerance not stated)',
          }
        T0L: { ns: 680, tol_ns: null, printed: 'half of 1.36us (derived)' }
        T1H: { ns: 680, tol_ns: null, printed: 'half of 1.36us (derived)' }
        T1L: { ns: 340, tol_ns: null, printed: 'half of 0.68us (derived)' }
        period: null
        reset: null
        doc: tm1803-en-old
        page: 4
        quote: 'Note: When on high-speed mode, half the above time only.'
        other_quotes:
          - { page: 1, quote: 'Data transmission speed can be 400Kbps and 800Kbps two modes' }
          - { page: 3, quote: 'Data rate Fmax 400 (min) Kbps 50% duty cycle' }
    clock: null
    frame:
      bits_per_channel: 8
      channels: 3
      wire_order: 'R7…R0 G7…G0 B7…B0'
      pixel_bits: 24
      extra: null
      start: null
      end: null
      latch: 'low ≥8 μs (typ 24 μs) per V1.5'
      doc: tm1803-v1.5
      page: 4
      quote: '1、24bit的数据结构 R7…R0 (BIT23-BIT16 设定OUTR输出PWM占空比) G7…G0 (BIT15-BIT8 OUTG) B7…B0 (BIT7-BIT0 OUTB) | 高位先发，按照RGB的顺序发送数据。'
      translation: '24-bit data structure R7…R0 sets OUTR duty, G7…G0 OUTG, B7…B0 OUTB. High bit first, sent in R, G, B order.'
    forwarding:
      text: 'Takes the first 24 bits after reset, then re-shapes and forwards everything else; DO is held low until it starts forwarding. Propagation delay Td DIN→DOUT 300 ns max (p3).'
      doc: tm1803-v1.5
      page: 4
      quote: '芯片在上电复位以后，接受DIN端送来的数据，接收完24bit后，DO端口开始转发DIN端继续发来的数据，为下个级联芯片提供输入数据。在转发数据之前，DO口一直为低电平。如果DIN输入RESET复位信号，芯片将在复位成功后根据接收到的24bit数据输出相对应PWM占空比波形'
      translation: 'After power-on reset the chip accepts data from DIN; after receiving 24 bits, DO starts forwarding the data DIN keeps receiving, as input for the next cascaded chip. Before forwarding, DO stays low. When DIN receives a RESET, the chip outputs PWM duty cycles according to the 24 bits it received.'
    backup_line: null
    compatibility_claims: []
    disagreements:
      - 'Speeds: V1.5 p1 "数据发送速度为400Kbps" (400 Kbps only) and p2 pin 7 "NC … 空脚" vs the older English sheet p1 "Data transmission speed can be 400Kbps and 800Kbps two modes" with p2 pin 7 "SET Mode setting 1)SET toVDD：Low-speed mode 2)SET flaoting: High-speed mode".'
      - 'Timing: the two sheets'' 1-code windows do not overlap. V1.5 p4 T1h 1600–2000 ns vs English p4 T1H "1.36us ±150ns" (1210–1510 ns). V1.5 T0h 500–900 ns vs English T0H "0.68us ±150ns" (530–830 ns). Reset: V1.5 min 8 / typ 24 μs vs English "24us" typ only.'
      - 'PWM cycle inside V1.5: features p1 "PWM控制端能够实现256级调节，扫描频率不低于400Hz" (scan frequency ≥400 Hz) vs electrical table p3 "驱动端口PWM 周期 TPWM … 3 3.5 4 ms" (250–333 Hz). The English sheet p4 says "the cycle of signal is 4ms".'
      - 'Packages inside V1.5: features p1 "封装形式：SOP8、DIP8" but p10 is "封装示意图（MSOP8）" (an MSOP8 outline, page without the V1.5 footer).'
    open:
      - 'No newer revision than V1.5 found (Titan, Lumikit and LCSC all carry V1.5).'
      - 'Which silicon the undated English sheet (SET pin, two speeds) describes is unknown; it has no Titan branding.'

